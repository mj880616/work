name: Map KPTU contact authors
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kptu_contact_authors.py'
      - '.github/workflows/kptu-contact-authors.yml'
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/kptu_contact_authors.py
      - name: Commit contact map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/contact-authors-2023-2026.json
          git diff --cached --quiet || git commit -m "Map KPTU contact authors"
          git pull --rebase origin main
          git push
