name: Validate KPTU corpus extraction
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kptu_validate_corpus.py'
      - '.github/workflows/kptu-corpus-validate.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/kptu_validate_corpus.py
      - name: Commit validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/validation-summary.json
          git diff --cached --quiet || git commit -m "Validate KPTU corpus extraction"
          git pull --rebase origin main
          git push
