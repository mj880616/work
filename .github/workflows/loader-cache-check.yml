name: Loader cache version check

on:
  pull_request:
    branches: [main]

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loader-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked checker parser
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Test cache checker
        run: node --test scripts/check-loader-cache.test.mjs
      # CI-버전자동화 3단계: the Pages build adds ?v= and the asset manifest (pages-build-check.yml).
      - name: Check no hand-written ?v= in sources
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(git merge-base "$PR_BASE" "$PR_HEAD")
          node scripts/check-loader-cache.mjs --base "$BASE" --head "$PR_HEAD"
      # SEC-공개저장소점검: 공개 저장소에 개인정보 모양(전화·주민번호·개인 메일·키/토큰)이 새로 들어오지 않게 막는다.
      # 이 job(loader-cache)은 모든 main 대상 PR에서 돈다.
      # 예외는 scripts/personal-data-allowlist.json에 이유와 함께 적는다. 출력에는 값 원문 대신 hash만 찍는다.
      - name: Test personal-data checker
        run: node --test scripts/check-personal-data.test.mjs
      - name: Check personal-data shapes in tracked files
        run: node scripts/check-personal-data.mjs
      # DESIGN-검증하네스 ②: app/*.css(theme-tokens.css 밖)에 손으로 쓴 글자 크기·버튼 높이 px가 새로 늘면 실패.
      # 기준선(scripts/ci/css-token-baseline.json)은 줄이기만 한다. 판별 규칙은 스크립트 머리 주석.
      - name: Test CSS token checker
        run: node --test tests/css-token-check.test.mjs
      - name: Check CSS font-size/button height px against baseline
        run: node scripts/ci/css-token-check.mjs
