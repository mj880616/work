name: Loader cache version check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  loader-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install locked checker parser
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Test cache checker
        run: node --test scripts/check-loader-cache.test.mjs scripts/asset-manifest.test.mjs
      - name: Check asset manifest is current
        run: node scripts/asset-manifest.mjs --check
      - name: Check PR loader cache versions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(git merge-base "$PR_BASE" "$PR_HEAD")
          node scripts/check-loader-cache.mjs --base "$BASE" --head "$PR_HEAD"
