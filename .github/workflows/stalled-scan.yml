name: Stalled work scan

# QA-멈춘일자동점검(S70-50, 근거 docs/qa/stalled-audit-20261125.md 3절): 매일 KST 07:10에 승인형 DB·Edge workflow 실행 로그와 main을 대조해
#   (a) apply 성공 기록이 없는 migration (b) 마지막 성공 배포 뒤 소스(_shared 포함)가 바뀐 Edge 함수 (c) 7일 넘게 커밋 없는 열린 PR을
#   파일 이름·함수 이름·PR 번호·날짜 수만 job summary에 적는다(업무 내용 없음). 알릴 항목이 새로 생기거나 바뀌면(같은 항목은 7일마다)
#   'CC 멈춘 일 자동 점검' 이슈를 하나 만들거나 열린 그 이슈에 댓글을 단다. 비밀값 없음, 쓰기 권한은 issues 하나.
#   읽은 로그 결과는 actions cache에 모아 새 실행만 읽는다(--max-logs, 첫 며칠은 채우는 중이라 (a)(b) 판정 보류).
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: stalled-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'mj880616/work'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore read run logs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stalled-scan/cache.json
          key: stalled-scan-${{ github.run_id }}
          restore-keys: stalled-scan-

      - name: Compare run logs with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .stalled-scan
          node scripts/ops/stalled-scan.mjs --cache .stalled-scan/cache.json --max-logs 350 --out .stalled-scan/report.md --json .stalled-scan/result.json
          cat .stalled-scan/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save read run logs
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stalled-scan/cache.json
          key: stalled-scan-${{ github.run_id }}

      - name: Open or comment on the stalled work issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.notify' .stalled-scan/result.json)" != "true" ]; then
            echo "알릴 새 항목 없음"
            exit 0
          fi
          { cat .stalled-scan/report.md; printf '\n실행: %s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$RUN_URL"; } > .stalled-scan/body.md
          title='CC 멈춘 일 자동 점검'
          num="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq "[.[] | select(.pull_request == null and .title == \"$title\")][0].number // empty")"
          if [ -n "$num" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@.stalled-scan/body.md --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@.stalled-scan/body.md --jq .html_url
          fi
