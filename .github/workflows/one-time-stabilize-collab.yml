name: One-time collaboration stabilization

on:
  push:
    paths:
      - '.github/workflows/one-time-stabilize-collab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch collaboration shell conflicts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/collaboration-center.js')
          s=p.read_text(encoding='utf-8')

          replacements=[
            (
              "function ccSwitch(view){document.querySelectorAll('#appView .view-panel').forEach(x=>x.classList.toggle('hidden',x.id!==view+'View'));document.querySelectorAll('.app-nav .nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(x=>x.classList.toggle('active',x.dataset.ccView===view));if(view==='messages')ccLoadConversation();if(view==='profile')setTimeout(()=>document.querySelector('[data-view=\"profile\"]')?.classList.add('active'),0);window.scrollTo({top:0,behavior:'instant'})}",
              "function ccSwitch(view){if(window.KPTURouter?.go){window.KPTURouter.go(view,{source:'collaboration'});return}document.querySelectorAll('#appView .view-panel').forEach(x=>x.classList.toggle('hidden',x.id!==view+'View'));document.querySelectorAll('.app-nav .nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(x=>x.classList.toggle('active',x.dataset.ccView===view));window.scrollTo({top:0,behavior:'instant'})}"
            ),
            (
              "if(ta&&!document.querySelector('#ccNotifTop')){const n=document.createElement('button');n.id='ccNotifTop';n.type='button';n.className='ghost hidden';n.innerHTML='알림 <span id=\"ccNotifBadge\" class=\"cc-count hidden\">0</span>';const p=document.createElement('button');p.id='ccProfileTop';p.type='button';p.className='ghost hidden';p.textContent='프로필';const logout=document.querySelector('#logoutBtn');ta.insertBefore(n,logout);ta.insertBefore(p,logout);n.onclick=()=>{ccOpen('ccNotifModal');ccLoadNotifications()};p.onclick=()=>ccSwitch('profile')}",
              "if(ta&&!document.querySelector('#ccNotifTop')){const n=document.createElement('button');n.id='ccNotifTop';n.type='button';n.className='ghost hidden';n.innerHTML='알림 <span id=\"ccNotifBadge\" class=\"cc-count hidden\">0</span>';const logout=document.querySelector('#logoutBtn');ta.insertBefore(n,logout);n.onclick=()=>ccSwitch('notifications')}document.querySelector('#ccProfileTop')?.remove();const logout=document.querySelector('#logoutBtn');if(logout){logout.classList.add('hidden');logout.setAttribute('aria-hidden','true')}"
            ),
            (
              "  if(!document.querySelector('#ccNotifModal'))document.body.insertAdjacentHTML('beforeend',`<div id=\"ccNotifModal\" class=\"modal hidden cc-notif-modal\" aria-hidden=\"true\"><div class=\"modal-card small-card\"><div class=\"modal-head\"><div><div class=\"eyebrow\">NOTIFICATIONS</div><h2>알림</h2><p class=\"muted\">프로젝트 초대와 할 일 배정을 여기서 수락·거절합니다.</p></div><button id=\"ccNotifClose\" class=\"icon-btn\" type=\"button\">×</button></div><div id=\"ccNotifList\" class=\"cc-notif-list\"></div></div></div>`);\n  document.querySelector('#ccNotifClose').onclick=()=>ccClose('ccNotifModal');\n",
              "  document.querySelector('#ccNotifModal')?.remove();\n"
            ),
            (
              "  document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(b=>b.onclick=()=>ccSwitch(b.dataset.ccView));\n  const stat=document.querySelector('#statUnread')?.closest('button');if(stat)stat.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();ccOpen('ccNotifModal');ccLoadNotifications()},true);\n",
              "  document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(b=>b.onclick=()=>ccSwitch(b.dataset.ccView));\n"
            ),
            (
              "function ccShowLoggedUi(){document.querySelector('#ccNotifTop')?.classList.remove('hidden');document.querySelector('#ccProfileTop')?.classList.remove('hidden')}",
              "function ccShowLoggedUi(){document.querySelector('#ccNotifTop')?.classList.remove('hidden')}"
            ),
            (
              "if(!document.querySelector('#ccNotifModal')?.classList.contains('hidden'))await ccLoadNotifications();",
              "if(!document.querySelector('#notificationsView')?.classList.contains('hidden'))await ccLoadNotifications();"
            )
          ]

          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]}')
              s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')

          n=Path('app/notification-center-ui.js')
          t=n.read_text(encoding='utf-8')
          old="function show(){installView();document.querySelectorAll('#appView .view-panel').forEach(x=>x.classList.toggle('hidden',x.id!=='notificationsView'));document.querySelectorAll('.app-nav .nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(x=>x.classList.remove('active'));window.scrollTo({top:0,behavior:'instant'});load()}"
          new="function show(){installView();if(window.KPTURouter?.go)window.KPTURouter.go('notifications',{source:'notifications'});else{document.querySelectorAll('#appView .view-panel').forEach(x=>x.classList.toggle('hidden',x.id!=='notificationsView'));document.querySelectorAll('.app-nav .nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(x=>x.classList.remove('active'));window.scrollTo({top:0,behavior:'instant'})}load()}"
          if t.count(old)!=1:
              raise SystemExit('notification show() patch target not found exactly once')
          n.write_text(t.replace(old,new),encoding='utf-8')
          PY

      - name: Syntax check changed modules
        run: |
          node --check app/collaboration-center.js
          node --check app/notification-center-ui.js
          node --check app/app-router.js

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kptu-app-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/collaboration-center.js app/notification-center-ui.js
          git commit -m "Stabilize collaboration routing and notification shell"
          git push
