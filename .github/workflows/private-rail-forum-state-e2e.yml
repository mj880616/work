name: Private rail forum state E2E

on:
  pull_request:
    # 초안(draft) PR은 화면 시험을 건너뛰고, 초안을 풀면(ready_for_review) 다시 돈다(S54-01).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'private-rail/forum-0929/**'
      - 'tests/app-e2e/private-rail-forum-state.spec.mjs'
      - '.github/workflows/private-rail-forum-state-e2e.yml'
      - '.github/actions/setup-playwright/**'
  push:
    branches: [main]
    paths:
      - 'private-rail/forum-0929/**'
      - 'tests/app-e2e/private-rail-forum-state.spec.mjs'
      - '.github/workflows/private-rail-forum-state-e2e.yml'
      - '.github/actions/setup-playwright/**'

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  forum-state:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
      - name: Start static server
        run: |
          python3 -m http.server 8123 >/tmp/forum-state-e2e-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/private-rail/forum-0929/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/forum-state-e2e-http.log
          exit 1
      - name: Run forum shared-state tests
        run: >-
          npx playwright test tests/app-e2e/private-rail-forum-state.spec.mjs
          --browser=chromium --workers=1 --reporter=line,github
