name: Build KPTU corpus metadata
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kptu-corpus-build.yml'
      - 'scripts/kptu_corpus_collect.py'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect KPTU metadata
        run: python scripts/kptu_corpus_collect.py
      - name: Commit corpus metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/metadata-2023-2026.json
          git diff --cached --quiet || git commit -m "Update KPTU corpus metadata"
          git push
