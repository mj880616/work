name: Assigned organization E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/suborganizations.js'
      - 'app/suborganizations.css'
      - 'app/workplace-detail.js'
      - 'app/workplace-detail.css'
      - 'app/workplace-ai-report.js'
      - 'app/profile-workplace-sync.js'
      - 'app/loader-v2.js'
      - 'app/view-loader.js'
      - 'app/styles.css'
      - 'app/myspace-return.js'
      - 'app/my-work.html'
      - 'app/app.js'
      - 'tests/app-e2e/suborganization-filters-*'
      - '.github/workflows/suborganization-filters-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'app/suborganizations.js'
      - 'app/suborganizations.css'
      - 'app/workplace-detail.js'
      - 'app/workplace-detail.css'
      - 'app/workplace-ai-report.js'
      - 'app/profile-workplace-sync.js'
      - 'app/loader-v2.js'
      - 'app/view-loader.js'
      - 'app/styles.css'
      - 'app/myspace-return.js'
      - 'app/my-work.html'
      - 'app/app.js'
      - 'tests/app-e2e/suborganization-filters-*'
      - '.github/workflows/suborganization-filters-e2e.yml'

jobs:
  assigned-organizations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check assigned organization invariants
        run: |
          set -e
          test -f app/suborganizations.css
          test -f app/workplace-detail.css
          test ! -f app/suborganization-filters.js
          test ! -f app/suborganization-filters.css
          test ! -f app/suborganization-planned-assignee.js
          grep -q "suborganizations.js?v=8" app/view-loader.js
          grep -q "__KPTU_SUBORGANIZATIONS_READY__" app/view-loader.js
          grep -q "workplace-detail.js?v=8" app/view-loader.js
          grep -q "suborganizations.css?v=5" app/styles.css
          grep -q "workplace-detail.css?v=4" app/styles.css
          if grep -q "suborganization-filters.js" app/loader-v2.js app/view-loader.js; then echo 'removed assigned-organization filter module returned'; exit 1; fi
          if grep -q "suborganization-filters.css" app/styles.css; then echo 'removed assigned-organization filter styles returned'; exit 1; fi
          grep -q "default_assignee_name" app/suborganizations.js
          grep -q "sofEditType" app/suborganizations.js
          grep -q "id=\"soOrgCount\"" app/suborganizations.js
          grep -q "const mine=myOrganizations()" app/suborganizations.js
          grep -q "id=\"wdInboxSave\"" app/workplace-detail.js
          if grep -Eq "wdUpdateCurrent|wdAddItem" app/workplace-detail.js; then echo 'removed current-status/memo input returned'; exit 1; fi
          grep -q "id=\"wdBasicView\"" app/workplace-detail.js
          if grep -q "wdDeleteOrg" app/workplace-detail.js; then echo 'organization delete returned to normal detail'; exit 1; fi
          if grep -q "MutationObserver" app/suborganizations.js app/workplace-detail.js app/profile-workplace-sync.js; then
            echo 'assigned organization UI returned to DOM mutation polling'; exit 1
          fi
          if grep -Eq "localStorage|SO_SESSION|kptu_collab_session_v1" app/suborganizations.js app/workplace-detail.js; then
            echo 'assigned organization UI bypassed shared runtime session handling'; exit 1
          fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/suborganizations.js app/workplace-detail.js; then
            echo 'assigned organization styles returned to dynamic injection'; exit 1
          fi
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: python3 -m http.server 8123 >/tmp/kptu-suborg-http.log 2>&1 &
      - name: Run suborganization tests
        run: npx playwright test tests/app-e2e/suborganization-filters.spec.mjs --browser=chromium --workers=1 --reporter=line
