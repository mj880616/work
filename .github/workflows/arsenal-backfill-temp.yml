name: Temporary Arsenal backfill applicator

on:
  push:
    branches:
      - automation/arsenal-2526-backfill-01
    paths:
      - 'personal/arsenal-match-archive/.backfill-2026-01-28_02-18.json'
      - '.github/workflows/arsenal-backfill-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/arsenal-2526-backfill-01
          fetch-depth: 1
      - name: Apply verified match batch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = 'personal/arsenal-match-archive/matches.js';
          const batchPath = 'personal/arsenal-match-archive/.backfill-2026-01-28_02-18.json';
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
          if (!Array.isArray(batch) || batch.length !== 5) throw new Error('Expected exactly five backfill matches');
          const before = fs.readFileSync(path, 'utf8');
          const existingIds = new Set([...before.matchAll(/"id"\s*:\s*"([^"]+)"/g)].map(m => m[1]));
          const duplicates = batch.map(m => m.id).filter(id => existingIds.has(id));
          if (duplicates.length) throw new Error('Duplicate match ids: ' + duplicates.join(', '));
          const addition = '\nwindow.ARSENAL_MATCHES.push(\n' + batch.map(m => JSON.stringify(m)).join(',\n') + '\n);\n';
          fs.writeFileSync(path, before.replace(/\s*$/, '') + addition, 'utf8');

          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync(path, 'utf8'), sandbox, { filename: path });
          const matches = sandbox.window.ARSENAL_MATCHES;
          if (!Array.isArray(matches)) throw new Error('ARSENAL_MATCHES did not evaluate to an array');
          const ids = matches.map(m => m.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate ids after append');
          for (const m of batch) if (!ids.includes(m.id)) throw new Error('Missing appended id: ' + m.id);
          const season = matches.filter(m => m.season === '2025-26');
          const pl = season.filter(m => m.competition === 'Premier League');
          const ucl = season.filter(m => m.competition === 'UEFA Champions League');
          if (pl.length !== 27 || ucl.length !== 8) throw new Error(`Unexpected 2025-26 counts after batch: PL=${pl.length}, UCL=${ucl.length}`);
          console.log(`Validated ${matches.length} total archive rows; 2025-26 PL=${pl.length}, UCL=${ucl.length}`);
          NODE
      - name: Remove temporary applicator files and commit only matches.js
        run: |
          rm -f personal/arsenal-match-archive/.backfill-2026-01-28_02-18.json
          rm -f .github/workflows/arsenal-backfill-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only)" = "personal/arsenal-match-archive/matches.js"
          git commit -m 'Backfill 2025-26 Arsenal matches through Wolves away'
          git push origin HEAD:automation/arsenal-2526-backfill-01
