name: Temporary Arsenal backfill patch

on:
  push:
    branches:
      - backfill/arsenal-25-26-jan-batch-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch matches.js
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          target = Path("personal/arsenal-match-archive/matches.js")
          text = target.read_text(encoding="utf-8")
          paths = sorted(Path(".tmp").glob("arsenal-backfill-2026-01-*.json"))
          entries = [json.loads(p.read_text(encoding="utf-8")) for p in paths]
          ids = [e["id"] for e in entries]
          if len(entries) != 5:
              raise SystemExit(f"expected 5 entries, found {len(entries)}")
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate ids in payload")
          present = [mid for mid in ids if f'"id":"{mid}"' in text or f'"id": "{mid}"' in text]
          if present:
              raise SystemExit(f"target IDs already present: {present}")
          stripped = text.rstrip()
          if not stripped.endswith("];"):
              raise SystemExit("unexpected matches.js terminator")
          serialized = ",\n  ".join(json.dumps(e, ensure_ascii=False, separators=(",", ":")) for e in entries)
          patched = stripped[:-2] + ",\n  " + serialized + "\n];\n"
          target.write_text(patched, encoding="utf-8")
          print(f"added {len(entries)} matches")
          PY
          node --check personal/arsenal-match-archive/matches.js
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("personal/arsenal-match-archive/matches.js").read_text(encoding="utf-8")
          ids = re.findall(r'"id"\s*:\s*"([^"]+)"', text)
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate match ids after patch")
          expected = [
            "2026-01-03-bournemouth-away",
            "2026-01-08-liverpool-home",
            "2026-01-17-nottingham-forest-away",
            "2026-01-20-inter-away-ucl",
            "2026-01-25-man-utd-home"
          ]
          missing = [x for x in expected if x not in ids]
          if missing:
              raise SystemExit(f"missing expected ids: {missing}")
          print("syntax and duplicate checks passed")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal/arsenal-match-archive/matches.js
          git commit -m "Backfill Arsenal 2025-26 January matches"
          git push origin HEAD:${{ github.ref_name }}
