name: One-time app entry cache bump

on:
  push:
    paths:
      - '.github/workflows/bump-app-entry-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump app entry version
        run: sed -i 's#app.js?v=9#app.js?v=10#' app/index.html
      - name: Verify
        run: grep -q 'app.js?v=10' app/index.html
      - name: Commit
        run: |
          git config user.name kptu-app-bot
          git config user.email actions@users.noreply.github.com
          git add app/index.html
          git commit -m 'Bump app entry cache version'
          git push
