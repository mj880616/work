name: Phone app release

# APP-폰앱새로: 서명된 release APK(web2-phone-X.Y.Z.apk)를 GitHub 릴리스 phone-app-vX.Y.Z에 올린다(설계 docs/design/phone-app-v2.md 6.1·6.3).
# 앱(android-app/…/UpdateCheck.kt)은 공개 릴리스 목록에서 이 태그·이 저장소의 .apk만 새 버전으로 본다.
# 시작하는 길 두 가지(basket-pc-release.yml과 같음):
#   1. 사람이 main에 있는 커밋에 태그 phone-app-vX.Y.Z를 만든다(push 또는 GitHub 릴리스 화면);
#   2. 커맨드센터(또는 사람)가 main에서 이 workflow를 손으로 실행하고 version(예: 0.3.0)을 넣는다.
#      승인 뒤 release 작업이 확인한 main 커밋에 태그 phone-app-v<version>을 만든다. 태그가 이미 있으면 거절한다.
# 태그 버전은 android-app/app/build.gradle의 versionName과 같아야 한다(승인 요청 전에 확인).
# 서명은 승인형 environment `phone-app-release`의 비밀값으로만 한다. 서명 키·비밀번호는 저장소에 없고, 로그에 출력하지 않는다.
# DB·Edge·웹 배포·그 밖의 운영 서비스는 건드리지 않는다.

on:
  push:
    tags:
      - 'phone-app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the prefix, for example 0.3.0 (must equal versionName; the tag phone-app-v<version> is created after approval)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phone-app-release
  cancel-in-progress: false

jobs:
  # 읽기 권한만으로 먼저 확인한다. 태그 모양·main·versionName이 틀리면 승인 요청 전에 실패한다.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag or the version
        id: check
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Run this workflow on main only"
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
              echo "Version must look like 1.2.3"
              exit 1
            fi
            TAG="phone-app-v$INPUT_VERSION"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
              echo "The tag $TAG already exists. Use a new version number."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            if ! [[ "$TAG" =~ ^phone-app-v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
              echo "Tag must look like phone-app-v1.2.3"
              exit 1
            fi
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main"
            exit 1
          fi
          VERSION="${TAG#phone-app-v}"
          NAME="$(git show "$GITHUB_SHA:android-app/app/build.gradle" | sed -n "s/^ *versionName '\([0-9.]*\)'.*/\1/p")"
          if [ "$NAME" != "$VERSION" ]; then
            echo "versionName in android-app/app/build.gradle ($NAME) differs from $VERSION. Raise versionName and versionCode first."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: phone-app-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      BUILD_TOOLS: '36.0.0'
    steps:
      # verify가 확인한 바로 그 커밋(손 실행이면 시작 시점의 main 커밋)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;$BUILD_TOOLS"

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Render Android launcher icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 app/app-icon.svg -o android-app/app/src/main/res/drawable-nodpi/app_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
          # 서명하는 실행은 다른 실행이 만든 캐시를 쓰지 않는다
          cache-disabled: true

      - name: Unit tests
        run: gradle -p android-app :app:testReleaseUnitTest --stacktrace

      # build.gradle에는 서명 설정이 없다. 서명 없는 release APK를 만든 뒤 아래에서 서명한다.
      - name: Build release APK (unsigned)
        run: gradle -p android-app :app:assembleRelease --stacktrace

      - name: Sign the APK
        shell: bash
        env:
          PHONE_APP_KEYSTORE_B64: ${{ secrets.PHONE_APP_KEYSTORE_B64 }}
          PHONE_APP_KEYSTORE_PASSWORD: ${{ secrets.PHONE_APP_KEYSTORE_PASSWORD }}
          PHONE_APP_KEY_ALIAS: ${{ secrets.PHONE_APP_KEY_ALIAS }}
          PHONE_APP_KEY_PASSWORD: ${{ secrets.PHONE_APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PHONE_APP_KEYSTORE_B64 PHONE_APP_KEYSTORE_PASSWORD PHONE_APP_KEY_ALIAS PHONE_APP_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "The phone-app-release environment secret $name is missing"
              exit 1
            fi
          done
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          ks="$RUNNER_TEMP/phone-app.keystore"
          trap 'rm -f "$ks"' EXIT
          umask 077
          printf '%s' "$PHONE_APP_KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p out
          "$tools/zipalign" -p -f 4 android-app/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          # 비밀번호는 환경 변수 이름으로만 넘긴다(명령 인자·로그에 값이 나오지 않음).
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$PHONE_APP_KEY_ALIAS" \
            --ks-pass env:PHONE_APP_KEYSTORE_PASSWORD --key-pass env:PHONE_APP_KEY_PASSWORD \
            --out "out/web2-phone-$VERSION.apk" out/aligned.apk
          rm -f out/aligned.apk out/*.idsig
          "$tools/apksigner" verify "out/web2-phone-$VERSION.apk"
          # 서명 인증서 지문(공개값)만 요약에 남긴다. 업데이트가 같은 키인지 비교할 때 쓴다.
          digest="$("$tools/apksigner" verify --print-certs "out/web2-phone-$VERSION.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          echo "Signing certificate SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Record where the file came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/web2-phone-*.apk

      - name: Create the tag on the checked commit (manual run only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 승인을 기다리는 동안 태그가 생겼으면 거절한다. 이 작업을 다시 실행하면 자기 태그를 만날 수 있다.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha" | tr -d '\r')"
          if [ -n "$existing" ]; then
            if [ "$GITHUB_RUN_ATTEMPT" != "1" ] && [ "$existing" = "$RELEASE_SHA" ]; then
              echo "The tag $TAG already points at the checked commit (re-run). Continuing."
              exit 0
            fi
            echo "The tag $TAG already exists. Use a new version number."
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA" > /dev/null

      - name: Publish the release (hidden until the file is uploaded, then public)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="웹2 폰 앱 $VERSION"
          NOTES="폰에서 web2-phone-$VERSION.apk를 눌러 설치합니다. 이미 깔린 앱은 지우지 않고 덮어 깔립니다(같은 서명 키)."
          existing=0
          # 같은 태그의 릴리스가 이미 있을 수 있다(태그와 함께 손으로 만든 빈 릴리스, 또는 앞선 실패 실행이 남긴 것).
          while IFS=$'\t' read -r id draft assets; do
            [ -n "$id" ] || continue
            if [ "$draft" = "true" ]; then
              # 초안은 앱의 새 버전 확인에 보이지 않으므로 지우고 새로 만든다
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" > /dev/null
            elif [ "$assets" != "0" ]; then
              echo "A published release for $TAG already has files. Use a new version number."
              exit 1
            else
              existing=1
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft, (.assets | length)] | @tsv" | tr -d '\r')
          if [ "$existing" = "1" ]; then
            # 파일을 올리는 동안 빈 릴리스를 앱이 못 보게 pre-release로 둔다
            gh release edit "$TAG" --prerelease --latest=false
            gh release upload "$TAG" out/web2-phone-*.apk
          else
            gh release create "$TAG" out/web2-phone-*.apk --verify-tag --draft --latest=false --title "$TITLE" --notes "$NOTES"
          fi
          gh release edit "$TAG" --draft=false --prerelease=false --latest=false --title "$TITLE" --notes "$NOTES"
