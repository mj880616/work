name: Cloud files jobs cron

# FILES-통합 2-②b(S49-32, 설계 docs/design/files-unified-plan.md J절 H-6 '화면을 닫아도 전송은 계속'):
# 5분마다 서버(Edge cloud-files, 비밀 머리 x-cloud-files-cron-secret)를 부른다. 서버 실행이 조각 도중 끊기고 화면도 닫혀 있어
# 멈춘 '사람이 시작한 클라우드 전송'이 있으면 다음 실행 한 번을 깨운다. 일시 정지·끝난 줄·다른 작업공간은 건드리지 않는다.
# phone-push-schedule.yml과 같은 방식(GitHub 예약 + 함수 코드의 비밀 머리 비교). 분은 정각을 피해 흩뜨린다(GitHub 예약은 5분보다 자주 못 돈다).
# 켜기 스위치: 저장소 변수 CLOUD_FILES_CRON_ENABLED=true일 때만 돈다(함수 배포·비밀값 등록 전에는 건너뜀).
# 비밀값: CLOUD_FILES_CRON_SECRET(32자 이상) — GitHub Actions 비밀값과 Supabase Edge 비밀값 두 곳에 같은 값.
#         CLOUD_FILES_GATEWAY_KEY — 프로젝트 anon(legacy JWT) 열쇠, GitHub Actions 비밀값에만(cloud-files verify_jwt=true 게이트 통과용).
# 되돌리기: 변수를 지우거나 false로 두면(또는 이 workflow를 끄면) 예약 호출이 멈춘다. 화면이 열려 있을 때 깨우는 길(job_list)은 그대로다.
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-files-jobs-cron
  cancel-in-progress: false

jobs:
  sweep:
    if: github.repository == 'mj880616/work' && vars.CLOUD_FILES_CRON_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wake stalled cloud transfers
        env:
          CLOUD_FILES_CRON_SECRET: ${{ secrets.CLOUD_FILES_CRON_SECRET }}
          CLOUD_FILES_GATEWAY_KEY: ${{ secrets.CLOUD_FILES_GATEWAY_KEY }}
        run: node scripts/ops/cloud-files-cron.mjs
