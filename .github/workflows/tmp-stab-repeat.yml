name: TEMP calendar color repeat
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8123 >/tmp/http.log 2>&1 &
      - run: npx playwright test tests/app-e2e/calendar-week-view.spec.mjs tests/app-e2e/calendar-edit-move.spec.mjs -g "own event color|phone list keeps|move persists|PC default week|week bands" --browser=chromium --workers=1 --repeat-each=20 --reporter=line,github
