name: Render social preview images
on:
  push:
    paths:
      - 'assets/social/*.svg'
      - '.github/workflows/install-social-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render 600x600 JPEGs
        run: |
          for f in assets/social/*.svg; do
            base="${f%.svg}"
            rsvg-convert -w 600 -h 600 "$f" -o "$base.png"
            convert "$base.png" -strip -interlace Plane -sampling-factor 4:2:0 -quality 82 "$base.jpg"
            rm "$base.png"
          done
      - name: Commit JPEGs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/social/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Render social preview JPEGs'
          git push
