name: Render social preview images
on:
  push:
    paths:
      - 'assets/social/*.svg'
      - '.github/workflows/install-social-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render 600x600 JPEGs
        run: |
          for f in assets/social/*.svg; do
            base="${f%.svg}"
            rsvg-convert -w 600 -h 600 "$f" -o "$base.png"
            convert "$base.png" -strip -interlace Plane -sampling-factor 4:2:0 -quality 82 "$base.jpg"
            rm "$base.png"
          done
      - name: Connect Open Graph images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages={
            'index.html':'home-social.jpg',
            '2in1/field-testimony/index.html':'field-social.jpg',
            'workforce/index.html':'workforce-social.jpg',
            'workforce/press-conference-0914/index.html':'press-social.jpg',
            'workforce/joint-struggle-0921/index.html':'joint-social.jpg',
          }
          import re
          for page,img in pages.items():
              p=Path(page); s=p.read_text()
              s=re.sub(r'<meta[^>]+(?:og:image|twitter:image)[^>]*>','',s,flags=re.I)
              url=f'https://mj880616.github.io/work/assets/social/{img}?v=20260910-1'
              tags=(f'<meta property="og:image" content="{url}">'
                    f'<meta property="og:image:secure_url" content="{url}">'
                    f'<meta property="og:image:type" content="image/jpeg">'
                    f'<meta property="og:image:width" content="600">'
                    f'<meta property="og:image:height" content="600">'
                    f'<meta name="twitter:card" content="summary_large_image">'
                    f'<meta name="twitter:image" content="{url}">')
              s=s.replace('</head>',tags+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit previews and metadata
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/social/*.jpg index.html 2in1/field-testimony/index.html workforce/index.html workforce/press-conference-0914/index.html workforce/joint-struggle-0921/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add social preview images and metadata'
          git push
