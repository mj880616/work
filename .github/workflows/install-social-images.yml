name: Remove social preview image metadata
on:
  push:
    paths:
      - '.github/workflows/install-social-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove-image-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove image metadata from every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = [
              r'<meta\s+property=["\']og:image(?::[^"\']*)?["\'][^>]*>\s*',
              r'<meta\s+name=["\']twitter:image(?::[^"\']*)?["\'][^>]*>\s*',
          ]
          changed = []
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              old = s
              for pattern in patterns:
                  s = re.sub(pattern, '', s, flags=re.I)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Removed image metadata from:', *changed, sep='\n- ')
          PY
      - name: Commit removal
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add '*.html' '**/*.html' || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove SNS preview image metadata from all pages'
          git push