name: Web2 anonymous auth gate E2E

on:
  pull_request:
    # 초안(draft) PR은 화면 시험을 건너뛰고, 초안을 풀면(ready_for_review) 다시 돈다(S54-01).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/app-e2e/public-workspace-auth.spec.mjs'
      - '.github/workflows/public-workspace-auth-e2e.yml'
      - '.github/actions/setup-playwright/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/app-e2e/public-workspace-auth.spec.mjs'
      - '.github/workflows/public-workspace-auth-e2e.yml'
      - '.github/actions/setup-playwright/**'

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  anonymous-auth-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # OPS-시험줄(S70-39): PR에서는 고친 파일이 이 시험과 관련될 때만 돈다(scripts/ci/e2e-select.mjs 한 곳).
      # 관련 없으면 시험 칸은 건너뛰고 job은 성공으로 끝난다. push(main)는 늘 돈다. 전체는 merge queue의 browser-e2e가 본다.
      - name: Decide whether these specs are related to the change
        id: related
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > /tmp/e2e-changed-files
          node scripts/ci/e2e-select.mjs /tmp/e2e-changed-files /tmp/e2e-select.json
          run="$(node scripts/ci/e2e-select.mjs --has /tmp/e2e-select.json tests/app-e2e/public-workspace-auth.spec.mjs)"
          if grep -zq '^\.github/workflows/public-workspace-auth-e2e.yml$' /tmp/e2e-changed-files; then run=true; fi
          echo "related: $run" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Install Playwright
        if: steps.related.outputs.run == 'true'
        uses: ./.github/actions/setup-playwright
      - name: Start static app server
        if: steps.related.outputs.run == 'true'
        run: |
          python3 -m http.server 8123 >/tmp/kptu-auth-gate-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-auth-gate-http.log
          exit 1
      - name: Run Web2 anonymous auth gate flow
        if: steps.related.outputs.run == 'true'
        run: npx playwright test tests/app-e2e/public-workspace-auth.spec.mjs --browser=chromium --workers=1 --reporter=line,github
