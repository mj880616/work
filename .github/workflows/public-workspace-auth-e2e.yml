name: Web2 anonymous auth gate E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/app-e2e/public-workspace-auth.spec.mjs'
      - '.github/workflows/public-workspace-auth-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/app-e2e/public-workspace-auth.spec.mjs'
      - '.github/workflows/public-workspace-auth-e2e.yml'

permissions:
  contents: read

jobs:
  anonymous-auth-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python3 -m http.server 8123 >/tmp/kptu-auth-gate-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-auth-gate-http.log
          exit 1
      - name: Run Web2 anonymous auth gate flow
        run: npx playwright test tests/app-e2e/public-workspace-auth.spec.mjs --browser=chromium --workers=1 --reporter=line
