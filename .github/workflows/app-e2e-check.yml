name: App browser E2E check

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'p/**'
      - 'tests/app-e2e/**'
      - '.github/workflows/app-e2e-check.yml'
  # main 대상 PR은 경로와 무관하게 시작해 browser-e2e 결과를 항상 남긴다.
  # 화면 시험이 필요한지는 아래 changes job이 변경 파일로 판정한다.
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 화면 시험 필요 여부 판정. 기준 경로는 push 필터와 같다.
  # push·schedule·workflow_dispatch는 항상 필요로 본다.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Decide whether browser E2E is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event $EVENT_NAME: browser E2E always needed"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > /tmp/e2e-changed-files
          tr '\0' '\n' < /tmp/e2e-changed-files
          if grep -zqE '^(app/|p/|tests/app-e2e/|\.github/workflows/app-e2e-check\.yml$)' /tmp/e2e-changed-files; then
            echo "browser E2E needed"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "no app, p, tests/app-e2e or workflow change: browser E2E not needed"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  browser-e2e-shard:
    name: browser-e2e-shard (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static app server
        run: |
          python3 -m http.server 8123 >/tmp/kptu-e2e-http.log 2>&1 &
          echo $! > /tmp/kptu-e2e-http.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-e2e-http.log
          exit 1

      # 시작 시간 측정은 검사 묶음과 별개라 shard 1에서만 한 번 실행한다.
      - name: Start baseline main app server
        if: matrix.shardIndex == 1
        run: |
          mkdir -p /tmp/kptu-p6-main
          git archive 3d84e8e18a822c84015bf7a8a4a556b42d7f2f1c | tar -x -C /tmp/kptu-p6-main
          (cd /tmp/kptu-p6-main && python3 -m http.server 8124 >/tmp/kptu-p6-main-http.log 2>&1 &)
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8124/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-p6-main-http.log
          exit 1

      - name: Measure main and P6 startup with identical mocked APIs
        if: matrix.shardIndex == 1
        run: node tests/app-e2e/startup-benchmark.mjs

      - name: Upload startup measurements
        if: always() && matrix.shardIndex == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p6-startup-measurement
          path: /tmp/p6-startup-measurement.json
          if-no-files-found: ignore

      - name: Run complete browser regression suite
        run: >-
          npx playwright test tests/app-e2e
          --browser=chromium --workers=1 --reporter=line,github
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-e2e-report-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # 기존 검사 이름(browser-e2e)으로 판정과 4개 shard 결과를 한 번에 본다.
  # 판정 실패·취소는 실패, 불필요는 성공, 필요하면 shard 모두 success일 때만 성공.
  # shard가 실패하면 "Re-run failed jobs"로 실패한 shard와 이 job만 다시 돌린다.
  browser-e2e:
    if: always()
    needs: [changes, browser-e2e-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check decision and shard results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_NEEDED: ${{ needs.changes.outputs.e2e }}
          SHARD_RESULT: ${{ needs.browser-e2e-shard.result }}
        run: |
          echo "changes result: $CHANGES_RESULT, e2e needed: $E2E_NEEDED, browser-e2e-shard result: $SHARD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "decision job did not succeed"
            exit 1
          fi
          if [ "$E2E_NEEDED" = "false" ]; then
            echo "browser E2E not needed for this change"
            exit 0
          fi
          if [ "$E2E_NEEDED" != "true" ]; then
            echo "unknown decision: $E2E_NEEDED"
            exit 1
          fi
          test "$SHARD_RESULT" = "success"
