name: App browser E2E check

on:
  push:
    branches: [main]
    paths: ['app/**','p/**','tests/app-e2e/**','.github/workflows/app-e2e-check.yml']
  pull_request:
    branches: [main]
    paths: ['app/**','p/**','tests/app-e2e/**','.github/workflows/app-e2e-check.yml']
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python3 -m http.server 8123 >/tmp/kptu-e2e-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          exit 1
      - name: Run recovery RED check
        run: npx playwright test tests/app-e2e/public-page-password-recovery.spec.mjs --browser=chromium --workers=1 --reporter=line
