name: App browser E2E check

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/app-e2e/**'
      - '.github/workflows/app-e2e-check.yml'
      - '.github/actions/setup-playwright/**'
  # main 대상 PR은 경로와 무관하게 시작해 browser-e2e 결과를 항상 남긴다.
  # PR에서는 고친 파일과 관련된 시험만 돈다(아래 changes job → scripts/ci/e2e-select.mjs, OPS-시험줄 S70-39).
  pull_request:
    # 초안(draft) PR은 화면 시험을 건너뛰고, 초안을 풀면(ready_for_review) 다시 돈다(S54-01).
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  # merge queue: main에 들어가기 직전 묶음마다 늘 전체 시험(필수 검사 browser-e2e를 같은 이름으로 보고).
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 화면 시험 필요 여부 판정. 기준 경로는 push 필터와 같다.
  # push·workflow_dispatch는 항상 필요로 본다. schedule은 마지막 성공한 정기 실행과 같은 커밋이면 건너뛴다(S54-14).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
      full: ${{ steps.decide.outputs.full }}
      specs: ${{ steps.decide.outputs.specs }}
      shards: ${{ steps.decide.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          package-manager-cache: false

      - name: Decide whether browser E2E is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          HEAD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # 밤 정기 실행: 마지막으로 성공한 정기 실행과 같은 커밋이면 시험 칸을 건너뛴다.
            # 공개 저장소의 실행 목록을 토큰 없이 읽는다(권한을 넓히지 않음). 읽지 못하거나 이전 성공이 없으면 그대로 돌린다.
            if [ "$EVENT_NAME" = "schedule" ]; then
              last_sha="$(curl --fail --silent --show-error --max-time 20 \
                "https://api.github.com/repos/$REPO/actions/workflows/app-e2e-check.yml/runs?event=schedule&status=success&branch=main&per_page=1" \
                | jq -r '.workflow_runs[0].head_sha // empty' || true)"
              if [ -n "$last_sha" ] && [ "$last_sha" = "$HEAD_COMMIT" ]; then
                { echo "e2e=false"; echo "full=false"; echo "shards=[1]"; } >> "$GITHUB_OUTPUT"
                echo "밤 정기 실행 건너뜀: 마지막 성공한 정기 실행 이후 main에 새 커밋 없음 (${HEAD_COMMIT:0:7})" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "last successful scheduled run sha: ${last_sha:-unknown}; running"
            fi
            # merge_group·push·workflow_dispatch·schedule은 늘 전체.
            echo "event $EVENT_NAME: complete browser E2E"
            {
              echo "e2e=true"; echo "full=true"; echo "shards=[$(seq -s, 1 24)]"; echo "specs=tests/app-e2e"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > /tmp/e2e-changed-files
          tr '\0' '\n' < /tmp/e2e-changed-files
          # 고친 파일 → 관련 시험(대응을 못 찾거나 공용 부품·시험 도구·workflow면 전체, 앱·시험과 무관하면 없음).
          node scripts/ci/e2e-select.mjs /tmp/e2e-changed-files /tmp/e2e-select.json | tee -a "$GITHUB_STEP_SUMMARY"
          mode="$(jq -r .mode /tmp/e2e-select.json)"
          case "$mode" in
            none)
              { echo "e2e=false"; echo "full=false"; echo "shards=[1]"; } >> "$GITHUB_OUTPUT"
              ;;
            full)
              {
                echo "e2e=true"; echo "full=true"; echo "shards=[$(seq -s, 1 24)]"; echo "specs=tests/app-e2e"
              } >> "$GITHUB_OUTPUT"
              ;;
            some)
              {
                echo "e2e=true"; echo "full=false"
                echo "shards=$(jq -c '[range(1; .shards + 1)]' /tmp/e2e-select.json)"
                echo "specs=$(jq -r '.specs | join(" ")' /tmp/e2e-select.json)"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown selection mode: $mode"; exit 1
              ;;
          esac

  # 갈래 수: 전체면 24, 관련 시험만이면 시험 파일 6개당 1갈래(1~24). 갈래 안 나누기는 그대로 e2e-shard.mjs.
  browser-e2e-shard:
    name: browser-e2e-shard (${{ matrix.shardIndex }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        uses: ./.github/actions/setup-playwright

      # 접속 대기 줄을 넓힌 정적 서버(내주는 파일은 http.server와 같음). workers=2에서 기본 대기 줄 5칸이 넘쳐
      # 접속이 1~3초씩 늦어지던 간헐 실패를 막는다(STAB-화면시험간헐, tests/app-e2e/helpers/static-server.py).
      - name: Start static app server
        run: |
          python3 tests/app-e2e/helpers/static-server.py 8123 >/tmp/kptu-e2e-http.log 2>&1 &
          echo $! > /tmp/kptu-e2e-http.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-e2e-http.log
          exit 1

      # OPS-작업속도(S56-29): 시험 개수·내용·재시도(0)는 그대로 두고 나누는 방법만 바꾼다.
      # - Playwright --shard는 파일 이름 순서로 이어 잘라, 무거운 파일(journal.spec.mjs 시험 145개)이 한 갈래에 몰려
      #   그 갈래만 10~16분 걸렸다. scripts/ci/e2e-shard.mjs가 전체 목록을 시험 하나씩 갈래마다 차례로 나눠
      #   모든 파일이 모든 갈래에 퍼지게 하고, 실행 뒤 시험 id로 맡은 시험이 빠짐·덧붙음 없이 돌았는지 확인한다.
      # - 갈래 24개, 갈래마다 workers 2: workers 4로 재 보니 러너 하나가 1분에 끝내는 시험 수가 오히려 줄고(약 55 → 41개)
      #   바쁜 화면에서 사라짐 확인 같은 시험이 흔들렸다. 러너 하나는 workers 2로 가득 차므로 러너 수(갈래)를 늘린다.
      # 고를 시험 파일: 전체면 tests/app-e2e, 아니면 changes job이 고른 파일들(빈칸 구분, 파일 이름에 빈칸 없음).
      - name: Plan this shard's tests
        env:
          E2E_SPECS: ${{ needs.changes.outputs.specs }}
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test $E2E_SPECS --browser=chromium --list --reporter=json > /tmp/e2e-list.json
          node scripts/ci/e2e-shard.mjs plan /tmp/e2e-list.json "$SHARD_INDEX" "$SHARD_TOTAL" /tmp/e2e-shard.json /tmp/e2e-shard-grep.txt

      - name: Run browser regression suite (complete or related specs)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/e2e-result.json
          E2E_SPECS: ${{ needs.changes.outputs.specs }}
        run: >-
          npx playwright test $E2E_SPECS
          --browser=chromium --workers=2 --fully-parallel --reporter=line,github,json
          --grep "$(cat /tmp/e2e-shard-grep.txt)"

      - name: Check this shard ran exactly its planned tests
        run: node scripts/ci/e2e-shard.mjs verify /tmp/e2e-shard.json /tmp/e2e-result.json

      # UI-화면정리: 세 폭 화면 사진(tests/app-e2e/ui-screen-audit.spec.mjs)을 전후 비교용으로 남긴다. 사진이 없는 shard는 건너뛴다.
      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-audit-${{ matrix.shardIndex }}
          path: test-results/ui-audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-e2e-report-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # 시작 시간 측정(main과 P6 비교)은 검사 묶음과 별개라 따로 한 번 돈다. 전에는 shard 1 안에서 돌아
  # 그 갈래만 1분 남짓 늦게 끝났다(OPS-작업속도). 결과는 browser-e2e가 함께 본다.
  # 관련 시험만 도는 PR에서는 건너뛰고, 전체일 때(공용 부품을 고친 PR·merge queue·main)만 돈다.
  startup-benchmark:
    needs: changes
    if: needs.changes.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        uses: ./.github/actions/setup-playwright

      - name: Start static app server
        run: |
          python3 tests/app-e2e/helpers/static-server.py 8123 >/tmp/kptu-e2e-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-e2e-http.log
          exit 1

      - name: Start baseline main app server
        run: |
          mkdir -p /tmp/kptu-p6-main
          git archive 3d84e8e18a822c84015bf7a8a4a556b42d7f2f1c | tar -x -C /tmp/kptu-p6-main
          (cd /tmp/kptu-p6-main && python3 -m http.server 8124 >/tmp/kptu-p6-main-http.log 2>&1 &)
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8124/app/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-p6-main-http.log
          exit 1

      - name: Measure main and P6 startup with identical mocked APIs
        run: node tests/app-e2e/startup-benchmark.mjs

      - name: Upload startup measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p6-startup-measurement
          path: /tmp/p6-startup-measurement.json
          if-no-files-found: ignore

  # 기존 검사 이름(browser-e2e, main 필수 검사)으로 판정과 shard·시작 시간 측정 결과를 한 번에 본다.
  # pull_request·merge_group 모두 같은 이름으로 보고한다(관련 시험만 돈 PR도 이 이름이 성공해야 merge queue에 들어감).
  # 판정 실패·취소는 실패, 불필요는 성공, 필요하면 shard가(전체면 시작 시간 측정도) success일 때만 성공.
  # shard가 실패하면 "Re-run failed jobs"로 실패한 shard와 이 job만 다시 돌린다.
  browser-e2e:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, browser-e2e-shard, startup-benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check decision and shard results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_NEEDED: ${{ needs.changes.outputs.e2e }}
          E2E_FULL: ${{ needs.changes.outputs.full }}
          SHARD_RESULT: ${{ needs.browser-e2e-shard.result }}
          BENCHMARK_RESULT: ${{ needs.startup-benchmark.result }}
        run: |
          echo "changes result: $CHANGES_RESULT, e2e needed: $E2E_NEEDED, browser-e2e-shard result: $SHARD_RESULT, startup-benchmark result: $BENCHMARK_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "decision job did not succeed"
            exit 1
          fi
          if [ "$E2E_NEEDED" = "false" ]; then
            echo "browser E2E not needed for this change"
            exit 0
          fi
          if [ "$E2E_NEEDED" != "true" ]; then
            echo "unknown decision: $E2E_NEEDED"
            exit 1
          fi
          test "$SHARD_RESULT" = "success"
          if [ "$E2E_FULL" = "true" ]; then
            test "$BENCHMARK_RESULT" = "success"
          else
            echo "related specs only: startup-benchmark runs in merge queue"
            test "$BENCHMARK_RESULT" = "skipped"
          fi
