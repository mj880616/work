name: Page management E2E

on:
  push:
    branches:
      - main
    paths:
      - 'app/page-management.js'
      - 'app/page-shortcut.js'
      - 'tests/app-e2e/page-management-*'
      - '.github/workflows/page-management-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/page-management.js'
      - 'app/page-shortcut.js'
      - 'tests/app-e2e/page-management-*'
      - '.github/workflows/page-management-e2e.yml'
  workflow_dispatch:

jobs:
  page-management-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python3 -m http.server 8123 >/tmp/kptu-page-e2e-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/tests/app-e2e/page-management-fixture.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-page-e2e-http.log
          exit 1
      - name: Run page management E2E
        run: npx playwright test tests/app-e2e/page-management.spec.mjs --browser=chromium --workers=1 --reporter=line
