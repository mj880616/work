name: KPTU board probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe metadata and HWP extraction
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhwp-bin >/dev/null 2>&1 || true
          python - <<'PY'
          import urllib.request,re,html,os,subprocess,tempfile
          from urllib.parse import urljoin
          UA={"User-Agent":"Mozilla/5.0 KPTU-archive-probe/1.0"}
          urls=[
            "https://kptu.net/board/detail.aspx?mid=F686C1F3&idx=56205&bid=KPTU_NEW04",
            "https://kptu.net/board/detail.aspx?mid=F686C1F3&idx=56177&bid=KPTU_NEW04",
            "https://kptu.net/board/detail.aspx?mid=F686C1F3&page=10&idx=55684&bid=KPTU_NEW04"
          ]
          def clean(s):
              s=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',s,flags=re.I)
              s=re.sub(r'<[^>]+>',' ',s)
              return html.unescape(re.sub(r'\s+',' ',s)).strip()
          for url in urls:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read(); page=raw.decode(r.headers.get_content_charset() or "utf-8","replace")
              # candidate metadata around common board labels and heading tags
              heads=[clean(x) for x in re.findall(r'<(?:h1|h2|h3|h4|strong|dt|dd|th|td)[^>]*>([\s\S]*?)</(?:h1|h2|h3|h4|strong|dt|dd|th|td)>',page,re.I)]
              heads=[x for x in heads if x and len(x)<300]
              hrefs=re.findall(r'href\s*=\s*["\']([^"\']+)["\']',page,re.I)
              files=[urljoin(url,html.unescape(x)) for x in hrefs if re.search(r'FileDown\.aspx',x,re.I)]
              print("META",{"url":url,"candidate_fields":heads[-30:],"files":files})
              for i,fu in enumerate(files[:3]):
                  try:
                      rq=urllib.request.Request(fu,headers=UA)
                      with urllib.request.urlopen(rq,timeout=30) as rr:
                          data=rr.read()
                          ctype=rr.headers.get("content-type"); dispo=rr.headers.get("content-disposition")
                      ext=".hwp" if ".hwp" in fu.lower() else ".bin"
                      p=f"/tmp/kptu_{i}{ext}"
                      open(p,"wb").write(data)
                      print("FILE",{"url":fu,"bytes":len(data),"content_type":ctype,"disposition":dispo,"magic":data[:16].hex()})
                      for cmd in (["hwp5txt",p],["hwp5proc","xml",p]):
                          try:
                              z=subprocess.run(cmd,capture_output=True,timeout=30)
                              out=(z.stdout or b"").decode("utf-8","replace")
                              if out.strip():
                                  print("EXTRACT",{"tool":cmd[0],"chars":len(out),"sample":re.sub(r'\s+',' ',out)[:1200]})
                                  break
                          except Exception as e: pass
                  except Exception as e: print("FILE_ERROR",fu,repr(e))
          PY
