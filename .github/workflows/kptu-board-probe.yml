name: KPTU board probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kptu-board-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install pyhwp
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          python -m pip install six\n          python -m pip install --pre pyhwp
          hwp5txt --help >/dev/null
      - name: Probe metadata and HWP extraction
        shell: python
        run: |
          import urllib.request,re,html,subprocess,os
          from urllib.parse import urljoin
          UA={"User-Agent":"Mozilla/5.0 KPTU-archive-probe/1.0"}
          urls=[
            "https://kptu.net/board/detail.aspx?mid=F686C1F3&idx=56205&bid=KPTU_NEW04",
            "https://kptu.net/board/detail.aspx?mid=F686C1F3&idx=56177&bid=KPTU_NEW04",
            "https://kptu.net/board/detail.aspx?mid=F686C1F3&page=10&idx=55684&bid=KPTU_NEW04"
          ]
          def clean(s):
              s=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',s,flags=re.I)
              s=re.sub(r'<[^>]+>',' ',s)
              return html.unescape(re.sub(r'\s+',' ',s)).strip()
          for docno,url in enumerate(urls):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read(); page=raw.decode(r.headers.get_content_charset() or "utf-8","replace")
              fields=[clean(x) for x in re.findall(r'<(?:h1|h2|h3|h4|strong|dt|dd|th|td)[^>]*>([\s\S]*?)</(?:h1|h2|h3|h4|strong|dt|dd|th|td)>',page,re.I)]
              fields=[x for x in fields if x and len(x)<300]
              hrefs=re.findall(r'href\s*=\s*["\']([^"\']+)["\']',page,re.I)
              hwps=[urljoin(url,html.unescape(x)) for x in hrefs if re.search(r'FileDown\.aspx.*\.hwp(?:&|$)',html.unescape(x),re.I)]
              print("META",{"url":url,"candidate_fields":fields[-20:],"hwp_count":len(hwps)})
              for i,fu in enumerate(hwps):
                  rq=urllib.request.Request(fu,headers=UA)
                  with urllib.request.urlopen(rq,timeout=30) as rr:
                      data=rr.read()
                  p=f"/tmp/kptu_{docno}_{i}.hwp"
                  open(p,"wb").write(data)
                  z=subprocess.run(["hwp5txt",p],capture_output=True,timeout=60)
                  out=z.stdout.decode("utf-8","replace")
                  err=z.stderr.decode("utf-8","replace")
                  print("HWP_RESULT",{"url":fu,"bytes":len(data),"returncode":z.returncode,"chars":len(out),"sample":re.sub(r'\s+',' ',out)[:1800],"stderr":err[:500]})
