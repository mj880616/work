name: KPTU board probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe KPTU board and detail pages
        shell: python
        run: |
          import urllib.request, re, html
          from urllib.parse import urljoin
          UA={"User-Agent":"Mozilla/5.0 KPTU-archive-probe/1.0"}
          base="https://kptu.net/board/list.aspx?mid=F686C1F3"
          details_all=[]
          for page in (1,2,10):
              url=base if page==1 else base+"&page="+str(page)
              req=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(); text=raw.decode("utf-8","replace")
                      details=re.findall(r'href=["\']?([^"\' >]*detail\.aspx[^"\' >]*)',text,re.I)
                      details=[urljoin(url,x.replace("&amp;","&")) for x in details]
                      print({"page":page,"status":r.status,"bytes":len(raw),"detail_count":len(details),"samples":details[:3]})
                      details_all += details[1:4]
              except Exception as e: print({"page":page,"error":repr(e)})
          seen=[]
          for url in details_all:
              if url in seen: continue
              seen.append(url)
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read()
                      enc=r.headers.get_content_charset() or "utf-8"
                      text=raw.decode(enc,"replace")
                      title=(re.search(r'<title[^>]*>([\s\S]*?)</title>',text,re.I) or [None,None])[1]
                      hrefs=re.findall(r'href\s*=\s*["\']([^"\']+)["\']',text,re.I)
                      file_hrefs=[urljoin(url,html.unescape(x)) for x in hrefs if re.search(r'(download|attach|file|\.hwp|\.hwpx|\.pdf|\.docx?|\.xlsx?|\.pptx?)',x,re.I)]
                      plain=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',text,flags=re.I)
                      plain=re.sub(r'<[^>]+>',' ',plain); plain=html.unescape(re.sub(r'\s+',' ',plain)).strip()
                      print({"detail":url,"status":r.status,"bytes":len(raw),"title":re.sub(r'<[^>]+>',' ',title or '').strip(),"file_candidates":file_hrefs[:10],"text_sample":plain[:500]})
              except Exception as e: print({"detail":url,"error":repr(e)})
