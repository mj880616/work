name: Basket PC drop check

on:
  pull_request:
    paths:
      - 'basket-pc/**'
      - 'tests/fixtures/basket-pc-content-disposition.json'
      - '.github/workflows/basket-pc-check.yml'
  workflow_dispatch:

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build (warnings are errors)
        run: dotnet build basket-pc/BasketDrop.sln -c Release

      - name: Test (fake server only, no production calls)
        env:
          # S69-35: the desktop tile picture at 100·125·150·200% is kept as an artifact (pictures only, no data).
          BASKET_TILE_SHOTS: ${{ runner.temp }}/tile-shots
        run: dotnet test basket-pc/tests/BasketDrop.Tests -c Release --no-build

      - name: Keep the tile pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: basket-pc-tile-shots
          path: ${{ runner.temp }}/tile-shots
          if-no-files-found: ignore
          retention-days: 14
