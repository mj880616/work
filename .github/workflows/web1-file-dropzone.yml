name: Check Web1 file dropzones

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  dropzone:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test dropzone checker
        run: node --test scripts/check-web1-file-dropzone.test.mjs
      - name: Require helper on Web1 upload pages
        run: node scripts/check-web1-file-dropzone.mjs
