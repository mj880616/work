name: News feed

# NEWS-클리핑 B: 켠 매체 RSS·관심 키워드(구글 뉴스 검색 RSS)·채널 기사 원문을 하루 3번 서버(Edge news-feed)가 읽어 온다(N2).
# 시각(KST): 08:22·13:22·18:22(UTC 23:22·04:22·09:22). 사회운동 Now(7분)와 겹치지 않게 22분.
# 비밀값 NEWS_FEED_CRON_SECRET은 GitHub Actions 비밀값과 Supabase Edge 비밀값 두 곳에 같은 값(명진이 등록).
# 함수 첫 배포·비밀값 등록 전에는 401로 실패한다(되돌리기: 이 workflow를 끄면 예약 호출이 멈춘다).
on:
  schedule:
    - cron: '22 23,4,9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  read:
    if: github.repository == 'mj880616/work'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read news clipping
        env:
          NEWS_FEED_CRON_SECRET: ${{ secrets.NEWS_FEED_CRON_SECRET }}
        run: node scripts/ops/news-feed.mjs
