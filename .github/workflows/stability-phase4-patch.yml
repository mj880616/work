name: Stability phase4 patch

on:
  push:
    branches:
      - stability-audit-phase4
    paths:
      - '.github/workflows/stability-phase4-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-audit-phase4
      - name: Apply explicit team ready contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          team=Path('app/team.js')
          text=team.read_text(encoding='utf-8')
          old_css="  const css=document.createElement('link');css.rel='stylesheet';css.href='./team.css?v=1';document.head.appendChild(css);\n"
          if old_css not in text:
              raise SystemExit('team dynamic css marker not found')
          text=text.replace(old_css,'',1)
          old_tail='\ninit();'
          new_tail="""\nwindow.__KPTU_TEAM_READY__=init().then(()=>{\n  const state=!session?'auth':membership?'workspace':'bootstrap';\n  window.__KPTU_TEAM_READY_STATE__=state;\n  window.dispatchEvent(new CustomEvent('kptu:team-ready',{detail:{state}}));\n  return state;\n});"""
          if not text.endswith(old_tail):
              raise SystemExit('team init tail not found')
          text=text[:-len(old_tail)]+new_tail
          team.write_text(text,encoding='utf-8')

          loader=Path('app/loader-v2.js')
          text=loader.read_text(encoding='utf-8')
          if "import('./team.js?v=8')" not in text:
              raise SystemExit('team import v8 marker not found')
          text=text.replace("import('./team.js?v=8')","import('./team.js?v=9')",1)
          pattern=r"  const waitForTeamState=async\(\)=>\{.*?\n  await waitForTeamState\(\);"
          text,count=re.subn(pattern,"  await window.__KPTU_TEAM_READY__;",text,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f'loader waitForTeamState replacement count={count}')
          loader.write_text(text,encoding='utf-8')

          smoke=Path('.github/workflows/app-smoke-check.yml')
          text=smoke.read_text(encoding='utf-8')
          text=text.replace('grep -q "team.js?v=8" app/loader-v2.js','grep -q "team.js?v=9" app/loader-v2.js',1)
          marker='          grep -q "KPTURuntime.session.ensure" app/loader-v2.js\n'
          insert=(marker+
                  '          grep -q "__KPTU_TEAM_READY__" app/team.js app/loader-v2.js\n'
                  '          grep -q "__KPTU_TEAM_READY_STATE__" app/team.js\n')
          if marker not in text:
              raise SystemExit('smoke ready marker insertion point not found')
          text=text.replace(marker,insert,1)
          marker2="          if grep -q \"MutationObserver\" app/access-approval.js app/home-task-controls.js app/photo-room.js; then\n"
          insert2=("          if grep -q \"MutationObserver\" app/loader-v2.js; then\n"
                   "            echo 'loader must use explicit feature readiness contracts, not DOM mutation polling'; exit 1\n"
                   "          fi\n"+marker2)
          if marker2 not in text:
              raise SystemExit('smoke observer insertion point not found')
          text=text.replace(marker2,insert2,1)
          marker3="          if grep -q \"createElement('style')\\|createElement(\\\"style\\\")\" app/access-approval.js app/home-task-controls.js app/home-dashboard-v2.js app/photo-room.js; then\n"
          insert3=("          if grep -q \"createElement('link')\" app/team.js; then\n"
                   "            echo 'team css must stay in the static stylesheet graph'; exit 1\n"
                   "          fi\n"+marker3)
          if marker3 not in text:
              raise SystemExit('smoke css insertion point not found')
          text=text.replace(marker3,insert3,1)
          smoke.write_text(text,encoding='utf-8')
          PY

          node --check app/team.js
          node --check app/loader-v2.js
          git diff --check
          git diff -- app/team.js app/loader-v2.js .github/workflows/app-smoke-check.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/team.js app/loader-v2.js .github/workflows/app-smoke-check.yml
          git commit -m 'Web2 4차: 명시적 team ready 계약 적용'
          git push origin HEAD:stability-audit-phase4
