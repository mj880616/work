name: Fix sanbyeol layout
on:
  push:
    paths:
      - '.github/workflows/fix-sanbyeol-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete sanbyeol requested fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sanbyeol/index.html')
          s=p.read_text(encoding='utf-8')
          # Keep page isolated and metadata image-free.
          s=s.replace('<a class="back" href="/work/">← 업무 현황</a>\n','')
          # Static fallback summaries for LX education events.
          s=s.replace('<div class="row editable" data-key="public-0904" data-type="row"><div class="date">9/4</div><div><b>한국국토정보공사노조 서울지역 확대운영위원회 산별전환 교육</b></div></div>', '<div class="row editable" data-key="public-0904" data-type="row"><div class="date">9/4</div><div><b>한국국토정보공사노조 서울지역 확대운영위원회 산별전환 교육</b><p>기업별노조의 사후 대응을 넘어 LX 현안은 공사와 교섭하고 총인건비·정부지침은 산별 공동교섭으로 대응하는 구조 전환을 중심으로 교육함.</p></div></div>')
          s=s.replace('<div class="row editable" data-key="public-0911" data-type="row"><div class="date">9/11</div><div><b>한국국토정보공사노조 경남본부 간부 산별전환 교육</b></div></div>', '<div class="row editable" data-key="public-0911" data-type="row"><div class="date">9/11</div><div><b>한국국토정보공사노조 경남본부 간부 산별전환 교육</b><p>LX의 임금·인력·조직개편 현안을 정부의 공공기관 정책과 연결하고, 이를 넘어설 산별전환의 필요성을 중심으로 교육함.</p></div></div>')
          # Make summary editing explicit and preserve title/content separately.
          s=s.replace("const title=prompt('제목',v.title);if(title===null)return;const text=prompt('내용',v.text);", "const title=prompt('카드 제목',v.title);if(title===null)return;const text=prompt('카드 내용',v.text);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sanbyeol/index.html
          git diff --cached --quiet || git commit -m 'Complete sanbyeol page fixes'
          git push
