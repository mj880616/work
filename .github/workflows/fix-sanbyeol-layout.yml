name: Fix sanbyeol layout
on:
  push:
    paths:
      - '.github/workflows/fix-sanbyeol-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix summary card editor
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sanbyeol/index.html
          git diff --cached --quiet || git commit -m 'Fix summary editor and line breaks'
          git push
