name: Fix sanbyeol layout
on:
  push:
    paths:
      - '.github/workflows/fix-sanbyeol-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add April rail activities
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sanbyeol/index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="row editable" data-key="rail-0407" data-type="row"><div class="date">4/7</div><div><b>영주지방본부 대의원대회 산별전환 교육</b><p>산별노조 역사와 조직형태 변화, 재경부 등 실질 사용자와의 교섭 필요성을 중심으로 교육.</p></div></div>'
          new='''<div class="row editable" data-key="rail-0407" data-type="row"><div class="date">4/7</div><div><b>영주지방본부 정기대의원대회 산별전환 교육</b><p>산별노조 역사와 조직형태 변화, 정부 상대 교섭 필요성을 중심으로 김명진 국장이 교육함.</p></div></div>
<div class="row editable" data-key="rail-0410" data-type="row"><div class="date">4/10</div><div><b>부산지방본부 정기대의원대회 산별전환 교육</b><p>박진현 국장이 산별전환 필요성과 조직적 과제를 중심으로 교육함.</p></div></div>
<div class="row editable" data-key="rail-0414" data-type="row"><div class="date">4/14</div><div><b>호남지방본부 정기대의원대회 산별전환 교육</b><p>강철 위원장이 산별전환 필요성과 철도노조의 조직적 과제를 중심으로 교육함.</p></div></div>
<div class="row editable" data-key="rail-0428" data-type="row"><div class="date">4/28</div><div><b>대전지방본부 초급간부 기초교육 산별전환 교육</b><p>김명진 국장이 초급간부를 대상으로 산별전환의 필요성과 조직운영 변화를 중심으로 교육함.</p></div></div>'''
          if old in s:
              s=s.replace(old,new)
          else:
              # If 4/7 text was already revised, insert only missing rows immediately after the existing 4/7 row.
              marker='data-key="rail-0407"'
              if marker in s and 'data-key="rail-0410"' not in s:
                  start=s.index('<div class="row editable"', s.index(marker)-80)
                  end=s.index('</div></div>', s.index(marker))+12
                  s=s[:end]+'\n'+new.split('\n',1)[1]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sanbyeol/index.html
          git diff --cached --quiet || git commit -m 'Add April rail conversion activities'
          git push
