name: Fix wedding MC shared storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wedding-mc-shared-storage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace browser-local save with shared server save
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wedding/mc-script/index.html')
          text=p.read_text(encoding='utf-8')
          start=text.rfind('  <script>\n    (() => {')
          if start < 0:
              raise SystemExit('old wedding editor script start not found')
          end=text.find('  </script>', start)
          if end < 0:
              raise SystemExit('old wedding editor script end not found')
          end += len('  </script>')
          new_script=r'''  <script>
    (() => {
      const API = 'https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/wedding-mc-shared';
      const script = document.getElementById('script');
      const editBtn = document.getElementById('editBtn');
      const saveBtn = document.getElementById('saveBtn');
      const printBtn = document.getElementById('printBtn');
      const savedState = document.getElementById('savedState');
      const editableSelector = '.speech, .cue, .hero h1, .hero .meta';
      let dirty = false;
      let lastServerUpdated = null;

      function setEditing(on){
        document.body.classList.toggle('editing', on);
        script.querySelectorAll(editableSelector).forEach(el => el.contentEditable = on ? 'true' : 'false');
        editBtn.textContent = on ? '편집 종료' : '편집';
        if(on){
          const first = script.querySelector('.speech');
          first && first.focus({preventScroll:true});
        }
      }

      async function loadShared(silent=false){
        if(document.body.classList.contains('editing') || dirty) return;
        try{
          const r = await fetch(API,{cache:'no-store'});
          if(!r.ok) throw new Error('load');
          const d = await r.json();
          if(d.content && d.updated_at !== lastServerUpdated){
            script.innerHTML = d.content;
            lastServerUpdated = d.updated_at || null;
          }
          if(!silent) savedState.textContent = d.updated_at ? '공동저장 최신본' : '공동저장 준비됨';
        }catch{
          if(!silent) savedState.textContent = '불러오기 실패';
        }
      }

      editBtn.addEventListener('click', () => setEditing(!document.body.classList.contains('editing')));
      saveBtn.addEventListener('click', async () => {
        script.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
        setEditing(false);
        savedState.textContent = '서버 저장 중…';
        try{
          const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:script.innerHTML})});
          if(!r.ok) throw new Error('save');
          const d = await r.json();
          lastServerUpdated = d.updated_at || null;
          dirty = false;
          savedState.textContent = '공동저장됨';
          setTimeout(() => savedState.textContent = '', 1600);
        }catch{
          dirty = true;
          savedState.textContent = '서버 저장 실패';
          alert('공동 서버에 저장하지 못했습니다. 다시 시도해 주세요.');
        }
      });
      script.addEventListener('input', () => { dirty = true; savedState.textContent = '수정됨 · 미저장'; });
      printBtn.addEventListener('click', () => { setEditing(false); window.print(); });
      document.addEventListener('visibilitychange', () => { if(!document.hidden) loadShared(true); });
      setInterval(() => { if(document.visibilityState === 'visible') loadShared(true); }, 5000);
      setEditing(false);
      loadShared(false);
    })();
  </script>'''
          p.write_text(text[:start]+new_script+text[end:],encoding='utf-8')
          PY
      - name: Verify local content storage removed
        run: |
          if grep -n 'localStorage\|sessionStorage\|indexedDB' wedding/mc-script/index.html; then
            echo 'Wedding page still contains browser-local persistence'
            exit 1
          fi
          grep -q 'wedding-mc-shared' wedding/mc-script/index.html
      - name: Commit shared-storage conversion
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wedding/mc-script/index.html
          git commit -m 'Use shared server storage for wedding MC script'
          git push
