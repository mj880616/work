name: Fix wedding MC shared storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wedding-mc-shared-storage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace browser-local save with shared server save
        env:
          NEW_SCRIPT_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          p=Path('wedding/mc-script/index.html')
          text=p.read_text(encoding='utf-8')
          start=text.rfind('  <script>\n    (() => {')
          if start < 0:
              raise SystemExit('old wedding editor script start not found')
          end=text.find('  </script>', start)
          if end < 0:
              raise SystemExit('old wedding editor script end not found')
          end += len('  </script>')
          new_script=base64.b64decode(os.environ['NEW_SCRIPT_B64']).decode('utf-8')
          p.write_text(text[:start]+new_script+text[end:],encoding='utf-8')
          PY
      - name: Verify local content storage removed
        run: |
          if grep -n 'localStorage\|sessionStorage\|indexedDB' wedding/mc-script/index.html; then
            echo 'Wedding page still contains browser-local persistence'
            exit 1
          fi
          grep -q 'wedding-mc-shared' wedding/mc-script/index.html
      - name: Commit shared-storage conversion
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wedding/mc-script/index.html
          git commit -m 'Use shared server storage for wedding MC script'
          git push
