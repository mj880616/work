name: Arsenal recent match patch

on:
  push:
    branches:
      - feat/arsenal-recent-2026-09

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arsenal-recent-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Append verified matches
        run: node scripts/append-arsenal-recent-2026-09.mjs
      - name: Clean temporary patch files and commit
        run: |
          rm -f scripts/append-arsenal-recent-2026-09.mjs
          rm -f .github/workflows/arsenal-recent-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Napoli and Ipswich Arsenal reviews"
          git push origin HEAD:feat/arsenal-recent-2026-09
