name: Sync public page metadata

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'p/**'
      - 'scripts/generate-public-pages.mjs'
      - 'scripts/public-page-meta.mjs'
      - 'scripts/public-page-meta.test.mjs'
      - '.github/workflows/sync-public-page-meta.yml'

permissions:
  contents: read

concurrency:
  group: sync-public-page-meta
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test metadata shell rules
        run: node --test scripts/public-page-meta.test.mjs
      - name: Compare metadata shells with the current public post lookup
        run: node scripts/generate-public-pages.mjs --check
      - name: Require reviewed metadata to match the lookup
        run: |
          git diff --exit-code -- p
          test -z "$(git status --porcelain -- p)"
