name: Sync public page metadata

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'p/index.html'
      - 'scripts/generate-public-pages.mjs'
      - 'scripts/public-page-meta.mjs'
      - 'scripts/public-page-meta.test.mjs'
      - '.github/workflows/sync-public-page-meta.yml'

permissions:
  contents: write

concurrency:
  group: sync-public-page-meta
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test metadata shell rules
        run: node --test scripts/public-page-meta.test.mjs
      - name: Generate metadata shells
        run: node scripts/generate-public-pages.mjs
      - name: Commit changes
        shell: bash
        run: |
          git add -A p
          if git diff --cached --quiet; then
            echo "No public page metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync public page metadata"
          git pull --rebase origin main
          git push origin HEAD:main
