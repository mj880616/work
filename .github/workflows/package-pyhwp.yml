name: Package pyhwp offline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-pyhwp.yml'
permissions: {}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.8'
      - name: Download wheels
        run: |
          mkdir -p wheelhouse
          python -m pip install --upgrade "pip<25"
          python -m pip download --dest wheelhouse six "pyhwp==0.1b15" olefile "lxml<6" "cryptography<44" cffi pycparser typing-extensions
          ls -lh wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyhwp-wheelhouse
          path: wheelhouse
          retention-days: 1
