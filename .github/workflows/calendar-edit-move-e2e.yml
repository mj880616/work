name: Calendar edit move E2E
on:
  pull_request:
    # 초안(draft) PR은 화면 시험을 건너뛰고, 초안을 풀면(ready_for_review) 다시 돈다(S54-01).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/functions/google-calendar/**'
      - 'tests/app-e2e/calendar-edit-move.spec.mjs'
      - 'tests/app-e2e/calendar-personalization.spec.mjs'
      - 'tests/app-e2e/save-lock.spec.mjs'
      - 'tests/app-e2e/save-lock-2-org.spec.mjs'
      - 'tests/app-e2e/calendar-modal-close.spec.mjs'
      - 'tests/app-e2e/helpers/login-entry.mjs'
      - 'tests/app-e2e/helpers/calendar-task-emphasis.mjs'
      - 'tests/app-e2e/suborganization-filters-canonical-fixture.html'
      - '.github/workflows/calendar-edit-move-e2e.yml'
      - '.github/actions/setup-playwright/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/functions/google-calendar/**'
      - 'tests/app-e2e/calendar-edit-move.spec.mjs'
      - 'tests/app-e2e/calendar-personalization.spec.mjs'
      - 'tests/app-e2e/save-lock.spec.mjs'
      - 'tests/app-e2e/save-lock-2-org.spec.mjs'
      - 'tests/app-e2e/calendar-modal-close.spec.mjs'
      - 'tests/app-e2e/helpers/login-entry.mjs'
      - 'tests/app-e2e/helpers/calendar-task-emphasis.mjs'
      - 'tests/app-e2e/suborganization-filters-canonical-fixture.html'
      - '.github/workflows/calendar-edit-move-e2e.yml'
      - '.github/actions/setup-playwright/**'
# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  calendar-edit-move:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
      - run: python3 -m http.server 8123 >/tmp/calendar-edit-move-http.log 2>&1 &
      - run: npx playwright test tests/app-e2e/calendar-edit-move.spec.mjs tests/app-e2e/calendar-personalization.spec.mjs tests/app-e2e/save-lock.spec.mjs tests/app-e2e/save-lock-2-org.spec.mjs tests/app-e2e/calendar-modal-close.spec.mjs --browser=chromium --workers=1 --reporter=line,github
