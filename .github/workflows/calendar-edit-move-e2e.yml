name: Calendar edit move E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/functions/google-calendar/**'
      - 'tests/app-e2e/calendar-edit-move.spec.mjs'
      - '.github/workflows/calendar-edit-move-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/functions/google-calendar/**'
      - 'tests/app-e2e/calendar-edit-move.spec.mjs'
      - '.github/workflows/calendar-edit-move-e2e.yml'
jobs:
  calendar-edit-move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8123 >/tmp/calendar-edit-move-http.log 2>&1 &
      - run: npx playwright test tests/app-e2e/calendar-edit-move.spec.mjs tests/app-e2e/calendar-personalization.spec.mjs tests/app-e2e/save-lock.spec.mjs tests/app-e2e/save-lock-2-org.spec.mjs tests/app-e2e/calendar-modal-close.spec.mjs --browser=chromium --workers=1 --reporter=line
