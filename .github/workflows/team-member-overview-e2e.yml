name: Web2 membership removal E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/app-e2e/nonmember-access.spec.mjs'
      - 'tests/app-e2e/access-request-push.spec.mjs'
      - 'tests/app-e2e/solo-shell.spec.mjs'
      - '.github/workflows/team-member-overview-e2e.yml'
      - '.github/actions/setup-playwright/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/app-e2e/nonmember-access.spec.mjs'
      - 'tests/app-e2e/access-request-push.spec.mjs'
      - 'tests/app-e2e/solo-shell.spec.mjs'
      - '.github/workflows/team-member-overview-e2e.yml'
      - '.github/actions/setup-playwright/**'
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
      - run: python3 -m http.server 8123 >/tmp/http.log 2>&1 &
      - run: node --test tests/domain/web2-auth-origin.test.mjs
      - run: npx playwright test tests/app-e2e/nonmember-access.spec.mjs tests/app-e2e/access-request-push.spec.mjs tests/app-e2e/solo-shell.spec.mjs --browser=chromium --workers=1 --reporter=line
