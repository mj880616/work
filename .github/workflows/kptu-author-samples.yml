name: Build KPTU author samples
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/kptu-corpus/contact-authors-2023-2026.json'
      - 'scripts/kptu_author_sample.py'
      - '.github/workflows/kptu-author-samples.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/kptu_author_sample.py
      - name: Commit author samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/author-sample-summary.json analysis/kptu-corpus/authors
          git diff --cached --quiet || git commit -m "Build KPTU person-level writing samples"
          git pull --rebase origin main
          git push
