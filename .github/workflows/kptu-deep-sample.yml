name: Select KPTU deep sample
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kptu_deep_sample.py'
      - '.github/workflows/kptu-deep-sample.yml'
      - 'analysis/kptu-corpus/selected-180.json'
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/kptu_deep_sample.py
      - name: Commit deep sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/deep-sample-48.json
          git diff --cached --quiet || git commit -m "Select KPTU deep-reading sample"
          git push
