name: Patch press button colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-press-button-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update press edit button colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('workforce/press-conference-0914/press-release/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.editbtn{border:1px solid #cdd3d9;background:#fff;color:#4a525a;border-radius:9px;padding:7px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.editbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff}'
          new = '.editbtn{border:1px solid #d8b56a;background:#fff6df;color:#7a5410;border-radius:9px;padding:7px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.editbtn:hover{background:#ffefc2;border-color:#c99a3d}.editbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.editbtn.primary:hover{background:#171a1e;border-color:#171a1e}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workforce/press-conference-0914/press-release/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'style: distinguish press edit buttons'
          git push
