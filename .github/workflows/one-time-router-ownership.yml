name: One-time router ownership migration

on:
  push:
    paths:
      - '.github/workflows/one-time-router-ownership.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move navigation ownership to shared router
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(path,old,new):
              p=Path(path);s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          one('app/team.js',
              "function switchView(view){$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('.view-panel').forEach(v=>v.classList.add('hidden'));$('#'+view+'View')?.classList.remove('hidden');if(view==='calendar'&&googleState.connected)loadGoogleEvents()}",
              "function switchView(view){if(window.KPTURouter?.go){window.KPTURouter.go(view,{source:'team'});return}$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('.view-panel').forEach(v=>v.classList.add('hidden'));$('#'+view+'View')?.classList.remove('hidden');if(view==='calendar'&&googleState.connected)loadGoogleEvents()}"
          )
          one('app/team.js',
              "if(b.dataset.view){switchView(b.dataset.view);return}if(b.dataset.goto){switchView(b.dataset.goto);return}",
              ""
          )
          one('app/team.js',
              " $$('.nav-btn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));\n",
              " if(window.KPTURouter?.on)window.KPTURouter.on('calendar',()=>{if(googleState.connected)loadGoogleEvents()});\n"
          )
          one('app/collaboration-center.js',
              "const team=nav.querySelector('[data-view=\"team\"]');team?.insertAdjacentElement('beforebegin',b);b.onclick=()=>ccSwitch('messages')}",
              "const team=nav.querySelector('[data-view=\"team\"]');team?.insertAdjacentElement('beforebegin',b)}"
          )
          one('app/collaboration-center.js',
              "  document.querySelectorAll('#ccMobileDock [data-cc-view]').forEach(b=>b.onclick=()=>ccSwitch(b.dataset.ccView));\n",
              ""
          )

          p=Path('app/loader-v2.js');s=p.read_text(encoding='utf-8')
          s=s.replace("./team.js?v=6","./team.js?v=7")
          s=s.replace("./collaboration-center.js?v=2","./collaboration-center.js?v=3")
          p.write_text(s,encoding='utf-8')

          p=Path('app/app.js');s=p.read_text(encoding='utf-8')
          s=s.replace("./team.js?v=6","./team.js?v=7")
          s=s.replace('loader-v2.js?v=86','loader-v2.js?v=87')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate changed modules
        run: |
          node --check app/team.js
          node --check app/collaboration-center.js
          node --check app/app-router.js
          node --check app/loader-v2.js
          node --check app/app.js
          grep -q "team.js?v=7" app/loader-v2.js
          grep -q "collaboration-center.js?v=3" app/loader-v2.js
          if grep -q "b.onclick=()=>ccSwitch('messages')" app/collaboration-center.js; then exit 1; fi
          if grep -q "querySelectorAll('#ccMobileDock \[data-cc-view\]').forEach(b=>b.onclick" app/collaboration-center.js; then exit 1; fi
      - name: Commit migration
        run: |
          git config user.name kptu-app-bot
          git config user.email actions@users.noreply.github.com
          git add app/team.js app/collaboration-center.js app/loader-v2.js app/app.js
          git commit -m 'Make shared router sole navigation owner'
          git push
