name: Publication gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: publication-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Classify every changed path against the trusted policy
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOOTSTRAP_BASE_SHA: 74b8578c8d63597f652b973e714d9d9e61e45464
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -f trusted/scripts/publication-pr-policy.mjs ]]; then
            node trusted/scripts/publication-pr-policy.mjs classify
          elif [[ "$CURRENT_BASE_SHA" == "$BOOTSTRAP_BASE_SHA" ]]; then
            # The first PR introduces this file while auto-merge is disabled.
            node candidate/scripts/publication-pr-policy.mjs classify
          else
            echo 'Trusted publication policy is missing.' >&2
            exit 1
          fi
      - name: Wait until an earlier auto-merge reservation is removed
        if: steps.classify.outputs.publication != 'true' && steps.classify.outputs.trusted_author == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOOTSTRAP_BASE_SHA: 74b8578c8d63597f652b973e714d9d9e61e45464
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -f trusted/scripts/publication-pr-policy.mjs ]]; then
            node trusted/scripts/publication-pr-policy.mjs wait-disabled
          elif [[ "$CURRENT_BASE_SHA" == "$BOOTSTRAP_BASE_SHA" ]]; then
            node candidate/scripts/publication-pr-policy.mjs wait-disabled
          else
            exit 1
          fi
      - name: Check press archive paths and newest listing
        if: steps.classify.outputs.publication == 'true'
        working-directory: candidate
        run: node --test scripts/publication-content.test.mjs
      - name: Install press browser test
        if: steps.classify.outputs.publication == 'true'
        working-directory: candidate
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local press test server
        if: steps.classify.outputs.publication == 'true'
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/publication-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/publication-http.log
          exit 1
      - name: Run Web1 press integration browser test
        if: steps.classify.outputs.publication == 'true'
        working-directory: candidate
        run: npx playwright test tests/app-e2e/web1-press.spec.mjs --browser=chromium --workers=1 --reporter=line
      - name: Wait for existing cache and HTML audit checks
        if: steps.classify.outputs.publication == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node trusted/scripts/publication-pr-policy.mjs wait-checks
