name: Publication gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: publication-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publication: ${{ steps.classify.outputs.publication }}
      trusted_author: ${{ steps.classify.outputs.trusted_author }}
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Classify every changed path against the trusted policy
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publication-pr-policy.mjs classify

  content-check:
    needs: classify
    if: needs.classify.outputs.publication == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out candidate with a read-only token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Check press archive paths and newest listing
        working-directory: candidate
        run: node --test scripts/publication-content.test.mjs
      # 설치 절차는 후보 PR이 아니라 신뢰하는 base 커밋의 공유 action을 쓴다(후보가 설치 단계 코드를 바꾸지 못하게).
      - name: Check out trusted install action from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github/actions/setup-playwright
          persist-credentials: false
      # pull_request_target에서 후보 코드를 돌리므로 브라우저 캐시는 복원만 하고 저장하지 않는다(캐시 오염 방지).
      - name: Install press browser test
        uses: ./trusted/.github/actions/setup-playwright
        with:
          working-directory: candidate
          npm-flags: --no-save --no-package-lock
          save-cache: 'false'
      - name: Start local press test server
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/publication-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/publication-http.log
          exit 1
      - name: Run Web1 press integration browser test
        working-directory: candidate
        run: npx playwright test tests/app-e2e/web1-press.spec.mjs --browser=chromium --workers=1 --reporter=line,github

  publication-gate:
    needs: [classify, content-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require trusted classification and candidate check result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PUBLICATION: ${{ needs.classify.outputs.publication }}
          CONTENT_RESULT: ${{ needs.content-check.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [[ "$PUBLICATION" == true ]]; then test "$CONTENT_RESULT" = success; fi
      - name: Check out trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Wait until an earlier auto-merge reservation is removed
        if: needs.classify.outputs.publication != 'true' && needs.classify.outputs.trusted_author == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publication-pr-policy.mjs wait-disabled
      - name: Wait for existing cache and HTML audit checks
        if: needs.classify.outputs.publication == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publication-pr-policy.mjs wait-checks
