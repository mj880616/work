name: Publication gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: publication-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publication: ${{ steps.classify.outputs.publication }}
      trusted_author: ${{ steps.classify.outputs.trusted_author }}
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Classify every changed path against the trusted policy
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publication-pr-policy.mjs classify

  content-check:
    needs: classify
    if: needs.classify.outputs.publication == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out candidate with a read-only token
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check press archive paths and newest listing
        working-directory: candidate
        run: node --test scripts/publication-content.test.mjs
      - name: Install press browser test
        working-directory: candidate
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local press test server
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/publication-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/app/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/publication-http.log
          exit 1
      - name: Run Web1 press integration browser test
        working-directory: candidate
        run: npx playwright test tests/app-e2e/web1-press.spec.mjs --browser=chromium --workers=1 --reporter=line

  publication-gate:
    needs: [classify, content-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require trusted classification and candidate check result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PUBLICATION: ${{ needs.classify.outputs.publication }}
          CONTENT_RESULT: ${{ needs.content-check.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [[ "$PUBLICATION" == true ]]; then test "$CONTENT_RESULT" = success; fi
      - name: Check out trusted base policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait until an earlier auto-merge reservation is removed
        if: needs.classify.outputs.publication != 'true' && needs.classify.outputs.trusted_author == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publication-pr-policy.mjs wait-disabled
      - name: Wait for existing cache and HTML audit checks
        if: needs.classify.outputs.publication == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publication-pr-policy.mjs wait-checks
