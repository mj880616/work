name: Extract full KPTU HWP contact authors
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kptu_hwp_contacts_year.py'
      - '.github/workflows/kptu-hwp-contacts-full.yml'
permissions:
  contents: write
jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        year: ['2023','2024','2025','2026']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          python -m pip install six requests beautifulsoup4
          python -m pip install --pre pyhwp
      - name: Extract contacts
        env:
          YEAR: ${{ matrix.year }}
        run: python scripts/kptu_hwp_contacts_year.py
      - uses: actions/upload-artifact@v4
        with:
          name: hwp-contacts-${{ matrix.year }}
          path: /tmp/hwp-contacts-${{ matrix.year }}.json
          retention-days: 1
  combine:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hwp-contacts-*
          path: /tmp/contact-parts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Combine
        run: |
          python - <<'PY'
          import json,glob
          from pathlib import Path
          parts=[]
          for p in sorted(glob.glob('/tmp/contact-parts/*.json')):
              parts.append(json.load(open(p,encoding='utf-8')))
          items=[]
          summaries=[]
          for x in parts:
              items.extend(x['items']); summaries.append(x['summary'])
          counts={}
          for r in items:
              for c in r.get('contacts',[]):
                  n=c['name']; counts[n]=counts.get(n,0)+1
          out={'summary':{'parts':summaries,'name_counts':sorted(counts.items(),key=lambda x:(-x[1],x[0]))},'items':items}
          dest=Path('analysis/kptu-corpus/contact-authors-hwp-full.json')
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('NAMES',json.dumps(out['summary']['name_counts'][:100],ensure_ascii=False))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/contact-authors-hwp-full.json
          git diff --cached --quiet || git commit -m "Map KPTU HWP contact authors"
          git pull --rebase origin main
          git push
