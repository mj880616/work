name: Deploy bokdoong Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bokdoong-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify bokdoong-router
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run router regression tests
        run: node --test tests/domain/bokdoong-router.test.mjs

      - name: Wait for portal icons on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          for icon in favicon.png favicon.ico; do
            expected="$(sha256sum "personal/portal/$icon" | cut -d ' ' -f1)"
            ready=false
            for attempt in {1..60}; do
              actual="$(curl --silent --fail --location --compressed \
                --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "https://mj880616.github.io/work/personal/portal/$icon?deploy=$GITHUB_SHA" \
                | sha256sum | cut -d ' ' -f1 || true)"
              if [[ "$actual" == "$expected" ]]; then
                ready=true
                echo "OK  GitHub Pages $icon matches this commit"
                break
              fi
              echo "WAIT ($attempt/60)  GitHub Pages $icon"
              if (( SECONDS >= deadline )); then break; fi
              sleep 5
            done
            if [[ "$ready" != true ]]; then
              echo "FAIL  GitHub Pages $icon did not match this commit"
              exit 1
            fi
          done

      # Pages serves either this checkout (Source: branch) or the build-pages.mjs output
      # (Source: GitHub Actions, .github/workflows/pages-deploy.yml). Build the same output here
      # so the wait and the URL checks below work before and after the switch.
      - name: Jekyll build
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Build expected Actions deployment output
        run: |
          npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
          node scripts/build-pages.mjs _site "$RUNNER_TEMP/pages-out"
          node scripts/check-pages-build.mjs "$RUNNER_TEMP/pages-out"

      - name: Wait for Web2 release on GitHub Pages
        id: pages
        shell: bash
        run: |
          set -euo pipefail

          files=(
            app/index.html
            app/app.js
            app/loader-v2.js
            app/app-icon.svg
            app/pwa.js
            app/windows-manifest.json
            # The router pins ?v= assets only when they match this manifest on Pages.
            app/asset-manifest.json
          )
          declare -A live

          count_matches() {
            local dir="$1"
            local file
            local count=0
            for file in "${files[@]}"; do
              if [[ "${live[$file]}" == "$(sha256sum "$dir/$file" | cut -d ' ' -f1)" ]]; then count=$((count + 1)); fi
            done
            echo "$count"
          }

          for attempt in {1..60}; do
            for file in "${files[@]}"; do
              live[$file]="$(curl --silent --fail --location --compressed --connect-timeout 5 --max-time 10 --header 'Cache-Control: no-cache' "https://mj880616.github.io/work/$file?deploy=$GITHUB_SHA&attempt=$attempt" | sha256sum | cut -d ' ' -f1 || true)"
            done
            # Every file must match one tree; a mix of branch and build files is still waiting.
            if (( $(count_matches "$RUNNER_TEMP/pages-out") == ${#files[@]} )); then
              echo "OK  GitHub Pages matches this commit's Actions build output"
              echo "tree=$RUNNER_TEMP/pages-out" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( $(count_matches "$GITHUB_WORKSPACE") == ${#files[@]} )); then
              echo "OK  GitHub Pages matches this commit's branch files"
              echo "tree=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "WAIT ($attempt/60)  GitHub Pages matches $(count_matches "$RUNNER_TEMP/pages-out")/${#files[@]} build files, $(count_matches "$GITHUB_WORKSPACE")/${#files[@]} branch files"
            sleep 5
          done
          echo "FAIL  GitHub Pages did not match this commit (branch files or Actions build output)"
          exit 1

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.toml

      - name: Verify production routes
        shell: bash
        env:
          PAGES_TREE: ${{ steps.pages.outputs.tree }}
        run: |
          set -euo pipefail
          # Resolve the release URLs from the tree GitHub Pages serves before any production request.
          # A read/parse failure exits the step through set -e (no fallback URLs).
          asset_urls="$(node scripts/cloudflare-check-urls.mjs "$PAGES_TREE")"
          IFS=$'\t' read -r APP_URL LOADER_URL PWA_URL SW_URL APP_ICON_URL <<< "$asset_urls"
          USER_AGENT='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          check_200() {
            local url="$1"
            local accept="${2:-*/*}"
            local code=""

            for attempt in {1..20}; do
              code="$(curl \
                --silent \
                --show-error \
                --location \
                --max-redirs 8 \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Accept: $accept" \
                --header "User-Agent: $USER_AGENT" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$url" || true)"

              if [[ "$code" == "200" ]]; then
                echo "OK  $url"
                return 0
              fi

              echo "WAIT ($attempt/20, HTTP $code)  $url"
              sleep 5
            done

            echo "FAIL  $url (last HTTP $code)"
            return 1
          }

          check_https_upgrade() {
            local host="$1"
            local result=""

            result="$(curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 8 \
              --connect-timeout 10 \
              --max-time 30 \
              --header "User-Agent: $USER_AGENT" \
              --output /dev/null \
              --write-out '%{url_effective}|%{http_code}' \
              "http://$host/" || true)"

            if [[ "$result" != https://*'|200' ]]; then
              echo "FAIL  http://$host/ -> $result"
              return 1
            fi

            echo "OK  http://$host/ -> $result"
          }

          check_icon() {
            local url="$1"
            local expected_type="$2"
            local result=""

            for attempt in {1..20}; do
              result="$(curl \
                --silent \
                --show-error \
                --location \
                --max-redirs 8 \
                --connect-timeout 10 \
                --max-time 30 \
                --output /dev/null \
                --write-out '%{http_code}|%{content_type}' \
                "$url" || true)"

              if [[ "$result" == "200|$expected_type" ]]; then
                echo "OK  $url ($expected_type)"
                return 0
              fi

              echo "WAIT ($attempt/20, $result)  $url"
              sleep 5
            done

            echo "FAIL  $url (last $result)"
            return 1
          }

          for url in \
            https://bokdoong.com/ \
            https://work.bokdoong.com/ \
            https://desk.bokdoong.com/ \
            https://arsenal.bokdoong.com/
          do
            check_200 "$url" "text/html"
          done

          for host in \
            bokdoong.com \
            work.bokdoong.com \
            desk.bokdoong.com \
            arsenal.bokdoong.com
          do
            check_https_upgrade "$host"
          done

          check_200 'https://arsenal.bokdoong.com/favicon.ico'
          check_200 "$SW_URL"
          check_200 "$APP_URL"
          check_200 "$LOADER_URL"
          check_200 "$PWA_URL"
          check_200 "$APP_ICON_URL"
          check_icon 'https://bokdoong.com/favicon.png' 'image/png'
          check_icon 'https://bokdoong.com/favicon.ico' 'image/x-icon'

          for url in \
            "$APP_URL" \
            "$LOADER_URL" \
            "$APP_ICON_URL"
          do
            headers="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --dump-header - --output /dev/null "$url")"
            if ! grep -qi 'cache-control: public, max-age=31536000, immutable' <<< "$headers"; then
              echo "FAIL  immutable cache policy $url"
              exit 1
            fi
            echo "OK  immutable cache policy $url"
          done

          missing_url="https://desk.bokdoong.com/work/app/__missing-cache-probe__.js?v=$GITHUB_SHA"
          missing_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$missing_url" || true)"
          missing_headers="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --dump-header - --output /dev/null "$missing_url" || true)"
          if [[ "$missing_code" != "404" ]]; then
            echo "FAIL  missing asset did not return 404"
            exit 1
          fi
          if ! grep -qi 'cache-control: no-cache, must-revalidate' <<< "$missing_headers"; then
            echo "FAIL  missing versioned asset can be browser-cached"
            exit 1
          fi
          echo "OK  missing versioned asset is non-cacheable"

          # These are stable URLs whose contents change on GitHub Pages deploys.
          # Fail the deploy verification if Cloudflare starts giving browsers a TTL.
          for url in \
            https://bokdoong.com/ \
            https://work.bokdoong.com/work/assets/web1-design-lite.css \
            "$SW_URL" \
            https://arsenal.bokdoong.com/work/personal/arsenal-match-archive/matches.js
          do
            headers="$(curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "User-Agent: $USER_AGENT" \
              --dump-header - \
              --output /dev/null \
              "$url")"
            if ! printf '%s\n' "$headers" | tr -d '\r' | grep -qi '^cache-control: no-cache, must-revalidate$'; then
              echo "FAIL  cache policy $url"
              exit 1
            fi
            echo "OK  cache policy $url"
          done

          for url in \
            https://mj880616.github.io/work/ \
            https://mj880616.github.io/work/app/ \
            https://mj880616.github.io/work/personal/arsenal-match-archive/
          do
            check_200 "$url" "text/html"
          done
