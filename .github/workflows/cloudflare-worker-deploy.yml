name: Deploy bokdoong Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bokdoong-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify bokdoong-router
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run router regression tests
        run: node --test tests/domain/bokdoong-router.test.mjs

      - name: Wait for portal icons on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          for icon in favicon.png favicon.ico; do
            expected="$(sha256sum "personal/portal/$icon" | cut -d ' ' -f1)"
            ready=false
            for attempt in {1..60}; do
              actual="$(curl --silent --fail --location --compressed \
                --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "https://mj880616.github.io/work/personal/portal/$icon?deploy=$GITHUB_SHA" \
                | sha256sum | cut -d ' ' -f1 || true)"
              if [[ "$actual" == "$expected" ]]; then
                ready=true
                echo "OK  GitHub Pages $icon matches this commit"
                break
              fi
              echo "WAIT ($attempt/60)  GitHub Pages $icon"
              if (( SECONDS >= deadline )); then break; fi
              sleep 5
            done
            if [[ "$ready" != true ]]; then
              echo "FAIL  GitHub Pages $icon did not match this commit"
              exit 1
            fi
          done

      - name: Wait for Web2 release on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail

          wait_for_match() {
            local local_path="$1"
            local remote_url="$2"
            local expected
            local actual
            expected="$(sha256sum "$local_path" | cut -d ' ' -f1)"
            for attempt in {1..60}; do
              actual="$(curl --silent --fail --location --compressed --connect-timeout 5 --max-time 10 --header 'Cache-Control: no-cache' "$remote_url?deploy=$GITHUB_SHA&attempt=$attempt" | sha256sum | cut -d ' ' -f1 || true)"
              if [[ "$actual" == "$expected" ]]; then
                echo "OK  GitHub Pages $local_path matches this commit"
                return 0
              fi
              echo "WAIT ($attempt/60)  GitHub Pages $local_path"
              sleep 5
            done
            echo "FAIL  GitHub Pages $local_path did not match this commit"
            return 1
          }

          wait_for_match app/index.html https://mj880616.github.io/work/app/index.html
          wait_for_match app/app.js https://mj880616.github.io/work/app/app.js
          wait_for_match app/loader-v2.js https://mj880616.github.io/work/app/loader-v2.js
          wait_for_match app/app-icon.svg https://mj880616.github.io/work/app/app-icon.svg
          wait_for_match app/pwa.js https://mj880616.github.io/work/app/pwa.js
          wait_for_match app/windows-manifest.json https://mj880616.github.io/work/app/windows-manifest.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.toml

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          check_200() {
            local url="$1"
            local accept="${2:-*/*}"
            local code=""

            for attempt in {1..20}; do
              code="$(curl \
                --silent \
                --show-error \
                --location \
                --max-redirs 8 \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Accept: $accept" \
                --header "User-Agent: $USER_AGENT" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$url" || true)"

              if [[ "$code" == "200" ]]; then
                echo "OK  $url"
                return 0
              fi

              echo "WAIT ($attempt/20, HTTP $code)  $url"
              sleep 5
            done

            echo "FAIL  $url (last HTTP $code)"
            return 1
          }

          check_https_upgrade() {
            local host="$1"
            local result=""

            result="$(curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 8 \
              --connect-timeout 10 \
              --max-time 30 \
              --header "User-Agent: $USER_AGENT" \
              --output /dev/null \
              --write-out '%{url_effective}|%{http_code}' \
              "http://$host/" || true)"

            if [[ "$result" != https://*'|200' ]]; then
              echo "FAIL  http://$host/ -> $result"
              return 1
            fi

            echo "OK  http://$host/ -> $result"
          }

          check_icon() {
            local url="$1"
            local expected_type="$2"
            local result=""

            for attempt in {1..20}; do
              result="$(curl \
                --silent \
                --show-error \
                --location \
                --max-redirs 8 \
                --connect-timeout 10 \
                --max-time 30 \
                --output /dev/null \
                --write-out '%{http_code}|%{content_type}' \
                "$url" || true)"

              if [[ "$result" == "200|$expected_type" ]]; then
                echo "OK  $url ($expected_type)"
                return 0
              fi

              echo "WAIT ($attempt/20, $result)  $url"
              sleep 5
            done

            echo "FAIL  $url (last $result)"
            return 1
          }

          for url in \
            https://bokdoong.com/ \
            https://work.bokdoong.com/ \
            https://desk.bokdoong.com/ \
            https://read.bokdoong.com/ \
            https://arsenal.bokdoong.com/
          do
            check_200 "$url" "text/html"
          done

          for host in \
            bokdoong.com \
            work.bokdoong.com \
            desk.bokdoong.com \
            read.bokdoong.com \
            arsenal.bokdoong.com
          do
            check_https_upgrade "$host"
          done

          check_200 \
            'https://read.bokdoong.com/read-think-write/records/?tab=recent' \
            'text/html'

          check_200 'https://read.bokdoong.com/favicon.ico'
          check_200 'https://arsenal.bokdoong.com/favicon.ico'
          check_200 'https://desk.bokdoong.com/work/app/sw.js?v=2'
          check_200 'https://desk.bokdoong.com/work/app/app.js?v=87'
          check_200 'https://desk.bokdoong.com/work/app/loader-v2.js?v=199'
          check_200 'https://desk.bokdoong.com/work/app/pwa.js?v=5'
          check_200 'https://desk.bokdoong.com/work/app/app-icon.svg?v=20260924-unicorn3'
          check_icon 'https://bokdoong.com/favicon.png' 'image/png'
          check_icon 'https://bokdoong.com/favicon.ico' 'image/x-icon'

          for url in \
            'https://desk.bokdoong.com/work/app/app.js?v=87' \
            'https://desk.bokdoong.com/work/app/loader-v2.js?v=199' \
            'https://desk.bokdoong.com/work/app/app-icon.svg?v=20260924-unicorn3'
          do
            headers="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --dump-header - --output /dev/null "$url")"
            if ! grep -qi 'cache-control: public, max-age=31536000, immutable' <<< "$headers"; then
              echo "FAIL  immutable cache policy $url"
              exit 1
            fi
            echo "OK  immutable cache policy $url"
          done

          missing_url="https://desk.bokdoong.com/work/app/__missing-cache-probe__.js?v=$GITHUB_SHA"
          missing_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$missing_url" || true)"
          missing_headers="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --dump-header - --output /dev/null "$missing_url" || true)"
          if [[ "$missing_code" != "404" ]]; then
            echo "FAIL  missing asset did not return 404"
            exit 1
          fi
          if ! grep -qi 'cache-control: no-cache, must-revalidate' <<< "$missing_headers"; then
            echo "FAIL  missing versioned asset can be browser-cached"
            exit 1
          fi
          echo "OK  missing versioned asset is non-cacheable"

          # These are stable URLs whose contents change on GitHub Pages deploys.
          # Fail the deploy verification if Cloudflare starts giving browsers a TTL.
          for url in \
            https://bokdoong.com/ \
            https://work.bokdoong.com/work/assets/web1-design-lite.css \
            https://desk.bokdoong.com/work/app/sw.js?v=2 \
            https://read.bokdoong.com/read-think-write/src/app-entry.js \
            https://arsenal.bokdoong.com/work/personal/arsenal-match-archive/matches.js
          do
            headers="$(curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "User-Agent: $USER_AGENT" \
              --dump-header - \
              --output /dev/null \
              "$url")"
            if ! printf '%s\n' "$headers" | tr -d '\r' | grep -qi '^cache-control: no-cache, must-revalidate$'; then
              echo "FAIL  cache policy $url"
              exit 1
            fi
            echo "OK  cache policy $url"
          done

          for url in \
            https://mj880616.github.io/work/ \
            https://mj880616.github.io/work/app/ \
            https://mj880616.github.io/read-think-write/ \
            https://mj880616.github.io/work/personal/arsenal-match-archive/
          do
            check_200 "$url" "text/html"
          done
