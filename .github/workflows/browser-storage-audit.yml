name: Browser storage audit

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '.github/workflows/browser-storage-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '.github/workflows/browser-storage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce shared-storage policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          exts={'.html','.js','.mjs','.ts','.tsx','.jsx'}
          skip_parts={'.git','node_modules','dist','build'}
          patterns={
              'localStorage':re.compile(r'\blocalStorage\b'),
              'sessionStorage':re.compile(r'\bsessionStorage\b'),
              'indexedDB':re.compile(r'\bindexedDB\b'),
              'CacheStorage':re.compile(r'\bcaches\s*\.'),
          }

          # Browser-local storage is permitted only for authentication/session state
          # or a truly device-local UI preference. User-created/shared content must
          # always be persisted to the server.
          allowed={
              'app/home-quick.js':[r"'kptu-home-quick-mode'"],
              'app/home-read.js':[r"'home-read-v1:'"],
              # 화면 색은 기기에만 두는 화면 설정이며 사용자 내용이 아님.
              'app/index.html':[r"'kptu-theme'"],
              'app/login/index.html':[r"'kptu-theme'"],
              'app/topbar-actions.js':[r"'kptu-theme'"],
              'tests/theme-bootstrap.test.mjs':[r'\bTHEME_STORAGE_KEY\b'],
              'tests/app-e2e/theme.spec.mjs':[r'\bTHEME_STORAGE_KEY\b'],
              'index.html':[r'AUTH_KEY',r'AUTH_SESSION_KEY'],
              'app/auth-handoff-client.js':[r'AH_SESSION'],
              'app/suborganization-planned-assignee.js':[r'PA_SESSION'],
              'app/session-resilience.js':[r'SR_KEY'],
              'app/calendar-plus.js':[r'CM_PREF'],
              # D-4b: approved device-local view preference only; no user content.
              'app/calendar-view.js':[r'\bSTORAGE_KEY\b'],
              'tests/app-e2e/calendar-task-toggle.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/calendar-list-view.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/calendar-week-view.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              # Toolbar regression only reads the existing device-local preference.
              'tests/app-e2e/calendar-toolbar-one-row.spec.mjs':[r"localStorage\.getItem\('kptu-calendar-view'\)"],
              'tests/app-e2e/calendar-edit-move.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/modal-typography.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/calendar-tasks.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/swipe-nav-follow.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/mobile-ux-shell.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/calendar-google-loading.spec.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'tests/app-e2e/helpers/calendar-task-emphasis.mjs':[r"['\"]kptu-calendar-view['\"]"],
              'app/library-upload.js':[r'LU_SESSION'],
              'app/suborganizations.js':[r'SO_SESSION'],
              'app/team.js':[r'SESSION_KEY'],
              'app/auth-bootstrap.js':[r'SESSION_KEY'],
              'app/runtime-client.js':[r'config\.sessionKey',r'OWNER_CACHE_PREFIX'],
              # 묶음C-2: per-owner read cache of Google Tasks (Google stays the source of truth),
              # dropped by KPTURuntime on sign-out or owner change.
              'app/google-tasks.js':[r'gtCacheKey\('],
              'app/public-page-auth.js':[r'config[.]sessionKey'],
              'app/web1-admin-auth.js':[r'cfg[.]sessionKey',r'oauthReturnKey'],
              'tests/app-e2e/public-page-editor-fixture.html':[r'kptu_public_editor_session_v1'],
              'tests/app-e2e/public-page-editor-live.spec.mjs':[r'kptu_public_editor_session_v1',r'kptu_collab_session_v1'],
              'tests/app-e2e/public-page-password-recovery.spec.mjs':[r'kptu_public_editor_session_v1'],
              'tests/app-e2e/public-workspace-auth.spec.mjs':[r'\blocalStorage\b'],
              'tests/security/web1-admin-auth-redirect.test.mjs':[r'\bsessionStorage\b',r'\blocalStorage\b'],
              # SEC-1 synthetic session adapter and a read-only assertion that
              # failed handoffs never persist a session. No application grant.
              'tests/security/auth-handoff-browser.test.mjs':[r'^\s*localStorage:\s*\{'],
              'tests/app-e2e/google-tasks-cache.spec.mjs':[r'\blocalStorage\b'],
              # Exact synthetic Map adapter and injection into the real runtime VM.
              # No application storage grant or other test-file usage is allowed.
              'tests/quick-save-session.test.mjs':[
                  r'^\s*'+re.escape(line)+r'\s*$' for line in (
                      'const localStorage={getItem:k=>rows.get(k)??null,setItem:(k,v)=>rows.set(k,v),removeItem:k=>rows.delete(k),get length(){return rows.size},key:i=>[...rows.keys()][i]};',
                      "vm.runInNewContext(readFileSync(new URL('../app/runtime-client.js',import.meta.url),'utf8'),{window,localStorage,fetch,performance,URL,URLSearchParams,AbortController,FormData,CustomEvent:class{},setTimeout,clearTimeout,console});",
                  )
              ],
              # Synthetic stale-copy fixture only, scoped to the existing home-test display-cache key.
              # This adds no application storage permission and permits no other key in this test file.
              'tests/app-e2e/basket-link-home.spec.mjs':[
                  r'^\s*'+re.escape(line)+r'\s*$' for line in (
                      "const copy=JSON.parse(localStorage.getItem('kptu_owner_cache:home-read-v1:home-test'));",
                      "localStorage.setItem('kptu_owner_cache:home-read-v1:home-test',JSON.stringify(copy));",
                      "const cache=await page.evaluate(()=>JSON.parse(localStorage.getItem('kptu_owner_cache:home-read-v1:home-test')));",
                  )
              ],
              'tests/app-e2e/auth-handoff.spec.mjs':[r'localStorage\.getItem\(key\),SESSION'],
              # LIB: exact read-only assertion that disclosure never creates storage keys.
              'tests/app-e2e/library-row-list.spec.mjs':[r'^\s*'+re.escape('const storageKeys=()=>page.evaluate(()=>({local:Object.keys(localStorage).sort(),session:Object.keys(sessionStorage).sort()}));')+r'\s*$'],
              # Active-saver tests: read-only privacy observation and a synthetic adapter
              # whose write always throws. No application storage permission.
              'tests/app-e2e/save-other-active.spec.mjs':[
                  r'^\s*'+re.escape('const storageSnapshot=page=>page.evaluate(()=>({local:Object.values(localStorage),session:Object.values(sessionStorage)}));')+r'\s*$',
              ],
              # LIB Task2: synthetic session-state probes that swap only the runtime
              # auth session key (owner/null/empty token) and restore it. No user content.
              'tests/app-e2e/runtime-recovery.spec.mjs':[
                  r'^\s*'+re.escape(line)+r'\s*$' for line in (
                      'const write=value=>value?localStorage.setItem(key,JSON.stringify(value)):localStorage.removeItem(key);',
                      "await page.evaluate(changed=>{const rt=window.KPTURuntime,s=rt.session.read();if(changed==='null')localStorage.removeItem(rt.config.sessionKey);else localStorage.setItem(rt.config.sessionKey,JSON.stringify(changed==='owner'?{...s,user:{id:'other-owner'}}:{...s,access_token:''}))},changed);",
                  )
              ],
              'tests/save-other-active.test.mjs':[
                  r'^\s*'+re.escape("localStorage:{getItem:()=>null,setItem(){throw Error('private persistence forbidden');}},")+r'\s*$',
                  r'^\s*'+re.escape('h.privateStore=env.localStorage;')+r'\s*$',
              ],
          }

          # HWP-편집기 1단계: 고정 버전 rhwp 편집기 빌드본(제3자 코드, 직접 고치지 않음). 편집기 frame은
          # app/hwp-lab/studio-guard.js가 모든 편집기 코드보다 먼저 저장소를 메모리 대체물·undefined로 바꾸므로
          # 기기에 남는 것이 없다(tests/app-e2e/hwp-lab.spec.mjs가 실제 브라우저에서 확인). 보고만 한다.
          vendored_prefix='app/hwp-lab/rhwp-'
          # The guard may only replace storage with a memory stand-in or undefined; nothing else.
          # The spec lines are read-only observations that nothing was stored and that the frame cannot see Web2 keys.
          neutralizers={
              'app/hwp-lab/studio-guard.js':[re.compile(r"^\s*replace\('(?:localStorage|sessionStorage|indexedDB)',(?:memoryStorage\(\)|undefined)\);\s*$")],
              'tests/app-e2e/hwp-lab.spec.mjs':[re.compile(r'^\s*'+re.escape(line)+r'\s*$') for line in (
                  'databases:(await indexedDB.databases()).map(db=>db.name),',
                  'local:Object.keys(localStorage).filter(key=>/rhwp/i.test(key)),',
                  'session:Object.keys(sessionStorage).filter(key=>/rhwp/i.test(key))',
                  'const web2Keys=await page.evaluate(()=>Object.keys(localStorage));',
                  "expect(await frame.evaluate(keys=>({visible:keys.filter(key=>localStorage.getItem(key)!==null),idb:typeof indexedDB,caches:typeof caches}),web2Keys)).toEqual({visible:[],idb:'undefined',caches:'undefined'});",
              )],
          }

          active_hits=[]; legacy_hits=[]; vendored_hits=[]; violations=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts: continue
              if any(part in skip_parts for part in p.parts): continue
              path=p.as_posix().lstrip('./')
              try:text=p.read_text(encoding='utf-8')
              except Exception:continue
              for lineno,line in enumerate(text.splitlines(),1):
                  for kind,pat in patterns.items():
                      if not pat.search(line):continue
                      row=(path,lineno,kind,line.strip())
                      if path.startswith('app/legacy/'):
                          legacy_hits.append(row)
                          continue
                      if path.startswith(vendored_prefix):
                          vendored_hits.append(row)
                          continue
                      active_hits.append(row)
                      if any(rule.search(line) for rule in neutralizers.get(path,[])):
                          continue
                      if kind in {'indexedDB','CacheStorage'}:
                          violations.append(row);continue
                      tokens=allowed.get(path,[])
                      if not any(re.search(t,line) for t in tokens):
                          violations.append(row)

          print('=== ACTIVE BROWSER STORAGE USE ===')
          for path,lineno,kind,line in active_hits:
              print(f'{path}:{lineno}: [{kind}] {line}')
          print(f'ACTIVE_HITS={len(active_hits)}')
          print('=== INACTIVE LEGACY STORAGE USE (reported only) ===')
          for path,lineno,kind,line in legacy_hits:
              print(f'{path}:{lineno}: [{kind}] {line}')
          print(f'LEGACY_HITS={len(legacy_hits)}')
          print('=== VENDORED EDITOR STORAGE USE (memory-only via studio-guard.js, reported only) ===')
          print(f'VENDORED_HITS={len(vendored_hits)}')

          if violations:
              print('=== POLICY VIOLATIONS ===')
              for path,lineno,kind,line in violations:
                  print(f'{path}:{lineno}: [{kind}] {line}')
              print('\nBrowser-local persistence is forbidden for shared/user-created content. Use server/shared persistence instead.')
              sys.exit(1)
          print('PASS: no unauthorized active browser-local persistence found.')
          PY
