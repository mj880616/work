name: Runtime recovery E2E

on:
  push:
    paths:
      - 'app/runtime-client.js'
      - 'app/page-save-controller.js'
      - 'app/library-upload.js'
      - 'app/calendar-persistence.js'
      - 'tests/app-e2e/runtime-client-fixture.html'
      - 'tests/app-e2e/page-save-singleflight-fixture.html'
      - 'tests/app-e2e/runtime-recovery.spec.mjs'
      - 'tests/app-e2e/calendar-persistence-race-fixture.html'
      - 'tests/app-e2e/calendar-persistence-race.spec.mjs'
      - '.github/workflows/runtime-recovery-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/runtime-client.js'
      - 'app/page-save-controller.js'
      - 'app/library-upload.js'
      - 'app/calendar-persistence.js'
      - 'tests/app-e2e/runtime-client-fixture.html'
      - 'tests/app-e2e/page-save-singleflight-fixture.html'
      - 'tests/app-e2e/runtime-recovery.spec.mjs'
      - 'tests/app-e2e/calendar-persistence-race-fixture.html'
      - 'tests/app-e2e/calendar-persistence-race.spec.mjs'
      - '.github/workflows/runtime-recovery-e2e.yml'
  workflow_dispatch:

jobs:
  runtime-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static app server
        run: |
          python3 -m http.server 8123 >/tmp/kptu-runtime-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/tests/app-e2e/runtime-client-fixture.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-runtime-http.log
          exit 1

      - name: Run runtime failure-path regression
        run: >-
          npx playwright test
          tests/app-e2e/runtime-recovery.spec.mjs
          tests/app-e2e/calendar-persistence-race.spec.mjs
          --browser=chromium --workers=1 --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-recovery-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
