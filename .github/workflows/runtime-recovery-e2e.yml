name: Runtime recovery E2E

on:
  push:
    # 태그 push(예: basket-pc-v*)에는 돌지 않음. 브랜치 push 동작은 그대로.
    tags-ignore:
      - '**'
    paths:
      - 'app/runtime-client.js'
      - 'app/library-upload.js'
      - 'app/calendar-persistence.js'
      - 'tests/app-e2e/runtime-client-fixture.html'
      - 'tests/app-e2e/runtime-recovery.spec.mjs'
      - 'tests/app-e2e/calendar-persistence-race-fixture.html'
      - 'tests/app-e2e/calendar-persistence-race.spec.mjs'
      - 'tests/app-e2e/library-upload-failure-fixture.html'
      - 'tests/app-e2e/library-upload-failure.spec.mjs'
      - '.github/workflows/runtime-recovery-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/runtime-client.js'
      - 'app/library-upload.js'
      - 'app/calendar-persistence.js'
      - 'tests/app-e2e/runtime-client-fixture.html'
      - 'tests/app-e2e/runtime-recovery.spec.mjs'
      - 'tests/app-e2e/calendar-persistence-race-fixture.html'
      - 'tests/app-e2e/calendar-persistence-race.spec.mjs'
      - 'tests/app-e2e/library-upload-failure-fixture.html'
      - 'tests/app-e2e/library-upload-failure.spec.mjs'
      - '.github/workflows/runtime-recovery-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static app server
        run: |
          python3 -m http.server 8123 >/tmp/kptu-runtime-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/tests/app-e2e/runtime-client-fixture.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kptu-runtime-http.log
          exit 1

      - name: Run runtime failure-path regression
        run: >-
          npx playwright test
          tests/app-e2e/runtime-recovery.spec.mjs
          tests/app-e2e/calendar-persistence-race.spec.mjs
          tests/app-e2e/library-upload-failure.spec.mjs
          --browser=chromium --workers=1 --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-recovery-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
