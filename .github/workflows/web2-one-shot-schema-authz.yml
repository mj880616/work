name: Web2 one-shot schema authorization

# Inspect and verify are separate manual invocations. No raw dump is persisted
# between jobs or uploaded; verification compares a canonical digest while
# retaining pg_dump's unpredictable restriction key in the raw restore file.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'inspect first; verify only after reviewing its findings and SHA-256'
        required: true
        type: choice
        options: [inspect, seed-diagnose, edge-diagnose, edge-readiness, verify, predeploy, transition]
      expected_sha256:
        description: 'SHA-256 printed by the clean inspect run; required for verify'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web2-one-shot-schema-authz
  cancel-in-progress: false

jobs:
  schema-authz:
    if: github.repository == 'mj880616/work' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/web2-schema-verify' || github.ref == 'refs/heads/codex/web2-transition-verify' || github.ref == 'refs/heads/codex/web2-transition-edge-readiness') && (inputs.phase != 'transition' || github.ref == 'refs/heads/codex/web2-transition-verify') && (inputs.phase != 'edge-readiness' || github.ref == 'refs/heads/codex/web2-transition-edge-readiness')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: web2-schema-verification
    env:
      PGHOST: ${{ vars.WEB2_SCHEMA_PGHOST }}
      PGPORT: ${{ vars.WEB2_SCHEMA_PGPORT }}
      PGUSER: ${{ vars.WEB2_SCHEMA_PGUSER }}
      PGDATABASE: ${{ vars.WEB2_SCHEMA_PGDATABASE }}
      VERIFICATION_PHASE: ${{ inputs.phase }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /out/prod-ca-2021.crt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check read-only connection settings without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in PGHOST PGPORT PGUSER PGDATABASE; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done
          test "$VERIFICATION_PHASE" = inspect || test "$VERIFICATION_PHASE" = seed-diagnose || test "$VERIFICATION_PHASE" = edge-diagnose || test "$VERIFICATION_PHASE" = edge-readiness || test "$VERIFICATION_PHASE" = verify || test "$VERIFICATION_PHASE" = predeploy || test "$VERIFICATION_PHASE" = transition
          if test "$VERIFICATION_PHASE" != inspect; then
            [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
              echo 'The reviewed SHA-256 is required for verify' >&2; exit 1;
            }
          fi
      - name: Read only public/private schema into temporary runner storage
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.WEB2_SCHEMA_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PGPASSWORD" || { echo 'Missing protected DB password' >&2; exit 1; }
          curl --fail --location --silent --show-error \
            'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt' \
            --output "$RUNNER_TEMP/prod-ca-2021.crt"
          openssl x509 -in "$RUNNER_TEMP/prod-ca-2021.crt" -noout -checkend 0 >/dev/null
          docker run --rm --network host --read-only --tmpfs /tmp:rw,noexec,nosuid \
            --user "$(id -u):$(id -g)" \
            -e PGPASSWORD -e PGOPTIONS -e PGSSLMODE -e PGSSLROOTCERT \
            -v "$RUNNER_TEMP:/out" postgres:17 \
            pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
              --schema-only --schema=public --schema=private --no-comments \
              --file=/out/web2-schema.raw.sql \
              >/dev/null 2>"$RUNNER_TEMP/pg-dump.err" || {
                if grep -Eiq 'password authentication failed|SQLSTATE 28P01' "$RUNNER_TEMP/pg-dump.err"; then
                  echo 'DB_AUTH_FAILED: password authentication failed; no credential was changed' >&2
                elif grep -Eiq 'certificate verify failed|root certificate file|SSL error' "$RUNNER_TEMP/pg-dump.err"; then
                  echo 'DB_TLS_FAILED: certificate or TLS validation failed' >&2
                elif grep -Eiq 'could not translate host|Name or service not known' "$RUNNER_TEMP/pg-dump.err"; then
                  echo 'DB_DNS_FAILED: database host could not be resolved' >&2
                elif grep -Eiq 'Connection refused|Network is unreachable|timeout expired|No route to host' "$RUNNER_TEMP/pg-dump.err"; then
                  echo 'DB_NETWORK_FAILED: database endpoint was unreachable' >&2
                elif grep -Eiq 'role .* does not exist|database .* does not exist' "$RUNNER_TEMP/pg-dump.err"; then
                  echo 'DB_LOGIN_CONFIG_FAILED: database or role was not found' >&2
                elif grep -Eiq 'permission denied|read-only file system' "$RUNNER_TEMP/pg-dump.err"; then
                  echo 'RUNNER_FILE_FAILED: container could not write its temporary output' >&2
                else
                  echo 'EXTRACT_FAILED_UNCLASSIFIED: see no raw diagnostics; stop for review' >&2
                fi
                exit 1
              }
          node supabase/local-verify/scan-schema.mjs "$RUNNER_TEMP/web2-schema.raw.sql"
          if test "$VERIFICATION_PHASE" != inspect; then
            node supabase/local-verify/schema-hash.mjs "$RUNNER_TEMP/web2-schema.raw.sql" "$EXPECTED_SHA256"
            docker run --rm --network host --read-only --tmpfs /tmp:rw,noexec,nosuid \
              --user "$(id -u):$(id -g)" \
              -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD \
              -e PGOPTIONS -e PGSSLMODE -e PGSSLROOTCERT \
              -v "$RUNNER_TEMP:/out" \
              -v "$PWD/supabase/local-verify/definer-acl.sql:/verify/definer-acl.sql:ro" \
              postgres:17 psql -X -qAt -v ON_ERROR_STOP=1 \
                -f /verify/definer-acl.sql \
                > "$RUNNER_TEMP/definer-acl.json" 2> "$RUNNER_TEMP/definer-acl.err" || {
                  echo 'DEFINER_ACL_QUERY_FAILED: read-only catalog query failed; raw output withheld' >&2
                  exit 1
                }
            node supabase/local-verify/definer-acl.mjs "$RUNNER_TEMP/definer-acl.json"
          fi
          if test "$VERIFICATION_PHASE" = inspect; then
            if test -n "$EXPECTED_SHA256"; then
              node supabase/local-verify/schema-hash.mjs "$RUNNER_TEMP/web2-schema.raw.sql" "$EXPECTED_SHA256"
            else
              node supabase/local-verify/schema-hash.mjs "$RUNNER_TEMP/web2-schema.raw.sql"
            fi
            node supabase/local-verify/analyze-baseline.mjs inventory "$RUNNER_TEMP/web2-schema.raw.sql"
            node supabase/local-verify/definer-diagnostics.mjs "$RUNNER_TEMP/web2-schema.raw.sql"
            node supabase/local-verify/role-diagnostics.mjs target "$RUNNER_TEMP/web2-schema.raw.sql" 10343
            docker run --rm --network host --read-only --tmpfs /tmp:rw,noexec,nosuid \
              --user "$(id -u):$(id -g)" \
              -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD \
              -e PGOPTIONS -e PGSSLMODE -e PGSSLROOTCERT \
              -v "$RUNNER_TEMP:/out" \
              -v "$PWD/supabase/local-verify/role-catalog.sql:/verify/role-catalog.sql:ro" \
              postgres:17 psql -X -qAt -v ON_ERROR_STOP=1 \
                -f /verify/role-catalog.sql \
                > "$RUNNER_TEMP/web2-hosted-roles.json" \
                2> "$RUNNER_TEMP/role-catalog.err" || {
                  echo 'HOSTED_ROLE_CATALOG_FAILED: read-only catalog query failed; raw output withheld' >&2
                  exit 1
                }
          fi
      - uses: supabase/setup-cli@v3
        if: ${{ inputs.phase == 'inspect' }}
        with:
          version: 2.84.2
      - name: Compare hosted and disposable local role catalogs
        if: ${{ inputs.phase == 'inspect' }}
        shell: bash
        env:
          WEB2_BASELINE_FILE: ${{ runner.temp }}/web2-schema.raw.sql
          WEB2_BASELINE_SHA256: ${{ inputs.expected_sha256 }}
          WEB2_HOSTED_ROLES_FILE: ${{ runner.temp }}/web2-hosted-roles.json
          WEB2_ROLE_DIAGNOSTIC: '1'
        run: |
          set -euo pipefail
          node --test tests/security/local-supabase-ci.test.mjs
          bash -n supabase/local-verify/bootstrap-ci.sh
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          bash supabase/local-verify/bootstrap-ci.sh
      - name: Stop after inspection and discard temporary schema
        if: ${{ inputs.phase == 'inspect' }}
        run: echo 'Inspection completed. Review the reported findings and hash before a separate verify run.'
      - name: Compare reviewed canonical schema hash before any tests or local stack setup
        if: ${{ inputs.phase == 'verify' || inputs.phase == 'seed-diagnose' || inputs.phase == 'edge-diagnose' || inputs.phase == 'edge-readiness' || inputs.phase == 'predeploy' || inputs.phase == 'transition' }}
        shell: bash
        run: node supabase/local-verify/schema-hash.mjs "$RUNNER_TEMP/web2-schema.raw.sql" "$EXPECTED_SHA256"
      - uses: supabase/setup-cli@v3
        if: ${{ inputs.phase == 'verify' || inputs.phase == 'seed-diagnose' || inputs.phase == 'edge-diagnose' || inputs.phase == 'edge-readiness' || inputs.phase == 'predeploy' || inputs.phase == 'transition' }}
        with:
          version: 2.84.2
      - uses: denoland/setup-deno@v2
        if: ${{ inputs.phase == 'predeploy' }}
        with:
          deno-version: v2.x
      - name: Run static contracts and synthetic authorization tests
        if: ${{ inputs.phase == 'verify' || inputs.phase == 'seed-diagnose' || inputs.phase == 'edge-diagnose' || inputs.phase == 'edge-readiness' || inputs.phase == 'predeploy' || inputs.phase == 'transition' }}
        shell: bash
        env:
          WEB2_BASELINE_FILE: ${{ runner.temp }}/web2-schema.raw.sql
          WEB2_BASELINE_SHA256: ${{ inputs.expected_sha256 }}
          WEB2_SEED_DIAGNOSTIC: ${{ inputs.phase == 'seed-diagnose' && '1' || '0' }}
          WEB2_EDGE_DIAGNOSTIC: ${{ inputs.phase == 'edge-diagnose' && '1' || '0' }}
          WEB2_EDGE_READINESS: ${{ inputs.phase == 'edge-readiness' && '1' || '0' }}
          WEB2_PREDEPLOY: ${{ inputs.phase == 'predeploy' && '1' || '0' }}
          WEB2_TRANSITION: ${{ inputs.phase == 'transition' && '1' || '0' }}
        run: |
          set -euo pipefail
          node supabase/local-verify/analyze-baseline.mjs inventory "$WEB2_BASELINE_FILE"
          node supabase/local-verify/definer-diagnostics.mjs "$WEB2_BASELINE_FILE"
          if test "$VERIFICATION_PHASE" = predeploy; then
            node supabase/local-verify/review-definer-body.mjs "$WEB2_BASELINE_FILE"
          fi
          node --test tests/security/*.test.mjs
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          bash supabase/local-verify/bootstrap-ci.sh
          if test "$VERIFICATION_PHASE" = predeploy; then
            fixture="$RUNNER_TEMP/web2-hwp-smoke.hwp"
            curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
              'https://raw.githubusercontent.com/edwardkim/rhwp/bc38ff55a7e8acb65aebebe237dca0542480d381/samples/para-001.hwp' \
              --output "$fixture"
            printf '%s  %s\n' 'bab4561ceb02cdfa184a1689be9619c08e18d6021cdbc423486b848bc14d267e' "$fixture" | sha256sum --check --status
            deno run --allow-read --allow-env --allow-net supabase/local-verify/hwp-smoke.mjs "$fixture"
          fi
      - name: Destroy temporary schema and local stack
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP"; then
            rm -f -- "$RUNNER_TEMP/web2-schema.raw.sql" "$RUNNER_TEMP/pg-dump.err" "$RUNNER_TEMP/prod-ca-2021.crt" \
              "$RUNNER_TEMP/web2-hosted-roles.json" "$RUNNER_TEMP/role-catalog.err"
            rm -f -- "$RUNNER_TEMP/definer-acl.json" "$RUNNER_TEMP/definer-acl.err"
            rm -f -- "$RUNNER_TEMP/web2-hwp-smoke.hwp"
          fi
