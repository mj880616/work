name: Authorization security check

on:
  push:
    # 태그 push(예: basket-pc-v*)에는 돌지 않음. 브랜치 push 동작은 그대로.
    tags-ignore:
      - '**'
    paths:
      - 'supabase/**'
      - 'app/project-catalog-model.mjs'
      - 'app/project-system-v3.js'
      - 'app/ledger-import-model.mjs'
      - 'app/ledger-candidate-model.mjs'
      - 'app/ledger-browse-model.mjs'
      - 'tests/ledger-import-fixture.mjs'
      - 'scripts/check-drive-summary-isolation.mjs'
      - 'tests/security/**'
      - 'tests/edge-isolation/**'
      - 'tests/auth-handoff/**'
      - '.github/workflows/**'
      - 'scripts/ops/**'
      - 'docs/main-pr-gate-ruleset.json'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'app/project-catalog-model.mjs'
      - 'app/project-system-v3.js'
      - 'app/ledger-import-model.mjs'
      - 'app/ledger-candidate-model.mjs'
      - 'app/ledger-browse-model.mjs'
      - 'tests/ledger-import-fixture.mjs'
      - 'scripts/check-drive-summary-isolation.mjs'
      - 'tests/security/**'
      - 'tests/edge-isolation/**'
      - 'tests/auth-handoff/**'
      - '.github/workflows/**'
      - 'scripts/ops/**'
      - 'docs/main-pr-gate-ruleset.json'
  workflow_dispatch:

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  auth-handoff-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked isolated PostgreSQL test dependencies
        working-directory: tests/auth-handoff
        run: npm ci --no-audit --no-fund
      - name: Verify single consumption across 20 real PostgreSQL connections
        working-directory: tests/auth-handoff
        run: npm test

  static-authz-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Deno 실행 파일을 버전 키로 보관해 GitHub 릴리스 다운로드(가끔 504)를 매번 하지 않는다.
      # setup-deno는 러너 도구 폴더에서 같은 버전을 먼저 찾고, 있으면 내려받지 않는다.
      - name: Restore Deno executable cache
        id: deno-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/deno
          key: deno-bin-${{ runner.os }}-${{ runner.arch }}-v2.9.6

      - name: Install Deno for functions-only deployment regression
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Save Deno executable cache
        if: steps.deno-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/deno
          key: deno-bin-${{ runner.os }}-${{ runner.arch }}-v2.9.6

      - name: Verify trusted-layer authorization invariants
        run: node --test tests/security/*.test.mjs

      - name: Test rejection of imports outside the deployment artifact
        run: node --test tests/edge-isolation/*.test.mjs

      - name: Check functions-only drive-summary deployment package
        run: node scripts/check-drive-summary-isolation.mjs

      - name: Verify SQL authorization regression assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            supabase/tests/authz_workspace_relationships.sql
            supabase/tests/authz_task_assignee.sql
            supabase/tests/authz_document_visibility.sql
            supabase/tests/authz_page_visibility.sql
            supabase/tests/authz_direct_id_writes.sql
            supabase/tests/authz_membership_invites.sql
            supabase/tests/authz_project_invitations.sql
            supabase/tests/authz_event_body_rpc.sql
            supabase/tests/authz_public_snapshot.sql
            supabase/tests/authz_sole_owner.sql
            supabase/tests/authz_task13_private_boundary.sql
            supabase/tests/authz_web1_4_delete_pages_removed.sql
            supabase/tests/authz_task_impl2_record_links.sql
            supabase/tests/authz_reference_bundles.sql
            supabase/tests/authz_dispute_stages.sql
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "missing security regression: $file"; exit 1; }
            grep -q '^rollback;' "$file" || { echo "security regression must roll back: $file"; exit 1; }
          done
