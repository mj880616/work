name: Revert wedding MC declaration to social final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-wedding-mc-declaration-to-social-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply social MC final declaration from uploaded Word
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('wedding/mc-script/index.html')
          text=p.read_text(encoding='utf-8')
          replacement='''      <section class="section"><h2><span class="num">10</span>혼인서약 · 성혼선언</h2><div class="cue">마이크 전달 · 신랑 김명진 → 신부 강승지 → 두 사람 공동서약 순서로 낭독</div><div class="speech"><p>두 사람이 서로에게 전한 이 약속을 오늘 이 자리에 함께한 모든 분들께서 따뜻한 마음으로 지켜봐 주셨습니다.</p><p>이어서, 오늘 이 자리에 함께하신 가족과 소중한 분들을 대신하여 사회자인 제가 두 사람의 혼인을 선언하겠습니다.</p><p>2026년 10월 3일, 이제 두 사람이 서로를 평생의 반려자로 선택하고 함께 살아가겠다는 뜻을 확인하였습니다.</p><p><span class="highlight">두 사람의 약속이 오래도록 변함없이 이어지기를 바라며, 신랑 김명진 군과 신부 강승지 양이 정식으로 부부가 되었음을 선언합니다.</span></p><p>여러분, 신랑신부의 새출발을 큰 박수로 축복해주시기 바랍니다.</p></div></section>'''
          pat=r'      <section class="section"><h2><span class="num">10</span>.*?</section>\n\n(?=      <section class="section"><h2><span class="num">11</span>)'
          new,n=re.subn(pat,replacement+'\n\n',text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'section 10 replacement count={n}')
          p.write_text(new,encoding='utf-8')
          PY
      - name: Verify declaration and shared storage only
        run: |
          set -e
          grep -q '이어서, 오늘 이 자리에 함께하신 가족과 소중한 분들을 대신하여' wedding/mc-script/index.html
          grep -q '2026년 10월 3일, 이제 두 사람이 서로를 평생의 반려자로 선택하고 함께 살아가겠다는 뜻을 확인하였습니다.' wedding/mc-script/index.html
          grep -q '신랑 김명진 군과 신부 강승지 양이 정식으로 부부가 되었음을 선언합니다.' wedding/mc-script/index.html
          grep -q '여러분, 신랑신부의 새출발을 큰 박수로 축복해주시기 바랍니다.' wedding/mc-script/index.html
          ! grep -q 'localStorage\|sessionStorage\|indexedDB' wedding/mc-script/index.html
          grep -q 'wedding-mc-shared' wedding/mc-script/index.html
      - name: Commit page update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wedding/mc-script/index.html
          git commit -m 'Restore social MC final declaration'
          git push
      - name: Sync page body to shared server and verify
        env:
          API: https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/wedding-mc-shared
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          text=Path('wedding/mc-script/index.html').read_text(encoding='utf-8')
          m=re.search(r'<article class="paper" id="script">(.*?)</article>',text,re.S)
          if not m: raise SystemExit('article not found')
          Path('/tmp/payload.json').write_text(json.dumps({'content':m.group(1).strip()},ensure_ascii=False),encoding='utf-8')
          PY
          curl --fail --silent --show-error -X POST "$API" -H 'Origin: https://mj880616.github.io' -H 'Content-Type: application/json' --data-binary @/tmp/payload.json > /tmp/save.json
          curl --fail --silent --show-error "$API" -H 'Origin: https://mj880616.github.io' > /tmp/read.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/read.json',encoding='utf-8'))
          c=d.get('content') or ''
          required=[
            '이어서, 오늘 이 자리에 함께하신 가족과 소중한 분들을 대신하여',
            '2026년 10월 3일, 이제 두 사람이 서로를 평생의 반려자로 선택하고 함께 살아가겠다는 뜻을 확인하였습니다.',
            '두 사람의 약속이 오래도록 변함없이 이어지기를 바라며, 신랑 김명진 군과 신부 강승지 양이 정식으로 부부가 되었음을 선언합니다.',
            '여러분, 신랑신부의 새출발을 큰 박수로 축복해주시기 바랍니다.'
          ]
          missing=[x for x in required if x not in c]
          assert not missing, missing
          print('shared server readback ok', d.get('updated_at'))
          PY
