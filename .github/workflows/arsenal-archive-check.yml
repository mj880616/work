name: Arsenal archive check

on:
  pull_request:
    # 초안(draft) PR은 화면 시험을 건너뛰고, 초안을 풀면(ready_for_review) 다시 돈다(S54-01).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'personal/arsenal-match-archive/**'
      - 'app/arsenal/**'
      - 'scripts/arsenal/**'
      - 'tests/arsenal/**'
      - '.github/workflows/arsenal-archive-check.yml'
      - '.github/actions/setup-playwright/**'

# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
        with:
          npm-flags: --no-save --no-package-lock
      - run: node --test tests/arsenal/validate-archive.test.mjs tests/arsenal/goals.test.mjs
      - run: node scripts/arsenal/validate-archive.mjs --baseline-ref ${{ github.event.pull_request.base.sha }}
      - run: npx playwright test personal/arsenal-match-archive/archive.spec.mjs --browser=chromium --workers=1 --reporter=line,github
