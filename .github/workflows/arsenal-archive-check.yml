name: Arsenal archive check

on:
  pull_request:
    branches: [main]
    paths:
      - 'personal/arsenal-match-archive/**'
      - '.github/workflows/arsenal-archive-check.yml'
      - '.github/actions/setup-playwright/**'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
        with:
          npm-flags: --no-save --no-package-lock
      - run: node --test personal/arsenal-match-archive/validate-archive.test.mjs personal/arsenal-match-archive/goals.test.mjs
      - run: node personal/arsenal-match-archive/validate-archive.mjs --baseline-ref ${{ github.event.pull_request.base.sha }}
      - run: npx playwright test personal/arsenal-match-archive/archive.spec.mjs --browser=chromium --workers=1 --reporter=line
