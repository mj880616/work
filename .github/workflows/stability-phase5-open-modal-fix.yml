name: Stability phase5 open modal fix

on:
  push:
    branches:
      - stability-audit-phase5
    paths:
      - '.github/workflows/stability-phase5-open-modal-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-audit-phase5
      - name: Remove hidden legacy meeting field dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/team.js')
          text=p.read_text(encoding='utf-8')
          old="function openMeetingModal(){['meetingTitle','meetingAt','meetingNotes','meetingDecisions','meetingTaskTitle','meetingTaskDue'].forEach(id=>{if($('#'+id))$('#'+id).value=''});$('#meetingProject').innerHTML=projectOptions(true);$('#meetingTaskAssignee').innerHTML=memberOptions(true);openModal('meetingModal')}"
          new="function openMeetingModal(){['meetingTitle','meetingAt','meetingNotes','meetingDecisions','meetingTaskTitle','meetingTaskDue'].forEach(id=>{if($('#'+id))$('#'+id).value=''});$('#meetingProject').innerHTML=projectOptions(true);if($('#meetingTaskAssignee'))$('#meetingTaskAssignee').innerHTML=memberOptions(true);openModal('meetingModal')}"
          if text.count(old)!=1: raise SystemExit(f'openMeetingModal exact match count={text.count(old)}')
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          node --check app/team.js
          grep -q "if(\$('#meetingTaskAssignee'))" app/team.js
      - name: Commit patch
        run: |
          git config user.name "mj880616"
          git config user.email "mj880616@gmail.com"
          git add app/team.js
          git commit -m "Fix: 회의 모달의 삭제된 legacy 필드 의존성 제거"
          git push origin HEAD:stability-audit-phase5
