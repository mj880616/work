name: Build Android app

on:
  workflow_dispatch:
  push:
    # 태그 push(예: basket-pc-v*)에는 돌지 않음. 브랜치 push 동작은 그대로.
    tags-ignore:
      - '**'
    paths:
      - 'android-app/**'
      - 'app/app-icon.svg'
      - '.github/workflows/build-android-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - 'app/app-icon.svg'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Render Android launcher icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 app/app-icon.svg -o android-app/app/src/main/res/drawable-nodpi/app_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      # 껍데기 규칙(내부 주소 판정, 로그인 복귀 값, 바 색, 새 버전 비교) 단위 시험을 먼저 돌린다.
      - name: Unit tests
        run: gradle -p android-app :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      # 릴리스 workflow(phone-app-release.yml)가 서명하기 전 단계와 같은 빌드다. 서명·비밀값 없이 빌드만 확인한다.
      - name: Build release APK (unsigned, check only)
        run: gradle -p android-app :app:assembleRelease --stacktrace

      - name: Read app version
        id: version
        run: |
          version=$(sed -n "s/^ *versionName '\([0-9.]*\)'.*/\1/p" android-app/app/build.gradle)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web2-phone-${{ steps.version.outputs.name }}-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
