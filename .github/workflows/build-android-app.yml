name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'app/app-icon.svg'
      - '.github/workflows/build-android-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - 'app/app-icon.svg'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KPTU_FIREBASE_API_KEY: ${{ secrets.KPTU_FIREBASE_API_KEY }}
      KPTU_FIREBASE_APP_ID: ${{ secrets.KPTU_FIREBASE_APP_ID }}
      KPTU_FIREBASE_PROJECT_ID: ${{ secrets.KPTU_FIREBASE_PROJECT_ID }}
      KPTU_FIREBASE_SENDER_ID: ${{ secrets.KPTU_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check Firebase client configuration
        shell: bash
        run: |
          if [[ -n "$KPTU_FIREBASE_API_KEY" && -n "$KPTU_FIREBASE_APP_ID" && -n "$KPTU_FIREBASE_PROJECT_ID" && -n "$KPTU_FIREBASE_SENDER_ID" ]]; then
            echo "Firebase client configuration: present"
          else
            echo "::warning::Firebase client configuration is incomplete. APK will build, but native push stays disabled until repository secrets are configured."
          fi

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Render Android launcher icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 app/app-icon.svg -o android-app/app/src/main/res/drawable-nodpi/app_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kptu-work-android-0.1.10-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
