name: Extract KPTU HWP contacts
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kptu_hwp_contacts.py'
      - '.github/workflows/kptu-hwp-contacts.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/kptu_hwp_contacts.py
      - name: Commit contacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kptu-corpus/contact-authors-hwp-180.json
          git diff --cached --quiet || git commit -m "Extract contact names from KPTU HWP sample"
          git pull --rebase origin main
          git push
