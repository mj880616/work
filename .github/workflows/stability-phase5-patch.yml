name: Stability phase5 patch

on:
  push:
    branches:
      - stability-audit-phase5
    paths:
      - '.github/workflows/stability-phase5-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-audit-phase5
      - name: Consolidate meeting save ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          team=Path('app/team.js')
          text=team.read_text(encoding='utf-8')
          old="async function saveMeeting(){const title=$('#meetingTitle').value.trim();if(!title)return setStatus($('#meetingStatus'),'회의명을 입력해 주세요.','error');try{"
          new="async function saveMeeting(){const title=$('#meetingTitle').value.trim();if(!title)return setStatus($('#meetingStatus'),'회의명을 입력해 주세요.','error');const location=$('#wfMeetingLocation')?.value.trim()||null,attendeeRaw=$('#wfMeetingAttendees')?.value,attendeeCount=attendeeRaw===''||attendeeRaw==null?null:Number(attendeeRaw);try{"
          if old not in text: raise SystemExit('team saveMeeting start marker not found')
          text=text.replace(old,new,1)
          old="notes:$('#meetingNotes').value,decisions:$('#meetingDecisions').value,created_by:user.id"
          new="notes:$('#meetingNotes').value,decisions:$('#meetingDecisions').value,location,attendee_count:Number.isFinite(attendeeCount)?attendeeCount:null,result_status:'final',finalized_at:new Date().toISOString(),created_by:user.id"
          if old not in text: raise SystemExit('team meeting payload marker not found')
          text=text.replace(old,new,1)
          team.write_text(text,encoding='utf-8')

          mmt=Path('app/meeting-multi-tasks.js')
          text=mmt.read_text(encoding='utf-8')
          pattern=r"if\(url\.includes\('/rest/v1/app_meetings'\)&&method==='POST'&&typeof init\.body==='string'\)\{.*?\}\}if\(url\.includes\('/rest/v1/app_tasks'\)"
          text,count=re.subn(pattern,"if(url.includes('/rest/v1/app_tasks')",text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'meeting fetch interception removal count={count}')
          mmt.write_text(text,encoding='utf-8')

          wf=Path('app/workflow-ai-v3.js')
          text=wf.read_text(encoding='utf-8')
          pattern=r";const btn=document\.querySelector\('#saveMeetingBtn'\);if\(btn&&!btn\.dataset\.wfBound\)\{btn\.dataset\.wfBound='1';btn\.addEventListener\('click',\(\)=>\{.*?\},true\)\}\}"
          text,count=re.subn(pattern,"}",text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'workflow meeting post-save patch removal count={count}')
          wf.write_text(text,encoding='utf-8')

          loader=Path('app/loader-v2.js')
          text=loader.read_text(encoding='utf-8')
          replacements={
            "meeting-multi-tasks.js?v=6":"meeting-multi-tasks.js?v=7",
            "team.js?v=9":"team.js?v=10",
            "workflow-ai-v3.js?v=1":"workflow-ai-v3.js?v=2",
          }
          for old,new in replacements.items():
              if old not in text: raise SystemExit(f'loader marker not found: {old}')
              text=text.replace(old,new,1)
          loader.write_text(text,encoding='utf-8')

          test=Path('tests/app-e2e/workflow-ai-model.spec.mjs')
          text=test.read_text(encoding='utf-8')
          old="if(method==='PATCH'){\n        const row=state.meetings.find(x=>x.id===idFrom());if(row)Object.assign(row,body||{});return ok([]);\n      }"
          new="if(method==='PATCH'){\n        state.meetingPatches=(state.meetingPatches||0)+1;\n        const row=state.meetings.find(x=>x.id===idFrom());if(row)Object.assign(row,body||{});return ok([]);\n      }"
          if old not in text: raise SystemExit('workflow test PATCH marker not found')
          text=text.replace(old,new,1)
          old="  await expect.poll(()=>state.meetings.length).toBe(1);\n  await page.waitForTimeout(700);\n  expect(state.meetings[0].location).toBe('회의실');\n  expect(state.meetings[0].attendee_count).toBe(6);"
          new="  await expect.poll(()=>state.meetings.length).toBe(1);\n  expect(state.meetings[0].location).toBe('회의실');\n  expect(state.meetings[0].attendee_count).toBe(6);\n  expect(state.meetings[0].result_status).toBe('final');\n  expect(state.meetings[0].finalized_at).toBeTruthy();\n  await page.waitForTimeout(450);\n  expect(state.meetingPatches||0).toBe(0);"
          if old not in text: raise SystemExit('workflow test save assertions marker not found')
          text=text.replace(old,new,1)
          test.write_text(text,encoding='utf-8')

          entry=Path('tests/app-e2e/meeting-entry.spec.mjs')
          text=entry.read_text(encoding='utf-8')
          pattern=r"  await page\.waitForTimeout\(1200\);\n  const diagnostic=.*?  expect\(diagnostic\.error\)\.toBe\(''\);\n"
          replacement="  await expect(page.locator('#appView')).toHaveClass(/kptu-ui-ready/,{timeout:15000});\n  await page.locator('#newMeetingBtn').click();\n"
          text,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'meeting entry diagnostic replacement count={count}')
          entry.write_text(text,encoding='utf-8')
          PY

          node --check app/team.js
          node --check app/meeting-multi-tasks.js
          node --check app/workflow-ai-v3.js
          node --check app/loader-v2.js
          node --check tests/app-e2e/workflow-ai-model.spec.mjs
          node --check tests/app-e2e/meeting-entry.spec.mjs
          git diff --check
          git diff -- app/team.js app/meeting-multi-tasks.js app/workflow-ai-v3.js app/loader-v2.js tests/app-e2e/workflow-ai-model.spec.mjs tests/app-e2e/meeting-entry.spec.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/team.js app/meeting-multi-tasks.js app/workflow-ai-v3.js app/loader-v2.js tests/app-e2e/workflow-ai-model.spec.mjs tests/app-e2e/meeting-entry.spec.mjs
          git commit -m 'Web2 5차: 회의 저장 경로 단일화'
          git push origin HEAD:stability-audit-phase5
