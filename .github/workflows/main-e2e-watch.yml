name: Main E2E watch

# TEST-시험선택구멍 ②(2026-11-27 사용자 결정): main의 'App browser E2E check'(push·매일 정기 실행)가 끝나면
#   실패 → 'main 시험 깨짐' 이슈를 열거나(이미 열려 있으면 댓글만) 실행 번호·SHA·실패한 시험 위치(파일:줄)만 적는다.
#   성공 → 열린 그 이슈에 초록 댓글을 달고 닫는다. 뒤늦게 끝난 옛 실행은 아무것도 하지 않는다.
# 판정·글은 scripts/ops/main-e2e-watch.mjs 한 곳. workflow_run은 늘 기본 가지(main)의 이 파일로 돌고, PR 코드는 받지 않는다.
# 비밀값 없음(기본 토큰), 쓰기 권한은 issues 하나.
on:
  workflow_run:
    workflows: ['App browser E2E check']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: main-e2e-watch
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      github.repository == 'mj880616/work'
      && github.event.workflow_run.head_branch == 'main'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
      && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Open, comment on or close the main E2E issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ops/main-e2e-watch.mjs --run "$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
