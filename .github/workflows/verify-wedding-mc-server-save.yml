name: Verify wedding MC server save

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-wedding-mc-server-save.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify page uses shared server storage only
        run: |
          set -e
          ! grep -q 'localStorage\|sessionStorage\|indexedDB' wedding/mc-script/index.html
          grep -q 'wedding-mc-shared' wedding/mc-script/index.html
          grep -q '평소 평소 신부 강승지 양과는 서로의 크고 작은 일상을 나누며 친자매처럼 지내왔기 때문에' wedding/mc-script/index.html
          grep -q '34년을 함께 해 온 동생 강진호 님' wedding/mc-script/index.html
          grep -q '멀리 베를린에서 온 여동생 김온유 님과 남편 김요한 님' wedding/mc-script/index.html
      - name: Save current final script to shared server and read it back
        env:
          API: https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/wedding-mc-shared
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          text=Path('wedding/mc-script/index.html').read_text(encoding='utf-8')
          m=re.search(r'<article class="paper" id="script">(.*?)</article>',text,re.S)
          if not m: raise SystemExit('article not found')
          content=m.group(1).strip()
          Path('/tmp/payload.json').write_text(json.dumps({'content':content},ensure_ascii=False),encoding='utf-8')
          print('payload chars',len(content))
          PY
          curl --fail --silent --show-error -X POST "$API" \
            -H 'Origin: https://mj880616.github.io' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json > /tmp/save.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/save.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          print('save ok',d.get('updated_at'))
          PY
          curl --fail --silent --show-error "$API" \
            -H 'Origin: https://mj880616.github.io' > /tmp/read.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/read.json',encoding='utf-8'))
          c=d.get('content') or ''
          required=[
            '평소 평소 신부 강승지 양과는 서로의 크고 작은 일상을 나누며 친자매처럼 지내왔기 때문에',
            '2026년 10월 3일, 이제 두 사람이 서로를 평생의 반려자로 선택하고 함께 살아가겠다는 뜻을 확인하였습니다.',
            '오늘의 축사는 신부 강승지 양과 34년을 함께 해 온 동생 강진호 님이 준비했습니다.',
            '오늘을 위해 멀리 베를린에서 온 여동생 김온유 님과 남편 김요한 님인데요.',
            '이제 신랑 신부의 친구, 직장 동료, 지인 나와주세요.'
          ]
          missing=[s for s in required if s not in c]
          assert not missing, missing
          assert c.count('<section class="section">') == 17, c.count('<section class="section">')
          print('readback ok; chars',len(c),'updated_at',d.get('updated_at'))
          PY
