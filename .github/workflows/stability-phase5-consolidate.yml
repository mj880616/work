name: Stability phase5 consolidate

on:
  push:
    branches:
      - stability-audit-phase5
    paths:
      - '.github/workflows/stability-phase5-consolidate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-audit-phase5
      - name: Consolidate meeting creation into team core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          team=Path('app/team.js')
          text=team.read_text(encoding='utf-8')
          replacement=r'''async function saveMeeting(){
            const title=$('#meetingTitle').value.trim();
            if(!title)return setStatus($('#meetingStatus'),'회의명을 입력해 주세요.','error');
            const projectId=$('#meetingProject').value||null;
            const location=$('#wfMeetingLocation')?.value.trim()||null;
            const attendeeRaw=$('#wfMeetingAttendees')?.value;
            const attendeeCount=attendeeRaw===''||attendeeRaw==null?null:Number(attendeeRaw);
            const seriesName=$('#meetingSeriesName')?.value.trim()||null;
            const roundRaw=$('#meetingRoundNo')?.value;
            const roundNo=roundRaw?Number(roundRaw):null;
            try{
              const rows=await api('/rest/v1/app_meetings',{method:'POST',body:{workspace_id:workspace.id,project_id:projectId,title,series_name:seriesName,round_no:Number.isFinite(roundNo)?roundNo:null,meeting_at:$('#meetingAt').value?new Date($('#meetingAt').value).toISOString():new Date().toISOString(),notes:$('#meetingNotes').value,decisions:$('#meetingDecisions').value,location,attendee_count:Number.isFinite(attendeeCount)?attendeeCount:null,result_status:'final',finalized_at:new Date().toISOString(),created_by:user.id},prefer:'return=representation'});
              const meeting=rows?.[0];
              if(!meeting)throw new Error('저장된 회의 정보를 확인하지 못했습니다.');
              const actionRows=$$('.meeting-action-row').map(r=>({title:r.querySelector('.meeting-action-title')?.value.trim()||'',assignee_id:r.querySelector('.meeting-action-assignee')?.value||null,due:r.querySelector('.meeting-action-due')?.value||''})).filter(x=>x.title||x.assignee_id||x.due);
              let assignments=actionRows.filter(x=>x.title&&x.assignee_id);
              if(!actionRows.length){const fallbackTitle=$('#meetingTaskTitle')?.value.trim()||'';if(fallbackTitle)assignments=[{title:fallbackTitle,assignee_id:$('#meetingTaskAssignee')?.value||null,due:$('#meetingTaskDue')?.value||''}].filter(x=>x.title&&x.assignee_id)}
              if(actionRows.some(x=>!x.title||!x.assignee_id))throw new Error('후속 할 일과 담당자를 모두 입력해 주세요.');
              if(assignments.length)await api('/rest/v1/app_tasks',{method:'POST',body:assignments.map(a=>({workspace_id:workspace.id,project_id:projectId,title:a.title,description:'회의 역할분담 · '+title,assignee_id:a.assignee_id,status:'todo',priority:'normal',due_at:a.due?new Date(a.due+'T18:00:00+09:00').toISOString():null,source_type:'meeting',source_id:meeting.id,created_by:user.id}))});
              const files=[...($('#meetingFiles')?.files||[])];
              for(const file of files){const fd=new FormData();fd.append('file',file);fd.append('meeting_id',meeting.id);if(projectId)fd.append('project_id',projectId);fd.append('category','회의자료');fd.append('description',title+' 회의자료');await api('/functions/v1/library-files',{method:'POST',body:fd})}
              closeModal('meetingModal');await reload(['meetings','tasks','notifications','documents']);window.dispatchEvent(new CustomEvent('kptu:meetings-changed',{detail:{meeting_id:meeting.id}}));if(assignments.length)window.dispatchEvent(new CustomEvent('kptu:tasks-changed'));toast(files.length?`회의 결과와 자료 ${files.length}개를 저장했습니다.`:'회의 결과를 저장했습니다.');
            }catch(e){setStatus($('#meetingStatus'),e.message,'error')}
          }
          '''
          new,n=re.subn(r"async function saveMeeting\(\).*?(?=async function saveProject\()",replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'team saveMeeting replacement count={n}')
          team.write_text(new,encoding='utf-8')

          tw=Path('app/task-workflow.js')
          text=tw.read_text(encoding='utf-8')
          text,n1=re.subn(r"async function twUploadMeetingFiles\(.*?(?=async function twSaveMeeting\()",'',text,count=1,flags=re.S)
          text,n2=re.subn(r"async function twSaveMeeting\(\).*?(?=let twOriginTimer)",'',text,count=1,flags=re.S)
          text,n3=re.subn(r"const saveMeeting=document\.querySelector\('#saveMeetingBtn'\);if\(saveMeeting\)saveMeeting\.onclick=twSaveMeeting;",'',text,count=1)
          if (n1,n2,n3)!=(1,1,1): raise SystemExit(f'task-workflow replacement counts={(n1,n2,n3)}')
          tw.write_text(text,encoding='utf-8')

          loader=Path('app/loader-v2.js')
          text=loader.read_text(encoding='utf-8')
          if "await import('./meeting-multi-tasks.js?v=7');\n" not in text: raise SystemExit('meeting-multi-tasks import not found')
          text=text.replace("await import('./meeting-multi-tasks.js?v=7');\n",'')
          text=text.replace("import('./team.js?v=10')","import('./team.js?v=11')")
          text=text.replace("import('./task-workflow.js?v=3')","import('./task-workflow.js?v=4')")
          loader.write_text(text,encoding='utf-8')
          PY
          node --check app/team.js
          node --check app/task-workflow.js
          node --check app/loader-v2.js
          grep -q "wfMeetingLocation" app/team.js
          grep -q "meetingSeriesName" app/team.js
          ! grep -q "twSaveMeeting" app/task-workflow.js
          ! grep -q "meeting-multi-tasks.js" app/loader-v2.js
      - name: Commit patch
        run: |
          git config user.name "mj880616"
          git config user.email "mj880616@gmail.com"
          git add app/team.js app/task-workflow.js app/loader-v2.js
          git commit -m "Refactor: 회의 생성 저장 주체를 team core로 단일화"
          git push origin HEAD:stability-audit-phase5
