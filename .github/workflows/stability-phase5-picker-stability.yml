name: Stability phase5 picker stability

on:
  push:
    branches:
      - stability-audit-phase5
    paths:
      - '.github/workflows/stability-phase5-picker-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-audit-phase5
      - name: Stop assignee picker self-rerender loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/meeting-assignee-picker.js')
          text=p.read_text(encoding='utf-8')
          old="""    const previous=sel.dataset.mapSelected||sel.value;\n    const edit=isDetailEdit(sel);\n    sel.querySelector(`option[value=\"${TEAM}\"]`)?.remove();\n    if(!edit){const o=document.createElement('option');o.value=TEAM;o.textContent='팀 전체';if(sel.options.length)sel.options[0].insertAdjacentElement('afterend',o);else sel.appendChild(o)}\n    if(previous&&[...sel.options].some(o=>o.value===previous))sel.value=previous;"""
          new="""    const previous=sel.dataset.mapSelected||sel.value;\n    const edit=isDetailEdit(sel);\n    const teamOption=sel.querySelector(`option[value=\"${TEAM}\"]`);\n    if(edit){teamOption?.remove()}\n    else if(!teamOption){const o=document.createElement('option');o.value=TEAM;o.textContent='팀 전체';if(sel.options.length)sel.options[0].insertAdjacentElement('afterend',o);else sel.appendChild(o)}\n    if(previous&&[...sel.options].some(o=>o.value===previous))sel.value=previous;"""
          if text.count(old)!=1: raise SystemExit(f'ensureTeamOption match={text.count(old)}')
          text=text.replace(old,new)
          old2="""  document.addEventListener('click',e=>{if(!e.target.closest('.map-picker'))closeAll()});const mo=new MutationObserver(()=>{clearTimeout(mo.t);mo.t=setTimeout(enhance,20)});mo.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setInterval(enhance,700);setTimeout(enhance,0);"""
          new2="""  document.addEventListener('click',e=>{if(!e.target.closest('.map-picker'))closeAll()});const mo=new MutationObserver(records=>{const relevant=records.some(r=>r.target?.matches?.(selector)||[...r.addedNodes].some(n=>n.nodeType===1&&(n.matches?.(selector)||n.querySelector?.(selector))));if(!relevant)return;clearTimeout(mo.t);mo.t=setTimeout(enhance,20)});mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(enhance,0);"""
          if text.count(old2)!=1: raise SystemExit(f'observer match={text.count(old2)}')
          text=text.replace(old2,new2)
          p.write_text(text,encoding='utf-8')
          PY
          node --check app/meeting-assignee-picker.js
          ! grep -q "setInterval(enhance" app/meeting-assignee-picker.js
          ! grep -q "attributeFilter:\['class'\]" app/meeting-assignee-picker.js
      - name: Commit patch
        run: |
          git config user.name "mj880616"
          git config user.email "mj880616@gmail.com"
          git add app/meeting-assignee-picker.js
          git commit -m "Fix: 회의 담당자 선택기 자체 재렌더 루프 제거"
          git push origin HEAD:stability-audit-phase5
