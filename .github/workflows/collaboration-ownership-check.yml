name: Mobile and notification ownership check

on:
  push:
    branches: [main]
    paths:
      - 'app/mobile-dock.js'
      - 'app/mobile-dock.css'
      - 'app/notification-center-ui.js'
      - 'app/notification-center-ui.css'
      - 'app/profile-settings.js'
      - 'app/loader-v2.js'
      - 'app/styles.css'
      - '.github/workflows/collaboration-ownership-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/mobile-dock.js'
      - 'app/mobile-dock.css'
      - 'app/notification-center-ui.js'
      - 'app/notification-center-ui.css'
      - 'app/profile-settings.js'
      - 'app/loader-v2.js'
      - 'app/styles.css'
      - '.github/workflows/collaboration-ownership-check.yml'

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile and notification ownership boundaries
        run: |
          set -e
          grep -q "mobile-dock.js?v=1" app/loader-v2.js
          grep -q "notification-center-ui.js?v=6" app/loader-v2.js
          grep -q "await window.__KPTU_NOTIFICATION_CENTER_READY__" app/loader-v2.js
          grep -q "mobile-dock.css?v=1" app/styles.css
          grep -q "notification-center-ui.css?v=2" app/styles.css
          grep -q "ccMobileDock" app/mobile-dock.js
          grep -q "window.__KPTU_NOTIFICATION_CENTER_READY__" app/notification-center-ui.js
          grep -q "id=\"psLogout\"" app/profile-settings.js
          if grep -Eq "app_notifications|ccNotifTop|myTaskMini|statUnread|messagesView" app/mobile-dock.js; then
            echo 'mobile dock crossed into notification, message, or home ownership'; exit 1
          fi
          if grep -Eq "ps-profile-grid|ncuLogout|logoutBtn|installLogout" app/notification-center-ui.js; then
            echo 'notification module crossed into profile ownership'; exit 1
          fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/mobile-dock.js app/notification-center-ui.js; then
            echo 'dynamic mobile or notification styles returned'; exit 1
          fi
          if grep -q "MutationObserver" app/mobile-dock.js app/notification-center-ui.js; then
            echo 'mobile or notification DOM observer returned'; exit 1
          fi
          if grep -q "setInterval" app/notification-center-ui.js; then
            echo 'notification polling returned'; exit 1
          fi
          node --check app/mobile-dock.js
          node --check app/notification-center-ui.js
          node --check app/profile-settings.js
