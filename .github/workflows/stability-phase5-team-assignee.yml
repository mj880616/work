name: Stability phase5 team assignee

on:
  push:
    branches:
      - stability-audit-phase5
    paths:
      - '.github/workflows/stability-phase5-team-assignee.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-audit-phase5
      - name: Apply patch script
        run: |
          python3 scripts/phase5-team-assignee-patch.py
          node --check app/team.js
          node --check app/meeting-assignee-picker.js
          grep -q "assignee_id==='__team__'" app/team.js
          ! grep -q "__KPTU_MEETING_TEAM_FETCH_V3__\|originalFetch" app/meeting-assignee-picker.js
      - name: Commit patch
        run: |
          git config user.name mj880616
          git config user.email mj880616@gmail.com
          git add app/team.js app/meeting-assignee-picker.js
          git commit -m 'Refactor: 팀 전체 회의 역할분담을 core 저장 경로로 통합'
          git push origin HEAD:stability-audit-phase5
