name: Update wedding MC final order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-wedding-mc-final-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final ceremony order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('wedding/mc-script/index.html')
          text = p.read_text(encoding='utf-8')

          # 1) 부모님 화촉점화 뒤 양가 부모님 맞절을 추가하고, 이후 하객 인사/착석으로 연결
          old = '''<div class="cue">어머님 두 분 중심으로 화촉점화 · 아버님들은 한발 옆에서 대기</div><div class="speech"><p>이제 오늘 이 자리를 찾아주신 하객 여러분께 감사 인사를 드리겠습니다.</p><p><span class="highlight">양가 부모님, 하객 여러분께 인사.</span></p></div><div class="cue">양가 부모님 네 분 함께 하객 인사</div><div class="speech"><p>양가 부모님께 다시 한번 큰 박수 부탁드리며, 부모님께서는 자리에 착석해주시기 바랍니다.</p></div>'''
          new = '''<div class="cue">어머님 두 분 중심으로 화촉점화 · 아버님들은 한발 옆에서 대기</div><div class="speech"><p>이제 양가 부모님께서는 서로 마주 봐주시기 바랍니다.</p><p>두 사람의 새로운 출발을 함께 축복하는 마음으로 서로 인사 나누겠습니다.</p><p><span class="highlight">양가 부모님, 맞절.</span></p></div><div class="cue">양가 부모님 맞절</div><div class="speech"><p>이어서 오늘 이 자리를 찾아주신 하객 여러분께 감사 인사를 드리겠습니다.</p><p><span class="highlight">양가 부모님, 하객 여러분께 인사.</span></p></div><div class="cue">양가 부모님 네 분 함께 하객 인사</div><div class="speech"><p>양가 부모님께 다시 한번 큰 박수 부탁드리며, 부모님께서는 자리에 착석해주시기 바랍니다.</p></div>'''
          if old not in text:
              raise SystemExit('parent ceremony block not found')
          text = text.replace(old, new, 1)

          # 2) 복둥이 화견 입장 섹션 전체 삭제
          pattern = r'\n\s*<section class="section"><h2><span class="num">09</span>복둥이 화견 입장</h2>.*?</section>\n'
          text, n = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'dog section removal count={n}')

          # 3) 이후 섹션 번호를 한 칸씩 당김
          for old_num, new_num in [(10,9),(11,10),(12,11),(13,12),(14,13),(15,14),(16,15),(17,16)]:
              text = text.replace(f'<span class="num">{old_num:02d}</span>', f'<span class="num">{new_num:02d}</span>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify page structure and shared persistence code
        run: |
          set -e
          grep -q '양가 부모님, 맞절.' wedding/mc-script/index.html
          grep -q '<span class="num">09</span>혼인서약 · 성혼선언' wedding/mc-script/index.html
          grep -q '<span class="num">16</span>폐식 · 촬영 안내' wedding/mc-script/index.html
          ! grep -q '복둥이 화견 입장\|라이온킹 OST\|심바' wedding/mc-script/index.html
          ! grep -q 'localStorage\|sessionStorage\|indexedDB' wedding/mc-script/index.html
          grep -q 'wedding-mc-shared' wedding/mc-script/index.html
          grep -q '서버 저장 중' wedding/mc-script/index.html
          grep -q '공동저장됨' wedding/mc-script/index.html

      - name: Commit updated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wedding/mc-script/index.html
          git commit -m 'Update wedding MC script to final ceremony order'
          git push

      - name: Sync updated page to shared server and verify readback
        env:
          API: https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/wedding-mc-shared
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          text = Path('wedding/mc-script/index.html').read_text(encoding='utf-8')
          m = re.search(r'<article class="paper" id="script">(.*?)</article>', text, re.S)
          if not m:
              raise SystemExit('article not found')
          content = m.group(1).strip()
          Path('/tmp/payload.json').write_text(json.dumps({'content': content}, ensure_ascii=False), encoding='utf-8')
          PY

          curl --fail --silent --show-error -X POST "$API" \
            -H 'Origin: https://mj880616.github.io' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json > /tmp/save.json

          curl --fail --silent --show-error "$API" \
            -H 'Origin: https://mj880616.github.io' > /tmp/read.json

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/read.json', encoding='utf-8'))
          c = d.get('content') or ''
          required = [
            '양가 부모님, 맞절.',
            '<span class="num">09</span>혼인서약 · 성혼선언',
            '<span class="num">16</span>폐식 · 촬영 안내',
            '이어서, 오늘 이 자리에 함께하신 가족과 소중한 분들을 대신하여',
            '신랑 김명진 군과 신부 강승지 양이 정식으로 부부가 되었음을 선언합니다.'
          ]
          missing = [x for x in required if x not in c]
          assert not missing, missing
          forbidden = ['복둥이 화견 입장', '라이온킹 OST', '심바']
          present = [x for x in forbidden if x in c]
          assert not present, present
          print('shared server readback ok', d.get('updated_at'))
          PY
