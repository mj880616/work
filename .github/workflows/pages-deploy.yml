name: Deploy GitHub Pages

# CI-버전자동화 2단계(docs/design/ci-version-automation.md 4장): builds the Pages site the same way
# the branch deployment does (Jekyll), adds content-hash ?v= to references (the repository has none
# since 3단계) and writes app/asset-manifest.json with scripts/build-pages.mjs, checks the result,
# and only then deploys it.
#
# Since 2단계 Pages Source is GitHub Actions and this workflow is the production deployment. The
# deploy job still runs only while the Pages build_type is "workflow", so if Source is ever set back
# to "Deploy from a branch" the build and checks run but nothing is deployed (the Summary says so).
# workflow_dispatch with skip_deploy builds and checks without deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: '빌드·검사만 하고 배포하지 않음'
        type: boolean
        default: false

permissions:
  contents: read

# One Pages release at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      build_type: ${{ steps.source.outputs.build_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Pages source setting
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          echo "Pages build_type: $build_type"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
      # The same Jekyll build GitHub Pages runs for a branch deployment.
      - name: Jekyll build
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked checker parser
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      # S67-56(2026-11-20 사용자 결정, AGENTS.md 5절): 운영 앱은 WORK ON 기본 단어 얼굴(girok)로 빌드한다. 고친 이름이 없는 사람은 노조 색 단어 없이,
      # 고친 이름(내 프로필 custom_words)이 있는 사람은 그 이름으로 본다. cloudflare-worker-deploy.yml도 같은 얼굴로 만들어 운영과 맞춘다
      # (scripts/production-face.test.mjs가 두 곳이 같은지 본다).
      - name: Add content-hash ?v= and build the asset manifest
        run: node scripts/build-pages.mjs _site "$RUNNER_TEMP/pages-out" --face=girok
      # APP-앱내려받기버튼: 최신 폰 앱(태그 phone-app-v*, 파일 web2-phone-*.apk — 바구니 PC 릴리스와 섞이지 않음)을 공개 릴리스 목록에서 골라
      # 빌드 결과($RUNNER_TEMP/pages-out)의 app/phone-app.json에 둔다(_site는 Jekyll이 root로 만들어 쓸 수 없다 — 2026-11-14 배포 실패 원인). 화면은 같은 주소의 이 파일만 읽는다. 목록을 못 읽으면 파일 없이 배포한다(화면은 릴리스 목록 주소로 연다).
      # 배포(main push·손 실행) 때마다 다시 고른다. 폰 앱 릴리스 뒤 바로 맞추려면 이 workflow를 손으로 한 번 돌린다(받은 옛 판도 앱이 스스로 업데이트한다).
      # BASKET-노조플러스업로드: 같은 목록에서 최신 윈도우 PC 프로그램(태그 basket-pc-v*, 파일 BasketDropApp-win-Setup.exe)도 골라 app/pc-app.json에 둔다(같은 규칙·같은 폴더, 못 고르면 파일 없이 배포).
      - name: Pick the latest phone app APK and Windows PC setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"; then
            node scripts/phone-app-latest.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/pages-out/app/phone-app.json" "$RUNNER_TEMP/pages-out/app/pc-app.json" || echo "고르기 실패: 파일 없이 배포"
          else
            echo "릴리스 목록을 읽지 못함: app/phone-app.json·app/pc-app.json 없이 배포"
          fi
      - name: Check hashed references, manifest and Worker fingerprints
        run: node scripts/check-pages-build.mjs "$RUNNER_TEMP/pages-out"
      - name: Check Worker deploy URL extraction on the output
        run: node scripts/cloudflare-check-urls.mjs "$RUNNER_TEMP/pages-out"
      # S67-56: WORK ON 화면 글자에 노조 색 글자가 없는지(pages-build-check.yml과 같은 검사, 배포 전 한 번 더).
      - name: Check WORK ON screen words
        run: node scripts/check-girok-words.mjs "$RUNNER_TEMP/pages-out"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages-out
          retention-days: 3
      - name: Summary
        env:
          BUILD_TYPE: ${{ steps.source.outputs.build_type }}
          SKIP_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_deploy }}
        run: |
          if [[ "$BUILD_TYPE" != workflow ]]; then
            echo "배포 건너뜀: Pages Source가 GitHub Actions가 아님(build_type=$BUILD_TYPE). 운영은 브랜치 배포 그대로." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SKIP_DEPLOY" == true ]]; then
            echo "배포 건너뜀: skip_deploy 입력. 빌드·검사만 함." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "빌드·검사 통과. deploy job이 이 결과를 배포함." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow' && !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # UPDATE-운영자전용기록업데이트소식 PR1: 개발 기록(app/release-notes/*.json)은 공개 배포물에 싣지 않고(build-pages.mjs),
  # 배포가 끝난 뒤 묶어서 서버 표(app_release_notes, 운영자만 읽음)로 보낸다. 열쇠는 이 job의 GitHub OIDC 토큰(새 비밀값 없음) —
  # Edge release-notes-sync가 저장소·main·이 workflow 파일을 확인한다. 실패해도 화면 배포는 그대로(이 job만 실패로 남음).
  release-notes:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            app/release-notes
            app/release-notes-model.mjs
            scripts/ops/release-notes-sync.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Send release notes to the server
        run: node scripts/ops/release-notes-sync.mjs .
