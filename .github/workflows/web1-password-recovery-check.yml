name: Web1 password recovery check

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/public-page-auth.js'
      - 'app/public-page-editor.js'
      - 'tests/app-e2e/public-page-password-recovery.spec.mjs'
      - '.github/workflows/web1-password-recovery-check.yml'

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Verify recovery contract
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const auth=await readFile('app/public-page-auth.js','utf8');
          const required=['/auth/v1/recover','resetPasswordForEmail','consumeRecoverySession','updatePassword','ppeAuthReset','ppeRecoveryForm','새 비밀번호'];
          for(const token of required){
            if(!auth.includes(token)) throw new Error(`missing recovery contract: ${token}`);
          }
          if(auth.includes('kptu_collab_session_v1')) throw new Error('Web2 session key leaked into Web1 auth');
          NODE
