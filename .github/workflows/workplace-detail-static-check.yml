name: Workplace detail static UI check

on:
  push:
    branches: [main]
    paths:
      - 'app/workplace-detail.js'
      - 'app/workplace-detail.css'
      - 'app/workplace-report.js'
      - 'app/styles.css'
      - 'app/loader-v2.js'
      - 'app/view-loader.js'
      - '.github/workflows/workplace-detail-static-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/workplace-detail.js'
      - 'app/workplace-detail.css'
      - 'app/workplace-report.js'
      - 'app/styles.css'
      - 'app/loader-v2.js'
      - 'app/view-loader.js'
      - '.github/workflows/workplace-detail-static-check.yml'

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check static workplace detail UI
        run: |
          set -e
          test -f app/workplace-detail.js
          test -f app/workplace-detail.css
          grep -q "workplace-detail.css?v=10" app/styles.css
          grep -Fq "workplace-detail.js?v=26" app/view-loader.js
          grep -q "data-wd-close" app/workplace-detail.js
          grep -q "data-wd-time-edit" app/workplace-detail.js
          grep -q "id=\"wdInboxText\"" app/workplace-detail.js
          grep -q "id=\"wdInboxSave\"" app/workplace-detail.js
          grep -Fq "workplace-report.js?v=5" app/view-loader.js
          if grep -Eq "wdUpdateCurrent|wdCurrentModal|wdAddItem|wdItemModal" app/workplace-detail.js; then
            echo 'removed current-status/memo input returned to workplace detail'; exit 1
          fi
          if grep -Eq "warRaw|warSaveRaw" app/workplace-report.js; then
            echo 'duplicate raw update input returned to AI report'; exit 1
          fi
          grep -q "id=\"wdBasicView\"" app/workplace-detail.js
          if grep -q "wdDeleteOrg" app/workplace-detail.js; then
            echo 'organization delete returned to normal detail'; exit 1
          fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/workplace-detail.js; then
            echo 'workplace detail returned to dynamic style injection'; exit 1
          fi
          if grep -q "MutationObserver" app/workplace-detail.js; then
            echo 'workplace detail returned to DOM mutation correction'; exit 1
          fi
          if grep -Eq "localStorage|kptu_collab_session_v1" app/workplace-detail.js; then
            echo 'workplace detail bypassed shared runtime session'; exit 1
          fi
          node --check app/workplace-detail.js
          node --check app/workplace-report.js
