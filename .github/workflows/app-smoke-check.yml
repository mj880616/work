name: App smoke check

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'tests/domain/bokdoong-router.test.mjs'
      - 'tests/domain/web2-pwa-registration.test.mjs'
      - 'p/**'
      - 'supabase/functions/meeting-ai-draft/**'
      - 'tests/meeting-draft-parser.test.mjs'
      - '.github/workflows/app-smoke-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'tests/domain/bokdoong-router.test.mjs'
      - 'tests/domain/web2-pwa-registration.test.mjs'
      - 'p/**'
      - 'supabase/functions/meeting-ai-draft/**'
      - 'tests/meeting-draft-parser.test.mjs'
      - '.github/workflows/app-smoke-check.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check meeting draft parser
        run: node --test tests/meeting-draft-parser.test.mjs

      - name: Check domain routing and service worker registration
        run: node --test tests/domain/bokdoong-router.test.mjs tests/domain/web2-pwa-registration.test.mjs

      - name: Check recursive app dependency graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('app'); queue=['app.js']; active=set(); missing=[]
          patterns=[r"import\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]\)",r"(?:from|import)\s*['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]",r"serviceWorker\.register\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]"]
          while queue:
            name=queue.pop(0)
            if name in active: continue
            path=root/name
            if not path.exists(): missing.append(name); continue
            active.add(name); text=path.read_text(encoding='utf-8')
            refs=[]
            for pat in patterns: refs.extend(re.findall(pat,text))
            for ref in refs:
              rel=ref.split('?',1)[0]
              if rel.startswith('./'):
                child=Path(rel[2:]).name
                if not (root/child).exists(): missing.append(f'{name} -> {ref}')
                elif child not in active: queue.append(child)
          if missing:
            print('Missing recursive dependencies:'); print('\n'.join(missing)); sys.exit(1)
          print('Active JS modules:',len(active)); print('\n'.join(sorted(active)))
          PY

      - name: Check public and authenticated app boundaries
        run: |
          set -e
          for f in \
            app/index.html app/app.js app/loader-v2.js app/app-router.js app/runtime-client.js \
            app/auth-service.js app/capabilities.js app/public-workspace.js app/login/index.html app/login/login.js \
            app/team.js app/topbar-actions.js app/topbar-actions.css \
            app/team-member-overview.js app/team-member-overview.css app/team-profile-view.js app/team-profile-view.css app/team-member-management.js app/team-member-management.css \
            app/profile-settings.js app/profile-settings.css app/notification-center-ui.js app/notification-center-ui.css \
            app/task-workflow.js app/task-row-view.js app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/meeting-round-detail.js app/page-builder.js app/page-builder.css \
            app/page-list-controller.js app/page-save-controller.js app/page-shortcut.js app/page-management.js app/page-inline-viewer-v2.js app/page-core.css app/compact-list.css \
            app/project-system-v3.js app/project-system-v3.css \
            app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js app/calendar-ui.css \
            app/workflow-ai-v3.js app/workplace-ai-report.js app/photo-room.js \
            app/access-approval.css app/meeting-ui.css app/photo-room.css p/index.html; do
            test -f "$f"
          done
          test -d app/legacy
          test -f app/legacy/README.md
          test ! -f app/meeting-assignee-picker.js
          test ! -f app/meeting-file-route.js
          test ! -f app/calendar-defaults.js
          test ! -f app/page-editor-fix.js
          test ! -f app/page-inline-viewer.js
          test ! -f app/task-status-state.js
          test ! -f app/task-assignment-visibility.js

          grep -q 'id="appView"' app/index.html
          grep -q 'id="authView"' app/index.html
          grep -Eq '<script src="\./app\.js\?v=[0-9]+" defer></script>' app/index.html
          grep -q "loader-v2.js" app/app.js
          grep -q "critical.css?v=1" app/index.html
          grep -q "styles.css?v=33" app/loader-v2.js
          grep -q "ensureFeatureStyles" app/loader-v2.js
          grep -q "runtime-client.js" app/loader-v2.js
          grep -q "auth-service.js" app/loader-v2.js
          grep -q "capabilities.js?v=2" app/loader-v2.js
          grep -q "KPTURuntime.session.ensure" app/loader-v2.js
          grep -q "__KPTU_BOOT_MEMBERSHIP_PROMISE__" app/loader-v2.js
          grep -q "workspacePrefetchStart" app/loader-v2.js
          grep -q "prefetched?.ok?prefetched.rows" app/team.js
          grep -q "public-workspace.js?v=10" app/loader-v2.js
          grep -q "home-dashboard-v2.js?v=7" app/loader-v2.js
          grep -q "topbar-actions.js?v=6" app/loader-v2.js
          grep -q "team.js?v=28" app/loader-v2.js
          grep -q "project-system-v3.js?v=10" app/loader-v2.js
          grep -q "task-workflow.js?v=6" app/loader-v2.js
          grep -q "__KPTU_TASK_WORKFLOW_READY__" app/loader-v2.js
          grep -q "task-row-view.js?v=1" app/loader-v2.js
          grep -q "task-layout.js?v=9" app/loader-v2.js
          grep -q "google-tasks.js?v=4" app/loader-v2.js
          grep -q "__KPTU_TASK_LAYOUT_READY__" app/loader-v2.js
          if grep -Eq "profile-settings.js|myspace-return.js" app/loader-v2.js; then echo 'removed personal view module was loaded'; exit 1; fi
          test ! -f app/home-task-controls.js
          test ! -f app/home-task.css
          test ! -f app/library-public-toggle.js
          if grep -Eq "home-task-controls|home-task.css|library-public-toggle" app/loader-v2.js app/styles.css; then echo 'retired home/library decorator returned'; exit 1; fi
          grep -q "photo-room.js?v=4" app/loader-v2.js
          grep -q "page-list-controller.js?v=6" app/loader-v2.js
          grep -q "__KPTU_PAGE_LIST_READY__" app/loader-v2.js
          grep -q "page-save-controller.js?v=4" app/loader-v2.js
          grep -q "__KPTU_PAGE_SAVE_READY__" app/loader-v2.js
          grep -q "page-builder.js?v=3" app/loader-v2.js
          grep -q "__KPTU_PAGE_BUILDER_READY__" app/loader-v2.js
          grep -q "page-management.js?v=4" app/loader-v2.js
          grep -q "__KPTU_PAGE_MANAGEMENT_READY__" app/loader-v2.js
          grep -q "page-inline-viewer-v2.js?v=4" app/loader-v2.js
          grep -q "__KPTU_PAGE_INLINE_VIEWER_READY__" app/loader-v2.js
          grep -q "meeting-round-detail.js?v=9" app/loader-v2.js
          grep -q "__KPTU_MEETING_ROUND_DETAIL_READY__" app/loader-v2.js
          if grep -q 'mobile-dock.js' app/loader-v2.js; then echo 'obsolete personal dock returned'; exit 1; fi
          grep -q "notification-center-ui.js?v=6" app/loader-v2.js
          grep -q "__KPTU_NOTIFICATION_CENTER_READY__" app/loader-v2.js
          grep -q "calendar-plus.js?v=5" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_PLUS_READY__" app/loader-v2.js
          grep -q "calendar-persistence.js?v=10" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_PERSISTENCE_READY__" app/loader-v2.js
          grep -q "calendar-interactions-v2.js?v=3" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_INTERACTIONS_READY__" app/loader-v2.js
          grep -q "calendar-mobile-ui.js?v=3" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_MOBILE_UI_READY__" app/loader-v2.js
          grep -q "calendar-day-overflow.js?v=2" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_DAY_OVERFLOW_READY__" app/loader-v2.js

          grep -q "topbar-actions.css?v=6" app/styles.css
          grep -q "team.css?v=2" app/styles.css
          if grep -q "profile-settings.css" app/styles.css; then echo 'removed personal view stylesheet was loaded'; exit 1; fi
          if grep -q 'mobile-dock.css' app/styles.css; then echo 'obsolete personal dock style returned'; exit 1; fi
          grep -q "notification-center-ui.css?v=2" app/styles.css
          grep -q "task-layout.css?v=4" app/styles.css
          grep -q "google-tasks.css?v=2" app/styles.css
          grep -q "meeting-ui.css?v=6" app/styles.css
          grep -q "calendar-ui.css?v=2" app/styles.css
          grep -q "page-core.css?v=7" app/styles.css
          grep -q "page-builder.css?v=2" app/styles.css
          grep -q "project-system-v3.css?v=9" app/styles.css
          grep -q "#authView{display:none!important}" app/base-ui.css
          grep -q "#appView:not(.kptu-ui-ready)" app/base-ui.css
          grep -q ".top-actions #logoutBtn" app/topbar-actions.css
          grep -q "logout.addEventListener" app/topbar-actions.js
          if grep -Eq "teamManageTop|ccMessageTop|userBadge" app/topbar-actions.js; then echo 'removed personal or message action returned to the topbar'; exit 1; fi

          grep -q "function taskProjectOptions" app/team.js
          grep -q "x.status!=='archived'&&x.parent_id" app/team.js
          grep -q "taskProjectOptions(true)" app/team.js
          grep -q "data-mrd-meeting" app/team.js
          grep -q "/functions/v1/meeting-files" app/team.js
          grep -q "function renderPages(){window.KPTUPageList?.render?.()}" app/team.js
          grep -q "data-board-project" app/page-list-controller.js
          grep -q "parent_id,status,sort_order,project_type,current_phase" app/page-list-controller.js
          grep -q "__KPTU_SYNC_TEAM_PAGES__" app/team.js

          grep -q "app_public_workspace_index" app/public-workspace.js
          grep -q "app_public_workspace_index" app/public-workspace-extras.js
          if grep -Eq "app_public_projects_snapshot|app_public_workspace_snapshot" app/public-workspace.js app/public-workspace-extras.js; then echo 'anonymous workspace client returned to a broad snapshot'; exit 1; fi
          grep -q "auth-service.js" app/login/index.html
          grep -q "KPTUAuth" app/login/login.js
          grep -q "KPTUCapabilities" app/capabilities.js

          if grep -q "auth-ui.js" app/loader-v2.js app/app.js; then echo 'legacy in-app authentication UI returned'; exit 1; fi
          if grep -q "team.js" app/app.js; then echo 'workspace modules bypass session boundary'; exit 1; fi
          if grep -Eq "task-child-project-guard.js|task-status-state.js|task-assignment-visibility.js|meeting-assignee-picker.js|meeting-file-route.js|calendar-defaults.js|page-editor-fix.js|page-inline-viewer.js" app/loader-v2.js; then echo 'legacy correction module returned'; exit 1; fi
          if grep -q "MutationObserver" app/loader-v2.js app/topbar-actions.js app/task-workflow.js app/meeting-round-detail.js; then echo 'core readiness returned to mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/topbar-actions.js app/task-workflow.js app/meeting-round-detail.js app/page-builder.js; then echo 'core styles returned to runtime injection'; exit 1; fi
          if grep -q "createElement('link')" app/team.js; then echo 'team css must stay static'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/access-approval.js app/home-dashboard-v2.js app/photo-room.js app/notification-center-ui.js; then echo 'core UI returned to dynamic style injection'; exit 1; fi
          if grep -q "localStorage\|SESSION_KEY\|kptu_collab_session_v1" app/photo-room.js app/notification-center-ui.js; then echo 'core UI bypassed shared runtime session'; exit 1; fi
          if grep -q "location.reload" app/photo-room.js app/page-save-controller.js app/page-builder.js; then echo 'feature returned to full-page reload'; exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          text=Path('app/loader-v2.js').read_text(encoding='utf-8')
          keys=[
            'const authenticated=await window.KPTURuntime.session.ensure()',
            "import('./team.js?v=28')",'await window.__KPTU_TEAM_READY__',
            "import('./task-workflow.js?v=6')",'await window.__KPTU_TASK_WORKFLOW_READY__',
            "import('./task-row-view.js?v=1')","import('./task-layout.js?v=9')",'await window.__KPTU_TASK_LAYOUT_READY__',
            "import('./page-list-controller.js?v=6')",'await window.__KPTU_PAGE_LIST_READY__',
            "import('./page-save-controller.js?v=4')",'await window.__KPTU_PAGE_SAVE_READY__',
            "import('./page-builder.js?v=3')",'await window.__KPTU_PAGE_BUILDER_READY__',
            "import('./page-management.js?v=4')",'await window.__KPTU_PAGE_MANAGEMENT_READY__',
            "import('./page-inline-viewer-v2.js?v=4')",'await window.__KPTU_PAGE_INLINE_VIEWER_READY__',
            "import('./meeting-round-detail.js?v=9')",'await window.__KPTU_MEETING_ROUND_DETAIL_READY__',
            "import('./notification-center-ui.js?v=6')",'await window.__KPTU_NOTIFICATION_CENTER_READY__',
            "import('./calendar-plus.js?v=5')",'await window.__KPTU_CALENDAR_PLUS_READY__',
            "import('./calendar-persistence.js?v=10')",'await window.__KPTU_CALENDAR_PERSISTENCE_READY__',
            "import('./calendar-interactions-v2.js?v=3')",'await window.__KPTU_CALENDAR_INTERACTIONS_READY__',
            "import('./calendar-mobile-ui.js?v=3')",'await window.__KPTU_CALENDAR_MOBILE_UI_READY__',
            "import('./calendar-day-overflow.js?v=2')",'await window.__KPTU_CALENDAR_DAY_OVERFLOW_READY__',
            'window.__KPTU_MARK_APP_UI_READY__?.()'
          ]
          pos=[text.index(x) for x in keys]
          if pos!=sorted(pos): raise SystemExit('authenticated readiness ordering is invalid')
          login=Path('app/login/index.html').read_text(encoding='utf-8')
          if 'id="appView"' in login: raise SystemExit('dedicated login page must not contain workspace shell')
          PY

      - name: Check Design System 1.0 invariants
        run: |
          set -e
          for token in \
            --kptu-bg --kptu-surface --kptu-ink --kptu-muted --kptu-border \
            --kptu-primary --kptu-success --kptu-warning --kptu-danger --kptu-info \
            --kptu-space-1 --kptu-space-2 --kptu-space-3 --kptu-space-4 --kptu-space-5 --kptu-space-6 \
            --kptu-radius-sm --kptu-radius-md --kptu-radius-lg \
            --kptu-control-height --kptu-action-compact-height; do
            grep -q -- "$token" app/base-ui.css || { echo "missing design token: $token"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          managed={
            'team.css','team-member-overview.css','team-profile-view.css','team-member-management.css',
            'profile-settings.css','workplace-detail.css','suborganizations.css','suborganization-filters.css',
            'access-approval.css','notification-center-ui.css',
            'photo-room.css','public-workspace.css','topbar-actions.css','calendar-ui.css','task-layout.css',
            'google-tasks.css','project-system-v3.css','meeting-ui.css','page-core.css','page-builder.css',
            'page-editor-static.css'
          }
          # Exact feature exception: calendar event source marker uses an inset shadow, not card elevation.
          shadow_allow={('calendar-ui.css','inset 3px 0 rgba(255,255,255,.22)')}
          errors=[]
          for name in sorted(managed):
            path=Path('app')/name
            text=path.read_text(encoding='utf-8')
            for value in re.findall(r'border-radius\s*:\s*([^;}]+)',text):
              value=value.strip()
              if 'var(--kptu-radius-' not in value and value!='999px':
                errors.append(f'{name}: raw radius {value}')
            for value in re.findall(r'box-shadow\s*:\s*([^;}]+)',text):
              value=value.strip()
              if value=='none' or 'var(--kptu-shadow-' in value or (name,value) in shadow_allow:
                continue
              errors.append(f'{name}: raw shadow {value}')
          if errors:
            print('\n'.join(errors)); sys.exit(1)
          PY

      - name: Check calendar explicit-render invariants
        run: |
          set -e
          grep -q "window.KPTUCalendarPlus={paint:" app/calendar-plus.js
          grep -q "window.KPTUCalendarPersistence={paint:" app/calendar-persistence.js
          grep -q "window.KPTUCalendarDayOverflow={apply}" app/calendar-day-overflow.js
          grep -q "KPTUCalendarPlus?.paint?.()" app/team.js
          grep -q "KPTUCalendarPersistence?.paint?.()" app/team.js
          grep -q "KPTUCalendarDayOverflow?.apply?.()" app/team.js
          grep -q "calendar-ui.css?v=2" app/styles.css
          if grep -q "MutationObserver" app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar returned to DOM mutation correction'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar styles returned to runtime injection'; exit 1; fi
          if grep -Eq "setTimeout\([^,]+,(20|25|40|120|150|180|250|350|400)\)" app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js; then echo 'calendar returned to delayed render correction'; exit 1; fi
          if grep -q "dayEvents.slice" app/team.js; then echo 'team.js returned to painting event cards before calendar painters'; exit 1; fi

      - name: Check project single-render invariants
        run: |
          set -e
          grep -q 'id="newProjectBtn"' app/index.html
          grep -q "data-ps3-delete-project" app/project-system-v3.js
          grep -q "data-ps3-edit-project" app/project-system-v3.js
          grep -q "data-ps3-archive-project" app/project-system-v3.js
          grep -q "data-ps3-restore" app/project-system-v3.js
          grep -q "data-ps3-edit-milestone" app/project-system-v3.js
          grep -q "ps3MilestoneDelete" app/project-system-v3.js
          grep -q "data-ps3-library" app/project-system-v3.js
          grep -q "ps3-parent-link" app/project-system-v3.js
          grep -q "ps3-child-menu" app/project-system-v3.js
          grep -q "data-ps3-doc-filter" app/project-system-v3.js
          grep -q "app-icon.svg" app/project-system-v3.css
          if grep -Eq 'id="projectModal"|id="projectCreateModal"|projectModalTitle|projectUpdates|projectChecks|projectComments' app/index.html; then echo 'legacy project modal returned'; exit 1; fi
          if grep -Eq 'renderProjects|projectCard\(|openProject\(|saveProject\(|openProjectCreate|addProjectUpdate|addProjectCheck|addProjectComment|notifyMentions|app_project_updates|app_project_checkitems|currentProject|newSubprojectBtn|projectCheckAssignee|projectCreateModal' app/team.js; then echo 'legacy project renderer returned'; exit 1; fi
          if grep -q "ps3-child-section" app/project-system-v3.js; then echo 'large bottom child-project section returned'; exit 1; fi
          if grep -Eq "project-system-v2.js|project-hide-legacy.js|project-files.js|project-delete.js|project-modal-polish.js|project-modal-scroll-lock.js|project-access.js|project-update-actions.js|project-task-link.js|project-v2.js|project-operating-model.js|project-templates.js|project-deeplink.js|project-archive.js|project-suborganization-links.js" app/loader-v2.js; then echo 'legacy project overlay returned'; exit 1; fi
          if grep -q "MutationObserver" app/project-system-v3.js; then echo 'project V3 returned to mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/project-system-v3.js; then echo 'project V3 styles must remain static'; exit 1; fi

      - name: Check task single-render invariants
        run: |
          set -e
          grep -q "const r=\$('#taskList')" app/task-layout.js
          grep -q "r.innerHTML=group('mine'" app/task-layout.js
          grep -q "btn.onclick=saveTask" app/task-layout.js
          grep -q "window.__KPTU_TASK_LAYOUT_READY__" app/task-layout.js
          grep -q "taskList.insertAdjacentElement('afterend',sec)" app/google-tasks.js
          if grep -q "tlTaskSections\|original.style.display\|insertAdjacentElement('afterend'" app/task-layout.js; then echo 'task screen returned to sibling overlay'; exit 1; fi
          if grep -q "tlTaskSections\|MutationObserver\|createElement('style')\|createElement(\"style\")" app/google-tasks.js; then echo 'Google Tasks returned to post-render correction'; exit 1; fi
          if grep -q "MutationObserver" app/task-layout.js; then echo 'task layout returned to mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/task-layout.js; then echo 'task layout styles must remain static'; exit 1; fi

      - name: Check removed member and message UI
        run: |
          set -e
          if grep -Eq 'memberList|inviteModal|messagesView|workspaceRole' app/index.html; then echo 'removed UI returned to the shell'; exit 1; fi
          if grep -Eq 'profileView|myspaceView|userBadge|teamManageTop|ccMessageTop' app/index.html app/team.js; then echo 'removed personal view returned to the shell'; exit 1; fi
          if grep -Eq 'team-member-overview|team-member-management|team-profile-view|collaboration-center' app/loader-v2.js app/styles.css; then echo 'removed UI module was loaded'; exit 1; fi
          if test -e app/mobile-dock.js || test -e app/mobile-dock.css; then echo 'obsolete personal dock returned'; exit 1; fi
          grep -q 'app_workspace_members' app/team.js

      - name: Check notification ownership
        run: |
          set -e
          grep -q "window.__KPTU_NOTIFICATION_CENTER_READY__" app/notification-center-ui.js
          grep -q 'id="logoutBtn"' app/index.html
          grep -q "notification-center-ui.css?v=2" app/styles.css
          if grep -Eq "ps-profile-grid|ncuLogout|logoutBtn|installLogout" app/notification-center-ui.js; then echo 'notification center is touching profile UI'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/notification-center-ui.js; then echo 'notification styles returned to runtime injection'; exit 1; fi
          if grep -q "MutationObserver" app/notification-center-ui.js; then echo 'notification UI returned to mutation correction'; exit 1; fi
          if grep -q "setInterval" app/notification-center-ui.js; then echo 'notification polling returned'; exit 1; fi

      - name: Check page core and builder invariants
        run: |
          set -e
          grep -q "PB_TEMPLATES" app/page-builder.js
          grep -q "page_design" app/page-builder.js
          grep -q "addEventListener('click',interceptOpen,true)" app/page-save-controller.js
          grep -q "kptu:page-editor-opened" app/page-save-controller.js
          grep -q "addEventListener('kptu:page-editor-opened'" app/page-builder.js
          grep -q "__KPTU_PAGE_BUILDER_READY__" app/page-builder.js
          grep -q "/functions/v1/page-ai-draft" app/page-builder.js
          grep -q "/functions/v1/document-ai-index" app/page-builder.js
          grep -q "/functions/v1/library-files" app/page-builder.js
          grep -q "app_save_page_v2" app/page-save-controller.js
          grep -q "바로가기" app/page-shortcut.js
          for f in app/page-list-controller.js app/page-save-controller.js app/page-builder.js app/page-shortcut.js app/page-management.js app/page-inline-viewer-v2.js; do
            if grep -q "MutationObserver\|createElement('style')\|createElement(\"style\")\|location.reload\|setTimeout(" "$f"; then echo "$f returned to delayed page correction"; exit 1; fi
          done

      - name: Check security-sensitive client boundaries
        run: |
          set -e
          grep -q "KPTUCapabilities" app/page-save-controller.js
          grep -q "KPTURuntime" app/page-builder.js
          if grep -Eq "service_role|SUPABASE_SERVICE_ROLE|Authorization:.*service" app/*.js; then echo 'service-role material must never ship to client'; exit 1; fi
          if grep -Eq "localStorage|kptu_collab_session_v1" app/page-save-controller.js app/page-builder.js app/notification-center-ui.js app/photo-room.js; then echo 'feature module bypassed shared runtime session'; exit 1; fi

      - name: Check retained non-project feature invariants
        run: |
          set -e
          grep -q "task-workflow.js?v=6" app/loader-v2.js
          grep -q "page-builder.js?v=3" app/loader-v2.js
          grep -q "workflow-ai-v3.js?v=6" app/loader-v2.js
          if grep -q 'mobile-dock.js' app/loader-v2.js; then echo 'obsolete personal dock returned'; exit 1; fi
          grep -q "notification-center-ui.js?v=6" app/loader-v2.js
          grep -q "PB_TEMPLATES" app/page-builder.js
          grep -q "page_design" app/page-builder.js
          grep -q "완료된 할 일" app/task-layout.js
          grep -q "바로가기" app/page-shortcut.js
          if grep -q "task-title-ui.js\|project-create-submit.js\|task-personal-due.js" app/loader-v2.js; then echo 'duplicate legacy shim loaded'; exit 1; fi

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8123 >/tmp/kptu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          for path in \
            app/ app/login/ app/app.js app/loader-v2.js app/auth-service.js app/capabilities.js app/public-workspace.js \
            app/page-builder.js app/page-builder.css app/page-list-controller.js app/page-save-controller.js app/page-shortcut.js app/page-management.js app/page-inline-viewer-v2.js app/page-core.css app/compact-list.css \
            app/topbar-actions.js app/topbar-actions.css app/profile-settings.js app/profile-settings.css app/notification-center-ui.js app/notification-center-ui.css \
            app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/project-system-v3.js app/project-system-v3.css app/workflow-ai-v3.js app/photo-room.js \
            app/task-workflow.js app/meeting-round-detail.js app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js \
            app/styles.css app/access-approval.css app/meeting-ui.css app/calendar-ui.css app/photo-room.css p/; do
            curl --fail --silent "http://127.0.0.1:8123/$path" >/dev/null
          done
