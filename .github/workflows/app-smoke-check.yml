name: App smoke check

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app-smoke-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check recursive app dependency graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('app')
          queue=['app.js']
          active=set()
          missing=[]
          patterns=[
              r"import\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]\)",
              r"(?:from|import)\s*['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]",
              r"serviceWorker\.register\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]"
          ]
          while queue:
              name=queue.pop(0)
              if name in active: continue
              path=root/name
              if not path.exists():
                  missing.append(name);continue
              active.add(name)
              text=path.read_text(encoding='utf-8')
              refs=[]
              for pat in patterns: refs.extend(re.findall(pat,text))
              for ref in refs:
                  rel=ref.split('?',1)[0]
                  if rel.startswith('./'):
                      child=Path(rel[2:]).name
                      if not (root/child).exists(): missing.append(f'{name} -> {ref}')
                      elif child not in active: queue.append(child)
          if missing:
              print('Missing recursive dependencies:')
              print('\n'.join(missing));sys.exit(1)
          print('Active JS modules:',len(active))
          print('\n'.join(sorted(active)))
          candidates=[p.name for p in sorted(root.glob('*.js')) if p.name not in active]
          print('\nInactive/legacy candidates (informational only):')
          print('\n'.join(candidates) if candidates else '(none)')
          PY

      - name: Check stabilized app shell
        run: |
          set -e
          test -f app/index.html
          test -f app/app.js
          test -f app/loader-v2.js
          test -f app/app-router.js
          test -f app/runtime-client.js
          test -f app/styles.css
          test -d app/legacy
          test -f app/legacy/README.md
          grep -q 'id="appView"' app/index.html
          grep -q 'id="authView"' app/index.html
          grep -q 'app.js?v=12' app/index.html
          grep -q "loader-v2.js?v=90" app/app.js
          grep -q "auth-ui.js?v=7" app/app.js
          grep -q "runtime-client.js?v=1" app/loader-v2.js
          grep -q "app-router.js?v=1" app/loader-v2.js
          grep -q "workspace-ui.css?v=5" app/loader-v2.js
          grep -q "auth-ui.js?v=7" app/loader-v2.js
          grep -q "team.js?v=8" app/loader-v2.js
          grep -q "authPreloadStyle" app/loader-v2.js
          grep -q "library-upload.js?v=3" app/loader-v2.js
          grep -q "collaboration-center.js?v=4" app/loader-v2.js
          grep -q "notification-center-ui.js?v=5" app/loader-v2.js
          grep -q "project-access.js?v=4" app/loader-v2.js
          grep -q "calendar-persistence.js?v=8" app/loader-v2.js
          grep -q "task-workflow.js?v=3" app/loader-v2.js
          grep -q "meeting-round-detail.js?v=5" app/loader-v2.js
          grep -q "KPTURouter?.on" app/team.js
          grep -q "KPTURuntime.session.ensure" app/team.js
          grep -q "KPTURuntime.session.ensure" app/library-upload.js
          grep -q "KPTURuntime.session.ensure" app/collaboration-center.js
          grep -q "rt.session.ensure" app/notification-center-ui.js
          grep -q "KPTURuntime" app/calendar-persistence.js
          grep -q "KPTURuntime" app/task-workflow.js
          grep -q "KPTURuntime" app/project-access.js
          grep -q "KPTURuntime" app/meeting-round-detail.js
          grep -q "KPTURouter?.on)window.KPTURouter.on('notifications'" app/notification-center-ui.js
          if grep -q "MutationObserver" app/notification-center-ui.js; then echo 'notification center global observer returned'; exit 1; fi
          if grep -q "setInterval" app/notification-center-ui.js; then echo 'notification center polling returned'; exit 1; fi
          if grep -q "addEventListener('click',intercept,true)" app/notification-center-ui.js; then echo 'notification capture interceptor returned'; exit 1; fi
          if grep -q "refresh_token" app/task-workflow.js app/meeting-round-detail.js; then echo 'feature refresh logic returned'; exit 1; fi
          if grep -q "kptu_collab_session_v1" app/calendar-persistence.js app/task-workflow.js app/project-access.js app/meeting-round-detail.js; then echo 'feature-local session storage returned'; exit 1; fi
          if grep -q "authPreloadStyle.*remove" app/auth-ui.js; then echo 'auth UI can unlock before login handlers bind'; exit 1; fi
          if grep -q "brand-home-nav.js" app/loader-v2.js; then echo 'legacy brand router loaded'; exit 1; fi
          if grep -q "auth-cleanup.js" app/loader-v2.js; then echo 'redundant auth cleanup loaded'; exit 1; fi
          if grep -q "mobile-dock-tune.js" app/loader-v2.js; then echo 'mobile dock JS override loaded'; exit 1; fi
          if grep -Fq "$$('.nav-btn').forEach(b=>b.onclick" app/team.js; then echo 'team owns nav click handlers again'; exit 1; fi
          if grep -q "b.onclick=()=>ccSwitch('messages')" app/collaboration-center.js; then echo 'collaboration owns message nav click again'; exit 1; fi
          if grep -q "프로젝트 초대와 할 일 배정을 여기서 수락·거절합니다" app/collaboration-center.js; then echo 'legacy notification popup copy returned'; exit 1; fi
          if grep -q "p.id='ccProfileTop'" app/collaboration-center.js; then echo 'legacy top profile button returned'; exit 1; fi
          for f in calendar-app-edit-ui.js calendar-create-live-title.js calendar-date-create.js calendar-edit-actions.js calendar-event-edit.js calendar-google-fast-edit.js calendar-observer-stability.js editable-page.js google-color-palette.js home-task-actions.js meeting-detail-patches.js page-preview-tools.js project-child-header.js project-hierarchy-ui.js startup-speed.js; do
            if test -e "app/$f"; then echo "inactive module returned to app root: $f"; exit 1; fi
            test -f "app/legacy/$f"
          done

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8123 >/tmp/kptu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8123/app/ >/tmp/app-index.html
          curl --fail --silent http://127.0.0.1:8123/app/app.js >/tmp/app.js
          curl --fail --silent http://127.0.0.1:8123/app/loader-v2.js >/tmp/loader.js
          curl --fail --silent http://127.0.0.1:8123/app/app-router.js >/tmp/router.js
          curl --fail --silent http://127.0.0.1:8123/app/runtime-client.js >/tmp/runtime.js
          test -s /tmp/app-index.html
          test -s /tmp/app.js
          test -s /tmp/loader.js
          test -s /tmp/router.js
          test -s /tmp/runtime.js
