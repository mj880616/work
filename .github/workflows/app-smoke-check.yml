# 같은 PR에 다시 push하면 옛 시험 실행을 취소한다(PR 밖 이벤트는 취소하지 않음).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check merge gate judgments for CC (OPS-넣기점검)
        run: node --test tests/cc-merge-check.test.mjs

      - name: Check public privacy page matches requested Google scopes (MULTI D4)
        run: node --test tests/about-privacy-page.test.mjs

      - name: Check public contact mail is the service mail and no personal mail is in the repository (ABOUT-문의메일안내문고침)
        run: node --test tests/about-contact-mail.test.mjs

      - name: Check Play store listing text, images, and account deletion page (STORE-플레이등록자료)
        run: node --test tests/store-workonplus.test.mjs

      - name: Check same-name same-size file notice (UX-이미있는파일알림)
        run: node --test tests/same-file.test.mjs

      - name: Check sticky bars are not white bands on the page background (UI-위쪽줄흰띠·여백)
        run: node --test tests/sticky-bar-background.test.mjs

      - name: Check shared auto-grow field (UI-줄입력늘어나기)
        run: node --test tests/auto-grow.test.mjs

      - name: Check attachment file rename rules (ATT-이름고치기)
