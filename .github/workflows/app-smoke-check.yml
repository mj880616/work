name: App smoke check

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'p/**'
      - '.github/workflows/app-smoke-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'p/**'
      - '.github/workflows/app-smoke-check.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check recursive app dependency graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('app')
          queue=['app.js']
          active=set();missing=[]
          patterns=[r"import\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]\)",r"(?:from|import)\s*['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]",r"serviceWorker\.register\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]"]
          while queue:
              name=queue.pop(0)
              if name in active: continue
              path=root/name
              if not path.exists(): missing.append(name);continue
              active.add(name);text=path.read_text(encoding='utf-8');refs=[]
              for pat in patterns: refs.extend(re.findall(pat,text))
              for ref in refs:
                  rel=ref.split('?',1)[0]
                  if rel.startswith('./'):
                      child=Path(rel[2:]).name
                      if not (root/child).exists(): missing.append(f'{name} -> {ref}')
                      elif child not in active: queue.append(child)
          if missing:
              print('Missing recursive dependencies:');print('\n'.join(missing));sys.exit(1)
          print('Active JS modules:',len(active));print('\n'.join(sorted(active)))
          PY

      - name: Check public and authenticated app boundaries
        run: |
          set -e
          for f in \
            app/index.html app/app.js app/loader-v2.js app/app-router.js app/runtime-client.js \
            app/auth-service.js app/capabilities.js app/public-workspace.js app/login/index.html app/login/login.js \
            app/team.js app/topbar-actions.js app/topbar-actions.css \
            app/team-member-overview.js app/team-member-overview.css app/team-profile-view.js app/team-profile-view.css app/team-member-management.js app/team-member-management.css \
            app/profile-settings.js app/profile-settings.css app/collaboration-center.js app/collaboration-center.css app/notification-center-ui.js app/notification-center-ui.css \
            app/task-workflow.js app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/meeting-round-detail.js app/page-builder.js \
            app/project-system-v3.js app/project-system-v3.css \
            app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js app/calendar-ui.css \
            app/workflow-ai-v3.js app/meeting-ai-ingest-client.js app/workplace-ai-report.js app/photo-room.js \
            app/access-approval.css app/home-task.css app/meeting-ui.css app/photo-room.css p/index.html; do
            test -f "$f"
          done
          test -d app/legacy
          test -f app/legacy/README.md
          test ! -f app/meeting-assignee-picker.js
          test ! -f app/meeting-file-route.js
          test ! -f app/calendar-defaults.js

          grep -q 'id="appView"' app/index.html
          grep -q 'id="authView"' app/index.html
          grep -Eq '<script src="\./app\.js\?v=[0-9]+" defer></script>' app/index.html
          grep -q "loader-v2.js" app/app.js
          grep -q "runtime-client.js" app/loader-v2.js
          grep -q "auth-service.js" app/loader-v2.js
          grep -q "capabilities.js" app/loader-v2.js
          grep -q "KPTURuntime.session.ensure" app/loader-v2.js
          grep -q "public-workspace.js" app/loader-v2.js
          grep -q "topbar-actions.js?v=1" app/loader-v2.js
          grep -q "team.js?v=16" app/loader-v2.js
          grep -q "project-system-v3.js?v=1" app/loader-v2.js
          grep -q "task-workflow.js?v=6" app/loader-v2.js
          grep -q "__KPTU_TASK_WORKFLOW_READY__" app/loader-v2.js
          grep -q "task-layout.js?v=6" app/loader-v2.js
          grep -q "google-tasks.js?v=3" app/loader-v2.js
          grep -q "__KPTU_TASK_LAYOUT_READY__" app/loader-v2.js
          grep -q "profile-settings.js?v=4" app/loader-v2.js
          grep -q "__KPTU_PROFILE_SETTINGS_READY__" app/loader-v2.js
          grep -q "home-task-controls.js?v=3" app/loader-v2.js
          grep -q "photo-room.js?v=2" app/loader-v2.js
          grep -q "meeting-round-detail.js?v=6" app/loader-v2.js
          grep -q "__KPTU_MEETING_ROUND_DETAIL_READY__" app/loader-v2.js
          grep -q "collaboration-center.js?v=6" app/loader-v2.js
          grep -q "__KPTU_COLLABORATION_READY__" app/loader-v2.js
          grep -q "notification-center-ui.js?v=6" app/loader-v2.js
          grep -q "__KPTU_NOTIFICATION_CENTER_READY__" app/loader-v2.js
          grep -q "calendar-plus.js?v=5" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_PLUS_READY__" app/loader-v2.js
          grep -q "calendar-persistence.js?v=9" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_PERSISTENCE_READY__" app/loader-v2.js
          grep -q "calendar-interactions-v2.js?v=3" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_INTERACTIONS_READY__" app/loader-v2.js
          grep -q "calendar-mobile-ui.js?v=3" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_MOBILE_UI_READY__" app/loader-v2.js
          grep -q "calendar-day-overflow.js?v=2" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_DAY_OVERFLOW_READY__" app/loader-v2.js
          grep -q "topbar-actions.css?v=1" app/styles.css
          grep -q "profile-settings.css?v=1" app/styles.css
          grep -q "collaboration-center.css?v=1" app/styles.css
          grep -q "notification-center-ui.css?v=1" app/styles.css
          grep -q "task-layout.css?v=1" app/styles.css
          grep -q "google-tasks.css?v=1" app/styles.css
          grep -q "meeting-ui.css?v=2" app/styles.css
          grep -q "calendar-ui.css?v=1" app/styles.css
          grep -q "project-system-v3.css?v=1" app/styles.css
          grep -q "#authView{display:none!important}" app/base-ui.css
          grep -q "#appView:not(.kptu-ui-ready)" app/base-ui.css
          grep -q ".top-actions #logoutBtn" app/topbar-actions.css
          grep -q "button.id='ccNotifTop'" app/topbar-actions.js
          grep -q "function taskProjectOptions" app/team.js
          grep -q "x.status!=='archived'&&x.parent_id" app/team.js
          grep -q "taskProjectOptions(true)" app/team.js
          grep -q "data-mrd-meeting" app/team.js
          grep -q "/functions/v1/meeting-files" app/team.js

          grep -q "app_public_projects_snapshot" app/public-workspace.js
          grep -q "filter(t=>!!t.project_id)" app/public-workspace.js
          grep -q "auth-service.js" app/login/index.html
          grep -q "KPTUAuth" app/login/login.js
          grep -q "KPTUCapabilities" app/capabilities.js

          if grep -q "auth-ui.js" app/loader-v2.js app/app.js; then
            echo 'legacy in-app authentication UI returned to the root app'; exit 1
          fi
          if grep -q "team.js" app/app.js; then
            echo 'authenticated workspace modules bypass the session boundary'; exit 1
          fi
          if grep -q "task-child-project-guard.js\|task-status-state.js" app/loader-v2.js; then
            echo 'task screen returned to a post-render correction module'; exit 1
          fi
          if grep -q "meeting-assignee-picker.js\|meeting-file-route.js" app/loader-v2.js; then
            echo 'meeting screen returned to a post-render correction or fetch interception module'; exit 1
          fi
          if grep -q "calendar-defaults.js" app/loader-v2.js; then
            echo 'calendar returned to delayed default-value shim'; exit 1
          fi
          if grep -q "MutationObserver" app/loader-v2.js app/topbar-actions.js app/task-workflow.js app/meeting-round-detail.js; then
            echo 'loader/topbar/meeting UI must use explicit readiness contracts'; exit 1
          fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/topbar-actions.js app/task-workflow.js app/meeting-round-detail.js; then
            echo 'topbar and meeting styles must remain in static CSS'; exit 1
          fi
          if grep -q "createElement('link')" app/team.js; then
            echo 'team css must stay in the static stylesheet graph'; exit 1
          fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/access-approval.js app/home-task-controls.js app/home-dashboard-v2.js app/photo-room.js app/collaboration-center.js app/notification-center-ui.js; then
            echo 'core UI module returned to late dynamic style injection'; exit 1
          fi
          if grep -q "localStorage\|SESSION_KEY\|kptu_collab_session_v1" app/photo-room.js app/collaboration-center.js app/notification-center-ui.js; then
            echo 'core UI module bypassed shared runtime session handling'; exit 1
          fi
          if grep -q "location.reload" app/photo-room.js; then
            echo 'photo upload returned to full-page reload'; exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          text=Path('app/loader-v2.js').read_text(encoding='utf-8')
          auth=text.index('const authenticated=await window.KPTURuntime.session.ensure()')
          guest=text.index("import('./public-workspace.js",auth)
          topbar=text.index("import('./topbar-actions.js",auth)
          team=text.index("import('./team.js?v=16')",auth)
          member=text.index("import('./team-member-overview.js?v=2')",team)
          member_ready=text.index('await window.__KPTU_TEAM_MEMBER_OVERVIEW_READY__',member)
          task_workflow=text.index("import('./task-workflow.js?v=6')",member_ready)
          task_workflow_ready=text.index('await window.__KPTU_TASK_WORKFLOW_READY__',task_workflow)
          task=text.index("import('./task-layout.js?v=6')",task_workflow_ready)
          task_ready=text.index('await window.__KPTU_TASK_LAYOUT_READY__',task)
          profile=text.index("import('./profile-settings.js?v=4')",task_ready)
          profile_ready=text.index('await window.__KPTU_PROFILE_SETTINGS_READY__',profile)
          meeting=text.index("import('./meeting-round-detail.js?v=6')",profile_ready)
          meeting_ready=text.index('await window.__KPTU_MEETING_ROUND_DETAIL_READY__',meeting)
          collab=text.index("import('./collaboration-center.js?v=6')",meeting_ready)
          collab_ready=text.index('await window.__KPTU_COLLABORATION_READY__',collab)
          notif=text.index("import('./notification-center-ui.js?v=6')",collab_ready)
          notif_ready=text.index('await window.__KPTU_NOTIFICATION_CENTER_READY__',notif)
          cal_plus=text.index("import('./calendar-plus.js?v=5')",notif_ready)
          cal_plus_ready=text.index('await window.__KPTU_CALENDAR_PLUS_READY__',cal_plus)
          cal_persist=text.index("import('./calendar-persistence.js?v=9')",cal_plus_ready)
          cal_persist_ready=text.index('await window.__KPTU_CALENDAR_PERSISTENCE_READY__',cal_persist)
          cal_interact=text.index("import('./calendar-interactions-v2.js?v=3')",cal_persist_ready)
          cal_interact_ready=text.index('await window.__KPTU_CALENDAR_INTERACTIONS_READY__',cal_interact)
          cal_mobile=text.index("import('./calendar-mobile-ui.js?v=3')",cal_interact_ready)
          cal_mobile_ready=text.index('await window.__KPTU_CALENDAR_MOBILE_UI_READY__',cal_mobile)
          cal_overflow=text.index("import('./calendar-day-overflow.js?v=2')",cal_mobile_ready)
          cal_overflow_ready=text.index('await window.__KPTU_CALENDAR_DAY_OVERFLOW_READY__',cal_overflow)
          app_ready=text.index('window.__KPTU_MARK_APP_UI_READY__?.()',cal_overflow_ready)
          if not auth < guest < topbar < team < member < member_ready < task_workflow < task_workflow_ready < task < task_ready < profile < profile_ready < meeting < meeting_ready < collab < collab_ready < notif < notif_ready < cal_plus < cal_plus_ready < cal_persist < cal_persist_ready < cal_interact < cal_interact_ready < cal_mobile < cal_mobile_ready < cal_overflow < cal_overflow_ready < app_ready:
              raise SystemExit('authenticated readiness ordering is invalid')
          login=Path('app/login/index.html').read_text(encoding='utf-8')
          if 'id="appView"' in login:
              raise SystemExit('dedicated login page must not contain workspace shell')
          PY

      - name: Check calendar explicit-render invariants
        run: |
          set -e
          grep -q "window.KPTUCalendarPlus={paint:" app/calendar-plus.js
          grep -q "window.KPTUCalendarPersistence={paint:" app/calendar-persistence.js
          grep -q "window.KPTUCalendarDayOverflow={apply}" app/calendar-day-overflow.js
          grep -q "KPTUCalendarPlus?.paint?.()" app/team.js
          grep -q "KPTUCalendarPersistence?.paint?.()" app/team.js
          grep -q "KPTUCalendarDayOverflow?.apply?.()" app/team.js
          grep -q "calendar-ui.css?v=1" app/styles.css
          if grep -q "MutationObserver" app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar returned to DOM mutation correction'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar styles returned to runtime injection'; exit 1; fi
          if grep -Eq "setTimeout\([^,]+,(20|25|40|120|150|180|250|350|400)\)" app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js; then echo 'calendar returned to delayed render correction'; exit 1; fi
          if grep -q "dayEvents.slice" app/team.js; then echo 'team.js returned to painting event cards before calendar painters'; exit 1; fi

      - name: Check project single-render invariants
        run: |
          set -e
          grep -q 'id="newProjectBtn"' app/index.html
          grep -q "data-ps3-delete-project" app/project-system-v3.js
          grep -q "data-ps3-edit-project" app/project-system-v3.js
          grep -q "data-ps3-archive-project" app/project-system-v3.js
          grep -q "data-ps3-restore" app/project-system-v3.js
          grep -q "data-ps3-edit-milestone" app/project-system-v3.js
          grep -q "ps3MilestoneDelete" app/project-system-v3.js
          grep -q "data-ps3-library" app/project-system-v3.js
          grep -q "ps3-parent-link" app/project-system-v3.js
          grep -q "ps3-child-menu" app/project-system-v3.js
          grep -q "data-ps3-doc-filter" app/project-system-v3.js
          grep -q "app-icon.svg" app/project-system-v3.css
          if grep -Eq 'id="projectModal"|id="projectCreateModal"|projectModalTitle|projectUpdates|projectChecks|projectComments' app/index.html; then echo 'legacy project modal markup returned to index'; exit 1; fi
          if grep -Eq 'renderProjects|projectCard\(|openProject\(|saveProject\(|openProjectCreate|addProjectUpdate|addProjectCheck|addProjectComment|notifyMentions|app_project_updates|app_project_checkitems|currentProject|newSubprojectBtn|projectCheckAssignee|projectCreateModal' app/team.js; then echo 'legacy project renderer returned to team.js'; exit 1; fi
          if grep -q "ps3-child-section" app/project-system-v3.js; then echo 'large bottom child-project section returned'; exit 1; fi
          if grep -Eq "project-system-v2.js|project-hide-legacy.js|project-files.js|project-delete.js|project-modal-polish.js|project-modal-scroll-lock.js|project-access.js|project-update-actions.js|project-task-link.js|project-v2.js|project-operating-model.js|project-templates.js|project-deeplink.js|project-archive.js|project-suborganization-links.js" app/loader-v2.js; then echo 'legacy project overlay module returned to active loader'; exit 1; fi
          if grep -q "MutationObserver" app/project-system-v3.js; then echo 'project V3 must not rely on DOM mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/project-system-v3.js; then echo 'project V3 styles must remain in static CSS'; exit 1; fi

      - name: Check task single-render invariants
        run: |
          set -e
          grep -q "const r=\$('#taskList')" app/task-layout.js
          grep -q "r.innerHTML=group('mine'" app/task-layout.js
          grep -q "btn.onclick=saveTask" app/task-layout.js
          grep -q "window.__KPTU_TASK_LAYOUT_READY__" app/task-layout.js
          grep -q "taskList.insertAdjacentElement('afterend',sec)" app/google-tasks.js
          if grep -q "tlTaskSections\|original.style.display\|insertAdjacentElement('afterend'" app/task-layout.js; then echo 'task screen returned to a sibling overlay renderer'; exit 1; fi
          if grep -q "tlTaskSections\|MutationObserver\|createElement('style')\|createElement(\"style\")" app/google-tasks.js; then echo 'Google Tasks returned to a post-render task correction pattern'; exit 1; fi
          if grep -q "MutationObserver" app/task-layout.js; then echo 'task layout returned to DOM mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/task-layout.js; then echo 'task layout styles must remain in static CSS'; exit 1; fi
          test ! -f app/task-status-state.js

      - name: Check team member single-render invariants
        run: |
          set -e
          test ! -f app/team-member-overview-bootstrap.js
          grep -q "team-member-overview.js?v=2" app/loader-v2.js
          grep -q "__KPTU_TEAM_MEMBER_OVERVIEW_READY__" app/loader-v2.js
          grep -q "team-member-management.js?v=2" app/loader-v2.js
          grep -q "__KPTU_TEAM_MEMBER_MANAGEMENT_READY__" app/loader-v2.js
          grep -q "team-profile-view.js?v=2" app/loader-v2.js
          grep -q "__KPTU_TEAM_PROFILE_READY__" app/loader-v2.js
          grep -q "team-member-overview.css?v=1" app/styles.css
          grep -q "team-profile-view.css?v=1" app/styles.css
          grep -q "team-member-management.css?v=1" app/styles.css
          grep -q "window.__KPTU_RELOAD_TEAM_MEMBERS__" app/team-member-overview.js
          grep -q "KPTUTeamMemberManagement" app/team-profile-view.js
          if grep -q "memberList" app/team.js; then echo 'team.js returned to owning memberList'; exit 1; fi
          if grep -q "MutationObserver\|setInterval" app/team-member-overview.js app/team-profile-view.js app/team-member-management.js; then echo 'team member UI returned to polling or DOM mutation correction'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/team-member-overview.js app/team-profile-view.js app/team-member-management.js; then echo 'team member styles returned to dynamic injection'; exit 1; fi
          if grep -Eq "localStorage|TPV_SESSION|kptu_collab_session_v1" app/team-member-overview.js app/team-profile-view.js app/team-member-management.js; then echo 'team member modules bypassed shared runtime session'; exit 1; fi
          if grep -q "tpvBody.*prepend\|insertAdjacentElement.*tpvBody" app/team-member-management.js; then echo 'member management returned to post-render body injection'; exit 1; fi

      - name: Check collaboration ownership invariants
        run: |
          set -e
          grep -q "window.__KPTU_COLLABORATION_READY__" app/collaboration-center.js
          grep -q "window.__KPTU_NOTIFICATION_CENTER_READY__" app/notification-center-ui.js
          grep -q "id=\"psLogout\"" app/profile-settings.js
          grep -q "collaboration-center.css?v=1" app/styles.css
          grep -q "notification-center-ui.css?v=1" app/styles.css
          if grep -Eq "app_notifications|ccNotifTop|myTaskMini|statUnread" app/collaboration-center.js; then echo 'collaboration center is touching notification or home-task UI'; exit 1; fi
          if grep -Eq "ps-profile-grid|ncuLogout|logoutBtn|installLogout" app/notification-center-ui.js; then echo 'notification center is touching profile account UI'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/collaboration-center.js app/notification-center-ui.js; then echo 'collaboration styles returned to runtime injection'; exit 1; fi
          if grep -q "MutationObserver" app/collaboration-center.js app/notification-center-ui.js; then echo 'collaboration UI returned to DOM mutation correction'; exit 1; fi
          if grep -q "setInterval" app/notification-center-ui.js; then echo 'notification center polling returned'; exit 1; fi

      - name: Check retained non-project feature invariants
        run: |
          set -e
          grep -q "task-workflow.js?v=6" app/loader-v2.js
          grep -q "page-builder.js?v=1" app/loader-v2.js
          grep -q "workflow-ai-v3.js?v=2" app/loader-v2.js
          grep -q "meeting-ai-ingest-client.js?v=1" app/loader-v2.js
          grep -q "collaboration-center.js?v=6" app/loader-v2.js
          grep -q "notification-center-ui.js?v=6" app/loader-v2.js
          grep -q "PB_TEMPLATES" app/page-builder.js
          grep -q "page_design" app/page-builder.js
          grep -q "완료된 할 일" app/task-layout.js
          grep -q "바로가기" app/page-shortcut.js
          if grep -q "task-title-ui.js\|project-create-submit.js\|task-personal-due.js" app/loader-v2.js; then echo 'duplicate legacy shim loaded'; exit 1; fi

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8123 >/tmp/kptu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          for path in \
            app/ app/login/ app/app.js app/loader-v2.js app/auth-service.js app/capabilities.js app/public-workspace.js app/page-builder.js \
            app/topbar-actions.js app/topbar-actions.css app/profile-settings.js app/profile-settings.css app/collaboration-center.js app/collaboration-center.css app/notification-center-ui.js app/notification-center-ui.css \
            app/team-member-overview.js app/team-member-overview.css app/team-profile-view.js app/team-profile-view.css app/team-member-management.js app/team-member-management.css \
            app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/project-system-v3.js app/project-system-v3.css app/workflow-ai-v3.js app/photo-room.js \
            app/task-workflow.js app/meeting-round-detail.js app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js \
            app/styles.css app/access-approval.css app/home-task.css app/meeting-ui.css app/calendar-ui.css app/photo-room.css p/; do
            curl --fail --silent "http://127.0.0.1:8123/$path" >/dev/null
          done
