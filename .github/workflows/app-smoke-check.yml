          if grep -q "grid.querySelectorAll('.cal-event.google')" app/calendar-persistence.js; then echo 'Google persistence returned to direct DOM painting'; exit 1; fi
          if grep -q "MutationObserver" app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar returned to DOM mutation correction'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar styles returned to runtime injection'; exit 1; fi
          if grep -Eq "setTimeout\([^,]+,(20|25|40|120|150|180|250|350|400)\)" app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js; then echo 'calendar returned to delayed render correction'; exit 1; fi

      - name: Check project single-render invariants
        run: |
          set -e
          grep -q 'id="newProjectBtn"' app/index.html
          grep -q "data-ps3-delete-project" app/project-system-v3.js
          grep -q 'owner_id=eq.${encodeURIComponent(userId)}' app/project-catalog.js
          grep -q 'catalog.fetchSpaces(wid,user.id)' app/project-system-v3.js
          grep -q "data-ps3-records" app/project-system-v3.js
          # MTG-프로젝트합치기 3단계: 상세 맨 위 진행 기록 입력칸은 없다(기록은 사업 보고 한 곳, 표·데이터 보존).
          if grep -Eq 'data-ps3-record-input|saveRecordInput|openRecordBig' app/project-system-v3.js; then echo 'project record input returned'; exit 1; fi
          grep -q "data-ps3-basket-note" app/project-system-v3.js
          grep -q ".ps3-rec-line" app/project-system-v3.css
          if grep -Eq "data-ps3-add-ws|data-ps3-progress-item|data-ps3-quick-progress|ps3ProgressModal" app/project-system-v3.js; then echo 'retired per-item progress UI returned'; exit 1; fi
          # UI-연결요약수정: the shared link summary editor may be mounted only lazily from the record ⋯ [요약 수정] action (no always-on project basket editor).
          grep -q "ps3RecordAction==='summary')editBasketSummary(b)" app/project-system-v3.js
          test "$(grep -o 'mountLinkSummaryEditor(' app/project-system-v3.js | wc -l)" -eq 1
          grep -q "if(!basketEditor){basketEditorKey=key;basketEditor=mountLinkSummaryEditor(body," app/project-system-v3.js
          if grep -Eq "ps3CreateType|ps3CreateVisibility|ps3AccessModal|ps3TypeModal|data-ps3-access|ps3ManageTypes" app/project-system-v3.js; then echo 'removed project type/access UI returned'; exit 1; fi
          if grep -q "bindPublication();" app/project-system-v3.js; then echo 'project publication execution path returned'; exit 1; fi
          grep -q "projects','\\[\\]'::jsonb" supabase/migrations/20260923074619_web2_project_owner_only.sql
          grep -q "using (owner_id = (select auth.uid()))" supabase/migrations/20260923074619_web2_project_owner_only.sql
          grep -q "data-ps3-edit-project" app/project-system-v3.js
          grep -q "data-ps3-archive-project" app/project-system-v3.js
          grep -q "data-ps3-restore" app/project-system-v3.js
          grep -q "data-ps3-edit-milestone" app/project-system-v3.js
          grep -q "ps3MilestoneDelete" app/project-system-v3.js
          grep -q "ps3MilestoneGoogle" app/project-system-v3.js
          grep -q "createGoogleMilestone" app/project-system-v3.js
          grep -q "updateGoogleMilestone" app/project-system-v3.js
          grep -q "deleteGoogleMilestone" app/project-system-v3.js
          grep -Fq "google_calendar_id:a.address.calendarId" app/project-system-v3.js
          grep -Fq "google_event_id:a.address.eventId" app/project-system-v3.js
          grep -q "app_project_milestones_google_linkage_pair_chk" supabase/migrations/20260925032810_add_project_milestone_google_linkage.sql
          if grep -q "Web2에만 저장" app/project-system-v3.js; then echo 'project milestone Web2-only fallback returned'; exit 1; fi
          if grep -Eq 'ps3MilestoneType|ps3MilestoneStatusValue|ps3MilestoneWs' app/project-system-v3.js; then echo 'retired project milestone inputs returned'; exit 1; fi
          grep -q "data-ps3-library" app/project-system-v3.js
          grep -q "ps3-parent-link" app/project-system-v3.js
          grep -q 'id="ps3-children"' app/project-system-v3.js
          if grep -q "data-ps3-kids-toggle" app/project-system-v3.js; then echo 'project child toggle returned'; exit 1; fi
          grep -q 'data-ps3-total' app/project-system-v3.js
          grep -q 'ps3-prow-kids' app/project-system-v3.js
          grep -q 'milestones.limit' app/project-system-v3.js
          grep -q 'kptu-list-row' app/project-system-v3.js
          grep -q 'kptu-list-row' app/suborganizations.js
          grep -q ".ps3-plist" app/project-system-v3.css
          if grep -Eq "ps3-project-card|ps3-kind|ps3-archive-row" app/project-system-v3.js app/project-system-v3.css; then echo 'project list card layout returned'; exit 1; fi
          grep -q "ps3-more" app/project-system-v3.js
          grep -Fq "d.docs.filter(x=>!off.has(categoryOf(x.category))).slice(0,5)" app/project-system-v3.js
          if grep -Eq "data-ps3-nav|data-ps3-doc-filter|ps3DocSearch" app/project-system-v3.js; then echo 'removed project chip row or document filter returned'; exit 1; fi
          grep -q "app-icon.svg" app/project-system-v3.css
          if grep -Eq 'id="projectModal"|id="projectCreateModal"|projectModalTitle|projectUpdates|projectChecks|projectComments' app/index.html; then echo 'legacy project modal returned'; exit 1; fi
          if grep -Eq 'renderProjects|projectCard\(|openProject\(|saveProject\(|openProjectCreate|addProjectUpdate|addProjectCheck|addProjectComment|notifyMentions|app_project_updates|app_project_checkitems|currentProject|newSubprojectBtn|projectCheckAssignee|projectCreateModal' app/team.js; then echo 'legacy project renderer returned'; exit 1; fi
          if grep -q "ps3-child-section" app/project-system-v3.js; then echo 'large bottom child-project section returned'; exit 1; fi
          if grep -Eq "project-system-v2.js|project-access.js|project-update-actions.js|project-task-link.js|project-v2.js|project-templates.js|project-suborganization-links.js" app/loader-v2.js app/view-loader.js; then echo 'legacy project overlay returned'; exit 1; fi
          if grep -q "MutationObserver" app/project-system-v3.js; then echo 'project V3 returned to mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/project-system-v3.js; then echo 'project V3 styles must remain static'; exit 1; fi

      - name: Check task single-render invariants
        run: |
          set -e
          grep -q "const r=\$('#taskList')" app/task-layout.js
          grep -q "r.innerHTML=group('mine'" app/task-layout.js
          grep -q "btn.onclick=saveTask" app/task-layout.js
          grep -q "window.__KPTU_TASK_LAYOUT_READY__" app/task-layout.js
          grep -q "taskList.insertAdjacentElement('afterend',sec)" app/google-tasks.js
          if grep -q "tlTaskSections\|original.style.display\|insertAdjacentElement('afterend'" app/task-layout.js; then echo 'task screen returned to sibling overlay'; exit 1; fi
          if grep -q "tlTaskSections\|MutationObserver\|createElement('style')\|createElement(\"style\")" app/google-tasks.js; then echo 'Google Tasks returned to post-render correction'; exit 1; fi
          if grep -q "MutationObserver" app/task-layout.js; then echo 'task layout returned to mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/task-layout.js; then echo 'task layout styles must remain static'; exit 1; fi

      - name: Check removed member and message UI
        run: |
          set -e
          if grep -Eq 'memberList|inviteModal|messagesView|workspaceRole' app/index.html; then echo 'removed UI returned to the shell'; exit 1; fi
          if grep -Eq 'profileView|myspaceView|userBadge|teamManageTop|ccMessageTop' app/index.html app/team.js; then echo 'removed personal view returned to the shell'; exit 1; fi
          if grep -Eq 'team-member-overview|team-member-management|team-profile-view|collaboration-center' app/loader-v2.js app/view-loader.js app/styles.css; then echo 'removed UI module was loaded'; exit 1; fi
          if test -e app/mobile-dock.js || test -e app/mobile-dock.css; then echo 'obsolete personal dock returned'; exit 1; fi
          grep -q 'app_workspace_members' app/team.js

      - name: Check notification removal
        run: |
          set -e
          grep -q 'id="logoutBtn"' app/index.html
          test ! -e app/notification-center-ui.js
          test ! -e app/notification-center-ui.css
          test ! -e app/push-notifications-ui.js
          if grep -Eq 'ccNotif|data-kptu-notifications|notificationsView|notification-center-ui|push-notifications-ui|app_notifications' app/index.html app/team.js app/loader-v2.js app/view-loader.js app/styles.css; then echo 'notification UI or client data path returned'; exit 1; fi
          if grep -Eq "addEventListener\('push'|addEventListener\('notificationclick'" app/sw.js; then echo 'service worker push handler returned'; exit 1; fi

      - name: Check Web1 borrowing removal (DOMAIN-④ E2)
        run: |
          set -e
          test ! -e app/web1-board.js
          test ! -e app/web1-board.css
          test ! -e app/web1-page-capabilities.js
          test ! -e app/web1-admin-auth.js
          test ! -e app/public-page-editor.js
          test ! -e app/forum-flow-polish.js
          test ! -e app/forum-flow-polish.css
          test ! -e app/legacy/editable-page.js
          if grep -REq "web1-board|web1BoardLegacy|web1BoardDetailModal|KPTUWeb1Board|public-page-editor|web1-admin-auth|web1-page-capabilities|forum-flow-polish" app/index.html app/loader-v2.js app/view-loader.js app/styles.css app/team.js app/share-pages.js; then echo 'Web2 returned to a Web1 borrowing path'; exit 1; fi
          if grep -Eq "page-list-controller.js|page-save-controller.js|page-builder.js|page-shortcut.js|page-management.js|page-inline-viewer-v2.js" app/loader-v2.js app/view-loader.js; then echo 'retired page management returned to authenticated loader'; exit 1; fi
      - name: Check security-sensitive client boundaries
        run: |
          set -e
          if grep -Eq "service_role|SUPABASE_SERVICE_ROLE|Authorization:.*service" app/*.js; then echo 'service-role material must never ship to client'; exit 1; fi
      - name: Check retained non-project feature invariants
        run: |
          set -e
          test -f app/workflow-ai-v3.js
          if grep -q "workflow-ai-v3.js" app/loader-v2.js app/view-loader.js; then echo 'retired meeting AI workflow returned to active loader'; exit 1; fi
          if grep -q 'mobile-dock.js' app/loader-v2.js app/view-loader.js; then echo 'obsolete personal dock returned'; exit 1; fi
          if grep -q "notification-center-ui" app/view-loader.js; then echo 'notification loader returned'; exit 1; fi
          grep -q "완료된 할 일" app/task-layout.js
          if grep -q "project-create-submit.js\|legacy/" app/loader-v2.js app/view-loader.js; then echo 'duplicate legacy shim loaded'; exit 1; fi

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8123 >/tmp/kptu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          for path in \
            app/ app/login/ app/app.js app/loader-v2.js app/auth-service.js app/capabilities.js \
            app/compact-list.css \
            app/topbar-actions.js app/topbar-actions.css app/profile-settings.js app/profile-settings.css \
            app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/library-upload.js app/library-upload.css app/project-system-v3.js app/project-system-v3.css app/workflow-ai-v3.js \
            app/task-workflow.js app/meeting-round-detail.js app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js \
            app/styles.css app/meeting-ui.css app/calendar-ui.css p/; do
            curl --fail --silent "http://127.0.0.1:8123/$path" >/dev/null
          done
