name: App smoke check

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'p/**'
      - '.github/workflows/app-smoke-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'p/**'
      - '.github/workflows/app-smoke-check.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check recursive app dependency graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('app')
          queue=['app.js']
          active=set();missing=[]
          patterns=[r"import\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]\)",r"(?:from|import)\s*['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]",r"serviceWorker\.register\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]"]
          while queue:
              name=queue.pop(0)
              if name in active: continue
              path=root/name
              if not path.exists(): missing.append(name);continue
              active.add(name);text=path.read_text(encoding='utf-8');refs=[]
              for pat in patterns: refs.extend(re.findall(pat,text))
              for ref in refs:
                  rel=ref.split('?',1)[0]
                  if rel.startswith('./'):
                      child=Path(rel[2:]).name
                      if not (root/child).exists(): missing.append(f'{name} -> {ref}')
                      elif child not in active: queue.append(child)
          if missing:
              print('Missing recursive dependencies:');print('\n'.join(missing));sys.exit(1)
          print('Active JS modules:',len(active));print('\n'.join(sorted(active)))
          PY

      - name: Check stabilized app shell
        run: |
          set -e
          test -f app/index.html
          test -f app/app.js
          test -f app/loader-v2.js
          test -f app/app-router.js
          test -f app/runtime-client.js
          test -f app/page-builder.js
          test -f p/index.html
          test -d app/legacy
          test -f app/legacy/README.md
          grep -q 'id="appView"' app/index.html
          grep -q 'id="authView"' app/index.html
          grep -q 'app.js?v=12' app/index.html
          grep -q "loader-v2.js?v=96" app/app.js
          grep -q "auth-ui.js?v=8" app/app.js
          grep -q "calendar-return-bridge.js?v=2" app/app.js
          grep -q "runtime-client.js?v=1" app/loader-v2.js
          grep -q "app-router.js?v=1" app/loader-v2.js
          grep -q "workspace-ui.css?v=5" app/loader-v2.js
          grep -q "auth-ui.js?v=8" app/loader-v2.js
          grep -q "team.js?v=8" app/loader-v2.js
          grep -q "task-layout.js?v=4" app/loader-v2.js
          grep -q "profile-settings.js?v=2" app/loader-v2.js
          grep -q "page-editor-fix.js?v=2" app/loader-v2.js
          grep -q "page-builder.js?v=1" app/loader-v2.js
          grep -q "page-shortcut.js?v=1" app/loader-v2.js
          grep -q "google-calendar-return-status.js?v=1" app/loader-v2.js
          grep -q "collaboration-center.js?v=5" app/loader-v2.js
          grep -q "notification-center-ui.js?v=5" app/loader-v2.js
          grep -q "KPTURuntime" app/task-layout.js
          grep -q "KPTURuntime" app/profile-settings.js
          grep -q "KPTURuntime" app/page-editor-fix.js
          grep -q "KPTURuntime" app/page-builder.js
          grep -q "PB_TEMPLATES" app/page-builder.js
          grep -q "AI로 초안 만들기" app/page-builder.js
          grep -q "page_design" app/page-builder.js
          grep -q "template-status" p/index.html
          grep -q "metadata,page_design\|metadata?.page_design\|metadata.*page_design" p/index.html
          grep -q "tlGroup('내 할 일'" app/task-layout.js
          grep -q "완료된 할 일" app/task-layout.js
          grep -q "바로가기" app/page-shortcut.js
          if grep -q "MutationObserver" app/notification-center-ui.js; then echo 'notification center global observer returned'; exit 1; fi
          if grep -q "setInterval" app/notification-center-ui.js; then echo 'notification center polling returned'; exit 1; fi
          if grep -q "refresh_token" app/task-workflow.js app/meeting-round-detail.js app/page-editor-fix.js; then echo 'feature refresh logic returned'; exit 1; fi
          if grep -q "kptu_collab_session_v1" app/calendar-health.js app/calendar-persistence.js app/calendar-plus.js app/calendar-interactions-v2.js app/task-workflow.js app/task-layout.js app/profile-settings.js app/page-editor-fix.js app/page-builder.js app/project-access.js app/meeting-round-detail.js app/collaboration-center.js; then echo 'feature-local session storage returned'; exit 1; fi
          if grep -q "task-title-ui.js" app/loader-v2.js; then echo 'task title CSS shim loaded again'; exit 1; fi
          if grep -q "project-create-submit.js" app/loader-v2.js; then echo 'duplicate project submit shim loaded'; exit 1; fi
          if grep -q "task-personal-due.js" app/loader-v2.js; then echo 'duplicate task submit shim loaded'; exit 1; fi
          for f in calendar-app-edit-ui.js calendar-create-live-title.js calendar-date-create.js calendar-edit-actions.js calendar-event-edit.js calendar-google-fast-edit.js calendar-observer-stability.js editable-page.js google-color-palette.js home-task-actions.js meeting-detail-patches.js page-preview-tools.js project-child-header.js project-hierarchy-ui.js project-create-submit.js task-personal-due.js startup-speed.js; do
            if test -e "app/$f"; then echo "inactive module returned to app root: $f"; exit 1; fi
            test -f "app/legacy/$f"
          done

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8123 >/tmp/kptu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8123/app/ >/tmp/app-index.html
          curl --fail --silent http://127.0.0.1:8123/app/app.js >/tmp/app.js
          curl --fail --silent http://127.0.0.1:8123/app/loader-v2.js >/tmp/loader.js
          curl --fail --silent http://127.0.0.1:8123/app/page-builder.js >/tmp/page-builder.js
          curl --fail --silent http://127.0.0.1:8123/p/ >/tmp/public-page.html
          test -s /tmp/app-index.html
          test -s /tmp/app.js
          test -s /tmp/loader.js
          test -s /tmp/page-builder.js
          test -s /tmp/public-page.html
