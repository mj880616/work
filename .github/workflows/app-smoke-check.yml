      - 'tests/meeting-columns.test.mjs'
      - 'tests/report-kinds.test.mjs'
      - 'tests/pdf-lib-pin.test.mjs'
      - 'tests/markdown-view.test.mjs'
      - 'tests/html-frame.test.mjs'
      - 'scripts/markdown/**'
      - 'scripts/editor/**'
      - 'tests/ed-editor.test.mjs'
      - 'tests/ed-window.test.mjs'
      - 'tests/update-window.test.mjs'
      - 'tests/record-doc.test.mjs'
      - 'tests/home-read-model.test.mjs'
      - 'tests/english-labels.test.mjs'
      - 'tests/ledger-import-model.test.mjs'
      - 'tests/ledger-import-fixture.mjs'
      - 'tests/ledger-browse-model.test.mjs'
      - 'tests/global-search-model.test.mjs'
      - 'tests/ledger-candidate-model.test.mjs'
      - 'tests/ledger-export-model.test.mjs'
      - 'tests/ledger-auto-model.test.mjs'
      - 'tests/overlap-model.test.mjs'
      - 'tests/overlap-paths.test.mjs'
      - 'tests/ledger-fix-model.test.mjs'
      - 'scripts/check-app-smoke-contract.mjs'
      - 'scripts/check-app-smoke-contract.test.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/app-smoke-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'tests/domain/bokdoong-router.test.mjs'
      - 'tests/domain/web2-pwa-registration.test.mjs'
      - 'p/**'
      - 'supabase/functions/meeting-ai-draft/**'
      - 'tests/meeting-draft-parser.test.mjs'
      - 'tests/meeting-time.test.mjs'
      - 'tests/seoul-time.test.mjs'
      - 'tests/time-input.test.mjs'
      - 'tests/meeting-compact.test.mjs'
      - 'tests/select-menu.test.mjs'
      - 'tests/basket-data.test.mjs'
      - 'tests/task-files.test.mjs'
      - 'tests/file-actions.test.mjs'
      - 'tests/drive-summary-refresh.test.mjs'
      - 'tests/basket-classification.test.mjs'
      - 'tests/basket-ai-handoff.test.mjs'
      - 'tests/basket-upload.test.mjs'
      - 'tests/basket-ocr-text.test.mjs'
      - 'tests/basket-ocr.test.mjs'
      - 'tests/basket-ocr-runtime.test.mjs'
      - 'tests/hwp-lab-pin.test.mjs'
      - 'scripts/hwp-lab/**'
      - 'scripts/pdf/**'
      - 'tests/meeting-file-parse.test.mjs'
      - 'tests/meeting-when.test.mjs'
      - 'tests/meeting-columns.test.mjs'
      - 'tests/report-kinds.test.mjs'
      - 'tests/pdf-lib-pin.test.mjs'
      - 'tests/markdown-view.test.mjs'
      - 'tests/html-frame.test.mjs'
      - 'scripts/markdown/**'
      - 'scripts/editor/**'
      - 'tests/ed-editor.test.mjs'
      - 'tests/ed-window.test.mjs'
      - 'tests/update-window.test.mjs'
      - 'tests/record-doc.test.mjs'
      - 'tests/home-read-model.test.mjs'
      - 'tests/english-labels.test.mjs'
      - 'tests/ledger-import-model.test.mjs'
      - 'tests/ledger-import-fixture.mjs'
      - 'tests/ledger-browse-model.test.mjs'
      - 'tests/global-search-model.test.mjs'
      - 'tests/ledger-candidate-model.test.mjs'
      - 'tests/ledger-export-model.test.mjs'
      - 'tests/ledger-auto-model.test.mjs'
      - 'tests/overlap-model.test.mjs'
      - 'tests/overlap-paths.test.mjs'
      - 'tests/ledger-fix-model.test.mjs'
      - 'scripts/check-app-smoke-contract.mjs'
      - 'scripts/check-app-smoke-contract.test.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/app-smoke-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check meeting Korea time conversions
        run: node --test tests/meeting-time.test.mjs tests/seoul-time.test.mjs tests/time-input.test.mjs tests/meeting-compact.test.mjs tests/select-menu.test.mjs tests/calendar-week-timeline.test.mjs tests/calendar-drag-model.test.mjs

      - name: Check shared Enter-to-save rule (UI-엔터저장)
        run: node --test tests/enter-save.test.mjs

      - name: Check meeting draft parser
        run: node --test tests/meeting-draft-parser.test.mjs

      - name: Check shared document deletion client
        run: node --test tests/document-delete.test.mjs

      - name: Check home KST day and week boundaries
        run: node --test tests/home-read-model.test.mjs tests/home-read-cache.test.mjs tests/data-freshness.test.mjs tests/collection-status.test.mjs

      - name: Check phone bottom tab selection rule
        run: node --test tests/mobile-tab-selection.test.mjs

      - name: Check basket data and sequential file uploads
        run: node --test tests/basket-data.test.mjs tests/basket-upload.test.mjs tests/basket-ocr-text.test.mjs tests/basket-ocr.test.mjs tests/basket-ocr-runtime.test.mjs tests/basket-classification.test.mjs tests/basket-ai-handoff.test.mjs tests/basket-link-records.test.mjs tests/basket-record-delete.test.mjs tests/basket-manual-link.test.mjs tests/reference-bundles-data.test.mjs tests/basket-ref-bundle-ai.test.mjs tests/update-places-reference.test.mjs tests/basket-ai-summary.test.mjs tests/todo-radar-data.test.mjs tests/basket-note-tasks.test.mjs tests/basket-kind-filter.test.mjs tests/basket-record-summary-guide.test.mjs tests/basket-library-send.test.mjs tests/meeting-basket-send.test.mjs tests/diary-data.test.mjs tests/journal-data.test.mjs tests/journal-weekly.test.mjs tests/weekly-file-lines.test.mjs tests/journal-org-summary.test.mjs tests/journal-meeting-kinds.test.mjs tests/project-order.test.mjs tests/basket-file-docs.test.mjs tests/document-categories.test.mjs tests/basket-note-pin.test.mjs tests/update-requests.test.mjs tests/update-journal.test.mjs tests/task-files.test.mjs tests/file-actions.test.mjs tests/library-ai-fill.test.mjs tests/quick-links.test.mjs tests/feed-model.test.mjs tests/call-personal-screen.test.mjs tests/project-trash-model.test.mjs tests/summary-part-unify.test.mjs

      - name: Check library toggle tree model
        run: node --test tests/library-tree.test.mjs tests/library-view-pref.test.mjs tests/category-chips.test.mjs tests/org-dispute-stage-model.test.mjs tests/view-prefs.test.mjs tests/theme-bootstrap.test.mjs tests/library-upload-organization.test.mjs

      - name: Check Drive copy refresh batching after saves
        run: node --test tests/drive-summary-refresh.test.mjs

      - name: Check pinned HWP editor files
        run: node --test tests/hwp-lab-pin.test.mjs

      - name: Meeting files·text grouping and pinned PDF reader
        run: node --test tests/meeting-file-parse.test.mjs tests/pdf-lib-pin.test.mjs

      - name: Meeting card time, kind colors and PC layout
        run: node --test tests/meeting-when.test.mjs tests/meeting-columns.test.mjs tests/report-kinds.test.mjs tests/report-links.test.mjs

      - name: Markdown display pin and safety unit tests
        run: node --test tests/markdown-view.test.mjs tests/md-telegram.test.mjs tests/html-frame.test.mjs tests/note-markdown.test.mjs tests/basket-notes-data.test.mjs

      - name: Unified editor pin, saved form and text export unit tests (ED-통합편집기)
        run: node --test tests/ed-editor.test.mjs tests/ed-window.test.mjs tests/update-window.test.mjs tests/record-doc.test.mjs tests/note-doc.test.mjs

      - name: Check English eyebrow cleanup
        run: node --test tests/english-labels.test.mjs

      - name: Global search model (SEARCH-전체검색 words, highlights, Google filters, groups, error codes)
        run: node --test tests/global-search-model.test.mjs

      - name: Ledger import checker (CSV·xlsx·import file, synthetic sheet)
        run: node --test tests/ledger-import-model.test.mjs tests/ledger-browse-model.test.mjs tests/ledger-candidate-model.test.mjs tests/ledger-export-model.test.mjs tests/ledger-auto-model.test.mjs tests/ledger-fix-model.test.mjs tests/overlap-model.test.mjs tests/overlap-paths.test.mjs

      - name: Check removed team AI app path
        run: node --test tests/security/team-ai-app-removed.test.mjs

      - name: Check loaded app has no app_tasks writes
        run: node --test tests/security/app-tasks-loaded-writes.test.mjs

      - name: Check domain routing and service worker registration
        run: node --test tests/domain/bokdoong-router.test.mjs tests/domain/web2-pwa-registration.test.mjs tests/domain/read-oauth-return-bridge.test.mjs tests/domain/supabase-origin.test.mjs

      - name: Check home, inbox, quick save and trash units (STAB-단위시험등록)
        run: node --test tests/home-fill-data.test.mjs tests/home-fill-model.test.mjs tests/inbox-count.test.mjs tests/inbox-promise.test.mjs tests/quick-save-session.test.mjs tests/trash-actions.test.mjs

      - name: Check notes, editor tables and text units (STAB-단위시험등록)
        run: node --test tests/basket-note-folder.test.mjs tests/chatgpt-html.test.mjs tests/diary-doc.test.mjs tests/ed-table-colbuttons.test.mjs tests/ed-table-resize.test.mjs tests/note-files.test.mjs tests/preview-text.test.mjs tests/report-words.test.mjs

      - name: Check library, project, share and upload units (STAB-단위시험등록)
        run: node --test tests/library-select.test.mjs tests/project-fold.test.mjs tests/share-pages-label.test.mjs tests/share-photos.test.mjs tests/summary-copy-model.test.mjs tests/text-backfill-notice.test.mjs tests/upload-file-copy.test.mjs

      - name: Check hardcoded color baseline (STAB-단위시험등록)
        run: node --test tests/hardcoded-colors.test.mjs

      - name: Install locked smoke parser
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Check save keeps other active edit open (needs the locked parser) (STAB-단위시험등록)
        run: node --test tests/save-other-active.test.mjs

      - name: Check every tests/ unit test is registered in a workflow (STAB-단위시험등록)
        run: node scripts/check-test-registration.mjs

      - name: Check recursive app dependency graph
        run: |
          node --test scripts/check-app-smoke-contract.test.mjs
          node scripts/check-app-smoke-contract.mjs
          node <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('app/loader-v2.js','utf8');
          const views=fs.readFileSync('app/view-loader.js','utf8');
          const loaderKeys=[
            'const authenticated=await window.KPTURuntime.session.ensure()',
            'await window.__KPTU_TEAM_READY__',
            'result=await viewLoader.load(requested)',
            'window.__KPTU_MARK_APP_UI_READY__?.({usable:result?.ok===true})'
          ];
          const missingLoader=loaderKeys.filter(key=>!loader.includes(key));
          if(missingLoader.length)throw new Error('missing route-first startup marker: '+missingLoader.join(', '));
          const viewKeys=[
            "__KPTU_CALENDAR_MONTH_VIEW_READY__",
            "__KPTU_TASK_WORKFLOW_READY__",
            "__KPTU_MEETING_ROUND_DETAIL_READY__",
            "__KPTU_CALENDAR_PLUS_READY__",
            "__KPTU_CALENDAR_PERSISTENCE_READY__",
            "__KPTU_CALENDAR_INTERACTIONS_READY__",
            "__KPTU_CALENDAR_MOBILE_UI_READY__",
            "__KPTU_CALENDAR_DAY_OVERFLOW_READY__"
          ];
          const missingViews=viewKeys.filter(key=>!views.includes(key));
          if(missingViews.length)throw new Error('missing view dependency marker: '+missingViews.join(', '));
          if(loader.includes("import('./google-tasks.js"))throw new Error('route-agnostic loader must not import task-only integration');
          const login=fs.readFileSync('app/login/index.html','utf8');
          if(login.includes('id="appView"'))throw new Error('dedicated login page must not contain workspace shell');
          NODE

      - name: Check public and authenticated app boundaries
        run: |
          set -e
          for f in \
            app/index.html app/app.js app/loader-v2.js app/app-router.js app/runtime-client.js \
            app/auth-service.js app/capabilities.js app/login/index.html app/login/login.js \
            app/team.js app/topbar-actions.js app/topbar-actions.css \
            app/profile-settings.js app/profile-settings.css \
            app/task-workflow.js app/task-row-view.js app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/meeting-round-detail.js app/compact-list.css \
            app/project-system-v3.js app/project-system-v3.css app/project-catalog.js app/project-catalog-model.mjs \
            app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js app/calendar-ui.css \
            app/workflow-ai-v3.js app/workplace-report.js \
            app/meeting-ui.css p/index.html; do
            test -f "$f"
          done
          test -d app/legacy
          test -f app/legacy/README.md
          test ! -f app/meeting-assignee-picker.js
          test ! -f app/meeting-file-route.js
          test ! -f app/calendar-defaults.js
          test ! -f app/page-editor-fix.js
          test ! -f app/page-inline-viewer.js
          test ! -f app/task-status-state.js
          test ! -f app/task-assignment-visibility.js

          grep -q 'id="appView"' app/index.html
          grep -q 'id="accessDeniedView"' app/index.html
          grep -q "loader-v2.js" app/app.js
          if grep -q "ensureFeatureStyles" app/loader-v2.js; then echo 'global feature stylesheet gate returned'; exit 1; fi
          grep -q "viewLoader.prepare(requested)" app/loader-v2.js
          grep -q "runtime-client.js" app/loader-v2.js
          grep -q "auth-service.js" app/loader-v2.js
          grep -q "KPTURuntime.session.ensure" app/loader-v2.js
          grep -Fq "document.body.classList.toggle('kptu-workspace-shell',id==='appView')" app/team.js
          grep -q "__KPTU_BOOT_MEMBERSHIP_PROMISE__" app/loader-v2.js
          grep -q "workspacePrefetchStart" app/loader-v2.js
          grep -q "prefetched?.ok?prefetched.rows" app/team.js
          if grep -q "public-workspace.js" app/loader-v2.js; then echo 'anonymous Web2 boot returned to the public workspace'; exit 1; fi
          grep -Fq 'class="brand-icon" src="./app-icon.svg"' app/index.html
          if grep -q 'class="leaf"' app/index.html; then echo 'green first-paint brand placeholder returned'; exit 1; fi
          if grep -Eq "favicon|apple-touch-icon|createElement\\('link'\\)" app/pwa.js; then echo 'PWA bootstrap returned to late icon mutation'; exit 1; fi
          if grep -R -q "20260913-3" app/index.html app/pwa.js app/windows-manifest.json app/sw.js; then echo 'stale Web2 icon version returned'; exit 1; fi
          if grep -R -q "20260924-unicorn2" app/index.html app/windows-manifest.json app/sw.js; then echo 'poisoned Web2 icon URL returned'; exit 1; fi
          grep -q "immutableAsset = await matchesManifest(incoming.pathname" cloudflare/bokdoong-router.mjs
          if grep -q "cacheEverything" cloudflare/bokdoong-router.mjs; then echo 'unverified edge pinning of ?v= assets returned'; exit 1; fi
          if grep -q "home-dashboard-v2.js" app/view-loader.js; then echo 'removed home route returned'; exit 1; fi
          grep -q "__KPTU_TASK_WORKFLOW_READY__" app/view-loader.js
          # UI-프로필입구: 내 프로필은 [계정 ▾] 메뉴에서 열 때만 view-loader가 불러온다. 시작 로더(loader-v2.js)에는 넣지 않는다.
          if grep -Eq "profile-settings.js|myspace-return.js" app/loader-v2.js; then echo 'personal view module was loaded at startup'; exit 1; fi
          if grep -q "myspace-return.js" app/view-loader.js; then echo 'removed personal view module was loaded'; exit 1; fi
          grep -q "profile-settings.js" app/view-loader.js
          grep -q "dataset.profileOpen" app/topbar-actions.js
          test ! -f app/home-task-controls.js
          test ! -f app/home-task.css
          test ! -f app/library-public-toggle.js
          if grep -Eq "home-task-controls|home-task.css|library-public-toggle" app/loader-v2.js app/view-loader.js app/styles.css; then echo 'retired home/library decorator returned'; exit 1; fi
          # 포토룸 삭제 상태 유지(TASK-포토룸삭제 1단계): 전용 파일과 로더·라우터·스타일 연결이 돌아오면 실패.
          test ! -f app/photo-room.js
          test ! -f app/photo-room.css
          if grep -Eq "photo-room|__KPTU_PHOTO_ROOM|photos" app/loader-v2.js app/view-loader.js app/app-router.js app/styles.css app/index.html; then echo 'retired photo room returned'; exit 1; fi
          grep -q "__KPTU_MEETING_ROUND_DETAIL_READY__" app/view-loader.js
          if grep -q 'mobile-dock.js' app/loader-v2.js app/view-loader.js; then echo 'obsolete personal dock returned'; exit 1; fi
          if grep -Eq "notification-center-ui|__KPTU_NOTIFICATION_CENTER_READY__|push-notifications-ui" app/loader-v2.js app/view-loader.js app/styles.css; then echo 'notification runtime returned'; exit 1; fi
          test ! -e app/notification-center-ui.js
          test ! -e app/notification-center-ui.css
          test ! -e app/push-notifications-ui.js
          grep -q "__KPTU_CALENDAR_PLUS_READY__" app/view-loader.js
          grep -q "__KPTU_CALENDAR_PERSISTENCE_READY__" app/view-loader.js
          grep -q "__KPTU_CALENDAR_INTERACTIONS_READY__" app/view-loader.js
          grep -q "__KPTU_CALENDAR_MOBILE_UI_READY__" app/view-loader.js
          grep -q "__KPTU_CALENDAR_DAY_OVERFLOW_READY__" app/view-loader.js

          if grep -q "profile-settings.css" app/styles.css; then echo 'removed personal view stylesheet was loaded'; exit 1; fi
          if grep -q 'mobile-dock.css' app/styles.css; then echo 'obsolete personal dock style returned'; exit 1; fi
          if grep -Eq "page-editor-static|page-core\.css|page-builder\.css" app/styles.css; then echo 'retired Web2 page editor styles returned'; exit 1; fi
          grep -q "#authView{display:none!important}" app/base-ui.css
          grep -q "#appView:not(.kptu-ui-ready)" app/base-ui.css
          grep -Fq "[data-kptu-logout]" app/topbar-actions.css
          grep -q "logoutButtons.forEach" app/topbar-actions.js
          if grep -Eq "teamManageTop|ccMessageTop|userBadge" app/topbar-actions.js; then echo 'removed personal or message action returned to the topbar'; exit 1; fi

          if grep -Eq "function taskProjectOptions|function taskProjectRows|function openTaskModal|saveTaskBtn.*saveTask|dataset\.taskToggle" app/team.js; then echo 'legacy task ownership returned to team.js'; exit 1; fi
          if grep -Eq "teamAssigned|팀에서 부여된 할 일|팀에서 부여 · 회의|내가 추가" app/task-layout.js; then echo 'team assignment task concept returned'; exit 1; fi
          if grep -Eq "meeting-action-assignee|mrdTaskAssignee|MRD_TEAM|mrdMemberOptions" app/task-workflow.js app/meeting-round-detail.js app/index.html; then echo 'meeting assignee selector returned'; exit 1; fi
          grep -q "function openCreate(projectId='')" app/task-layout.js
          grep -q "function projectOptions(selected='')" app/task-layout.js
          grep -q "metadata?.project_system==='v2'" app/task-layout.js
          grep -q "window.KPTUTaskLayout={openTask,openCreate}" app/task-layout.js
          # Project task add creates a Google task linked to the project (TASK-구현 PR 4).
          grep -q "g.openEditor(null,{links:\[{project_id:current.id}\]})" app/project-system-v3.js
          if grep -q "할 일은 하위 프로젝트에 연결됩니다" app/project-system-v3.js; then echo 'top-level project task guard returned'; exit 1; fi
          grep -q "data-mrd-meeting" app/team.js
          # MEET-파일AI분류: 새 사업 보고의 자료도 자료실 올리기(library-files, meeting_id 연결)로 올린다. meeting-files Edge는 meeting-from-files.js가 계속 쓴다.
          grep -q "uploadFileForMeeting" app/team.js
          grep -q "fd.append('meeting_id',target.id)" app/library-upload.js
          grep -q "/functions/v1/meeting-files" app/meeting-from-files.js
          grep -q 'id="meetingTranscript"' app/index.html
          grep -q 'id="meetingNotes"' app/index.html
          grep -q 'id="meetingFiles" type="file" multiple' app/index.html
          grep -q "transcript_text:transcript" app/team.js
          grep -q "id=\"mrdSpecialSection\"" app/meeting-round-detail.js
          if grep -Eq 'meetingAutoClassify|meetingDecisions|wfMeetingLocation|wfMeetingAttendees' app/index.html app/team.js; then echo 'retired meeting fields returned'; exit 1; fi
          if grep -q "mrdAiDraft" app/meeting-round-detail.js; then echo 'retired meeting AI draft action returned'; exit 1; fi
          grep -q "function renderPages(){window.KPTUWeb1Board?.render?.()}" app/team.js
          grep -q "main_project_archive_state" app/web1-board.js
          grep -q "replaceReader(injectReaderBridge" app/web1-board.js
          grep -q "repoPathFromCanonical" app/web1-board.js
          grep -q "kptu:web1-board:navigate" app/web1-board.js
