name: App smoke check

on:
  push:
    branches: [main]
    paths: ['app/**','p/**','.github/workflows/app-smoke-check.yml']
  pull_request:
    branches: [main]
    paths: ['app/**','p/**','.github/workflows/app-smoke-check.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check recursive app dependency graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('app'); queue=['app.js']; active=set(); missing=[]
          patterns=[r"import\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]\)",r"(?:from|import)\s*['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]",r"serviceWorker\.register\(['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]"]
          while queue:
            name=queue.pop(0)
            if name in active: continue
            path=root/name
            if not path.exists(): missing.append(name); continue
            active.add(name); text=path.read_text(encoding='utf-8')
            refs=[]
            for pat in patterns: refs.extend(re.findall(pat,text))
            for ref in refs:
              rel=ref.split('?',1)[0]
              if rel.startswith('./'):
                child=Path(rel[2:]).name
                if not (root/child).exists(): missing.append(f'{name} -> {ref}')
                elif child not in active: queue.append(child)
          if missing:
            print('Missing recursive dependencies:'); print('\n'.join(missing)); sys.exit(1)
          print('Active JS modules:',len(active)); print('\n'.join(sorted(active)))
          PY

      - name: Check authenticated readiness and static UI graph
        run: |
          set -e
          for f in \
            app/index.html app/app.js app/loader-v2.js app/runtime-client.js app/auth-service.js app/capabilities.js \
            app/team.js app/project-system-v3.js app/project-system-v3.css app/task-layout.js app/task-layout.css \
            app/team-member-overview.js app/team-profile-view.js app/team-member-management.js \
            app/profile-settings.js app/workplace-detail.js app/collaboration-center.js app/notification-center-ui.js \
            app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js app/calendar-ui.css \
            app/page-list-controller.js app/page-save-controller.js app/page-builder.js app/page-builder.css app/page-shortcut.js app/page-management.js app/page-inline-viewer-v2.js app/page-core.css \
            app/meeting-round-detail.js app/meeting-ui.css app/styles.css p/index.html; do test -f "$f"; done
          test ! -f app/page-editor-fix.js
          test ! -f app/page-inline-viewer.js
          test ! -f app/meeting-assignee-picker.js
          test ! -f app/meeting-file-route.js
          test ! -f app/calendar-defaults.js
          test ! -f app/task-status-state.js
          test ! -f app/task-assignment-visibility.js
          grep -q "page-builder.css?v=1" app/styles.css
          grep -q "page-save-controller.js?v=2" app/loader-v2.js
          grep -q "__KPTU_PAGE_SAVE_READY__" app/loader-v2.js
          grep -q "page-builder.js?v=2" app/loader-v2.js
          grep -q "__KPTU_PAGE_BUILDER_READY__" app/loader-v2.js
          grep -q "calendar-plus.js?v=5" app/loader-v2.js
          grep -q "__KPTU_CALENDAR_PLUS_READY__" app/loader-v2.js
          grep -q "collaboration-center.js?v=6" app/loader-v2.js
          grep -q "__KPTU_COLLABORATION_READY__" app/loader-v2.js
          grep -q "#appView:not(.kptu-ui-ready)" app/base-ui.css
          grep -Eq '<script src="\./app\.js\?v=[0-9]+" defer></script>' app/index.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app/loader-v2.js').read_text(encoding='utf-8')
          keys=[
            'const authenticated=await window.KPTURuntime.session.ensure()',
            "import('./team.js?v=17')",'await window.__KPTU_TEAM_READY__',
            "import('./task-workflow.js?v=6')",'await window.__KPTU_TASK_WORKFLOW_READY__',
            "import('./task-layout.js?v=6')",'await window.__KPTU_TASK_LAYOUT_READY__',
            "import('./profile-settings.js?v=4')",'await window.__KPTU_PROFILE_SETTINGS_READY__',
            "import('./page-list-controller.js?v=1')",'await window.__KPTU_PAGE_LIST_READY__',
            "import('./page-save-controller.js?v=2')",'await window.__KPTU_PAGE_SAVE_READY__',
            "import('./page-builder.js?v=2')",'await window.__KPTU_PAGE_BUILDER_READY__',
            "import('./page-management.js?v=2')",'await window.__KPTU_PAGE_MANAGEMENT_READY__',
            "import('./meeting-round-detail.js?v=6')",'await window.__KPTU_MEETING_ROUND_DETAIL_READY__',
            "import('./collaboration-center.js?v=6')",'await window.__KPTU_COLLABORATION_READY__',
            "import('./notification-center-ui.js?v=6')",'await window.__KPTU_NOTIFICATION_CENTER_READY__',
            "import('./calendar-plus.js?v=5')",'await window.__KPTU_CALENDAR_PLUS_READY__',
            "import('./calendar-day-overflow.js?v=2')",'await window.__KPTU_CALENDAR_DAY_OVERFLOW_READY__',
            'window.__KPTU_MARK_APP_UI_READY__?.()'
          ]
          pos=[text.index(x) for x in keys]
          if pos!=sorted(pos): raise SystemExit('authenticated readiness ordering is invalid')
          PY

      - name: Check single-render invariants
        run: |
          set -e
          grep -q "data-ps3-edit-project" app/project-system-v3.js
          grep -q "data-ps3-archive-project" app/project-system-v3.js
          grep -q "ps3-child-menu" app/project-system-v3.js
          grep -q "const r=\$('#taskList')" app/task-layout.js
          grep -q "window.__KPTU_RELOAD_TEAM_MEMBERS__" app/team-member-overview.js
          grep -q "window.__KPTU_COLLABORATION_READY__" app/collaboration-center.js
          grep -q "window.KPTUCalendarPlus={paint:" app/calendar-plus.js
          grep -q "window.KPTUCalendarPersistence={paint:" app/calendar-persistence.js
          grep -q "function renderPages(){window.KPTUPageList?.render?.()}" app/team.js
          grep -q "addEventListener('click',interceptOpen,true)" app/page-save-controller.js
          grep -q "kptu:page-editor-opened" app/page-save-controller.js
          grep -q "addEventListener('kptu:page-editor-opened'" app/page-builder.js
          grep -q "/functions/v1/page-ai-draft" app/page-builder.js
          grep -q "/functions/v1/document-ai-index" app/page-builder.js
          grep -q "/functions/v1/library-files" app/page-builder.js
          for f in app/project-system-v3.js app/task-layout.js app/team-member-overview.js app/team-profile-view.js app/team-member-management.js app/profile-settings.js app/workplace-detail.js app/collaboration-center.js app/notification-center-ui.js app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js app/page-list-controller.js app/page-save-controller.js app/page-builder.js app/page-shortcut.js app/page-management.js app/page-inline-viewer-v2.js app/meeting-round-detail.js; do
            if grep -q "MutationObserver" "$f"; then echo "$f returned to MutationObserver correction"; exit 1; fi
            if grep -q "createElement('style')\|createElement(\"style\")" "$f"; then echo "$f returned to runtime style injection"; exit 1; fi
          done
          for f in app/page-list-controller.js app/page-save-controller.js app/page-builder.js app/page-shortcut.js app/page-management.js app/page-inline-viewer-v2.js; do
            if grep -q "location.reload\|setTimeout(" "$f"; then echo "$f returned to delayed/full-page page correction"; exit 1; fi
          done
          if grep -Eq "project-system-v2.js|project-hide-legacy.js|project-files.js|project-delete.js|project-v2.js|project-deeplink.js|task-child-project-guard.js|task-status-state.js|task-assignment-visibility.js|page-editor-fix.js|page-inline-viewer.js|calendar-defaults.js|meeting-assignee-picker.js|meeting-file-route.js" app/loader-v2.js; then
            echo 'legacy correction module returned to active loader'; exit 1
          fi

      - name: Check security-sensitive client boundaries
        run: |
          set -e
          grep -q "app_save_page_v2" app/page-save-controller.js
          grep -q "KPTUCapabilities" app/page-save-controller.js
          grep -q "KPTURuntime" app/page-builder.js
          if grep -Eq "service_role|SUPABASE_SERVICE_ROLE|Authorization:.*service" app/*.js; then echo 'service-role material must never ship to client'; exit 1; fi
          if grep -Eq "localStorage|kptu_collab_session_v1" app/page-save-controller.js app/page-builder.js app/collaboration-center.js app/notification-center-ui.js app/photo-room.js; then echo 'feature module bypassed shared runtime session'; exit 1; fi

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8123 >/tmp/kptu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          for path in app/ app/login/ app/app.js app/loader-v2.js app/runtime-client.js app/styles.css app/page-builder.js app/page-builder.css app/page-save-controller.js app/page-list-controller.js app/project-system-v3.js app/task-layout.js app/calendar-plus.js app/collaboration-center.js p/; do
            curl --fail --silent "http://127.0.0.1:8123/$path" >/dev/null
          done
