name: App smoke check

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'tests/domain/bokdoong-router.test.mjs'
      - 'tests/domain/web2-pwa-registration.test.mjs'
      - 'p/**'
      - 'supabase/functions/meeting-ai-draft/**'
      - 'tests/meeting-draft-parser.test.mjs'
      - '.github/workflows/app-smoke-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'tests/domain/bokdoong-router.test.mjs'
      - 'tests/domain/web2-pwa-registration.test.mjs'
      - 'p/**'
      - 'supabase/functions/meeting-ai-draft/**'
      - 'tests/meeting-draft-parser.test.mjs'
      - '.github/workflows/app-smoke-check.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check meeting draft parser
        run: node --test tests/meeting-draft-parser.test.mjs

      - name: Check domain routing and service worker registration
        run: node --test tests/domain/bokdoong-router.test.mjs tests/domain/web2-pwa-registration.test.mjs tests/domain/read-oauth-return-bridge.test.mjs

      - name: Check recursive app dependency graph
        run: |
          node <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('app/loader-v2.js','utf8');
          const views=fs.readFileSync('app/view-loader.js','utf8');
          const loaderKeys=[
            'const authenticated=await window.KPTURuntime.session.ensure()',
            "import('./team.js?v=51')",'await window.__KPTU_TEAM_READY__',
            "import('./view-loader.js?v=18')",'result=await viewLoader.load(requested)',
            'window.__KPTU_MARK_APP_UI_READY__?.({usable:result?.ok===true})'
          ];
          const missingLoader=loaderKeys.filter(key=>!loader.includes(key));
          if(missingLoader.length)throw new Error('missing route-first startup marker: '+missingLoader.join(', '));
          const viewKeys=[
            "module('./calendar-month-view.js?v=6'","__KPTU_CALENDAR_MONTH_VIEW_READY__",
            "module('./task-workflow.js?v=9'","__KPTU_TASK_WORKFLOW_READY__",
            "module('./task-row-view.js?v=1'","module('./task-layout.js?v=13'","__KPTU_TASK_LAYOUT_READY__",
            "module('./web1-board.js?v=3'",
            "module('./meeting-round-detail.js?v=14'","__KPTU_MEETING_ROUND_DETAIL_READY__",
            "module('./calendar-plus.js?v=9'","__KPTU_CALENDAR_PLUS_READY__",
            "module('./calendar-persistence.js?v=13'","__KPTU_CALENDAR_PERSISTENCE_READY__",
            "module('./calendar-interactions-v2.js?v=8'","__KPTU_CALENDAR_INTERACTIONS_READY__",
            "module('./calendar-mobile-ui.js?v=5'","__KPTU_CALENDAR_MOBILE_UI_READY__",
            "module('./calendar-day-overflow.js?v=3'","__KPTU_CALENDAR_DAY_OVERFLOW_READY__"
          ];
          const missingViews=viewKeys.filter(key=>!views.includes(key));
          if(missingViews.length)throw new Error('missing view dependency marker: '+missingViews.join(', '));
          if(loader.includes("import('./google-tasks.js"))throw new Error('route-agnostic loader must not import task-only integration');
          const login=fs.readFileSync('app/login/index.html','utf8');
          if(login.includes('id="appView"'))throw new Error('dedicated login page must not contain workspace shell');
          NODE

      - name: Check public and authenticated app boundaries
        run: |
          set -e
          for f in \
            app/index.html app/app.js app/loader-v2.js app/app-router.js app/runtime-client.js \
            app/auth-service.js app/capabilities.js app/login/index.html app/login/login.js \
            app/team.js app/topbar-actions.js app/topbar-actions.css \
            app/team-member-overview.js app/team-member-overview.css app/team-profile-view.js app/team-profile-view.css app/team-member-management.js app/team-member-management.css \
            app/profile-settings.js app/profile-settings.css \
            app/task-workflow.js app/task-row-view.js app/task-layout.js app/task-layout.css app/google-tasks.js app/google-tasks.css app/meeting-round-detail.js app/compact-list.css \
            app/project-system-v3.js app/project-system-v3.css app/project-catalog.js \
            app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-interactions-v2.js app/calendar-mobile-ui.js app/calendar-day-overflow.js app/calendar-ui.css \
            app/workflow-ai-v3.js app/workplace-ai-report.js app/photo-room.js \
            app/access-approval.css app/meeting-ui.css app/photo-room.css p/index.html; do
            test -f "$f"
          done
          test -d app/legacy
          test -f app/legacy/README.md
          test ! -f app/meeting-assignee-picker.js
          test ! -f app/meeting-file-route.js
          test ! -f app/calendar-defaults.js
          test ! -f app/page-editor-fix.js
          test ! -f app/page-inline-viewer.js
          test ! -f app/task-status-state.js
          test ! -f app/task-assignment-visibility.js

          grep -q 'id="appView"' app/index.html
          grep -q 'id="authView"' app/index.html
          grep -Eq '<script src="\./app\.js\?v=[0-9]+" defer></script>' app/index.html
          grep -q "loader-v2.js" app/app.js
          grep -q "critical.css?v=6" app/index.html
          if grep -q "styles.css?v=51" app/loader-v2.js; then echo 'global feature stylesheet returned to startup'; exit 1; fi
          if grep -q "ensureFeatureStyles" app/loader-v2.js; then echo 'global feature stylesheet gate returned'; exit 1; fi
          grep -q "viewLoader.prepare(requested)" app/loader-v2.js
          grep -q "calendar-ui.css?v=8" app/view-loader.js
          grep -q "task-layout.css?v=4" app/view-loader.js
          grep -q "project-system-v3.css?v=15" app/view-loader.js
          grep -q "library-upload.css?v=2" app/view-loader.js
          grep -q "meeting-ui.css?v=10" app/view-loader.js
          grep -q "web1-press.css?v=1" app/view-loader.js
          grep -q "web1-board.css?v=2" app/view-loader.js
          grep -q "suborganizations.css?v=5" app/view-loader.js
          grep -q "runtime-client.js" app/loader-v2.js
          grep -q "auth-service.js" app/loader-v2.js
          grep -q "capabilities.js?v=3" app/loader-v2.js
          grep -q "KPTURuntime.session.ensure" app/loader-v2.js
          grep -Fq "document.body.classList.toggle('kptu-workspace-shell',id==='appView')" app/team.js
          grep -q "__KPTU_BOOT_MEMBERSHIP_PROMISE__" app/loader-v2.js
          grep -q "workspacePrefetchStart" app/loader-v2.js
          grep -q "prefetched?.ok?prefetched.rows" app/team.js
          if grep -q "public-workspace.js" app/loader-v2.js; then echo 'anonymous Web2 boot returned to the public workspace'; exit 1; fi
          grep -q "pwa.js?v=6" app/loader-v2.js
          grep -q 'class="brand-icon" src="./app-icon.svg?v=20260924-unicorn3"' app/index.html
          grep -q 'rel="manifest" href="./windows-manifest.json?v=6"' app/index.html
          if grep -q 'class="leaf"' app/index.html; then echo 'green first-paint brand placeholder returned'; exit 1; fi
          if grep -Eq "favicon|apple-touch-icon|createElement\\('link'\\)" app/pwa.js; then echo 'PWA bootstrap returned to late icon mutation'; exit 1; fi
          if grep -R -q "20260913-3" app/index.html app/pwa.js app/windows-manifest.json app/sw.js; then echo 'stale Web2 icon version returned'; exit 1; fi
          if grep -R -q "20260924-unicorn2" app/index.html app/windows-manifest.json app/sw.js; then echo 'poisoned Web2 icon URL returned'; exit 1; fi
          grep -q "const immutableAsset = versionedAsset && upstream.ok" cloudflare/bokdoong-router.mjs
          if grep -q "home-dashboard-v2.js" app/view-loader.js; then echo 'removed home route returned'; exit 1; fi
          grep -q "topbar-actions.js?v=10" app/loader-v2.js
          grep -q "team.js?v=51" app/loader-v2.js
          grep -q "project-system-v3.js?v=25" app/view-loader.js
          grep -q "task-workflow.js?v=9" app/view-loader.js
          grep -q "__KPTU_TASK_WORKFLOW_READY__" app/view-loader.js
          grep -q "task-row-view.js?v=1" app/view-loader.js
          grep -q "task-layout.js?v=13" app/view-loader.js
          grep -q "google-tasks.js?v=7" app/view-loader.js
          grep -q "library-upload.js?v=15" app/view-loader.js
          grep -q "project-catalog.js?v=1" app/view-loader.js
          grep -q "__KPTU_TASK_LAYOUT_READY__" app/view-loader.js
          if grep -Eq "profile-settings.js|myspace-return.js" app/loader-v2.js app/view-loader.js; then echo 'removed personal view module was loaded'; exit 1; fi
          test ! -f app/home-task-controls.js
          test ! -f app/home-task.css
          test ! -f app/library-public-toggle.js
          if grep -Eq "home-task-controls|home-task.css|library-public-toggle" app/loader-v2.js app/view-loader.js app/styles.css; then echo 'retired home/library decorator returned'; exit 1; fi
          grep -q "photo-room.js?v=6" app/view-loader.js
          grep -q "web1-board.js?v=3" app/view-loader.js
          grep -q "meeting-round-detail.js?v=14" app/view-loader.js
          grep -q "__KPTU_MEETING_ROUND_DETAIL_READY__" app/view-loader.js
          if grep -q 'mobile-dock.js' app/loader-v2.js app/view-loader.js; then echo 'obsolete personal dock returned'; exit 1; fi
          if grep -Eq "notification-center-ui|__KPTU_NOTIFICATION_CENTER_READY__|push-notifications-ui" app/loader-v2.js app/view-loader.js app/styles.css; then echo 'notification runtime returned'; exit 1; fi
          test ! -e app/notification-center-ui.js
          test ! -e app/notification-center-ui.css
          test ! -e app/push-notifications-ui.js
          grep -q "calendar-plus.js?v=9" app/view-loader.js
          grep -q "__KPTU_CALENDAR_PLUS_READY__" app/view-loader.js
          grep -q "calendar-persistence.js?v=13" app/view-loader.js
          grep -q "__KPTU_CALENDAR_PERSISTENCE_READY__" app/view-loader.js
          grep -q "calendar-interactions-v2.js?v=8" app/view-loader.js
          grep -q "__KPTU_CALENDAR_INTERACTIONS_READY__" app/view-loader.js
          grep -q "calendar-mobile-ui.js?v=5" app/view-loader.js
          grep -q "__KPTU_CALENDAR_MOBILE_UI_READY__" app/view-loader.js
          grep -q "calendar-day-overflow.js?v=3" app/view-loader.js
          grep -q "__KPTU_CALENDAR_DAY_OVERFLOW_READY__" app/view-loader.js

          grep -q "topbar-actions.css?v=8" app/styles.css
          grep -q "team.css?v=4" app/styles.css
          if grep -q "profile-settings.css" app/styles.css; then echo 'removed personal view stylesheet was loaded'; exit 1; fi
          if grep -q 'mobile-dock.css' app/styles.css; then echo 'obsolete personal dock style returned'; exit 1; fi
          grep -q "task-layout.css?v=4" app/styles.css
          grep -q "google-tasks.css?v=4" app/styles.css
          grep -q "library-upload.css?v=2" app/styles.css
          grep -q "meeting-ui.css?v=10" app/styles.css
          grep -q "calendar-ui.css?v=8" app/styles.css
          if grep -Eq "page-editor-static|page-core\.css|page-builder\.css" app/styles.css; then echo 'retired Web2 page editor styles returned'; exit 1; fi
          grep -q "project-system-v3.css?v=15" app/styles.css
          grep -q "#authView{display:none!important}" app/base-ui.css
          grep -q "#appView:not(.kptu-ui-ready)" app/base-ui.css
          grep -Fq "[data-kptu-logout]" app/topbar-actions.css
          grep -q "logoutButtons.forEach" app/topbar-actions.js
          if grep -Eq "teamManageTop|ccMessageTop|userBadge" app/topbar-actions.js; then echo 'removed personal or message action returned to the topbar'; exit 1; fi

          if grep -Eq "function taskProjectOptions|function taskProjectRows|function openTaskModal|saveTaskBtn.*saveTask|dataset\.taskToggle" app/team.js; then echo 'legacy task ownership returned to team.js'; exit 1; fi
          if grep -Eq "teamAssigned|팀에서 부여된 할 일|팀에서 부여 · 회의|내가 추가" app/task-layout.js; then echo 'team assignment task concept returned'; exit 1; fi
          if grep -Eq "meeting-action-assignee|mrdTaskAssignee|MRD_TEAM|mrdMemberOptions" app/task-workflow.js app/meeting-round-detail.js app/index.html; then echo 'meeting assignee selector returned'; exit 1; fi
          grep -q "function openCreate(projectId='')" app/task-layout.js
          grep -q "function projectOptions(selected='')" app/task-layout.js
          grep -q "metadata?.project_system==='v2'" app/task-layout.js
          grep -q "window.KPTUTaskLayout={openTask,openCreate}" app/task-layout.js
          grep -q "KPTUTaskLayout?.openCreate" app/project-system-v3.js
          if grep -q "할 일은 하위 프로젝트에 연결됩니다" app/project-system-v3.js; then echo 'top-level project task guard returned'; exit 1; fi
          grep -q "data-mrd-meeting" app/team.js
          grep -q "/functions/v1/meeting-files" app/team.js
          grep -q 'id="meetingTranscript"' app/index.html
          grep -q 'id="meetingNotes"' app/index.html
          grep -q 'id="meetingFiles" type="file" multiple' app/index.html
          grep -q "transcript_text:transcript" app/team.js
          grep -q "id=\"mrdSpecialSection\"" app/meeting-round-detail.js
          if grep -Eq 'meetingAutoClassify|meetingDecisions|wfMeetingLocation|wfMeetingAttendees' app/index.html app/team.js; then echo 'retired meeting fields returned'; exit 1; fi
          if grep -q "mrdAiDraft" app/meeting-round-detail.js; then echo 'retired meeting AI draft action returned'; exit 1; fi
          grep -q "function renderPages(){window.KPTUWeb1Board?.render?.()}" app/team.js
          grep -q "main_project_archive_state" app/web1-board.js
          grep -q "frame.srcdoc=injectReaderBridge" app/web1-board.js
          grep -q "repoPathFromCanonical" app/web1-board.js
          grep -q "kptu:web1-board:navigate" app/web1-board.js
          if grep -q "mj880616.github.io/work/" app/web1-board.js; then echo 'Web1 board returned to Pages document iframe'; exit 1; fi
          grep -q "web1-board.css?v=2" app/styles.css
          grep -q "#web1BoardDetailModal .w1b-detail-card" app/web1-board.css
          grep -q "height:100dvh" app/web1-board.css
          grep -q "#web1BoardDetailModal .w1b-detail-frame" app/web1-board.css
          grep -q "if(!forced||document.querySelector('#startupDiagCopy'))return;" app/app.js
          if grep -q "(!forced&&!slow)" app/app.js; then echo 'startup diagnostics returned to automatic slow-load UI'; exit 1; fi
          grep -q "const WORK_ORIGIN='https://work.bokdoong.com'" app/web1-board.js
          grep -q "/work/2in1/" app/web1-board.js
          grep -q "https://raw.githubusercontent.com/mj880616/work/main/" app/web1-board.js
          grep -q 'sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-downloads"' app/index.html
          if grep -Eq "public-policy|/press/" app/web1-board.js; then echo 'library or press leaked into Web1 board'; exit 1; fi

          test ! -e app/public-workspace.js
          test ! -e app/public-workspace-extras.js
          test ! -e app/public-workspace.css
          test ! -e app/public-page-links.js
          if grep -q "app_public_project" p/public-post.js; then echo 'public project URL RPC returned'; exit 1; fi
          if grep -REq "public-workspace|public-page-links|app_public_workspace_index" app/loader-v2.js app/app-router.js app/view-loader.js app/app.js; then echo 'Web2 runtime returned to a public workspace path'; exit 1; fi
          if grep -Eq "publicHomeAvailable|kptu-public-workspace" app/app-router.js; then echo 'router returned to an anonymous Web2 route'; exit 1; fi
          if grep -Eq "resource.visibility==='public'|resource.project_public===true" app/capabilities.js; then echo 'Web2 capability returned to an anonymous read fallback'; exit 1; fi
          grep -q "route:'login'" app/loader-v2.js
          grep -q "kptu-session-pending" app/index.html app/static-gates.css app/loader-v2.js
          grep -q "auth-service.js" app/login/index.html
          grep -q "KPTUAuth" app/login/login.js
          grep -q "KPTUCapabilities" app/capabilities.js
          if grep -Eq "publicBackLink|로그인 없이 공개 업무 보기" app/login/index.html app/login/login.js; then echo 'login returned to the retired Web2 public workspace'; exit 1; fi

          if grep -q "auth-ui.js" app/loader-v2.js app/app.js; then echo 'legacy in-app authentication UI returned'; exit 1; fi
          if grep -q "team.js" app/app.js; then echo 'workspace modules bypass session boundary'; exit 1; fi
          if grep -Eq "task-child-project-guard.js|task-status-state.js|task-assignment-visibility.js|meeting-assignee-picker.js|meeting-file-route.js|calendar-defaults.js|page-editor-fix.js|page-inline-viewer.js" app/loader-v2.js; then echo 'legacy correction module returned'; exit 1; fi
          if grep -q "MutationObserver" app/loader-v2.js app/topbar-actions.js app/task-workflow.js app/meeting-round-detail.js app/library-upload.js; then echo 'core readiness returned to mutation polling'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/topbar-actions.js app/task-workflow.js app/meeting-round-detail.js app/library-upload.js; then echo 'core styles returned to runtime injection'; exit 1; fi
          if grep -q "createElement('link')" app/team.js; then echo 'team css must stay static'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/access-approval.js app/home-dashboard-v2.js app/photo-room.js; then echo 'core UI returned to dynamic style injection'; exit 1; fi
          if grep -q "localStorage\|SESSION_KEY\|kptu_collab_session_v1" app/photo-room.js; then echo 'core UI bypassed shared runtime session'; exit 1; fi
          if grep -q "location.reload" app/photo-room.js; then echo 'feature returned to full-page reload'; exit 1; fi
          if grep -Eq "eventRecordSection|eventRecordList|renderRecordList|일정 기록" app/photo-room.js; then echo 'calendar schedule record section returned'; exit 1; fi


      - name: Check Design System 1.0 invariants
        run: |
          set -e
          for token in \
            --kptu-bg --kptu-surface --kptu-ink --kptu-muted --kptu-border \
            --kptu-primary --kptu-success --kptu-warning --kptu-danger --kptu-info \
            --kptu-space-1 --kptu-space-2 --kptu-space-3 --kptu-space-4 --kptu-space-5 --kptu-space-6 \
            --kptu-radius-sm --kptu-radius-md --kptu-radius-lg \
            --kptu-control-height --kptu-action-compact-height; do
            grep -q -- "$token" app/base-ui.css || { echo "missing design token: $token"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          managed={
            'team.css','team-member-overview.css','team-profile-view.css','team-member-management.css',
            'profile-settings.css','workplace-detail.css','suborganizations.css',
            'access-approval.css',
            'photo-room.css','topbar-actions.css','calendar-ui.css','task-layout.css',
            'google-tasks.css','library-upload.css','project-system-v3.css','meeting-ui.css'
          }
          # Exact feature exception: calendar event source marker uses an inset shadow, not card elevation.
          shadow_allow={('calendar-ui.css','inset 3px 0 rgba(255,255,255,.22)')}
          errors=[]
          for name in sorted(managed):
            path=Path('app')/name
            text=path.read_text(encoding='utf-8')
            for value in re.findall(r'border-radius\s*:\s*([^;}]+)',text):
              value=value.strip()
              if 'var(--kptu-radius-' not in value and value!='999px':
                errors.append(f'{name}: raw radius {value}')
            for value in re.findall(r'box-shadow\s*:\s*([^;}]+)',text):
              value=value.strip()
              if value=='none' or 'var(--kptu-shadow-' in value or (name,value) in shadow_allow:
                continue
              errors.append(f'{name}: raw shadow {value}')
          if errors:
            print('\n'.join(errors)); sys.exit(1)
          PY

      - name: Check calendar explicit-render invariants
        run: |
          set -e
          grep -q "window.KPTUCalendarMonthView={render,visibleRange,setNavigate" app/calendar-month-view.js
          grep -q "window.__KPTU_CALENDAR_MONTH_VIEW_READY__" app/calendar-month-view.js
          grep -q "calendar-month-view.js?v=6" app/view-loader.js
          grep -q "__KPTU_CALENDAR_MONTH_VIEW_READY__" app/view-loader.js
          grep -q "KPTUCalendarMonthView?.render?.(" app/team.js
          grep -q "window.__KPTU_RENDER_CALENDAR__=renderCalendar" app/team.js
          grep -q "window.KPTUCalendarPersistence={paint:" app/calendar-persistence.js
          grep -q "window.KPTUCalendarDayOverflow={apply,open}" app/calendar-day-overflow.js
          grep -q "calendar-ui.css?v=8" app/styles.css
          grep -q "id=\"googleCalendarPanel\"" app/team.js
          grep -q "visualViewport" app/calendar-month-view.js
          grep -q "cmvLaneSlots" app/calendar-month-view.js
          grep -q "calendarView:not(.hidden)::after" app/calendar-ui.css
          grep -q "10svh" app/calendar-ui.css
          if grep -Eq "calendarUpcoming|upcomingEvents|calendar-upcoming" app/index.html app/team.js app/calendar-ui.css; then echo 'retired calendar auxiliary list returned'; exit 1; fi
          if grep -q "paintAppEvents" app/team.js; then echo 'team.js returned to a competing app-event painter'; exit 1; fi
          if grep -q "grid.querySelectorAll('.cal-event.google')" app/calendar-persistence.js; then echo 'Google persistence returned to direct DOM painting'; exit 1; fi
          if grep -q "MutationObserver" app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar returned to DOM mutation correction'; exit 1; fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js app/calendar-interactions-v2.js; then echo 'calendar styles returned to runtime injection'; exit 1; fi
          if grep -Eq "setTimeout\([^,]+,(20|25|40|120|150|180|250|350|400)\)" app/calendar-month-view.js app/calendar-plus.js app/calendar-persistence.js app/calendar-day-overflow.js app/calendar-mobile-ui.js; then echo 'calendar returned to delayed render correction'; exit 1; fi

      - name: Check project single-render invariants
        run: |
          set -e
          grep -q 'id="newProjectBtn"' app/index.html
          grep -q "data-ps3-delete-project" app/project-system-v3.js
          grep -q 'owner_id=eq.${encodeURIComponent(userId)}' app/project-catalog.js
          grep -q 'catalog.fetchSpaces(wid,user.id)' app/project-system-v3.js
          grep -q "data-ps3-add-ws" app/project-system-v3.js
