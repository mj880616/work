  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check JavaScript syntax
        run: |
          set -e
          find app -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check meeting Korea time conversions
        run: node --test tests/meeting-time.test.mjs tests/seoul-time.test.mjs tests/time-input.test.mjs tests/meeting-compact.test.mjs tests/select-menu.test.mjs tests/calendar-week-timeline.test.mjs tests/calendar-drag-model.test.mjs tests/calendar-create-slot.test.mjs

      - name: Check shared UI parts stay unified (UI-화면정리 B)
        run: node --test tests/ui-cleanup-b.test.mjs

      - name: Check editor toolbar, add buttons and top bands stay unified (UI-화면정리 C)
        run: node --test tests/ui-cleanup-c.test.mjs
      - name: Check site audit fixes stay in the shared parts (UI-점검1030손질)
        run: node --test tests/ui-audit-1030.test.mjs
      - name: Check one shared loading/failed/empty part (UI-기다림표시통일)
        run: node --test tests/wait-state.test.mjs

      - name: Check Web2 app icon files (UI-앱아이콘 메모+체크)
        run: node --test tests/app-icon.test.mjs

      - name: Check shared Enter-to-save rule (UI-엔터저장)
        run: node --test tests/enter-save.test.mjs

      - name: Check Telegram raw lines phone layout (TG-원문폰배치)
        run: node --test tests/tg-raw-fold.test.mjs

      - name: Check organization key people tab (ORG-주요인물)
        run: node --test tests/org-key-people.test.mjs

      - name: Check home quiet organizations line (FEAT-1029묶음 ③)
        run: node --test tests/org-quiet.test.mjs
      - name: Check note views and sticky board (NOTE-보기3가지)
        run: node --test tests/note-board-model.test.mjs
      - name: Check note boards (NOTE-보드여러개)
        run: node --test tests/note-boards-model.test.mjs
      - name: Check small popup width and title drag (UI-창잘림·끌어옮기기)
        run: node --test tests/popup-fit-drag.test.mjs

      - name: Check ledger decision history (FEAT-1029묶음 ⑥)
        run: node --test tests/ledger-decision-history.test.mjs

      - name: Check meeting draft parser
        run: node --test tests/meeting-draft-parser.test.mjs

      - name: Check shared document deletion client
        run: node --test tests/document-delete.test.mjs

      - name: Check home KST day and week boundaries
        run: node --test tests/home-read-model.test.mjs tests/home-read-cache.test.mjs tests/data-freshness.test.mjs tests/collection-status.test.mjs tests/collection-cadence.test.mjs

      - name: Check telegram hourly send (new messages only, night rest, cumulative day summary)
        run: node --test tests/tg-feed-hourly.test.mjs

      - name: Check journal evening AI draft rules (today line draft, work calls only)
        run: node --test tests/journal-draft-model.test.mjs

      - name: Check next-week sheet rules (work calendar only, read-only materials, auto after Friday 15:00)
        run: node --test tests/next-week-sheet-model.test.mjs

      - name: Check press draft screen rules (ids only to the server, refs inside sources, AI-draft note text)
        run: node --test tests/press-draft-model.test.mjs

      - name: Check pre-meeting sheet rules (linked organization and meeting words, after 18:00 tomorrow only, shared sheet renderer)
        run: node --test tests/pre-meeting-sheet-model.test.mjs

      - name: Check phone bottom tab selection rule
        run: node --test tests/mobile-tab-selection.test.mjs tests/menu-model.test.mjs tests/home-cards-model.test.mjs tests/menu-home-prefs.test.mjs

      - name: Check basket data and sequential file uploads
        run: node --test tests/basket-data.test.mjs tests/basket-upload.test.mjs tests/basket-ocr-text.test.mjs tests/basket-ocr.test.mjs tests/basket-ocr-runtime.test.mjs tests/basket-classification.test.mjs tests/basket-link-records.test.mjs tests/basket-record-delete.test.mjs tests/basket-manual-link.test.mjs tests/reference-bundles-data.test.mjs tests/update-places-reference.test.mjs tests/basket-ai-summary.test.mjs tests/todo-radar-data.test.mjs tests/basket-note-tasks.test.mjs tests/basket-kind-filter.test.mjs tests/basket-library-send.test.mjs tests/diary-data.test.mjs tests/journal-data.test.mjs tests/journal-weekly.test.mjs tests/weekly-file-lines.test.mjs tests/journal-org-summary.test.mjs tests/journal-meeting-kinds.test.mjs tests/project-order.test.mjs tests/basket-file-docs.test.mjs tests/document-categories.test.mjs tests/basket-note-pin.test.mjs tests/update-requests.test.mjs tests/update-journal.test.mjs tests/task-files.test.mjs tests/task-note-files.test.mjs tests/file-actions.test.mjs tests/chip-no-ellipsis.test.mjs tests/color-swatch.test.mjs tests/grid-fr-guard.test.mjs tests/library-ai-fill.test.mjs tests/library-drop.test.mjs tests/quick-links.test.mjs tests/feed-model.test.mjs tests/call-personal-screen.test.mjs tests/call-user-edit.test.mjs tests/project-trash-model.test.mjs tests/summary-part-unify.test.mjs tests/tg-sender-model.test.mjs tests/tg-day-model.test.mjs tests/tg-mark-model.test.mjs tests/ai-tone.test.mjs tests/quick-links-groups.test.mjs tests/tg-summary-edit-model.test.mjs

      - name: TG-방고정 텔레그램 방 고정 칸 규칙·고정 읽기쓰기·메뉴 문구
        run: node --test tests/tg-room-pin.test.mjs

      - name: UI-고른것접기 긴 체크 목록 공용 부품(고른 것 + 접힌 그 외, 맨 위 찾기·초성) 시험
        run: node --test tests/pick-fold.test.mjs

      - name: Check folder depth limit and indent (LIB-폴더100단)
        run: node --test tests/folder-limits.test.mjs
      - name: NOTE-탐색기 노트 폴더 나무(순수 부분) 시험
        run: node --test tests/note-tree.test.mjs
      - name: NOTE-탐색기 후속 선택 상태·위치 줄 공용 부품 시험
        run: node --test tests/select-mode-folder-path.test.mjs
      - name: NOTE-비밀메모 판별(서버 note-secret.ts와 같은 규칙)·목록 제목 가리기 시험
        run: node --test tests/note-secret.test.mjs
      - name: NOTE-비밀메모 서버 쪽(AI 재료에서 비밀·AI 제외 노트 건너뛰기) 시험
        run: node --test tests/note-secret-server.test.mjs
      - name: SEC-github.io넘기기 github.io에서 열면 bokdoong.com으로 넘김 시험
        run: node --test tests/origin-redirect.test.mjs

      - name: Check library toggle tree model
        run: node --test tests/library-tree.test.mjs tests/library-bulk.test.mjs tests/library-view-pref.test.mjs tests/library-move.test.mjs tests/category-chips.test.mjs tests/org-dispute-stage-model.test.mjs tests/view-prefs.test.mjs tests/theme-contrast.test.mjs tests/theme-bootstrap.test.mjs tests/library-upload-organization.test.mjs tests/library-rename.test.mjs tests/library-photo.test.mjs tests/report-photos.test.mjs tests/library-photoset.test.mjs tests/activity-photo.test.mjs tests/report-views.test.mjs

      - name: Check split-resize column math
        run: node --test tests/split-resize-math.test.mjs

      - name: UI-칸안스크롤하나로 옆 칸 따라오기 계산 시험
        run: node --test tests/follow-pane-math.test.mjs

      - name: Check Drive copy refresh batching after saves
        run: node --test tests/drive-summary-refresh.test.mjs

      - name: Check pinned HWP editor files
        run: node --test tests/hwp-lab-pin.test.mjs

      - name: Check HWP union-style template and style shortcuts
        run: node --test tests/hwp-union-style.test.mjs

      - name: Check HWP union-form conversion (numbers, template pick, in-editor fill, engine line)
        run: node --test tests/hwp-convert.test.mjs

      - name: Check HWP editor fills the screen (phone, PC fullscreen, page-width refit)
        run: node --test tests/hwp-fill-screen.test.mjs

      - name: Meeting files·text grouping and pinned PDF reader
        run: node --test tests/meeting-file-parse.test.mjs tests/pdf-lib-pin.test.mjs

      - name: Meeting transcript → meeting record draft (MTG-녹음초안)
        run: node --test tests/meeting-transcript-model.test.mjs

      - name: Laptop recording rules (MTG-노트북녹음 2단계, segment roll·piece retry·text join·band words)
        run: node --test tests/meeting-recorder-model.test.mjs

      - name: Laptop recording discard and undo (버리기·되돌리기, owner check·other people's recording refused)
        run: node --test tests/meeting-recording-discard.test.mjs

      - name: Meeting card time, kind colors and PC layout
        run: node --test tests/meeting-when.test.mjs tests/meeting-columns.test.mjs tests/meeting-inline-edit.test.mjs tests/report-kinds.test.mjs tests/report-links.test.mjs

      - name: Markdown display pin and safety unit tests
        run: node --test tests/markdown-view.test.mjs tests/md-telegram.test.mjs tests/html-frame.test.mjs tests/note-markdown.test.mjs tests/basket-notes-data.test.mjs tests/number-shape.test.mjs

      - name: Unified editor pin, saved form and text export unit tests (ED-통합편집기)
        run: node --test tests/ed-editor.test.mjs tests/ed-window.test.mjs tests/update-window.test.mjs tests/record-doc.test.mjs tests/note-doc.test.mjs

      - name: Editor markdown paste unit tests (ED-폰마크다운붙여넣기 whole-text offer)
        run: node --test tests/ed-paste-markdown.test.mjs

      - name: Organization pickers offer only my organizations (ORG-고르기통일)
        run: node --test tests/org-picker-mine.test.mjs

      - name: Check English eyebrow cleanup
        run: node --test tests/english-labels.test.mjs

      - name: Global search model (SEARCH-전체검색 words, highlights, Google filters, groups, error codes)
        run: node --test tests/global-search-model.test.mjs

      - name: Ask Web2 answer box rules (FEAT-1029묶음 ① question detection, evidence refs, open targets)
        run: node --test tests/ask-web2-model.test.mjs

      - name: Ledger import checker (CSV·xlsx·import file, synthetic sheet)
        run: node --test tests/ledger-import-model.test.mjs tests/ledger-browse-model.test.mjs tests/ledger-candidate-model.test.mjs tests/ledger-export-model.test.mjs tests/ledger-auto-model.test.mjs tests/calendar-ref-model.test.mjs tests/ledger-fix-model.test.mjs tests/overlap-model.test.mjs tests/overlap-paths.test.mjs tests/overlap-weekly.test.mjs tests/ledger-merge-model.test.mjs

      - name: Check diary OneDrive folder switches (JOURNAL-일기원드라이브, synthetic)
        run: node --test tests/diary-onedrive-folders.test.mjs

      - name: Check OneDrive photo queue (OD-속도, visible first, limited at once, synthetic)
        run: node --test tests/od-thumb-loader.test.mjs

      - name: Check photo share shared part (OD-공유고침, share the shown photo, synthetic)
        run: node --test tests/photo-share.test.mjs

      - name: Check OneDrive small-picture copies on the phone (OD-폰보관, cache key·limits·cleanup·one audit allowance, synthetic)
        run: node --test tests/od-thumb-cache.test.mjs

      - name: Check picture cells (PHOTO-못받은사진, gray while loading, small retry mark when failed, every image place uses it, synthetic)
        run: node --test tests/img-slot.test.mjs

      - name: Check OneDrive warm-up after app start (OD-미리받기, status·this month·few small pictures in memory, synthetic)
        run: node --test tests/od-warm.test.mjs

