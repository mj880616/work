          for token in \
            --kptu-bg --kptu-surface --kptu-ink --kptu-muted --kptu-border \
            --kptu-primary --kptu-success --kptu-warning --kptu-danger --kptu-info \
            --kptu-space-1 --kptu-space-2 --kptu-space-3 --kptu-space-4 --kptu-space-5 --kptu-space-6 \
            --kptu-radius-sm --kptu-radius-md --kptu-radius-lg \
            --kptu-control-height --kptu-action-compact-height; do
            grep -q -- "$token" app/base-ui.css || { echo "missing design token: $token"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          managed={
            'team.css',
            'profile-settings.css','workplace-detail.css','suborganizations.css',
            'topbar-actions.css','calendar-ui.css','task-layout.css',
            'google-tasks.css','library-upload.css','project-system-v3.css','meeting-ui.css'
          }
          # Exact feature exception: calendar event source marker uses an inset shadow, not card elevation.
          shadow_allow={('calendar-ui.css','inset 3px 0 rgba(255,255,255,.22)')}
          errors=[]
          for name in sorted(managed):
            path=Path('app')/name
            text=path.read_text(encoding='utf-8')
            for value in re.findall(r'border-radius\s*:\s*([^;}]+)',text):
              value=value.strip()
              if 'var(--kptu-radius-' not in value and value!='999px':
                errors.append(f'{name}: raw radius {value}')
            for value in re.findall(r'box-shadow\s*:\s*([^;}]+)',text):
              value=value.strip()
              if value=='none' or 'var(--kptu-shadow-' in value or (name,value) in shadow_allow:
                continue
              errors.append(f'{name}: raw shadow {value}')
          if errors:
            print('\n'.join(errors)); sys.exit(1)
          PY

