name: Build Windows app (legacy/manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows-app/KPTUWork.csproj -r win-x64

      - name: Publish Windows x64
        run: dotnet publish windows-app/KPTUWork.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/KPTUWork

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'publish/KPTUWork/KPTUWork.exe'
          if (-not (Test-Path $exe)) { throw 'KPTUWork.exe was not produced.' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          if (Test-Path 'KPTUWork-win-x64.zip') { Remove-Item 'KPTUWork-win-x64.zip' -Force }
          Compress-Archive -Path 'publish/KPTUWork/*' -DestinationPath 'KPTUWork-win-x64.zip' -CompressionLevel Optimal

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KPTUWork-win-x64
          path: KPTUWork-win-x64.zip
          if-no-files-found: error
          retention-days: 30
