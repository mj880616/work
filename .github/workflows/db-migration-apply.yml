name: Approved DB migration workflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check/tx-probe or approved migration dry-run/apply/rollback'
        required: true
        type: choice
        default: check
        options: [check, tx-probe, dry-run, apply, rollback]
      version:
        description: 'migration file name (<version>_<name>.sql) or 14-digit version; leave blank for check/tx-probe'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: supabase-production-db
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      DB_MODE: ${{ inputs.mode }}
      DB_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate inputs and show full SQL before approval
        run: node scripts/ops/db-workflow.mjs plan
      - name: Record approved main source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf '\nMain source SHA: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-edge
    env:
      DB_MODE: ${{ inputs.mode }}
      DB_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the main SHA reviewed in plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Run only the approved DB mode
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DB_SNAPSHOT_DIR: ${{ runner.temp }}/db-snapshot
        run: node scripts/ops/db-workflow.mjs run
      # Catalog-only snapshot (no row values; checked before approval). Public
      # repository: treat this artifact as public. Never contains responses of
      # prechecks/postchecks, tokens or table data.
      - name: Keep the pre-apply snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/db-snapshot/
          if-no-files-found: ignore
          retention-days: 30
