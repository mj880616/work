name: Profile single-render check

on:
  push:
    branches: [main]
    paths:
      - 'app/profile-settings.js'
      - 'app/profile-settings.css'
      - 'app/loader-v2.js'
      - 'app/styles.css'
      - 'tests/app-e2e/profile-workplaces*'
      - 'tests/app-e2e/calendar-ref-settings.spec.mjs'
      - 'app/calendar-ref-settings.js'
      - '.github/workflows/profile-single-render-check.yml'
      - '.github/actions/setup-playwright/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/profile-settings.js'
      - 'app/profile-settings.css'
      - 'app/loader-v2.js'
      - 'app/styles.css'
      - 'tests/app-e2e/profile-workplaces*'
      - 'tests/app-e2e/calendar-ref-settings.spec.mjs'
      - 'app/calendar-ref-settings.js'
      - '.github/workflows/profile-single-render-check.yml'
      - '.github/actions/setup-playwright/**'

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check legacy profile fixture is excluded from the production shell
        run: |
          set -e
          test -f app/profile-settings.js
          test -f app/profile-settings.css
          test ! -f app/profile-workplace-edit-mode.js
          test ! -f app/profile-workplace-legacy.js
          test ! -f app/profile-workplace-sync.js
          if grep -q "profile-settings.css" app/styles.css; then echo 'removed profile stylesheet returned to production'; exit 1; fi
          if grep -q "profile-settings.js" app/loader-v2.js; then echo 'removed profile view returned to production'; exit 1; fi
          grep -q "id=\"psSave\"" app/profile-settings.js
          grep -q "ps-legacy-chip" app/profile-settings.js
          grep -q "산하조직 연결 전" app/profile-settings.js
          # 화면정리 A1(2026-10-28): 로그아웃은 메뉴(계정) 한 곳에만 — 프로필 화면 안에 다시 두지 않는다.
          if grep -q "id=\"psLogout\"" app/profile-settings.js; then echo "profile logout duplicated in the profile view"; exit 1; fi
          if grep -Eq "profile-workplace-edit-mode|profile-workplace-legacy|profile-workplace-sync" app/loader-v2.js; then
            echo 'profile post-render correction module returned to active loader'; exit 1
          fi
          if grep -q "MutationObserver" app/profile-settings.js; then
            echo 'profile renderer returned to MutationObserver correction'; exit 1
          fi
          if grep -q "createElement('style')\|createElement(\"style\")" app/profile-settings.js; then
            echo 'profile styles returned to dynamic injection'; exit 1
          fi
          if grep -Eq "localStorage|kptu_collab_session_v1" app/profile-settings.js; then
            echo 'profile renderer bypassed shared runtime session'; exit 1
          fi
          node --check app/profile-settings.js

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
      - run: |
          python3 -m http.server 8123 >/tmp/profile-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8123/tests/app-e2e/profile-workplaces-fixture.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          exit 1
      - run: npx playwright test tests/app-e2e/profile-workplaces.spec.mjs tests/app-e2e/calendar-ref-settings.spec.mjs --browser=chromium --workers=1 --reporter=line,github
