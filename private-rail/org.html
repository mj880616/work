<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>민자철도 조직별 현황</title><link rel="icon" href="/work/favicon.svg?v=1" type="image/svg+xml">
<style>
:root{--bg:#f4f6f8;--ink:#18202a;--muted:#687383;--line:#e2e7ec;--navy:#17324d;--blue:#245786;--green:#28704b;--amber:#9a6514}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.58;word-break:keep-all}.wrap{max-width:880px;margin:auto;padding:18px 16px 56px}.back{display:inline-block;margin:0 0 12px;text-decoration:none;color:var(--blue);font-size:13px;font-weight:900}.hero{background:linear-gradient(135deg,#142a42,#245786);color:#fff;border-radius:20px;padding:27px 26px}.hero .eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:#c9d8e6}.hero h1{font-size:28px;margin:5px 0 8px}.hero p{margin:0;color:#dce8f2;font-size:14px}.hero-meta{margin-top:11px;font-size:11px;color:#c8d7e5}.section{margin-top:20px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 2px 9px}.section-head h2{font-size:18px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.current-body{white-space:pre-wrap;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #cdd6de;background:#fff;color:#47515c;border-radius:9px;padding:8px 11px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.btn.primary{border:0;background:var(--navy);color:#fff}.btn.edit{color:var(--blue)}.btn.delete{color:#8a4650}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#44515f}.field input,.field textarea{width:100%;border:1px solid #ccd5dd;border-radius:10px;padding:10px 11px;font:inherit;font-size:13px;background:#fff}.field textarea{min-height:150px;resize:vertical}.status{font-size:12px;color:var(--muted);margin-top:8px}.note{font-size:11px;color:#76501a;background:#fff8ea;border:1px solid #f0d8a9;border-radius:11px;padding:10px 11px;margin-top:10px}.history{display:grid;gap:9px}.history-item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.history-item summary{cursor:pointer;list-style:none;padding:13px 14px;display:flex;justify-content:space-between;gap:10px}.history-item summary::-webkit-details-marker{display:none}.history-title strong{display:block;font-size:13px;color:var(--navy)}.history-title small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.history-body{padding:13px 14px;border-top:1px solid #edf0f3}.history-body p{white-space:pre-wrap;margin:0;font-size:13px}.legacy{opacity:.9}.empty{background:#fff;border:1px dashed #cbd3dc;border-radius:14px;padding:16px;color:var(--muted);font-size:12px}@media(max-width:650px){.wrap{padding:13px 11px 44px}.hero{padding:22px 19px}.hero h1{font-size:25px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="wrap"><a class="back" href="./">← 민자철도 사업 현황</a><header class="hero"><div class="eyebrow">민자철도 조직별 현황</div><h1 id="orgName">불러오는 중</h1><p id="orgSummary"></p><div class="hero-meta" id="orgUpdated"></div></header>
<section class="section"><div class="section-head"><h2>현재 상황</h2><button class="btn edit" id="quickEdit">한 줄 수정</button></div><div class="panel"><div class="current-body" id="currentBody"></div></div></section>
<section class="section"><div class="section-head"><h2>주간 업데이트</h2><span>저장 시 상단 현재상황도 함께 갱신</span></div><div class="panel"><div class="formgrid"><div class="field"><label>기준일</label><input id="updateDate" type="date"></div><div class="field"><label>작성자 / 직책 (선택)</label><input id="updateAuthor" maxlength="50"></div><div class="field full"><label>상단 한 줄 현황</label><input id="updateSummary" maxlength="220"></div><div class="field full"><label>상세 상황</label><textarea id="updateBody" maxlength="5000" placeholder="교섭·쟁의, 주요 현안, 대외·정책 대응, 다음 일정 등을 필요한 만큼 정리"></textarea></div><div class="field full"><label>마스터 비밀번호</label><input id="masterPassword" type="password" autocomplete="current-password"></div></div><div class="actions"><button class="btn primary" id="saveUpdate" data-action="save">주간 업데이트 저장</button><button class="btn" id="cancelEdit" hidden>수정 취소</button></div><div class="status" id="saveStatus"></div><div class="note">상단에는 한 줄만 표시되고, 상세 내용과 이전 기록은 이 페이지에 누적됨. 대외 공개가 곤란한 내부 교섭전략·개인정보는 입력하지 않는 것을 권장함.</div></div></section>
<section class="section"><div class="section-head"><h2>업데이트 기록</h2><span id="historyCount"></span></div><div class="history" id="history"></div></section>
<section class="section legacy" id="legacySection" hidden><div class="section-head"><h2>기존 임단투 기록</h2><span>기존 게시판 기록</span></div><div class="history" id="legacyHistory"></div></section>
</main><script src="./org-data.js?v=1"></script><script>
(()=>{'use strict';
const CARD_API='https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/pc0921-board?board=private_rail';
const BARGAIN_API='https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/pc0921-board?mode=bargaining';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('org');
const org=(window.PRIVATE_RAIL_ORGS||[]).find(x=>x.slug===slug);
if(!org){document.getElementById('orgName').textContent='조직을 찾을 수 없습니다.';document.getElementById('orgSummary').textContent='민자철도 사업 현황에서 조직을 다시 선택해 주세요.';return}
const key='rail_org_'+org.slug;let state={...org,history:[...(org.history||[])]},editingId=null,adminPw=null;
const fmt=v=>{if(!v)return'';const d=new Date(v.length===10?v+'T00:00:00+09:00':v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).format(d)};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function normalize(v){if(!v||typeof v!=='object')return;state={...org,...v,history:Array.isArray(v.history)?v.history:[...(org.history||[])]}}
function render(){document.title=`${org.name} · 민자철도 조직별 현황`;document.getElementById('orgName').textContent=org.name;document.getElementById('orgSummary').textContent=state.summary||org.summary;document.getElementById('orgUpdated').textContent='기준 '+fmt(state.updated_at||state.updated||org.updated);document.getElementById('currentBody').textContent=state.detail||org.detail;const list=[...(state.history||[])].sort((a,b)=>String(b.date||b.created_at||'').localeCompare(String(a.date||a.created_at||'')));document.getElementById('historyCount').textContent=list.length+'건';document.getElementById('history').innerHTML=list.length?list.map(x=>`<details class="history-item"><summary><div class="history-title"><strong>${esc(x.summary||'업데이트')}</strong><small>${esc(fmt(x.date||x.created_at))}${x.author?' · '+esc(x.author):''}</small></div><span>＋</span></summary><div class="history-body"><p>${esc(x.body||'')}</p>${String(x.id||'').startsWith('baseline-')?'':`<div class="actions"><button class="btn edit" data-history-edit="${esc(x.id)}">수정</button><button class="btn delete" data-history-delete="${esc(x.id)}">삭제</button></div>`}</div></details>`).join(''):'<div class="empty">업데이트 기록이 없습니다.</div>';if(!editingId){document.getElementById('updateDate').value=today();document.getElementById('updateSummary').value=state.summary||org.summary;document.getElementById('updateBody').value=''}}
async function load(){try{const r=await fetch(CARD_API,{cache:'no-store'});if(r.ok){const rows=await r.json();const row=Array.isArray(rows)?rows.find(x=>x.item_key===key):null;if(row?.value)normalize(row.value)}}catch(e){}render();loadLegacy()}
function password(){if(adminPw)return adminPw;const field=document.getElementById('masterPassword');if(field.value.trim()){adminPw=field.value.trim();return adminPw}const p=prompt('마스터 비밀번호를 입력하세요.');if(p===null)return null;adminPw=p.trim();field.value=adminPw;return adminPw}
async function persist(next){const pw=password();if(pw===null)return false;const status=document.getElementById('saveStatus');status.textContent='저장 중…';try{const r=await fetch(CARD_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_key:key,value:next,master_password:pw})});let data={};try{data=await r.json()}catch{}if(!r.ok){if(r.status===403&&data.error==='password'){adminPw=null;document.getElementById('masterPassword').value='';status.textContent='마스터 비밀번호가 올바르지 않습니다.';return false}throw new Error('save')}state=next;status.textContent='저장되었습니다.';render();return true}catch(e){status.textContent='저장하지 못했습니다.';return false}}
async function saveUpdate(){const date=document.getElementById('updateDate').value,summary=document.getElementById('updateSummary').value.trim(),body=document.getElementById('updateBody').value.trim(),author=document.getElementById('updateAuthor').value.trim();if(!date||!summary||!body){document.getElementById('saveStatus').textContent='기준일, 한 줄 현황, 상세 상황을 입력해 주세요.';return}const history=[...(state.history||[])];const now=new Date().toISOString();if(editingId){const i=history.findIndex(x=>String(x.id)===String(editingId));if(i>=0)history[i]={...history[i],date,summary,body,author:author||null,updated_at:now}}else history.push({id:'u'+Date.now().toString(36),date,summary,body,author:author||null,created_at:now});const next={...state,summary,detail:body,updated_at:now,history};if(await persist(next)){editingId=null;document.getElementById('saveUpdate').textContent='주간 업데이트 저장';document.getElementById('cancelEdit').hidden=true;document.getElementById('updateAuthor').value='';document.getElementById('updateBody').value=''}}
async function quickEdit(){const t=prompt(`${org.name} 현재 상황 한 줄`,state.summary||org.summary);if(t===null||!t.trim())return;await persist({...state,summary:t.trim(),updated_at:new Date().toISOString()})}
function startEdit(id){const x=(state.history||[]).find(v=>String(v.id)===String(id));if(!x)return;editingId=id;document.getElementById('updateDate').value=x.date||today();document.getElementById('updateSummary').value=x.summary||'';document.getElementById('updateBody').value=x.body||'';document.getElementById('updateAuthor').value=x.author||'';document.getElementById('saveUpdate').textContent='수정 저장';document.getElementById('cancelEdit').hidden=false;document.querySelector('.section:nth-of-type(2)')?.scrollIntoView({behavior:'smooth',block:'start'})}
async function remove(id){if(!confirm('이 업데이트 기록을 삭제하시겠습니까?'))return;const history=(state.history||[]).filter(x=>String(x.id)!==String(id));const newest=[...history].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];const next={...state,history,summary:newest?.summary||org.summary,detail:newest?.body||org.detail,updated_at:new Date().toISOString()};await persist(next)}
function cancel(){editingId=null;document.getElementById('saveUpdate').textContent='주간 업데이트 저장';document.getElementById('cancelEdit').hidden=true;render()}
const norm=s=>String(s||'').toLowerCase().replace(/[\s·\-_/()]/g,'');
function matches(name){const n=norm(name);return (org.aliases||[org.name]).some(a=>{const x=norm(a);return n===x||n.includes(x)||x.includes(n)})}
async function loadLegacy(){try{const r=await fetch(BARGAIN_API,{cache:'no-store'});if(!r.ok)return;const rows=await r.json();const list=Array.isArray(rows)?rows.filter(x=>matches(x.workplace)):[];if(!list.length)return;document.getElementById('legacySection').hidden=false;document.getElementById('legacyHistory').innerHTML=list.map(x=>`<details class="history-item"><summary><div class="history-title"><strong>${esc(x.workplace)}</strong><small>${esc(fmt(x.created_at))}${x.author?' · '+esc(x.author):''}</small></div><span>＋</span></summary><div class="history-body"><p>${esc(x.status_text)}</p></div></details>`).join('')}catch(e){}}
document.getElementById('saveUpdate').onclick=saveUpdate;document.getElementById('quickEdit').onclick=quickEdit;document.getElementById('cancelEdit').onclick=cancel;document.getElementById('history').addEventListener('click',e=>{const a=e.target.closest('[data-history-edit]');if(a){e.preventDefault();startEdit(a.dataset.historyEdit);return}const d=e.target.closest('[data-history-delete]');if(d){e.preventDefault();remove(d.dataset.historyDelete)}});render();load();
})();
</script></body></html>
