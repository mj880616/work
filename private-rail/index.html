<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민자철도 사업 현황</title><meta name="description" content="민자철도 공영화·운영기준·임단투·부실운영 방지법 사업 진행 현황"><link rel="canonical" href="https://mj880616.github.io/work/private-rail/"><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:title" content="민자철도 사업 현황"><meta property="og:description" content="2024년부터 이어진 민자철도 공공성·안전 강화 공동사업 현황"><meta property="og:url" content="https://mj880616.github.io/work/private-rail/"><link rel="icon" href="/work/favicon.svg?v=1" type="image/svg+xml"></head><body>
<script src="./materials-data.js"></script>
<script>
(async()=>{
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const item=([id,title,type])=>`<div class="material-item"><div class="material-title"><strong>${esc(title)}</strong><small>${esc(type||'PDF')}</small></div><div class="material-actions"><a class="material-btn" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view">보기</a><a class="material-btn download" href="https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}">다운로드</a></div></div>`;
  const category=c=>{const files=Array.isArray(c.files)?c.files:[];const first=files.slice(0,5),rest=files.slice(5);return `<details class="material-cat"><summary><span>${esc(c.no)} · ${esc(c.name)}</span><span class="material-cat-count">${files.length}개</span></summary><div class="material-body">${files.length?`<div class="material-list">${first.map(item).join('')}</div>${rest.length?`<details class="material-more"><summary>자료 ${rest.length}개 더보기</summary><div class="material-list">${rest.map(item).join('')}</div></details>`:''}`:'<div class="material-empty">등록된 자료가 없습니다.</div>'}<div class="material-folder-row"><a class="material-folder" target="_blank" rel="noopener" href="${esc(c.folder)}">${esc(c.name)} 폴더 ${files.length?'전체보기':'열기'} →</a></div></div></details>`};
  const materials=`<section class="section" id="materials"><div class="section-head"><h2>민자철도 자료실</h2><span>Google Drive</span></div><p class="material-note">자료는 Google Drive에 보관하며, 분류별 폴더와 개별 파일을 바로 열거나 내려받을 수 있습니다.</p><div class="material-board">${(window.PRIVATE_RAIL_MATERIALS||[]).map(category).join('')}</div></section>`;
  const r=await fetch('./page.html?v=1',{cache:'no-store'}); if(!r.ok) throw new Error('page');
  let html=await r.text();
  const start=html.indexOf('<section class="section" id="materials">');
  const end=html.indexOf('<section class="section">',start+1);
  if(start<0||end<0) throw new Error('materials');
  html=html.slice(0,start)+materials+'\n'+html.slice(end);
  document.open();document.write(html);document.close();
})().catch(()=>location.replace('./page.html'));
</script></body></html>
