<!doctype html><html><head><meta charset="utf-8"><title>suborganization filters fixture</title></head><body>
<div id="teamView"><section id="soTeamSection"><div id="soOrganizationList" class="so-list">
<article class="so-card" data-so-org="org-rail"><h4>전국철도노동조합</h4><button data-so-edit="org-rail">수정</button></article>
<article class="so-card" data-so-org="org-consumer"><h4>한국소비자원지부</h4><button data-so-edit="org-consumer">수정</button></article>
<article class="so-card" data-so-org="org-empty"><h4>미지정조직</h4><button data-so-edit="org-empty">수정</button></article>
</div></section></div>
<div id="soEditModal" class="modal hidden"><div class="modal-card"><label>조직명<input id="soEditName"></label><label>약칭<input id="soEditAliases"></label><label>설명<textarea id="soEditDescription"></textarea></label><button id="soSaveOrg">저장</button></div></div>
<script>
const now=Date.now();
window.__patches=[];
window.KPTURuntime={session:{ensure:async()=>true},api:async(path,opt={})=>{
 if(path==='/auth/v1/user')return {id:'user-me',user_metadata:{display_name:'김명진'}};
 if(path.startsWith('/rest/v1/app_workspace_members?user_id='))return [{workspace_id:'ws-1'}];
 if(path==='/rest/v1/app_profiles?select=user_id,display_name')return [{user_id:'user-me',display_name:'김명진'},{user_id:'user-other',display_name:'한소영'}];
 if(path.startsWith('/rest/v1/app_suborganizations?workspace_id=eq.ws-1&active=eq.true'))return [
  {id:'org-rail',name:'전국철도노동조합',aliases:['철도노조'],description:'철도',organization_type:'철도·도시철도',default_assignee_name:'김명진'},
  {id:'org-consumer',name:'한국소비자원지부',aliases:['소비자원'],description:'소비자 정책',organization_type:'중앙공공기관',default_assignee_name:'한소영'},
  {id:'org-empty',name:'미지정조직',aliases:[],description:'',organization_type:'미분류',default_assignee_name:null}
 ];
 if(path==='/rest/v1/app_suborganization_assignees?select=organization_id,user_id')return [{organization_id:'org-consumer',user_id:'user-other'}];
 if(path==='/rest/v1/app_suborganization_updates?select=organization_id,occurred_at&order=occurred_at.desc')return [
  {organization_id:'org-rail',occurred_at:new Date(now-3*86400000).toISOString()},
  {organization_id:'org-consumer',occurred_at:new Date(now-45*86400000).toISOString()}
 ];
 if(path.startsWith('/rest/v1/app_suborganizations?id=eq.')&&opt.method==='PATCH'){window.__patches.push({path,body:opt.body});return null}
 return [];
}};
document.querySelectorAll('[data-so-edit]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('#soEditModal').classList.remove('hidden');document.querySelector('#soEditName').value=btn.closest('.so-card').querySelector('h4').childNodes[0].textContent.trim()}));
document.querySelector('#soSaveOrg').onclick=async()=>{document.querySelector('#soEditModal').classList.add('hidden')};
</script>
<script type="module" src="/app/suborganization-filters.js"></script>
</body></html>
