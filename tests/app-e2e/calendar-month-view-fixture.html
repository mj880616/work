<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app/base-ui.css">
<link rel="stylesheet" href="/app/team.css">
<link rel="stylesheet" href="/app/calendar-ui.css">
<title>Month View Fixture</title>
<style>
  .fixture-top{height:170px}
  @media(min-width:761px){.fixture-top{height:150px}}
</style>
</head>
<body class="kptu-workspace-shell">
<div class="fixture-top" aria-hidden="true"></div>
<button id="newEventBtn" type="button" style="position:fixed;top:2px;left:2px;z-index:50">+ 일정</button>
<div id="eventModal" class="hidden" aria-hidden="true">
  <input id="eventTitle" type="text">
  <select id="eventTarget"><option value="web2">Web2</option><option value="google">Google</option></select>
  <input id="eventAllDay" type="checkbox">
  <input id="eventStartDate" type="date">
  <input id="eventStartTime" type="time">
  <input id="eventEndDate" type="date">
  <input id="eventEndTime" type="time">
</div>
<main>
  <div id="appView" class="kptu-ui-ready">
    <section id="calendarView" class="view-panel">
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
  </div>
</main>
<div id="toast" class="toast hidden"></div>
<script>
  window.__navDelta=0;
  window.__KPTU_CALENDAR_MOVE_MONTH__=delta=>{window.__navDelta=delta};
  window.KPTUA11y={dialog:{activate:()=>{},deactivate:()=>{}}};
</script>
<script src="/app/calendar-month-view.js"></script>
<script src="/app/calendar-day-overflow.js"></script>
<script>
  document.querySelector('#newEventBtn').addEventListener('click',()=>{
    const modal=document.querySelector('#eventModal');
    modal.classList.remove('hidden');
    modal.setAttribute('aria-hidden','false');
  });
</script>
<script src="/app/calendar-plus.js"></script>
<script src="/app/calendar-interactions-v2.js"></script>
<script>
  window.__appEvents=[
    {id:'app-1',title:'Web2 긴 일정 제목이 셀 너비를 넘는 경우 말줄임 확인',start_at:'2026-09-03T09:00:00+09:00',end_at:'2026-09-03T10:00:00+09:00',color_hex:'#7656a8',project_id:null},
    {id:'app-all',title:'Web2 종일',start_at:'2026-09-10T00:00:00+09:00',end_at:'2026-09-11T00:00:00+09:00',color_hex:'#7656a8',project_id:null}
  ];
  window.__googleState={colors:{'cal-a':'#4285f4','cal-b':'#0b8043'},calendars:[{id:'cal-a',backgroundColor:'#4285f4'},{id:'cal-b',backgroundColor:'#0b8043'}]};
  window.__googleEvents=[
    {id:'multi',source:'google',calendarId:'cal-a',title:'주 경계 멀티데이',start:'2026-09-25',end:'2026-09-29',allDay:true,color:null},
    {id:'recurring',source:'google',calendarId:'cal-b',title:'반복 일정',start:'2026-09-17T09:00:00+09:00',end:'2026-09-17T10:00:00+09:00',allDay:false,color:null},
    ...Array.from({length:7},(_,i)=>({id:'busy-'+i,source:'google',calendarId:i%2?'cal-a':'cal-b',title:'바쁜날 '+(i+1),start:'2026-09-03T'+String(11+i).padStart(2,'0')+':00:00+09:00',end:'2026-09-03T'+String(12+i).padStart(2,'0')+':00:00+09:00',allDay:false,color:null}))
  ];
  window.renderMonth=(year=2026,month=8)=>window.KPTUCalendarMonthView.render({year,month,appEvents:window.__appEvents,googleEvents:window.__googleEvents,googleState:window.__googleState});
  window.renderDensityFixture=({year=2026,month=8,dateCounts={},googleEvents=[]}={})=>{
    let sequence=0;
    const appEvents=[];
    Object.entries(dateCounts).forEach(([date,count])=>{
      for(let index=0;index<count;index++){
        const startMinutes=9*60+index*15,endMinutes=startMinutes+10;
        const time=minutes=>`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}:00+09:00`;
        appEvents.push({id:`density-${sequence++}`,title:`밀도 일정 ${index+1}`,start_at:`${date}T${time(startMinutes)}`,end_at:`${date}T${time(endMinutes)}`,color_hex:'#7656a8',project_id:null});
      }
    });
    return window.KPTUCalendarMonthView.render({year,month,appEvents,googleEvents,googleState:window.__googleState});
  };
  const fixtureScenario=new URLSearchParams(location.search).get('scenario');
  if(fixtureScenario==='density'){
    window.renderDensityFixture({dateCounts:{'2026-09-10':1,'2026-09-17':3,'2026-09-24':7,'2026-09-30':12}});
  }else if(fixtureScenario==='six-week'){
    window.renderDensityFixture({year:2026,month:7,dateCounts:{'2026-08-13':12}});
  }else if(fixtureScenario==='mixed'){
    window.renderDensityFixture({
      dateCounts:{'2026-09-09':10},
      googleEvents:[
        {id:'span-a',source:'google',calendarId:'cal-a',title:'월-목',start:'2026-09-07',end:'2026-09-11',allDay:true,color:null},
        {id:'span-b',source:'google',calendarId:'cal-b',title:'화-금',start:'2026-09-08',end:'2026-09-12',allDay:true,color:null},
        {id:'boundary',source:'google',calendarId:'cal-a',title:'주 경계',start:'2026-09-12',end:'2026-09-15',allDay:true,color:null}
      ]
    });
  }else{
    window.renderMonth();
  }
</script>
</body>
</html>
