<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>team overview fixture</title><style>body{font-family:sans-serif;margin:0;padding:16px}.member-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.member-card{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fff}@media(max-width:650px){.member-grid{grid-template-columns:1fr}}</style></head><body><section id="teamView"><h3>구성원</h3><div id="memberList" class="member-grid"><div class="member-card">기존 목록</div></div></section><script>
const st=window.__state={user:{id:'u1'},workspace:'w1',members:[{user_id:'u1',role:'owner'},{user_id:'u2',role:'author'},{user_id:'u3',role:'viewer'}],profiles:[{user_id:'u1',display_name:'김담당',job_title:'국장'},{user_id:'u2',display_name:'박기획',job_title:'부장'},{user_id:'u3',display_name:'이현장',job_title:'국장'}],orgs:[{id:'o1',name:'철도노조',aliases:['철도'],active:true},{id:'o2',name:'공항철도지부',aliases:['공철'],active:true},{id:'o3',name:'한국가스공사노조',aliases:['가스'],active:true},{id:'o4',name:'국민연금지부',aliases:['연금'],active:true}],assignments:[{user_id:'u1',organization_id:'o1'},{user_id:'u1',organization_id:'o2'},{user_id:'u1',organization_id:'o3'},{user_id:'u1',organization_id:'o4'},{user_id:'u3',organization_id:'o3'}]};
function copy(v){return JSON.parse(JSON.stringify(v))}
window.KPTURuntime={session:{ensure:async()=>true},api:async path=>{if(path==='/auth/v1/user')return copy(st.user);if(path.includes('/app_workspace_members?user_id=eq.u1'))return[{workspace_id:'w1'}];if(path.includes('/app_workspace_members?workspace_id=eq.w1'))return copy(st.members);if(path.includes('/app_profiles?'))return copy(st.profiles);if(path.includes('/app_suborganizations?'))return copy(st.orgs);if(path.includes('/app_suborganization_assignees?'))return copy(st.assignments);throw new Error('Unhandled '+path)}};
</script><script type="module" src="../../app/team-member-overview.js?fixture=1"></script></body></html>
