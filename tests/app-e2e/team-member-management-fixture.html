<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>member management fixture</title><style>body{font-family:sans-serif;margin:0;padding:16px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0003;display:flex;align-items:center;justify-content:center}.modal-card{width:min(620px,calc(100vw - 24px));max-height:85vh;overflow:auto;background:#fff;border-radius:16px;padding:14px}.tpv-section{border:1px solid #ddd;border-radius:12px;padding:10px;margin-bottom:8px}.secondary,.mini{padding:8px 10px}.aa-review-head{margin-bottom:10px}</style></head><body>
<section id="teamView"><section id="aaReviewSection"><div class="aa-review-head"><div><b>가입 승인</b><small>승인 전에는 접근할 수 없습니다.</small></div></div><div id="aaReviewList"><select data-aa-role="r1"><option value="viewer">열람자</option><option value="author">작성자</option><option value="editor">편집자</option><option value="admin">관리자</option></select></div></section><button id="openMember" data-tpv-open="u2" type="button">구성원 열기</button></section>
<div id="inviteModal"><label>권한<select id="inviteRole"><option value="viewer">열람자</option><option value="author">작성자</option><option value="editor">편집자</option><option value="admin">관리자</option></select></label></div>
<div id="tpvModal" class="modal hidden"><div class="modal-card"><button id="tpvClose" type="button">닫기</button><h2 id="tpvName">박기획</h2><p id="tpvTitle">부장 · 작성자</p><div id="tpvBody"><section class="tpv-section">기본 프로필</section></div></div></div>
<script>
const qs=new URLSearchParams(location.search),actorRole=qs.get('actor')||'owner',targetRole=qs.get('targetRole')||'author';
const st=window.__state={actor:{id:'u1'},workspace:'w1',actorRole,target:{user_id:'u2',role:targetRole},rpcCalls:[],deleteCalls:[],removed:false};
window.KPTURuntime={session:{ensure:async()=>true},api:async(path,opt={})=>{if(path==='/auth/v1/user')return st.actor;if(path.includes('/app_workspace_members?user_id=eq.u1'))return[{workspace_id:'w1',role:st.actorRole}];if(path.includes('/app_workspace_members?workspace_id=eq.w1&user_id=eq.u2')){if(opt.method==='DELETE'){st.removed=true;st.deleteCalls.push(path);return null}return st.removed?[]:[{user_id:'u2',role:st.target.role}]};if(path.includes('/rpc/app_set_workspace_member_role')){st.rpcCalls.push(opt.body);st.target.role=opt.body.p_role;return{ok:true,role:st.target.role}}if(opt.method==='DELETE'&&(path.includes('/app_suborganization_assignees?')||path.includes('/app_profile_workplaces?'))){st.deleteCalls.push(path);return null}throw new Error('Unhandled '+path)}};
document.querySelector('#openMember').addEventListener('click',()=>{document.querySelector('#tpvModal').classList.remove('hidden');document.querySelector('#tpvTitle').textContent='부장 · '+({owner:'소유자',admin:'관리자',editor:'편집자',author:'작성자',viewer:'열람자'}[st.target.role]);document.querySelector('#tpvBody').innerHTML='<section class="tpv-section">기본 프로필</section>'});
document.querySelector('#tpvClose').addEventListener('click',()=>document.querySelector('#tpvModal').classList.add('hidden'));
</script><script type="module" src="../../app/team-member-management.js?fixture=1"></script></body></html>
