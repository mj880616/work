<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Library upload failure fixture</title><link rel="stylesheet" href="/app/styles.css"></head>
<body>
  <div id="toast" class="hidden"></div>
  <section id="libraryView"><input id="documentSearch"><div id="documentProject"></div><section id="libraryListCard" class="add-list-card"><div class="add-list-head"><h2>자료실</h2><div class="lu-head-actions"><button id="manageLibraryBtn" class="secondary" type="button">분류 수정</button><button id="newDocumentBtn" class="primary" type="button">+ 자료 등록</button></div></div><div id="documentList" class="card-list"></div></section></section>
  <div id="documentModal"><div class="modal-card">
    <label>자료명<input id="docTitle"></label>
    <input id="docCategory"><input id="docSource"><input id="docDate"><input id="docTags"><select id="docProject"><option value="">없음</option></select><textarea id="docDescription"></textarea>
    <button id="saveDocumentBtn" type="button">등록</button><div id="documentStatus"></div>
  </div></div>
  <script src="/app/runtime-client.js"></script>
  <script>
    window.__documentsChanged=0;
    window.__releaseLibraryUpload=null;
    window.__documentActionError=null;
    window.__driveReconnectCalls=[];
    window.__libraryUploadMode='timeout';
    window.__libraryUploadCalls=[];
    window.__libraryUploadOpts=[];
    window.__libraryUploadPlan={};
    window.__libraryDocs=[{id:'doc-1',workspace_id:'workspace-1',title:'내부 자료',category:'정책자료',source:'테스트',visibility:'workspace',tags:[],drive_url:location.origin+'/tests/app-e2e/library-open-fixture.html'}];
    window.addEventListener('kptu:documents-changed',()=>window.__documentsChanged++);
    window.KPTURouter={current:'library',on(){}};
    window.KPTURuntime={
      copyUploadFile:window.KPTURuntime.copyUploadFile,
      // Task2 deletion requires the real runtime's owner, epoch and context agreement.
      session:{ensure:async()=>true,read:()=>({access_token:'token',expires_at:9999999999,user:{id:'user-1'}}),epoch:()=>0},
      context:{read:()=>({user:{id:'user-1'},workspace:{id:'workspace-1'},membership:{role:'owner'}})},
      api:async(path,opts={})=>{
        if(path==='/auth/v1/user')return {id:'user-1'};
        if(path.startsWith('/rest/v1/app_workspace_members'))return [{workspace_id:'workspace-1',role:'owner'}];
        if(path.startsWith('/rest/v1/app_spaces'))return [];
        if(path.startsWith('/rest/v1/app_documents'))return window.__libraryDocs;
        if(path==='/functions/v1/document-actions'&&window.__documentActionError)throw new Error(window.__documentActionError);
        if(path==='/functions/v1/public-policy-drive'){
          window.__driveReconnectCalls.push(opts.body);
          return {url:location.origin+location.pathname+'#drive-auth'};
        }
        if(path==='/functions/v1/library-files'){
          const file=opts.body?.get?.('file');
          window.__libraryUploadCalls.push(file?.name||'');
          window.__libraryUploadOpts.push({timeoutMs:opts.timeoutMs,project_id:opts.body?.get?.('project_id')||null});
          const planned=window.__libraryUploadPlan[file?.name||'']?.shift();
          if(planned){
            if(planned.hold)await new Promise(resolve=>{window.__releaseLibraryUpload=resolve});
            if(planned.ok)return {ok:true,document:{id:'uploaded-'+window.__libraryUploadCalls.length,project_id:null}};
            throw Object.assign(new Error(planned.message||'raw server detail'),{status:planned.status||0,code:planned.code||('http_'+(planned.status||0)),retryable:!!planned.retryable,...(planned.stage?{stage:planned.stage}:{})});
          }
          if(window.__libraryUploadMode==='success')return {ok:true,document:{id:'uploaded-'+window.__libraryUploadCalls.length,project_id:null}};
          if(window.__libraryUploadMode==='partial'){
            if(file?.name==='fail.pdf')throw new Error('테스트 업로드 실패');
            return {ok:true,document:{id:'uploaded-'+window.__libraryUploadCalls.length,project_id:null}};
          }
          await new Promise(resolve=>{window.__releaseLibraryUpload=resolve});
          const e=new Error('요청 시간이 초과되었습니다. 다시 시도해 주세요.');e.code='timeout';e.retryable=true;throw e;
        }
        return [];
      }
    };
    // Keep the existing failure plans and assertions, but exercise the new
    // native-fetch boundary as well as the baseline runtime API fixture.
    const nativeFetch=window.fetch,nativeTimeout=window.setTimeout;
    window.__lastUploadDeadline=null;
    window.setTimeout=function(callback,ms,...args){
      if(ms>=90000&&ms<=600000)window.__lastUploadDeadline=ms;
      return nativeTimeout(callback,ms,...args);
    };
    // UI-올리기진행표시 ②: 자료실 올리기는 이제 XMLHttpRequest(실제 보낸 양)로 보낸다. 같은 가짜 api로 잇고, 시간 초과·끊김은
    // XMLHttpRequest의 ontimeout·onerror로 알린다(다 보낸 뒤라 결과 불명). 다른 주소는 진짜 XMLHttpRequest 그대로.
    const NativeXhr=window.XMLHttpRequest;
    window.XMLHttpRequest=class extends NativeXhr{
      open(method,url,...rest){this.__mock=String(url).endsWith('/functions/v1/library-files');if(!this.__mock)return super.open(method,url,...rest)}
      setRequestHeader(name,value){if(!this.__mock)return super.setRequestHeader(name,value)}
      send(body){
        if(!this.__mock)return super.send(body);
        const answer=(status,text)=>{Object.defineProperty(this,'status',{value:status,configurable:true});Object.defineProperty(this,'responseText',{value:text,configurable:true});this.onload?.()};
        this.upload.onprogress?.({lengthComputable:false,loaded:0,total:0});
        (async()=>{
          try{const data=await window.KPTURuntime.api('/functions/v1/library-files',{body,timeoutMs:window.__lastUploadDeadline});this.upload.onload?.();answer(200,JSON.stringify(data))}
          catch(error){
            this.upload.onload?.();
            if(error.code==='timeout')return this.ontimeout?.();
            if(error.code==='network_error')return this.onerror?.();
            answer(error.status||500,JSON.stringify({message:error.message,...(error.stage?{stage:error.stage}:{})}));
          }
        })();
      }
    };
    window.fetch=async function(url,options={}){
      if(!String(url).endsWith('/functions/v1/library-files'))return nativeFetch.apply(this,arguments);
      try{
        const data=await window.KPTURuntime.api('/functions/v1/library-files',{body:options.body,timeoutMs:window.__lastUploadDeadline});
        return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}});
      }catch(error){
        if(error.code==='timeout')throw new DOMException('mock timeout','AbortError');
        if(error.code==='network_error')throw new TypeError('mock network failure');
        return new Response(JSON.stringify({message:error.message,...(error.stage?{stage:error.stage}:{})}),{status:error.status||500,headers:{'Content-Type':'application/json'}});
      }
    };
  </script>
  <script type="module" src="/app/project-catalog.js"></script>
  <script type="module" src="/app/library-upload.js"></script>
</body>
</html>
