<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Public page editor fixture</title><style>.hidden{display:none!important}</style></head>
<body>
<div class="tools"><button id="editPageBtn" class="hidden" type="button">수정</button><button id="printPageBtn" type="button">인쇄</button></div>
<article id="paper" class="paper"></article>
<script>
const fixtureParams=new URLSearchParams(location.search);
window.__ppeCalls=[];
window.__ppeAuthCalls=[];
window.__ppeFailUpdate=false;
window.__ppeFailCount=0;
window.__ppeUpdateDelay=0;
window.__ppeSession=fixtureParams.get('anon')!=='1';
window.__ppeCanEdit=fixtureParams.get('forbidden')!=='1';
window.__ppeAuthFail=fixtureParams.get('authfail')==='1';
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const editorApi=async(path,{body}={})=>{
  window.__ppeCalls.push({path,body,at:Date.now()});
  if(body?.action==='check'){
    if(!window.__ppeSession)throw new Error('session required');
    if(!window.__ppeCanEdit)throw new Error('forbidden');
    return {ok:true};
  }
  if(body?.action==='update'){
    if(window.__ppeUpdateDelay)await wait(window.__ppeUpdateDelay);
    if(window.__ppeFailUpdate||window.__ppeFailCount>0){
      if(window.__ppeFailCount>0)window.__ppeFailCount-=1;
      throw new Error('의도된 저장 실패');
    }
    return {page:{id:body.id,title:body.title,summary:body.summary,body:body.body,metadata:{},updated_at:new Date().toISOString()}};
  }
  throw new Error('unexpected request');
};
window.__ppeGoogleLogin=0;
window.alert=(message)=>{window.__ppeAlert=String(message)};
window.KPTUWeb1AdminAuth={
  session:async()=>window.__ppeSession?{access_token:'web1-test-token'}:null,
  isAdmin:async()=>window.__ppeSession&&window.__ppeCanEdit,
  signInWithGoogle:()=>{window.__ppeGoogleLogin=(window.__ppeGoogleLogin||0)+1},
  signOut:async()=>{window.__ppeSession=false}
};
const realFetch=window.fetch.bind(window);
window.fetch=async(url,options={})=>{
  if(String(url).includes('/functions/v1/public-page-edit')||String(url).includes('/public-page-edit')||String(url).includes('/work/functions/v1/public-page-edit')){
    let body={};try{body=JSON.parse(options.body||'{}')}catch{}
    try{const data=await editorApi(url,{body});return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}})}catch(e){return new Response(JSON.stringify({error:String(e?.message||e)}),{status:String(e?.message).includes('forbidden')?403:500,headers:{'Content-Type':'application/json'}})}
  }
  return realFetch(url,options)
};
// Legacy runtime remains present only so the RED test proves the editor stops depending on it.
window.KPTURuntime={session:{ensure:async()=>window.__ppeSession},api:editorApi};
window.__ppeDebug=()=>({session:window.__ppeSession,canEdit:window.__ppeCanEdit,alert:window.__ppeAlert,calls:window.__ppeCalls,google:window.__ppeGoogleLogin,editor:!!window.KPTUPublicPageEditor,btnClass:document.querySelector('#editPageBtn')?.className});
window.__fixturePage={id:'11111111-1111-4111-8111-111111111111',title:'원래 제목',summary:'원래 요약',body:'원래 본문',metadata:{},updated_at:new Date().toISOString()};
window.KPTURenderPublicPage=p=>{
  window.__fixturePage=p;
  document.querySelector('#paper').innerHTML=`<header class="pd-hero"><h1 class="pd-title">${p.title}</h1><p class="pd-summary">${p.summary}</p></header><div class="pd-body"><section class="pd-section"><h2>첫 번째 칸</h2><p>${p.body}</p></section><section class="pd-section"><h2>두 번째 칸</h2><details class="pd-details"><summary>세부 카드</summary><div class="pd-details-body"><blockquote>세부 내용</blockquote></div></details></section></div>`;
  window.KPTUPublicPageEditor?.setPage(p,false);
};
</script>
<script src="/app/public-page-editor.js"></script>
<script>window.KPTURenderPublicPage(window.__fixturePage);</script>
</body></html>
