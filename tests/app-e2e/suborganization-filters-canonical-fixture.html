<!doctype html><html><head><meta charset="utf-8"><title>suborganization canonical fixture</title><link rel="stylesheet" href="/app/base-ui.css"><link rel="stylesheet" href="/app/suborganizations.css"><link rel="stylesheet" href="/app/workplace-detail.css"><style>.hidden{display:none}</style></head><body>
<section id="teamView"></section>
<div id="eventModal" class="modal hidden"><div class="modal-card"><label>설명<textarea id="eventDescription"></textarea></label><button id="saveEventBtn" type="button">저장</button></div></div>
<div id="ciGoogleModal" class="modal hidden"><div class="modal-card"><label>메모<textarea id="ciGoogleMemo"></textarea></label><button id="ciGoogleSave" type="button">저장</button></div></div>
<button id="openAppEventE2E" class="hidden" type="button" data-app-event="ev-keep">일정 수정</button>
<div id="toast" class="hidden"></div>
<script>
const fixtureParams=new URLSearchParams(location.search);
const fixtureRole=fixtureParams.get('role')||'owner';
const fixtureUser=fixtureRole==='viewer'?'user-viewer':'user-me';
const orgs=[
 {id:'org-rail',workspace_id:'ws-1',name:'전국철도노동조합',aliases:['철도노조'],description:'철도 담당조직',organization_type:'철도·도시철도',default_assignee_name:'김명진',representative_name:'김철도',contact:'010-0000-0000',member_count:12000,recent_month_summary:'9월 정책교섭과 인력대응 진행 중',year_summary:'산별전환과 안전인력 사업 추진',created_by:'user-me',updated_at:'2026-09-23T00:00:00Z',active:true},
 {id:'org-consumer',workspace_id:'ws-1',name:'한국소비자원지부',aliases:['소비자원'],description:'소비자 정책',organization_type:'중앙공공기관',default_assignee_name:'한소영',created_by:'user-me',active:true}
];
// TASK-조직순서: ?orgs=order gives the 13 decided organizations in a scrambled (name) order, two others and the old space
// name 궤도협의회, all assigned to me, plus one organization that is not mine.
const orderNames=['공항철도지부','용인경전철지부','서울교통공사9호선지부','인천교통공사노동조합','신분당선지부','전국철도노동조합','메트로9호선노동조합','부산지하철노동조합','김포도시철도지부','서해선지부','대구교통공사노동조합','지티엑스에이운영지부','서울교통공사노동조합','한국소비자원지부','궤도협의회','국민연금지부'];
if(fixtureParams.get('orgs')==='order'){
 orgs.splice(0,orgs.length,...orderNames.map((name,i)=>({id:'ord-'+i,workspace_id:'ws-1',name,organization_type:'미분류',default_assignee_name:null,created_by:'user-me',active:true})),{id:'ord-other',workspace_id:'ws-1',name:'가나다 다른 담당',organization_type:'미분류',default_assignee_name:null,created_by:'user-me',active:true});
}
// TASK-조직상세: a stand-in for google-tasks.js that records what the organization detail asks for. ?gtasks=none leaves it out.
window.__gtCalls=[];
if(fixtureParams.get('gtasks')!=='none')window.KPTUGoogleTasks={
 mountLinked(box,target,opts={}){window.__gtCalls.push({action:'mount',target,boxId:box.id});box.className='gt-linked gt-list';box.innerHTML='<div class="gt-row pending" data-google-task="linked-1"><b>연결된 할 일</b></div><div class="gt-row pending" data-google-task="linked-2"><b>두 번째 할 일</b></div>';opts.onCount?.(2)},
 openEditor(task,opts){window.__gtCalls.push({action:'editor',task,opts})},
 openLinkPicker(target){window.__gtCalls.push({action:'picker',target})}
};
const updates=[{id:'up-old',organization_id:'org-rail',raw_text:'지난주 지부장 통화: 인력 요구안 확정',detail_text:null,occurred_at:'2026-09-20T01:00:00Z'}];
const memos=[{id:'memo-1',organization_id:'org-rail',title:'최근 교섭',body:'정책교섭 자료 취합 중',sort_order:0,created_at:'2026-09-20T00:00:00Z',updated_at:'2026-09-22T00:00:00Z'}];
const reports=[{id:'report-1',organization_id:'org-rail',week_of:'2026-09-21',summary:'E2E 주간보고',detail:'E2E 상세',status:'draft'}];
window.__teamAiCalls=0;window.__reportPatches=[];
window.__deletes=[];window.__failDelete=false;window.__deleteNoRows=false;
window.__updatePosts=[];window.__updateClock=Date.parse('2026-09-26T00:00:00Z');window.__failUpdateSave=false;
let assignments=fixtureParams.get('orgs')==='order'?orgs.filter(o=>o.id!=='ord-other').map(o=>({organization_id:o.id,user_id:'user-me',assigned_by:'user-me',created_at:'2026-09-15T00:00:00Z'})):[{organization_id:'org-consumer',user_id:'user-other',assigned_by:'user-me',created_at:'2026-09-15T00:00:00Z'}];
window.__patches=[];
window.__holdOrgSave=false;window.__failOrgSave=false;window.__holdAssigneeSave=false;
let releaseOrgSave,releaseAssigneeSave;
window.__orgSaveGate=new Promise(r=>releaseOrgSave=r);window.__assigneeSaveGate=new Promise(r=>releaseAssigneeSave=r);
window.__releaseOrgSave=()=>releaseOrgSave();window.__releaseAssigneeSave=()=>releaseAssigneeSave();
window.KPTURuntime={session:{ensure:async()=>true},api:async(path,opt={})=>{
 const probe=window.__saveLockProbe;
 if(probe&&path.split('?')[0]===`/rest/v1/${probe.table}`&&opt.method===probe.method){
   probe.count++;
   if(probe.hold)await new Promise(resolve=>probe.waiters.push(resolve));
   if(probe.fail){probe.fail=false;throw new Error('임시 저장 실패')}
   if(probe.table==='app_suborganizations'&&opt.method==='POST'){
     const row={id:'org-new-'+probe.count,...opt.body};orgs.push(row);return [row]
   }
   if(probe.table==='app_org_affiliation_tags')return [{id:'tag-new-'+probe.count}];
   if(probe.table==='app_suborganization_timeline'||probe.table==='app_suborganization_affiliations')return [];
 }
 if(path==='/functions/v1/team-ai'){window.__teamAiCalls++;throw new Error('retired team-ai call')}
 if(path==='/auth/v1/user')return {id:fixtureUser,user_metadata:{display_name:fixtureRole==='viewer'?'열람자':'김명진'}};
 if(path.startsWith('/rest/v1/app_workspace_members?user_id='))return [{workspace_id:'ws-1',role:fixtureRole}];
 if(path.startsWith('/rest/v1/app_workspace_members?workspace_id='))return [{user_id:'user-me',role:'owner'},{user_id:'user-other',role:'editor'},{user_id:'user-viewer',role:'viewer'}];
 if(path==='/rest/v1/app_profiles?select=user_id,display_name')return [{user_id:'user-me',display_name:'김명진'},{user_id:'user-other',display_name:'한소영'},{user_id:'user-viewer',display_name:'열람자'}];
 if(path.startsWith('/rest/v1/app_suborganizations?workspace_id=eq.ws-1&active=eq.true'))return orgs;
 if(path.startsWith('/rest/v1/app_suborganizations?id=eq.')&&opt.method!=='PATCH'){
   const id=decodeURIComponent(path.match(/id=eq\.([^&]+)/)?.[1]||'');
   return orgs.filter(x=>x.id===id);
 }
 if(path.startsWith('/rest/v1/app_suborganization_status_items?organization_id=eq.'))return memos.slice();
 if(opt.method==='DELETE'&&(path.startsWith('/rest/v1/app_suborganization_updates?id=eq.')||path.startsWith('/rest/v1/app_suborganization_status_items?id=eq.'))){
   window.__deletes.push({path,prefer:opt.prefer||''});
   if(window.__failDelete)throw new Error('네트워크 오류');
   if(window.__deleteNoRows)return [];
   const id=decodeURIComponent(path.match(/[?&]id=eq\.([^&]+)/)?.[1]||''),org=decodeURIComponent(path.match(/organization_id=eq\.([^&]+)/)?.[1]||'');
   const list=path.includes('app_suborganization_updates')?updates:memos,idx=list.findIndex(x=>x.id===id&&x.organization_id===org);
   if(idx<0)return [];
   list.splice(idx,1);return [{id}];
 }
 if(path.startsWith('/rest/v1/app_suborganization_timeline?organization_id=eq.'))return [{id:'time-1',organization_id:'org-rail',event_year:2026,event_date:'2026-09-15',category:'회의',title:'정책교섭 담당자회의',summary:'자료 제출 현황 확인',occurrence_count:1,sort_order:0}];
 if(path.startsWith('/rest/v1/app_suborganization_assignees?organization_id=eq.')&&path.includes('user_id=eq.user-me'))return [{user_id:'user-me'}];
 if(path.startsWith('/rest/v1/app_suborganization_assignees?organization_id=eq.')&&path.includes('user_id=eq.user-viewer'))return [];
 if(path.startsWith('/rest/v1/app_org_affiliation_tags?workspace_id=eq.ws-1'))return [{id:'tag-1',name:'궤도협의회',kind:'council',created_by:'user-me'},{id:'tag-2',name:'민자철도사업단',kind:'taskforce',created_by:'user-me'}];
 if(path.startsWith('/rest/v1/app_suborganization_affiliations?organization_id=eq.'))return [{tag_id:'tag-1',created_at:'2026-09-01T00:00:00Z'}];
 if(path==='/rest/v1/app_suborganization_assignees?select=organization_id,user_id,assigned_by,created_at')return assignments;
 if(path.startsWith('/rest/v1/app_suborganizations?id=eq.')&&opt.method==='PATCH'){
   if(window.__holdOrgSave)await window.__orgSaveGate;if(window.__failOrgSave)throw new Error('조직 저장 실패');
   const id=decodeURIComponent(path.match(/id=eq\.([^&]+)/)?.[1]||'');
   const row=orgs.find(x=>x.id===id);if(row)Object.assign(row,opt.body||{});window.__patches.push({path,body:opt.body});return null;
 }
 if(path.startsWith('/rest/v1/app_profile_workplaces?organization_id=eq.')&&opt.method==='PATCH')return null;
 if(path.startsWith('/rest/v1/app_suborganization_assignees?organization_id=eq.')&&opt.method==='DELETE'){if(window.__holdAssigneeSave)await window.__assigneeSaveGate;assignments=assignments.filter(x=>!path.includes(x.organization_id));return null}
 if(path==='/rest/v1/app_suborganization_assignees'&&opt.method==='POST'){assignments.push(...(Array.isArray(opt.body)?opt.body:[opt.body]));return null}
 // The event being edited is already linked to the old space name, which the picker must keep (TASK-조직순서).
 if(path.startsWith('/rest/v1/app_event_suborganizations?event_id=eq.ev-keep'))return fixtureParams.get('orgs')==='order'?[{organization_id:'ord-14'}]:[];
 if(path.startsWith('/rest/v1/app_event_suborganizations'))return [];
 if(path==='/rest/v1/app_suborganization_updates'&&opt.method==='POST'){
   if(window.__failUpdateSave)throw new Error('기록 저장 실패');
   window.__updatePosts.push(opt.body);window.__updateClock+=60000;
   updates.push({id:'up-'+(updates.length+1),organization_id:opt.body.organization_id,raw_text:opt.body.raw_text,detail_text:null,occurred_at:new Date(window.__updateClock).toISOString()});return null;
 }
 if(path.startsWith('/rest/v1/app_suborganization_updates?organization_id=eq.')){
   const id=decodeURIComponent(path.match(/organization_id=eq\.([^&]+)/)?.[1]||'');
   return updates.filter(x=>x.organization_id===id).sort((a,b)=>b.occurred_at.localeCompare(a.occurred_at));
 }
 if(path.startsWith('/rest/v1/app_suborganization_weekly_reports?organization_id=eq.'))return reports.slice();
 if(path.startsWith('/rest/v1/app_suborganization_weekly_reports?id=eq.')&&opt.method==='PATCH'){
   const id=decodeURIComponent(path.match(/id=eq\.([^&]+)/)?.[1]||'');
   const report=reports.find(x=>x.id===id);if(report)Object.assign(report,opt.body);
   window.__reportPatches.push({id,body:opt.body});return null;
 }
 return [];
}};
if(fixtureParams.has('teamstats')){
 if(fixtureParams.has('knownonly')){orgs.splice(13);assignments=assignments.filter(a=>orgs.some(o=>o.id===a.organization_id))}
 let release;const gate=new Promise(r=>release=r);window.__releaseTeamStats=release;
 window.__teamStatsCalls={tasks:0,links:0,updates:0};
 const tasks=[{id:'pending',status:'needsAction',due:'2026-01-01'},{id:'future',status:'needsAction',due:'2099-01-01'},{id:'done',status:'completed'}];
 Object.assign(window.KPTUGoogleTasks,{peekTasks:()=>fixtureParams.has('cachedstats')?{owner:fixtureUser,tasks}:null,listTasks:async()=>{window.__teamStatsCalls.tasks++;await gate;if(['1','tasks'].includes(fixtureParams.get('statsfail')))throw new Error('offline');return {owner:fixtureUser,status:fixtureParams.has('disconnectedstats')?'disconnected':'ok',tasks}},readLinks:async()=>{window.__teamStatsCalls.links++;return [{google_task_id:'pending',organization_id:'ord-5',status:'confirmed'},{google_task_id:'pending',organization_id:'ord-5',status:'confirmed'},{google_task_id:'future',organization_id:'ord-5',status:'confirmed'},{google_task_id:'future',organization_id:'ord-7',status:'confirmed'},{google_task_id:'done',organization_id:'ord-5',status:'confirmed'},{google_task_id:'pending',organization_id:'ord-3',status:'suggested'}]},isOverdue:t=>t.status!=='completed'&&t.due<'2026-10-09'});
 const oldApi=window.KPTURuntime.api;
 window.KPTURuntime.api=async(path,opt)=>{if(path.includes('/app_suborganization_updates?organization_id=in.')){window.__teamStatsCalls.updates++;await gate;if(['1','updates'].includes(fixtureParams.get('statsfail')))throw new Error('offline');if(fixtureParams.has('historypages'))return path.includes('offset=0')?Array.from({length:500},()=>({organization_id:'ord-5',occurred_at:'2026-10-08T09:00:00Z'})):[{organization_id:'ord-7',occurred_at:'2025-01-01T00:00:00Z'}];return [{organization_id:'ord-5',occurred_at:'2026-10-08T09:00:00Z'},{organization_id:'ord-5',occurred_at:'2026-10-01T00:00:00Z'}]}return oldApi(path,opt)};
}
</script>
<script src="/app/accessibility-dialog.js"></script>
<script src="/app/organization-order.js"></script>
<script src="/app/suborganizations.js"></script><script src="/app/workplace-detail.js"></script><script src="/app/workplace-report.js"></script>
</body></html>
