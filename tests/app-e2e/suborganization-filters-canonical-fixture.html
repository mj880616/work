<!doctype html><html><head><meta charset="utf-8"><title>suborganization canonical fixture</title><link rel="stylesheet" href="/app/base-ui.css"><link rel="stylesheet" href="/app/suborganizations.css"><link rel="stylesheet" href="/app/workplace-detail.css"><style>.hidden{display:none}</style></head><body>
<section id="teamView"></section>
<div id="eventModal" class="modal hidden"><div class="modal-card"><label>설명<textarea id="eventDescription"></textarea></label><button id="saveEventBtn" type="button">저장</button></div></div>
<div id="toast" class="hidden"></div>
<script>
const fixtureRole=new URLSearchParams(location.search).get('role')||'owner';
const fixtureUser=fixtureRole==='viewer'?'user-viewer':'user-me';
const orgs=[
 {id:'org-rail',workspace_id:'ws-1',name:'전국철도노동조합',aliases:['철도노조'],description:'철도 담당조직',organization_type:'철도·도시철도',default_assignee_name:'김명진',representative_name:'김철도',contact:'010-0000-0000',member_count:12000,recent_month_summary:'9월 정책교섭과 인력대응 진행 중',year_summary:'산별전환과 안전인력 사업 추진',created_by:'user-me',updated_at:'2026-09-23T00:00:00Z',active:true},
 {id:'org-consumer',workspace_id:'ws-1',name:'한국소비자원지부',aliases:['소비자원'],description:'소비자 정책',organization_type:'중앙공공기관',default_assignee_name:'한소영',created_by:'user-me',active:true}
];
const updates=[{id:'up-old',organization_id:'org-rail',raw_text:'지난주 지부장 통화: 인력 요구안 확정',detail_text:null,occurred_at:'2026-09-20T01:00:00Z'}];
window.__updatePosts=[];window.__updateClock=Date.parse('2026-09-26T00:00:00Z');window.__failUpdateSave=false;
let assignments=[{organization_id:'org-consumer',user_id:'user-other',assigned_by:'user-me',created_at:'2026-09-15T00:00:00Z'}];
window.__patches=[];
window.__holdOrgSave=false;window.__failOrgSave=false;window.__holdAssigneeSave=false;
let releaseOrgSave,releaseAssigneeSave;
window.__orgSaveGate=new Promise(r=>releaseOrgSave=r);window.__assigneeSaveGate=new Promise(r=>releaseAssigneeSave=r);
window.__releaseOrgSave=()=>releaseOrgSave();window.__releaseAssigneeSave=()=>releaseAssigneeSave();
window.KPTURuntime={session:{ensure:async()=>true},api:async(path,opt={})=>{
 if(path==='/auth/v1/user')return {id:fixtureUser,user_metadata:{display_name:fixtureRole==='viewer'?'열람자':'김명진'}};
 if(path.startsWith('/rest/v1/app_workspace_members?user_id='))return [{workspace_id:'ws-1',role:fixtureRole}];
 if(path.startsWith('/rest/v1/app_workspace_members?workspace_id='))return [{user_id:'user-me',role:'owner'},{user_id:'user-other',role:'editor'},{user_id:'user-viewer',role:'viewer'}];
 if(path==='/rest/v1/app_profiles?select=user_id,display_name')return [{user_id:'user-me',display_name:'김명진'},{user_id:'user-other',display_name:'한소영'},{user_id:'user-viewer',display_name:'열람자'}];
 if(path.startsWith('/rest/v1/app_suborganizations?workspace_id=eq.ws-1&active=eq.true'))return orgs;
 if(path.startsWith('/rest/v1/app_suborganizations?id=eq.')&&opt.method!=='PATCH'){
   const id=decodeURIComponent(path.match(/id=eq\.([^&]+)/)?.[1]||'');
   return orgs.filter(x=>x.id===id);
 }
 if(path.startsWith('/rest/v1/app_suborganization_status_items?organization_id=eq.'))return [{id:'memo-1',organization_id:'org-rail',title:'최근 교섭',body:'정책교섭 자료 취합 중',sort_order:0,created_at:'2026-09-20T00:00:00Z',updated_at:'2026-09-22T00:00:00Z'}];
 if(path.startsWith('/rest/v1/app_suborganization_timeline?organization_id=eq.'))return [{id:'time-1',organization_id:'org-rail',event_year:2026,event_date:'2026-09-15',category:'회의',title:'정책교섭 담당자회의',summary:'자료 제출 현황 확인',occurrence_count:1,sort_order:0}];
 if(path.startsWith('/rest/v1/app_suborganization_assignees?organization_id=eq.')&&path.includes('user_id=eq.user-me'))return [{user_id:'user-me'}];
 if(path.startsWith('/rest/v1/app_suborganization_assignees?organization_id=eq.')&&path.includes('user_id=eq.user-viewer'))return [];
 if(path.startsWith('/rest/v1/app_org_affiliation_tags?workspace_id=eq.ws-1'))return [{id:'tag-1',name:'궤도협의회',kind:'council',created_by:'user-me'},{id:'tag-2',name:'민자철도사업단',kind:'taskforce',created_by:'user-me'}];
 if(path.startsWith('/rest/v1/app_suborganization_affiliations?organization_id=eq.'))return [{tag_id:'tag-1',created_at:'2026-09-01T00:00:00Z'}];
 if(path==='/rest/v1/app_suborganization_assignees?select=organization_id,user_id,assigned_by,created_at')return assignments;
 if(path.startsWith('/rest/v1/app_suborganizations?id=eq.')&&opt.method==='PATCH'){
   if(window.__holdOrgSave)await window.__orgSaveGate;if(window.__failOrgSave)throw new Error('조직 저장 실패');
   const id=decodeURIComponent(path.match(/id=eq\.([^&]+)/)?.[1]||'');
   const row=orgs.find(x=>x.id===id);if(row)Object.assign(row,opt.body||{});window.__patches.push({path,body:opt.body});return null;
 }
 if(path.startsWith('/rest/v1/app_profile_workplaces?organization_id=eq.')&&opt.method==='PATCH')return null;
 if(path.startsWith('/rest/v1/app_suborganization_assignees?organization_id=eq.')&&opt.method==='DELETE'){if(window.__holdAssigneeSave)await window.__assigneeSaveGate;assignments=assignments.filter(x=>!path.includes(x.organization_id));return null}
 if(path==='/rest/v1/app_suborganization_assignees'&&opt.method==='POST'){assignments.push(...(Array.isArray(opt.body)?opt.body:[opt.body]));return null}
 if(path.startsWith('/rest/v1/app_event_suborganizations'))return [];
 if(path==='/rest/v1/app_suborganization_updates'&&opt.method==='POST'){
   if(window.__failUpdateSave)throw new Error('기록 저장 실패');
   window.__updatePosts.push(opt.body);window.__updateClock+=60000;
   updates.push({id:'up-'+(updates.length+1),organization_id:opt.body.organization_id,raw_text:opt.body.raw_text,detail_text:null,occurred_at:new Date(window.__updateClock).toISOString()});return null;
 }
 if(path.startsWith('/rest/v1/app_suborganization_updates?organization_id=eq.')){
   const id=decodeURIComponent(path.match(/organization_id=eq\.([^&]+)/)?.[1]||'');
   return updates.filter(x=>x.organization_id===id).sort((a,b)=>b.occurred_at.localeCompare(a.occurred_at));
 }
 if(path.startsWith('/rest/v1/app_suborganization_weekly_reports?organization_id=eq.'))return [];
 return [];
}};
</script>
<script src="/app/accessibility-dialog.js"></script>
<script src="/app/suborganizations.js"></script><script src="/app/workplace-detail.js"></script><script src="/app/workplace-ai-report.js"></script>
</body></html>
