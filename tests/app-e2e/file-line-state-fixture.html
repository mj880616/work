<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>file line state fixture</title>
<link rel="stylesheet" href="../../app/theme-tokens.css"><link rel="stylesheet" href="../../app/base-ui.css"><link rel="stylesheet" href="../../app/ui-standard.css">
<style>body{margin:0;padding:12px}.box{max-width:340px;margin:0 auto}</style></head><body>
<!-- FILE-이름고치기연필먹통 ④: 공용 파일 줄(app/meeting-compact.js fileLine)의 상태 글자가 좁은 칸에서 세로로 꺾이지 않는지 본다. 가짜 이름만. -->
<div class="box" id="box"></div>
<script type="module">
import {fileLine} from '../../app/meeting-compact.js';
const x='<button class="icon-btn file-line-x" type="button" aria-label="선택 취소">×</button>';
const lines=[
  {name:'가상 점검 자료 파일 이름이 꽤 길어서 줄이 좁아지는 경우.pdf',meta:'20KB',state:'uploading',label:'업로드 중',end:x},
  {name:'가상 안건지.hwp',meta:'4KB',state:'error',label:'실패 · 다시 시도',end:x},
  {name:'가상 결과표.xlsx',meta:'1MB',state:'unknown',label:'결과 확인 필요',end:x},
  {name:'가상 사진.jpg',meta:'3MB',state:'error',label:'파일을 읽지 못했어요. 파일을 다시 선택해 주세요.',end:x},
  {name:'가상 문서.docx',state:'success',label:'완료'}
];
document.querySelector('#box').innerHTML=lines.map(fileLine).join('');
</script></body></html>
