<script>
const params=new URLSearchParams(location.search),viewer=params.get('role')==='viewer';
const state=window.__state={user:{id:'u1'},workspace:'w1',role:viewer?'viewer':'owner',calls:[],projects:[
{id:'p1',workspace_id:'w1',parent_id:null,name:'인력확충 공동투쟁',status:'active',metadata:{project_system:'v2',management_version:2},owner_id:viewer?'u2':'u1',created_by:'u1',visibility:'team'},
{id:'p2',workspace_id:'w1',parent_id:'p1',name:'10.7 공동대의원대회',status:'active',metadata:{project_system:'v2',management_version:2},owner_id:viewer?'u2':'u1',created_by:'u1',visibility:'team'}
],organizations:[
{id:'org-a',workspace_id:'w1',name:'철도노조',aliases:['철도'],created_by:viewer?'u2':'u1',active:true},
{id:'org-b',workspace_id:'w1',name:'부산지하철노조',aliases:['부산'],created_by:'u2',active:true}
],links:[{project_id:'p1',organization_id:'org-a',created_by:'u1',created_at:'2026-09-14T00:00:00Z'}]};
function clone(v){return JSON.parse(JSON.stringify(v))}
window.KPTURuntime={session:{ensure:async()=>true},api:async(path,opts={})=>{const method=opts.method||'GET';state.calls.push({path,method,body:clone(opts.body??null)});if(path==='/auth/v1/user')return clone(state.user);if(path.includes('/app_workspace_members?'))return [{workspace_id:state.workspace,role:state.role}];if(path.includes('/app_spaces?'))return clone(state.projects);if(path.includes('/app_suborganizations?'))return clone(state.organizations);if(path.includes('/app_project_suborganizations?'))return clone(state.links);if(path.includes('/app_space_members?'))return [];if(path.includes('/app_suborganization_assignees?'))return [];if(path==='/rest/v1/rpc/app_sync_project_suborganizations'&&method==='POST'){const id=opts.body.p_project,selected=new Set(opts.body.p_organizations||[]);state.links=state.links.filter(x=>x.project_id!==id||selected.has(x.organization_id));for(const org of selected)if(!state.links.some(x=>x.project_id===id&&x.organization_id===org))state.links.push({project_id:id,organization_id:org,created_by:'u1',created_at:new Date().toISOString()});return state.links.filter(x=>x.project_id===id).length}if(path==='/rest/v1/rpc/app_sync_suborganization_projects'&&method==='POST'){const id=opts.body.p_organization,selected=new Set(opts.body.p_projects||[]);state.links=state.links.filter(x=>x.organization_id!==id||selected.has(x.project_id));for(const project of selected)if(!state.links.some(x=>x.project_id===project&&x.organization_id===id))state.links.push({project_id:project,organization_id:id,created_by:'u1',created_at:new Date().toISOString()});return state.links.filter(x=>x.organization_id===id).length}throw new Error('Unhandled '+method+' '+path)}};
document.addEventListener('click',e=>{const o=e.target.closest?.('[data-ps-workplace-org]');if(o)document.querySelector('#wdModal').classList.remove('hidden');const p=e.target.closest?.('[data-pm2-project]');if(p){document.querySelector('#pm2DetailModal').classList.remove('hidden');const u=new URL(location.href);u.searchParams.set('project',p.dataset.pm2Project);history.replaceState({},'',u)}if(e.target.closest?.('[data-wd-close]'))document.querySelector('#wdModal').classList.add('hidden');if(e.target.closest?.('[data-close-project]'))document.querySelector('#pm2DetailModal').classList.add('hidden')});
</script>
