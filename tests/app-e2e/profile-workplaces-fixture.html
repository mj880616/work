<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>profile workplaces fixture</title><style>.hidden{display:none}.app-nav{display:flex;gap:6px}.panel{padding:12px}.toast{position:fixed;bottom:5px}</style></head><body>
<nav class="app-nav"><button data-view="team">팀</button></nav>
<div id="appView"></div><span id="userBadge">테스터</span><div id="toast" class="toast hidden"></div>
<script>
const state=window.__state={
 user:{id:'u1',user_metadata:{display_name:'테스터'}},workspace:'w1',
 profile:[{user_id:'u1',display_name:'테스터',job_title:'국장'}],
 assignments:[{organization_id:'org-a',user_id:'u1',assigned_by:'admin',created_at:'2026-09-01T00:00:00Z'}],
 organizations:[
  {id:'org-a',name:'철도노조',aliases:['철도'],active:true},
  {id:'org-b',name:'한국가스공사노조',aliases:['가스공사'],active:true},
  {id:'org-c',name:'비활성조직',aliases:[],active:false}
 ],
 workplaces:[{id:'pw-a',user_id:'u1',organization_id:'org-a',full_name:'철도노조',aliases:['철도'],sort_order:0,created_at:'2026-09-01T00:00:00Z'}],
 projects:[],calls:[],events:0,reloads:0
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function orgFromPath(path){const m=path.match(/organization_id=eq\.([^&]+)/);return m?decodeURIComponent(m[1]):null}
const routerHooks=new Map();
window.KPTURouter={current:'team',on(view,fn){if(!routerHooks.has(view))routerHooks.set(view,new Set());routerHooks.get(view).add(fn);return()=>routerHooks.get(view)?.delete(fn)},go(view){document.querySelectorAll('#appView .view-panel').forEach(x=>x.classList.toggle('hidden',x.id!==view+'View'));this.current=view;const detail={view,source:'fixture'};window.dispatchEvent(new CustomEvent('kptu:view-changed',{detail}));for(const fn of routerHooks.get(view)||[])fn(detail)}};
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-view]');if(b)window.KPTURouter.go(b.dataset.view)});
window.__KPTU_RELOAD_SUBORGANIZATIONS__=()=>{state.reloads++};
window.addEventListener('kptu:suborganization-updated',()=>state.events++);
window.KPTURuntime={session:{ensure:async()=>true},api:async(path,opts={})=>{
 const method=opts.method||'GET';state.calls.push({path,method,body:clone(opts.body??null)});
 if(path==='/auth/v1/user')return clone(state.user);
 if(path.includes('/app_workspace_members?'))return [{workspace_id:state.workspace}];
 if(path.includes('/app_profiles?'))return clone(state.profile);
 if(path.includes('/app_profile_report_projects?'))return clone(state.projects);
 if(path.includes('/app_suborganizations?')&&method==='GET')return clone(state.organizations);
 if(path.includes('/app_suborganization_assignees?')&&method==='GET')return clone(state.assignments);
 if(path.includes('/app_profile_workplaces?')&&method==='GET')return clone(state.workplaces);
 if(path==='/rest/v1/app_suborganization_assignees'&&method==='POST'){
  const rows=Array.isArray(opts.body)?opts.body:[opts.body];for(const row of rows){if(!state.assignments.some(x=>x.organization_id===row.organization_id&&x.user_id===row.user_id))state.assignments.push({...clone(row),created_at:new Date().toISOString()})}return null;
 }
 if(path.includes('/app_suborganization_assignees?')&&method==='DELETE'){
  const org=orgFromPath(path);state.assignments=state.assignments.filter(x=>!(x.organization_id===org&&x.user_id==='u1'));return null;
 }
 if(path==='/rest/v1/app_profile_workplaces'&&method==='POST'){
  const rows=Array.isArray(opts.body)?opts.body:[opts.body];for(const row of rows){state.workplaces.push({...clone(row),id:row.id||'pw-'+row.organization_id,created_at:new Date().toISOString()})}return null;
 }
 if(path.includes('/app_profile_workplaces?')&&method==='PATCH'){
  const id=(path.match(/id=eq\.([^&]+)/)||[])[1];const row=state.workplaces.find(x=>x.id===decodeURIComponent(id||''));if(row)Object.assign(row,clone(opts.body));return null;
 }
 if(path.includes('/app_profile_workplaces?')&&method==='DELETE'){
  const org=orgFromPath(path);state.workplaces=state.workplaces.filter(x=>!(x.organization_id===org&&x.user_id==='u1'));return null;
 }
 if(path.includes('/app_profiles?')&&method==='PATCH'){Object.assign(state.profile[0],clone(opts.body));return null}
 throw new Error('Unhandled mock '+method+' '+path);
}};
</script>
<script type="module" src="../../app/profile-settings.js?fixture=1"></script>
<script type="module" src="../../app/profile-workplace-edit-mode.js?fixture=1"></script>
</body></html>
