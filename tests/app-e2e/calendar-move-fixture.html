<!doctype html><html><head><meta charset="utf-8"><style>.hidden{display:none}.modal{display:block}</style></head><body>
<div id="toast" class="hidden"></div>
<button id="teamEvent" class="cm-app" data-app-event="app-team" data-app-scope="team">team</button>
<button id="personalEvent" class="cm-app" data-app-event="app-personal" data-app-scope="personal">personal</button>
<button id="googleEvent" class="cp-event" data-google-event="g-event" data-google-calendar="cal-a">google</button>
<div id="ciAppModal" class="modal"><div class="ci-card"><label>제목<input id="ciAppTitle"></label><select id="ciAppType"><option value="meeting">회의</option></select><input id="ciAppStart"><input id="ciAppEnd"><input id="ciAppLocation"><textarea id="ciAppDescription"></textarea><input id="ciAppColor" value="#24496f"><button id="ciAppSave">save</button><div id="ciAppStatus"></div></div></div>
<div id="ciGoogleModal" class="modal"><div class="ci-card"><label>제목<input id="ciGoogleTitle"></label><input id="ciGoogleAllDay" type="checkbox"><input id="ciGoogleStartDate"><input id="ciGoogleStartTime"><input id="ciGoogleEndDate"><input id="ciGoogleEndTime"><textarea id="ciGoogleMemo"></textarea><input id="ciGoogleColor" value="#4285f4"><button id="ciGoogleSave">save</button><div id="ciGoogleStatus"></div></div></div>
<script>
window.__state={calls:[],oldApp:0,oldGoogle:0,app:{'app-team':{id:'app-team',title:'팀 일정',description:'팀 메모',event_type:'meeting',start_at:'2026-09-14T01:00:00.000Z',end_at:'2026-09-14T02:00:00.000Z',location:'국회',calendar_scope:'team',color_hex:'#24496f',project_id:'p1',created_by:'u1'},'app-personal':{id:'app-personal',title:'개인 일정',description:'개인 메모',event_type:'meeting',start_at:'2026-09-15T01:00:00.000Z',end_at:'2026-09-15T02:00:00.000Z',location:'서울',calendar_scope:'personal',color_hex:'#7656a8',project_id:null,created_by:'u1'}},google:{id:'g-event',title:'Google 일정',description:'구글 메모',start:'2026-09-16T10:00:00+09:00',end:'2026-09-16T11:00:00+09:00',allDay:false,location:'세종',calendarId:'cal-a',color:'#4285f4'}};
const S=window.__state;
window.KPTURuntime={config:{url:'https://example.supabase.co'},session:{ensure:async()=>true},api:async(path,o={})=>{const method=o.method||'GET',body=o.body||null,url=new URL(path,'https://example.supabase.co');if(url.pathname==='/auth/v1/user')return {id:'u1'};if(url.pathname==='/rest/v1/app_workspace_members')return [{workspace_id:'w1'}];if(url.pathname==='/rest/v1/app_event_attendees'){S.calls.push({kind:'attendee-delete',method});return null}if(url.pathname==='/rest/v1/app_events'){const id=(url.searchParams.get('id')||'').replace(/^eq\./,'');if(method==='GET')return [S.app[id]].filter(Boolean);if(method==='PATCH'){S.calls.push({kind:'app-patch',id,body});Object.assign(S.app[id],body);return null}if(method==='DELETE'){S.calls.push({kind:'app-delete',id});delete S.app[id];return null}if(method==='POST'){const row={...body,id:'app-created-'+S.calls.length};S.calls.push({kind:'app-create',body:row});S.app[row.id]=row;return [row]}}if(url.pathname==='/functions/v1/google-calendar'){const action=url.searchParams.get('action')||'';if(method==='GET'&&action==='status')return {connected:true,calendars:[{id:'cal-a',summary:'A',accessRole:'owner'},{id:'cal-b',summary:'B',accessRole:'writer'},{id:'cal-c',summary:'C',accessRole:'reader'}]};if(method==='GET'&&action==='event')return {event:{...S.google,calendarId:url.searchParams.get('calendarId')}};if(method==='POST'){S.calls.push({kind:'google-'+body.action,body});if(body.action==='create-event')return {ok:true,event:{id:'g-created-'+S.calls.length,calendarId:body.calendar_id}};return {ok:true}}}throw new Error('unhandled '+method+' '+url.pathname)}};
window.__KPTU_RELOAD_APP_EVENTS__=async()=>{S.calls.push({kind:'reload-app'})};window.__KPTU_RELOAD_GOOGLE_EVENTS__=async()=>{S.calls.push({kind:'reload-google'})};
ciAppSave.onclick=()=>S.oldApp++;ciGoogleSave.onclick=()=>S.oldGoogle++;
function fillApp(e){ciAppTitle.value=e.title;ciAppType.value=e.event_type;ciAppStart.value='2026-09-14T10:00';ciAppEnd.value='2026-09-14T11:00';ciAppLocation.value=e.location||'';ciAppDescription.value=e.description||'';ciAppColor.value=e.color_hex||'#24496f'}
teamEvent.onclick=()=>fillApp(S.app['app-team']);personalEvent.onclick=()=>fillApp(S.app['app-personal']);googleEvent.onclick=()=>{ciGoogleTitle.value=S.google.title;ciGoogleAllDay.checked=false;ciGoogleStartDate.value='2026-09-16';ciGoogleStartTime.value='10:00';ciGoogleEndDate.value='2026-09-16';ciGoogleEndTime.value='11:00';ciGoogleMemo.value=S.google.description;ciGoogleColor.value=S.google.color};
</script><script src="../../app/calendar-move.js?v=1"></script></body></html>
