<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료실</title>
<meta name="description" content="공공기관·철도·노동정책 등 공개 업무자료를 한곳에서 검색하는 자료실">
<link rel="canonical" href="https://mj880616.github.io/work/public-policy/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="자료실">
<meta property="og:description" content="웹2 자료실에서 외부 공개한 업무자료를 자동으로 모아 보여주는 공개 자료실">
<meta property="og:url" content="https://mj880616.github.io/work/public-policy/">
<link rel="icon" href="/work/favicon.svg?v=1" type="image/svg+xml">
<style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#18202a;--muted:#687383;--line:#e2e7ec;--navy:#17324d;--blue:#245786;--green:#28704b;--soft:#edf3f8;--red:#9a3d45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.58}
button,input,select{font:inherit}
.wrap{max-width:980px;margin:auto;padding:22px 16px 64px}
.hero{background:linear-gradient(135deg,#142a42,#245786);color:#fff;border-radius:20px;padding:30px 28px}
.hero h1{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:#dce8f2;font-size:14px;max-width:760px}.meta{margin-top:14px;font-size:12px;color:#c8d7e5}
.section-label{display:flex;align-items:baseline;gap:8px;margin:22px 2px 8px}.section-label span,.section-kicker{font-size:9px;font-weight:900;letter-spacing:.14em;color:#8793a0}.section-label b{font-size:18px;letter-spacing:-.25px}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:8px}
.toolbar input,.toolbar select{width:100%;border:1px solid #ccd5dd;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 2px 0}.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;background:#eaf0f5;color:var(--navy)}
.sync-note{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:#5c6875}
.sync-note b{color:var(--navy)}.sync-note a{color:var(--blue);font-weight:800;text-decoration:none;white-space:nowrap}.sync-note a:hover{text-decoration:underline}
.section{margin-top:26px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 2px 10px}.section-head h2{font-size:20px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
.groups{display:grid;gap:12px}.group{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.group summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900;color:var(--navy)}.group summary::-webkit-details-marker{display:none}.group summary:after{content:"펼치기 ＋";font-size:11px;color:var(--muted);font-weight:800}.group[open] summary{border-bottom:1px solid var(--line)}.group[open] summary:after{content:"접기 －"}.group-count{font-size:11px;background:var(--soft);padding:4px 8px;border-radius:99px;color:var(--blue);margin-left:auto;margin-right:8px}
.material{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:15px 17px;border-top:1px solid #edf0f3}.material:first-child{border-top:0}.material-main{min-width:0}.material-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.material-title a{color:var(--ink);font-weight:900;text-decoration:none;font-size:15px}.material-title a:hover{text-decoration:underline}.public-badge{font-size:10px;font-weight:800;color:var(--green);background:#eaf3ed;border-radius:99px;padding:3px 7px}.material-meta{font-size:11px;color:var(--muted);margin-top:4px}.material-desc{font-size:13px;color:#4f5b68;margin-top:6px;white-space:pre-wrap}.material-tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10px;color:#5f6d7b;background:#f2f5f7;border-radius:7px;padding:3px 6px}.open-btn{align-self:start;border:1px solid #cbd5df;background:#fff;color:var(--blue);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}.open-btn:hover{background:#f8fafc}
.empty{background:#fff;border:1px dashed #cbd3dc;border-radius:12px;padding:19px;color:var(--muted);font-size:13px}.error{color:var(--red)}
.footer{text-align:center;color:#8a939f;font-size:11px;margin-top:28px}
@media(max-width:720px){.wrap{padding:14px 11px 48px}.hero{padding:24px 20px}.hero h1{font-size:27px}.toolbar{grid-template-columns:1fr}.material{grid-template-columns:1fr}.open-btn{justify-self:start}.sync-note{align-items:flex-start;flex-direction:column}.section-head{align-items:flex-start}.group summary{padding:14px}}
</style>
<link rel="stylesheet" href="/work/assets/web1-design-lite.css?v=1">
</head>
<body>
<main class="wrap">
<header class="hero">
<h1>자료실</h1>
<p>공공기관·철도·노동정책 등 업무자료 중 외부 공개로 지정된 자료를 한곳에서 검색함.</p>
<div class="meta">웹2 자료실 공개본 자동 반영 · 읽기 전용</div>
</header>

<div class="section-label"><span>FIND</span><b>자료 찾기</b></div>
<div class="toolbar">
<input id="searchInput" type="search" placeholder="자료명 · 출처 · 설명 · 태그 검색" aria-label="자료 검색">
<select id="filterCategory" aria-label="분류 필터"><option value="">전체 분류</option></select>
</div>
<div class="summary" id="summary"></div>

<div class="sync-note">
<div><b>자료 원본은 웹2에서 관리함.</b><br>웹2 자료실에서 ‘외부 공개’로 설정한 자료만 이 페이지에 자동 반영되며, 내부 자료의 제목·설명은 노출되지 않음.</div>
<a href="/work/app/?view=library">웹2 자료실에서 관리 →</a>
</div>

<section class="section">
<div class="section-head"><div><span class="section-kicker">LIBRARY</span><h2>자료 목록</h2></div><span id="resultCount">불러오는 중…</span></div>
<div class="groups" id="materialGroups"><div class="empty">자료를 불러오는 중…</div></div>
</section>
<div class="footer">공공운수노조 공공기관사업팀 · 공개 자료실</div>
</main>

<script>
const SB='https://xmlkxfjeagycwttklxjw.supabase.co';
const KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';
const PUBLIC_POST=SB+'/rest/v1/rpc/app_public_post';
const DOCUMENT_SLUGS=["public-doc-8c529b9c6699","public-doc-8bdd35d6ad75","public-doc-9f56e9067b66","public-doc-a772e38145f0","public-doc-a31ad451ed30","public-doc-3f3477610b3c","public-doc-1acdfa2a5aa1","public-doc-12af6595ee61","public-doc-00aa6b9c4d66","public-doc-c09aa8d786d2","public-doc-0e8d97dedfb8","public-doc-80219444ae6b","public-doc-d8e5f6c18e56","public-doc-17ea0a1ed92c"];
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[];

function formatDate(v){
  if(!v)return'';
  const [y,m,d]=String(v).slice(0,10).split('-');
  return y&&m&&d?y+'. '+Number(m)+'. '+Number(d)+'.':String(v);
}
function categories(){
  return [...new Set(rows.map(x=>String(x.category||'기타').trim()||'기타'))].sort((a,b)=>a.localeCompare(b,'ko'));
}
function tagsHtml(tags){
  const list=Array.isArray(tags)?tags:String(tags||'').split(',');
  return list.map(s=>String(s).trim()).filter(Boolean).map(s=>'<span class="tag">'+esc(s)+'</span>').join('');
}
function refreshFilter(){
  const current=filterCategory.value;
  filterCategory.innerHTML='<option value="">전체 분류</option>'+categories().map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  if([...filterCategory.options].some(o=>o.value===current))filterCategory.value=current;
}
function render(){
  const q=searchInput.value.trim().toLowerCase(),cat=filterCategory.value;
  const filtered=rows.filter(x=>{
    const category=String(x.category||'기타').trim()||'기타';
    const hay=[x.title,x.file_name,x.source,category,x.description,Array.isArray(x.tags)?x.tags.join(' '):x.tags].filter(Boolean).join(' ').toLowerCase();
    return (!cat||category===cat)&&(!q||hay.includes(q));
  });
  resultCount.textContent=filtered.length+'개 자료';
  const counts={};
  rows.forEach(x=>{const c=String(x.category||'기타').trim()||'기타';counts[c]=(counts[c]||0)+1});
  summary.innerHTML='<span class="pill">전체 '+rows.length+'</span>'+categories().map(c=>'<span class="pill">'+esc(c)+' '+counts[c]+'</span>').join('');

  if(!filtered.length){
    materialGroups.innerHTML='<div class="empty">조건에 맞는 공개 자료가 없습니다.</div>';
    return;
  }
  const grouped=categories().map(c=>[c,filtered.filter(x=>(String(x.category||'기타').trim()||'기타')===c)]).filter(([,items])=>items.length);
  materialGroups.innerHTML=grouped.map(([category,items],i)=>'<details class="group" '+(i<3?'open':'')+'><summary><span>'+esc(category)+'</span><span class="group-count">'+items.length+'</span></summary><div>'+items.map(x=>{
    const title=x.title||x.file_name||'자료';
    const meta=[x.document_date?formatDate(x.document_date):'',x.source||''].filter(Boolean).map(esc).join(' · ');
    const link=x.drive_url?'<a class="open-btn" href="'+esc(x.drive_url)+'" target="_blank" rel="noopener">열기</a>':'';
    const postLink='<a class="open-btn" href="/work/p/?slug='+encodeURIComponent(x.slug)+'">게시글</a>';
    return '<div class="material"><div class="material-main"><div class="material-title">'+
      (x.drive_url?'<a href="'+esc(x.drive_url)+'" target="_blank" rel="noopener">'+esc(title)+'</a>':'<span>'+esc(title)+'</span>')+
      '<span class="public-badge">공개</span></div>'+
      (meta?'<div class="material-meta">'+meta+'</div>':'')+
      (x.description?'<div class="material-desc">'+esc(x.description)+'</div>':'')+
      ((Array.isArray(x.tags)&&x.tags.length)||(!Array.isArray(x.tags)&&x.tags)?'<div class="material-tags">'+tagsHtml(x.tags)+'</div>':'')+
      '</div>'+postLink+link+'</div>';
  }).join('')+'</div></details>').join('');
}
async function load(){
  try{
    const posts=await Promise.all(DOCUMENT_SLUGS.map(async slug=>{
      const r=await fetch(PUBLIC_POST,{method:'POST',headers:H,body:JSON.stringify({p_slug:slug}),cache:'no-store'});
      if(!r.ok)throw new Error('공개 자료 조회 실패: '+r.status);
      const data=await r.json();
      const post=Array.isArray(data)?data[0]:null;
      if(!post||!post.document_url)throw new Error('공개 자료 게시글 누락: '+slug);
      return {
        slug,title:post.title,description:post.summary,
        category:post.document_category,source:post.document_source,
        document_date:post.document_date,tags:post.document_tags,
        drive_url:post.document_url
      };
    }));
    rows=posts;
    refreshFilter();
    render();
  }catch(e){
    console.error(e);
    resultCount.textContent='조회 실패';
    materialGroups.innerHTML='<div class="empty error">자료 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
  }
}
searchInput.addEventListener('input',render);
filterCategory.addEventListener('change',render);
load();
</script>
<script src="/work/app/web1-page-capabilities.js?v=2"></script>

</body>
</html>
