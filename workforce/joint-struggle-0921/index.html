<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9.21~22 인력확충 촉구 공동투쟁</title><meta name="description" content="공공운수노조 인력확충 촉구 청와대 앞 1박 2일 공동투쟁 준비 현황"><link rel="canonical" href="https://mj880616.github.io/work/workforce/joint-struggle-0921/"><style>:root{--bg:#f3f4f6;--card:#fff;--ink:#17191d;--muted:#68707b;--line:#e3e6ea;--red:#b51f2e;--dark:#202328}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{max-width:900px;margin:auto;padding:18px 14px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{display:inline-block;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#555;text-decoration:none;font-size:13px;font-weight:800}.nav a.current{background:#202328;color:#fff;border-color:#202328}header{background:var(--dark);color:white;border-radius:20px;padding:25px 22px;margin-top:12px}header .eyebrow{font-size:12px;color:#cbd0d6;font-weight:700}h1{font-size:26px;line-height:1.35;margin:7px 0 8px}header p{margin:0;color:#d9dde2;font-size:14px}.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat,.section{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:15px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.section{padding:17px;margin:12px 0}.section h2{font-size:18px;margin:0 0 12px}.item{display:grid;grid-template-columns:27px 1fr;gap:7px;padding:11px 0;border-top:1px solid #eef0f2}.item:first-of-type{border-top:0}.item input{width:19px;height:19px;accent-color:var(--red)}.org{display:grid;grid-template-columns:27px 1fr 80px;gap:7px;padding:10px 0;border-top:1px solid #eef0f2}.org input[type=number]{width:70px;padding:6px;border:1px solid #ccd1d7;border-radius:8px}.desc{font-size:12px;color:var(--muted)}@media(max-width:620px){h1{font-size:22px}.dashboard{grid-template-columns:1fr 1fr}.dashboard .stat:last-child{grid-column:1/-1}.org{grid-template-columns:27px 1fr}.org input[type=number]{grid-column:2}}</style><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:site_name" content="공공운수노조"><meta property="og:title" content="9.21~22 인력확충 촉구 청와대 앞 1박 2일 공동투쟁"><meta property="og:description" content="공공기관 인력확충을 요구하는 9월 21~22일 청와대 앞 1박 2일 공동투쟁 준비 현황"><meta property="og:url" content="https://mj880616.github.io/work/workforce/joint-struggle-0921/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="9.21~22 인력확충 촉구 청와대 앞 1박 2일 공동투쟁"><meta name="twitter:description" content="공공기관 인력확충을 요구하는 9월 21~22일 청와대 앞 1박 2일 공동투쟁 준비 현황"></head><body><main><nav class="nav"><a href="../">← 인력확충 투쟁 메인</a><a href="../press-conference-0914/">9/14 기자회견</a><a class="current" href="./">9/21~22 1박2일 투쟁</a></nav><header><div class="eyebrow">공공운수노조 · 공동 준비 현황판</div><h1>9.21 ~ 9.22 인력확충 촉구 청와대 앞 1박 2일 공동투쟁</h1><p>조직화부터 집회·농성, 언론선전, 2일차 청와대 대응까지 함께 점검</p></header><div class="dashboard"><div class="stat"><b id="pct">0%</b><span>준비 진행률</span></div><div class="stat"><b id="remain">0</b><span>남은 준비 항목</span></div><div class="stat"><b id="people">0명</b><span>예상 참석인원</span></div></div><section class="section"><h2>확정·완료사항</h2><div id="done"></div></section><section class="section"><h2>조직화</h2><p class="desc">조직화 여부와 예상 참석인원을 공유합니다.</p><div id="orgs"></div></section><section class="section"><h2>집회·농성 기본 준비</h2><div id="basic"></div></section><section class="section"><h2>기획·예산</h2><div id="plan"></div></section><section class="section"><h2>발언·공연</h2><div id="program"></div></section><section class="section"><h2>선전·언론</h2><div id="media"></div></section><section class="section"><h2>2일차 청와대 대응</h2><div id="day2"></div></section></main><script>const API='https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/pc0921-board';const groups=[['rail','철도노조'],['seoulmetro','서울교통공사노조'],['busanmetro','부산지하철노조'],['gas_safety','가스안전공사노조'],['nhis','국민건강보험'],['pension','국민연금지부'],['kr_network','국가철도공단노조'],['lx','국토정보공사노조'],['consumer','소비자원지부'],['medical','의료연대본부']];const tasks={done:[['done_confirm','9/21~22 1박 2일 투쟁 운영위 결의'],['done_report','집회 신고 완료'],['done_ops','운영위원회 안건용 자료 작성·전달 완료']],basic:[['task_stage','무대 섭외'],['task_food','밥차 섭외 — 약 300인분'],['task_supplies','1박 2일 농성 필요 물품 체크'],['task_program','집회 프로그램 확정']],plan:[['task_outline_budget','사업 개요 및 예산 기안 — 김명진']],program:[['task_speakers','현장 중심 발언자 섭외'],['task_performance','공연팀 섭외'],['task_kang_draft','강성규 본부장 발언문 초안 작성']],media:[['task_webposter','웹자보 제작'],['task_webnotice','웹자보 활용 현장 알림'],['task_materials','현수막·피켓 등 선전물 제작'],['task_press_request','취재요청서 작성'],['task_press_release','보도자료 작성']],day2:[['task_meeting_schedule','청와대 사회수석 면담 일정 조율'],['task_meeting_doc','청와대 사회수석 면담자료 작성']]};let state={},ready=false;function render(){for(const [sec,arr] of Object.entries(tasks)){document.getElementById(sec).innerHTML=arr.map(([k,t])=>`<div class="item"><input type="checkbox" id="${k}" ${sec==='done'?'checked':''}><label for="${k}">${t}</label></div>`).join('')}document.getElementById('orgs').innerHTML=groups.map(([k,n])=>`<div class="org"><input type="checkbox" id="org_${k}"><label for="org_${k}">${n}</label><input type="number" min="0" id="people_${k}" placeholder="명"></div>`).join('');document.querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=()=>save(el.id,el.checked));document.querySelectorAll('input[type=number]').forEach(el=>el.onchange=()=>save(el.id,Number(el.value)||0));update()}async function save(k,v){if(!ready)return;state[k]=v;try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_key:k,checked:typeof v==='boolean'?v:undefined,value:typeof v==='number'?v:undefined})})}catch{}update()}async function load(){try{let r=await fetch(API,{cache:'no-store'});let rows=await r.json();rows.forEach(x=>{state[x.item_key]=x.value??x.checked;let e=document.getElementById(x.item_key);if(e){if(e.type==='checkbox')e.checked=!!x.checked;else e.value=x.value||0}})}catch{}ready=true;update()}function update(){let checks=[...document.querySelectorAll('input[type=checkbox]')],done=checks.filter(x=>x.checked).length;document.getElementById('pct').textContent=Math.round(done/checks.length*100)+'%';document.getElementById('remain').textContent=checks.length-done;document.getElementById('people').textContent=[...document.querySelectorAll('input[type=number]')].reduce((a,x)=>a+(Number(x.value)||0),0)+'명'}render();load();setInterval(()=>{if(document.visibilityState==='visible')load()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});</script></body></html>
