<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9/14 기자회견 준비 현황판</title><meta name="description" content="공공기관 증원 연계 2% 인력감축 방침 폐기 촉구 기자회견 준비 현황"><link rel="canonical" href="https://mj880616.github.io/work/workforce/press-conference-0914/"><style>:root{--bg:#f4f5f7;--text:#17191c;--muted:#68707a;--line:#e2e5e9;--accent:#b51f2e}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}main{max-width:920px;margin:auto;padding:18px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{display:inline-block;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#555;text-decoration:none;font-size:13px;font-weight:800}.nav a.current{background:#202328;color:#fff;border-color:#202328}header{background:#202328;color:#fff;padding:24px;border-radius:18px;margin:12px 0 16px}h1{font-size:25px;margin:0 0 8px;line-height:1.35}header p{margin:5px 0;color:#d9dde2;font-size:14px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat,.section{background:#fff;border:1px solid var(--line);border-radius:15px}.stat{padding:15px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#e8eaed;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent);width:0}.section{margin:12px 0;padding:16px}.section h2{font-size:17px;margin:0 0 12px}.item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:11px 0;border-top:1px solid #eee}.item:first-of-type{border-top:0}.item input{width:19px;height:19px;margin-top:2px}.item label{font-size:15px;line-height:1.45}.meta{font-size:11px;color:var(--muted)}.urgent{color:var(--accent);font-weight:700}.note{font-size:12px;color:var(--muted);margin-top:4px}.topnote{background:#fff7e8;border:1px solid #f0d29d;padding:13px 15px;border-radius:13px;font-size:13px;line-height:1.55;margin-bottom:12px}.sub{padding-left:18px;background:#fafafa}@media(max-width:560px){h1{font-size:21px}.item{grid-template-columns:26px 1fr}.meta{grid-column:2}}</style><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:site_name" content="공공운수노조"><meta property="og:title" content="9/14 공공기관 인력감축 방침 폐기 촉구 기자회견"><meta property="og:description" content="증원 연계 2% 인력감축 방침 폐기와 공공부문 인력 확대·충원을 요구하는 9월 14일 기자회견 준비 현황"><meta property="og:url" content="https://mj880616.github.io/work/workforce/press-conference-0914/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="9/14 공공기관 인력감축 방침 폐기 촉구 기자회견"><meta name="twitter:description" content="증원 연계 2% 인력감축 방침 폐기와 공공부문 인력 확대·충원을 요구하는 9월 14일 기자회견 준비 현황"></head><body><main><nav class="nav"><a href="../">← 인력확충 투쟁 메인</a><a class="current" href="./">9/14 기자회견</a><a href="../joint-struggle-0921/">9/21~22 1박2일 투쟁</a><a href="../../press/2026-09-14-workforce/">취재요청서 보기</a></nav><header><h1>공공기관 증원 연계 2% 인력감축 방침 폐기 촉구 기자회견</h1><p>2026. 9. 14.(월) 10:00 · 청와대 앞 · 공공운수노조</p></header><div class="topnote"><b>핵심 요구</b><br>① 증원 연계 2% 인력감축 방침 폐기 및 공공기관 정원·인력정책 전면 재검토<br>② 공공부문 청년 일자리 확충, 안전 보장 및 공공서비스 확대를 위한 인력 확대·충원</div><div class="summary"><div class="stat"><b id="pct">0%</b><span>전체 진행률</span><div class="bar"><i id="bar"></i></div></div><div class="stat"><b id="remain">0</b><span>남은 준비 항목</span></div></div><div id="sections"></div></main><script>const API='https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/pc0914-checklist';const data=[['기획·내용',[['기자회견 최종 기획안 확정','완료'],['현장발언 2~3꼭지 사업장·발언자 확정','긴급'],['연금 — 서보람 (당일 이사장 면담 일정으로 발언 불가)','발언 불가',1],['건보 — 서보람','',1],['국가철도 — 서보람','',1],['소비자원 — 한소영','',1],['가스안전 — 홍원표','',1],['철도 — 김명진','',1],['기자회견문 작성·검토',''],['청와대 전달용 공공기관 정원·인력정책 전면 재검토 요구안 작성','']]],['조직',[['증원 연계 2% 인력감축 방침 피해 사업장 확인 및 참가 요청','긴급']]],['현장·진행',[['사회자 — 공성식','확인'],['기자회견 현수막 제작',''],['손팻말 제작',''],['음향·앰프 준비',''],['청와대 요구안 전달 방식·담당자 확인','']]],['언론·선전',[['취재요청서 작성',''],['언론사·기자 연락망 발송',''],['보도자료 작성','']]],['당일 운영',[['운영위원회 안건 작성 제출',''],['보도자료·요구안 출력물 준비',''],['현수막·피켓·음향 등 지참','']]],['후속',[['언론보도 모니터링 및 공유','']]]];let idx=0,total=0,ready=false;const root=document.getElementById('sections');data.forEach(([title,items])=>{let s=document.createElement('section');s.className='section';s.innerHTML='<h2>'+title+'</h2>';items.forEach(([txt,status,sub])=>{let id='i'+idx++;total++;let row=document.createElement('div');row.className='item'+(sub?' sub':'');row.innerHTML=`<input type="checkbox" id="${id}" ${status==='완료'||status==='확인'?'checked':''}><label for="${id}">${txt}${status==='긴급'?'<div class="note urgent">우선 확정 필요</div>':''}</label><span class="meta">${status}</span>`;s.appendChild(row);row.querySelector('input').onchange=async e=>{if(!ready)return;try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_key:id,checked:e.target.checked})})}catch{}update()}});root.appendChild(s)});async function load(){try{let r=await fetch(API,{cache:'no-store'});let rows=await r.json();rows.forEach(x=>{let el=document.getElementById(x.item_key);if(el)el.checked=x.checked})}catch{}ready=true;update()}function update(){let done=document.querySelectorAll('input:checked').length,p=Math.round(done/total*100);document.getElementById('pct').textContent=p+'%';document.getElementById('remain').textContent=total-done;document.getElementById('bar').style.width=p+'%'}load();update();setInterval(()=>{if(document.visibilityState==='visible')load()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});</script></body></html>
