<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이메일 인증 완료 · 업무 현황</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1d2735;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #d9dee5;border-radius:24px;padding:38px 30px;box-shadow:0 18px 50px rgba(25,38,55,.08)}.mark{width:58px;height:58px;border-radius:18px;background:#96a58f;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin-bottom:24px}.eyebrow{font-size:13px;letter-spacing:.16em;font-weight:800;color:#426b8f;margin-bottom:10px}.card h1{font-size:30px;line-height:1.25;margin:0 0 14px}.card p{font-size:16px;line-height:1.7;color:#68727f;margin:0 0 28px}.btn{display:block;width:100%;padding:15px 18px;border-radius:14px;background:#1f4169;color:#fff;text-decoration:none;text-align:center;font-weight:800;font-size:17px}.sub{margin-top:14px;text-align:center;font-size:13px;color:#8a929c}
</style>
</head>
<body>
<main class="card">
<div class="mark">✓</div>
<div class="eyebrow">KPTU WORKSPACE</div>
<h1>이메일 인증이 완료되었습니다.</h1>
<p>계정 확인이 끝났습니다. 업무 현황 앱으로 돌아가 가입할 때 입력한 이메일과 비밀번호로 로그인해 주세요.</p>
<a class="btn" href="./">로그인 화면 열기</a>
<div class="sub">앱에서 메일을 열었다면 이 창을 닫고 앱으로 돌아가도 됩니다.</div>
</main>
</body>
</html>
