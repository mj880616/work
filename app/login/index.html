<!doctype html>
<html lang="ko">
<head>
<script data-kptu-theme-bootstrap>document.documentElement.setAttribute('data-theme','olive');</script><!-- SET-보기선택서버저장: 테마는 서버 프로필에서 읽어 loader가 첫 화면 공개 전에 바꾼다(기기 저장소 없음). -->
<meta charset="utf-8">
<script src="../origin-redirect.js"></script><!-- SEC-github.io넘기기: github.io로 열리면 bokdoong.com으로 넘김(가장 먼저) -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161613" media="(prefers-color-scheme: dark)">
<title>로그인</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../app-icon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/app-icon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="../styles.css">
<style>
.login-shell{min-height:100vh;display:grid;grid-template-rows:1fr}.oauth-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 8px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="login-shell">
  <main>
    <section class="auth-wrap">
      <div class="auth-card">
        <h1>업무 공간 로그인</h1>
        <p>업무 정보는 로그인한 본인만 볼 수 있습니다.</p>
        <button id="googleLoginBtn" class="secondary oauth-btn" type="button">Google로 계속하기</button>
        <div id="authStatus" class="status"></div>
      </div>
    </section>
  </main>
</div>
<script src="../runtime-client.js" defer></script>
<script src="../auth-bootstrap.js" defer></script>
<script src="../auth-service.js" defer></script>
<script src="./native-google-return.js" defer></script>
<script src="./login.js" defer></script>
</body>
</html>
