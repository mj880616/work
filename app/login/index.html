<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로그인</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles.css?v=4">
<style>
.login-shell{min-height:100vh;display:grid;grid-template-rows:1fr}.oauth-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 8px}.auth-divider{display:flex;align-items:center;gap:10px;color:#8a949d;font-size:11px;margin:12px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#e3e8ec;flex:1}.email-auth-toggle{width:100%}.hidden{display:none!important}
</style>
</head>
<body>
<div class="login-shell">
  <main>
    <section class="auth-wrap">
      <div class="auth-card">
        <div class="eyebrow">KPTU PUBLIC INSTITUTIONS TEAM</div>
        <h1>Workspace 로그인</h1>
        <p>Web2 업무정보는 로그인한 사용자만 볼 수 있습니다.</p>
        <button id="googleLoginBtn" class="secondary oauth-btn" type="button">Google로 계속하기</button>
        <div class="auth-divider"><span>또는</span></div>
        <button id="emailAuthToggle" class="secondary email-auth-toggle" type="button">다른 방법으로 로그인</button>
        <div id="emailAuthPanel" class="hidden">
          <form id="authForm">
            <label>이메일<input id="authEmail" type="email" autocomplete="email" required></label>
            <label>비밀번호<input id="authPassword" type="password" minlength="8" autocomplete="current-password" required></label>
            <button id="authSubmit" class="primary wide" type="submit">로그인</button>
          </form>
        </div>
        <div id="authStatus" class="status"></div>
      </div>
    </section>
  </main>
</div>
<script src="../runtime-client.js?v=5" defer></script>
<script src="../auth-bootstrap.js?v=1" defer></script>
<script src="../auth-service.js?v=2" defer></script>
<script src="./native-google-return.js?v=1" defer></script>
<script src="./login.js?v=3" defer></script>
</body>
</html>
