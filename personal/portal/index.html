<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="읽고 기록한 것을 모아 둔 개인 공간">
  <meta name="theme-color" content="#f7f8f6">
  <title>bokdoong.com</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b5d50'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' fill='white'%3Eb%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f8f6; color: #1c2925; }
    main { width: min(100% - 40px, 760px); margin: 0 auto; padding: clamp(56px, 10vw, 112px) 0 72px; }
    .eyebrow { margin: 0 0 16px; color: #2b5d50; font-size: 13px; font-weight: 750; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 52px); line-height: 1.2; letter-spacing: -.05em; }
    .intro { margin: 18px 0 44px; color: #50615b; font-size: 17px; line-height: 1.7; }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { display: block; min-height: 145px; padding: 24px; border: 1px solid #dce5de; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    .card:hover { border-color: #2b5d50; transform: translateY(-2px); }
    .card:focus-visible { outline: 3px solid #2b5d50; outline-offset: 3px; }
    .card strong { display: block; margin-bottom: 10px; font-size: 22px; }
    .card span { color: #50615b; font-size: 14px; line-height: 1.6; }
    footer { margin-top: 54px; color: #66756f; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">BOKDOONG.COM</p>
    <h1>읽고, 생각하고, 기록합니다.</h1>
    <p class="intro">관심 있는 것을 오래 살펴보고 기록하는 개인 공간입니다.</p>
    <nav class="links" aria-label="개인 프로젝트">
      <a class="card" href="https://read.bokdoong.com/"><strong>읽생기</strong><span>읽은 것에서 시작한 생각과 기록</span></a>
      <a class="card" href="https://arsenal.bokdoong.com/"><strong>아스날 경기노트</strong><span>경기별 리뷰와 전술 분석 아카이브</span></a>
    </nav>
    <footer>bokdoong.com</footer>
  </main>
</body>
</html>
