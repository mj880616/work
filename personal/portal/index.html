<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="개인 기록과 업무 도구를 모아 둔 bokdoong.com 시작 페이지">
  <meta name="theme-color" content="#f7f8f6">
  <title>bokdoong.com</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b5d50'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' fill='white'%3Eb%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f8f6; color: #1c2925; }
    main { width: min(100% - 40px, 760px); margin: 0 auto; padding: clamp(56px, 10vw, 112px) 0 72px; }
    .eyebrow { margin: 0 0 16px; color: #2b5d50; font-size: 13px; font-weight: 750; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 52px); line-height: 1.2; letter-spacing: -.05em; }
    .intro { margin: 14px 0 32px; color: #50615b; font-size: 16px; line-height: 1.65; }
    .group + .group { margin-top: 28px; }
    .group-label { margin: 0 0 10px 2px; color: #7a8983; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 11px; }
    .card { display: block; padding: 18px 20px; border: 1px solid #dce5de; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s; }
    .card:hover { border-color: #2b5d50; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(43,93,80,.06); }
    .card:focus-visible { outline: 3px solid #2b5d50; outline-offset: 3px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 7px; }
    .card-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .site-icon { width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto; object-fit: cover; }
    .card strong { font-size: 20px; line-height: 1.35; }
    .card small { color: #8a9892; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    .card span { display: block; color: #50615b; font-size: 14px; line-height: 1.55; }
    footer { margin-top: 42px; color: #66756f; font-size: 13px; }
    @media (max-width: 560px) {
      main { width: min(100% - 32px, 760px); padding-top: 44px; }
      .intro { margin-bottom: 28px; }
      .group + .group { margin-top: 24px; }
      .links { grid-template-columns: 1fr; gap: 10px; }
      .card { padding: 17px 18px; }
    }
    @media (hover: none) { .card:hover { border-color: #dce5de; transform: none; box-shadow: none; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">BOKDOONG.COM</p>
    <h1>나의 작업과 기록</h1>
    <p class="intro">업무 도구와 개인 기록을 한곳에서 엽니다.</p>

    <section class="group" aria-labelledby="work-group">
      <p class="group-label" id="work-group">WORK</p>
      <nav class="links" aria-label="업무 도구">
        <a class="card" href="https://work.bokdoong.com/">
          <div class="card-head"><span class="card-title"><img class="site-icon" src="https://work.bokdoong.com/work/favicon.svg?v=20260920" alt="" aria-hidden="true"><strong>업무 현황</strong></span><small>WEB1</small></div>
          <span>공공기관사업팀 주요 사업과 일정 현황</span>
        </a>
        <a class="card" href="https://desk.bokdoong.com/">
          <div class="card-head"><span class="card-title"><img class="site-icon" src="https://desk.bokdoong.com/work/app/app-icon.svg?v=20260920" alt="" aria-hidden="true"><strong>업무 공간</strong></span><small>WEB2</small></div>
          <span>프로젝트·회의·자료를 관리하는 작업 공간</span>
        </a>
      </nav>
    </section>

    <section class="group" aria-labelledby="personal-group">
      <p class="group-label" id="personal-group">PERSONAL</p>
      <nav class="links" aria-label="개인 기록">
        <a class="card" href="https://read.bokdoong.com/">
          <div class="card-head"><span class="card-title"><img class="site-icon" src="https://read.bokdoong.com/read-think-write/favicon.svg?v=20260920" alt="" aria-hidden="true"><strong>읽생기</strong></span><small>READ</small></div>
          <span>읽은 것에서 시작한 생각과 기록</span>
        </a>
        <a class="card" href="https://arsenal.bokdoong.com/">
          <div class="card-head"><span class="card-title"><img class="site-icon" src="https://arsenal.bokdoong.com/work/personal/arsenal-match-archive/favicon.svg?v=20260920" alt="" aria-hidden="true"><strong>아스날 경기노트</strong></span><small>ARSENAL</small></div>
          <span>경기별 리뷰와 전술 분석 아카이브</span>
        </a>
      </nav>
    </section>
    <footer>bokdoong.com</footer>
  </main>
</body>
</html>
