<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPTU 게시판 수집 테스트</title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:40px auto;padding:0 18px;line-height:1.55}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:10px}button{padding:10px 14px;font-size:16px}</style></head><body><h1>KPTU 게시판 수집 테스트</h1><p>Supabase 서버에서 KPTU 게시판 1·2·10페이지에 접근 가능한지 확인합니다.</p><button id="run">테스트 실행</button><pre id="out">대기 중</pre><script>const out=document.querySelector('#out');document.querySelector('#run').onclick=async()=>{out.textContent='실행 중...';try{const r=await fetch('https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/kptu-board-probe');const t=await r.text();out.textContent='HTTP '+r.status+'\n\n'+t}catch(e){out.textContent='호출 실패: '+e}}</script></body></html>
