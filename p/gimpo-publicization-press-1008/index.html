<main>
  <div class="event-strip"><strong>10/8 김포골드라인 공영화·안전인력 확충 촉구 기자회견</strong><span>2026. 10. 8.(목) 11:00 · 김포시청 앞 · 공공운수노조 전국철도지하철노동조합협의회</span></div>

  <section class="prep-board" aria-label="준비 체크리스트">
    <div class="prep-head"><div><h2>준비 체크리스트</h2><p>9/14 기자회견 준비 현황판과 같은 방식으로 상태를 서버에 저장함.</p></div><span id="saveStatus" class="save-status">서버 동기화</span></div>
    <div class="topnote"><b>핵심 요구</b><br>① 김포골드라인 공영화·공공운영 전환 검토 착수<br>② 5편성 증차에 따른 직종별 안전인력 충원 및 운영비 반영<br>③ 민간위탁 운영비·적정인력 산정근거 공개와 정상화</div>
    <div class="summary-grid"><div class="stat"><b id="pct">0%</b><span>전체 진행률</span><div class="bar"><i id="bar"></i></div></div><div class="stat"><b id="remain">0</b><span>남은 준비 항목</span></div></div>

<script src="../../app/page-design-core.js?v=3"></script>

<script>
const SB='https://xmlkxfjeagycwttklxjw.supabase.co',KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';
const PAGE_SLUG='gimpo-publicization-press-1008';
const BOARD_API='https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/pc0921-board?board=private_rail';
const LABEL={article:'ARTICLE · 업무자료',notice:'NOTICE · 알림',status:'STATUS UPDATE · 업무현황',event:'EVENT · 행사 안내',brief:'POLICY BRIEF · 정책 브리핑'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let printDetailState=[];
function expandForPrint(){printDetailState=[...document.querySelectorAll('#paper details')].map(el=>({el,open:el.open}));printDetailState.forEach(x=>x.el.open=true)}
function restoreAfterPrint(){printDetailState.forEach(x=>x.el.open=x.open);printDetailState=[]}
function printPage(){expandForPrint();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}
window.addEventListener('beforeprint',expandForPrint);window.addEventListener('afterprint',restoreAfterPrint);document.querySelector('#printPageBtn')?.addEventListener('click',printPage);
function render(p,secure=false){
  document.title=p.title;window.KPTUPublicPageEditor?.setPage(p,secure);
  const pd=window.KPTUPageDesign,pageDesign=secure?{}:(p.metadata?.page_design||{}),template=secure?'article':(pageDesign.template||'event');
  const paper=document.querySelector('#paper');paper.className='paper template-'+template+' '+(pd?.classNames(pageDesign,template)||'pd-design');
  paper.innerHTML=`<header class="pd-hero"><div class="pd-kicker">${secure?'제한 공유 문서':LABEL[template]||LABEL.event}</div><h1 class="pd-title">${esc(p.title)}</h1>${p.summary?`<p class="pd-summary">${esc(p.summary)}</p>`:''}</header><div class="pd-body">${pd?.renderMarkdown(p.body||'')||esc(p.body||'')}</div><div style="font-size:11px;color:#8b959f;margin-top:30px;padding-top:13px;border-top:1px solid #edf0f2">최근 수정 ${new Date(p.updated_at).toLocaleString('ko-KR')}</div>`;
}
window.KPTURenderPublicPage=render;
async function loadPage(){const url=SB+'/rest/v1/app_pages?slug=eq.'+encodeURIComponent(PAGE_SLUG)+'&status=eq.published&visibility=in.(public,unlisted)&select=id,title,summary,body,metadata,updated_at&limit=1';const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}),d=await r.json();if(!r.ok||!d.length)throw new Error('page');render(d[0],false)}
loadPage().catch(()=>document.querySelector('#paper').innerHTML='<div style="text-align:center;color:#68727c;padding:60px 20px">페이지를 불러오지 못했습니다.</div>');

const checklist=[
  ['기획·내용',[
    ['task_gimpo1008_plan','기자회견 최종 기획안 확정',''],
    ['task_gimpo1008_demands','핵심 요구 3~4개 최종 확정',''],
    ['task_gimpo1008_facts','5편성·인력·운영비 관련 현장 수치 최신화',''],
    ['task_gimpo1008_release','보도자료 작성·검토·최종본 확정',''],
    ['task_gimpo1008_statement','기자회견문 작성·검토',''],
    ['task_gimpo1008_city_demand','김포시 전달 요구서 작성','']
  ]],
  ['발언·섭외',[
    ['task_gimpo1008_social','사회자','select'],
    ['task_gimpo1008_opening','모두발언 — 궤도협의회 대표','select'],
    ['task_gimpo1008_field','현장발언 — 김포도시철도지부 대표','select'],
    ['task_gimpo1008_solidarity','연대발언 — 궤도협의회 소속 조직 대표','select'],
    ['task_gimpo1008_reader','기자회견문 낭독 — 김포도시철도지부 조합원 1~2명','select'],
    ['task_gimpo1008_brief','발언자별 발언요지 전달 및 시간 확인','']
  ]],
  ['현장·진행',[
    ['task_gimpo1008_fieldlead','현장 총괄 담당자 지정','select'],
    ['task_gimpo1008_banner','현수막 제작',''],
    ['task_gimpo1008_picket','손팻말·피켓 제작',''],
    ['task_gimpo1008_sound','음향·앰프 준비',''],
    ['task_gimpo1008_flags','궤도협의회·참가조직 깃발 준비',''],
    ['task_gimpo1008_layout','현장 집결 위치·발언자·기수 배치 확인',''],
    ['task_gimpo1008_handover','김포시 요구서 전달 방식·접수 담당 확인','']
  ]],
  ['언론·선전',[
    ['task_gimpo1008_media_owner','언론 연락·사진/SNS 담당자 확정','select'],
    ['task_gimpo1008_advisory','취재요청서 작성·발송',''],
    ['task_gimpo1008_media_list','중앙·지역 언론 기자 연락망 정리',''],
    ['task_gimpo1008_pressroom','김포시청 출입·지역기자단 전달 방식 확인',''],
    ['task_gimpo1008_photo','현장 사진·영상 촬영 담당 및 배포 채널 확인','']
  ]],
  ['인수인계·최종점검',[
    ['task_gimpo1008_handoff_pack','10/2까지 기획안·문안·연락처·준비상황 인수인계','긴급'],
    ['task_gimpo1008_reconfirm','10/7 참가조직·발언자 재확인',''],
    ['task_gimpo1008_weather','10/7 기상 확인 및 우천대책 점검',''],
    ['task_gimpo1008_materials','현수막·피켓·음향·깃발·인쇄물 최종 확인',''],
    ['task_gimpo1008_prints','보도자료·기자회견문·요구서 출력물 준비','']
  ]],
  ['당일 운영·후속',[
    ['task_gimpo1008_setup','10:20~10:30 현장 집결·세팅',''],
    ['task_gimpo1008_briefing','10:40 발언자·사회자 최종 브리핑',''],
    ['task_gimpo1008_start','11:00 기자회견 시작',''],
    ['task_gimpo1008_deliver','종료 직후 김포시 요구서 전달',''],
    ['task_gimpo1008_send','보도자료·현장사진 즉시 배포',''],
    ['task_gimpo1008_clipping','언론보도 클리핑 및 지부·궤도협의회 공유',''],
    ['task_gimpo1008_council','시의회 행감 대응 의원실에 결과자료 전달',''],
    ['task_gimpo1008_response','김포시 답변·요구서 접수 결과 기록','']
  ]]
];
let ready=false,total=0;
const checkRoot=document.querySelector('#checkSections');
function rowSelect(key,label){return `<div class="item sub"><span></span><label for="${key}">${label}</label><select class="status-select" id="${key}" data-done="false" data-failed="false"><option value="false">섭외 미완료</option><option value="true">섭외 완료</option><option value="failed">섭외 불발</option></select></div>`}
function rowCheck(key,label,flag){return `<div class="item"><input type="checkbox" id="${key}"><label for="${key}">${label}${flag==='긴급'?'<div class="urgent">우선 확정 필요</div>':''}</label><span class="meta">${flag||''}</span></div>`}
checklist.forEach(([title,items])=>{const sec=document.createElement('section');sec.className='check-section';sec.innerHTML='<h3>'+title+'</h3>'+items.map(([key,label,type])=>{total++;return type==='select'?rowSelect(key,label):rowCheck(key,label,type)}).join('');checkRoot.append(sec)});
async function save(key,value){const r=await fetch(BOARD_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_key:key,checked:value})});if(!r.ok)throw new Error('save')}
function setSaveStatus(text,error=false){const el=document.querySelector('#saveStatus');el.textContent=text;el.classList.toggle('error',error)}
document.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',async()=>{if(!ready)return;setSaveStatus('저장 중…');try{await save(el.id,el.checked);setSaveStatus('저장됨');update()}catch{setSaveStatus('저장 실패',true)}}));
document.querySelectorAll('select.status-select').forEach(el=>el.addEventListener('change',async()=>{if(!ready)return;const done=el.value==='true',failed=el.value==='failed';el.dataset.done=String(done);el.dataset.failed=String(failed);setSaveStatus('저장 중…');try{await Promise.all([save(el.id+'_done',done),save(el.id+'_failed',failed)]);setSaveStatus('저장됨');update()}catch{setSaveStatus('저장 실패',true)}}));
function update(){document.querySelectorAll('select.status-select').forEach(el=>{el.dataset.done=String(el.value==='true');el.dataset.failed=String(el.value==='failed')});const done=document.querySelectorAll('input[type=checkbox]:checked').length+[...document.querySelectorAll('select.status-select')].filter(el=>el.value==='true').length;const p=Math.round(done/total*100);document.querySelector('#pct').textContent=p+'%';document.querySelector('#remain').textContent=String(total-done);document.querySelector('#bar').style.width=p+'%'}
async function loadChecklist(){try{const r=await fetch(BOARD_API,{cache:'no-store'}),rows=await r.json(),map={};if(Array.isArray(rows))rows.forEach(x=>map[x.item_key]=x.value);document.querySelectorAll('input[type=checkbox]').forEach(el=>{if(Object.prototype.hasOwnProperty.call(map,el.id))el.checked=!!map[el.id]});document.querySelectorAll('select.status-select').forEach(el=>{const done=!!map[el.id+'_done'],failed=!!map[el.id+'_failed']&&!done;el.value=failed?'failed':String(done);el.dataset.done=String(done);el.dataset.failed=String(failed)});setSaveStatus('서버 동기화 완료')}catch{setSaveStatus('서버 동기화 실패',true)}ready=true;update()}
loadChecklist();document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadChecklist()});
</script>
</body>
