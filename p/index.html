<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업무 자료</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f2f5f7;--paper:#fff;--ink:#18222d;--muted:#697682;--line:#dde4e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.72}.wrap{max-width:980px;margin:auto;padding:34px 16px 80px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:44px 48px;box-shadow:0 10px 32px rgba(25,45,65,.055)}.template-status{}.paper .pd-title{font-size:38px}.paper .pd-summary{font-size:17px}.paper .pd-body{font-size:15.5px}.paper .pd-body h2{font-size:23px;letter-spacing:-.45px}.paper .pd-body h3{font-size:18px}.meta{font-size:11px;color:#8b959f;margin-top:34px;padding-top:15px;border-top:1px solid #edf0f2}.error{text-align:center;color:var(--muted);padding:70px 20px}@media(max-width:650px){.wrap{padding:12px 10px 50px}.paper{border-radius:15px;padding:27px 20px}.paper .pd-title{font-size:29px}.paper .pd-summary{font-size:15px}.paper .pd-body{font-size:14.5px}.paper .pd-body h2{font-size:20px}.paper.pd-hero-band .pd-hero{margin-left:-7px;margin-right:-7px}}
</style>
</head>
<body>
<main class="wrap"><article id="paper" class="paper"><div class="error">불러오는 중…</div></article></main>
<script src="../app/page-design-core.js?v=1"></script>
<script>
const SB='https://xmlkxfjeagycwttklxjw.supabase.co',KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';
const LABEL={article:'ARTICLE · 현장 공유',notice:'NOTICE · 알림',status:'STATUS UPDATE · 업무현황',event:'EVENT · 행사 안내',brief:'POLICY BRIEF · 정책 브리핑'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(p,secure=false){
  document.title=p.title+' · 업무 현황';
  const pd=window.KPTUPageDesign,pageDesign=secure?{}:(p.metadata?.page_design||{}),template=secure?'article':(pageDesign.template||'article');
  const paper=document.querySelector('#paper');
  paper.className='paper template-'+template+' '+(pd?.classNames(pageDesign,template)||'pd-design');
  paper.innerHTML=`<header class="pd-hero"><div class="pd-kicker">${secure?'제한 공유 문서':LABEL[template]||LABEL.article}</div><h1 class="pd-title">${esc(p.title)}</h1>${p.summary?`<p class="pd-summary">${esc(p.summary)}</p>`:''}</header><div class="pd-body">${pd?.renderMarkdown(p.body||'')||esc(p.body||'')}</div><div class="meta">최근 수정 ${new Date(p.updated_at).toLocaleString('ko-KR')}</div>`;
}
async function run(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,'')),token=hash.get('t');
  if(token){
    const r=await fetch(SB+'/rest/v1/rpc/app_open_share',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});
    const d=await r.json();
    if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공유 링크가 만료되었거나 사용할 수 없습니다.</div>';return}
    render(d[0],true);return;
  }
  const slug=new URLSearchParams(location.search).get('slug');
  if(!slug){document.querySelector('#paper').innerHTML='<div class="error">페이지 주소가 올바르지 않습니다.</div>';return}
  const url=SB+'/rest/v1/app_pages?slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&visibility=in.(public,unlisted)&select=title,summary,body,metadata,updated_at&limit=1';
  const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}),d=await r.json();
  if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공개된 페이지를 찾을 수 없습니다.</div>';return}
  render(d[0],false);
}
run().catch(()=>document.querySelector('#paper').innerHTML='<div class="error">페이지를 불러오지 못했습니다.</div>');
</script>
</body>
</html>
