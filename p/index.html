<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 자료</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><style>:root{--bg:#f2f5f7;--paper:#fff;--ink:#18222d;--muted:#697682;--line:#dde4e9;--navy:#17324d;--soft:#f7f9fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.72}.wrap{max-width:900px;margin:auto;padding:34px 16px 80px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:44px 48px;box-shadow:0 10px 32px rgba(25,45,65,.055)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;color:#496985}.paper h1{font-size:38px;line-height:1.22;letter-spacing:-1.3px;margin:8px 0 13px}.summary{font-size:17px;line-height:1.65;color:var(--muted);margin:0 0 27px;padding-bottom:24px;border-bottom:1px solid #e9edf0}.body{font-size:15.5px}.body h1,.body h2,.body h3{line-height:1.35;margin:1.6em 0 .6em}.body h2{font-size:23px;letter-spacing:-.45px}.body h3{font-size:18px}.body p{margin:.85em 0}.body ul,.body ol{padding-left:1.45em}.body li{margin:.35em 0}.body blockquote{border-left:4px solid #9eafbd;margin:1.25em 0;padding:.2em 0 .2em 1.1em;color:#536473}.meta{font-size:11px;color:#8b959f;margin-top:34px;padding-top:15px;border-top:1px solid #edf0f2}.template-notice{border-top:10px solid var(--navy)}.template-notice .eyebrow{display:inline-block;background:#eaf0f5;color:var(--navy);padding:5px 8px;border-radius:999px}.template-notice .paper h1{font-size:35px}.template-notice .summary{background:#f4f7f9;border:0;border-radius:13px;padding:17px 19px;margin-top:18px}.template-status{background:#f8fafb}.template-status>.eyebrow{color:#63798b}.template-status .summary{background:#fff;border:1px solid #e2e8ec;border-radius:13px;padding:16px 18px}.template-status .body h2{background:#fff;border:1px solid #e1e7eb;border-radius:13px;padding:13px 15px;margin-top:20px}.template-status .body ul{background:#fff;border:1px solid #edf0f2;border-radius:12px;padding:13px 18px 13px 36px}.template-event{background:linear-gradient(145deg,#ffffff 0%,#f3f6f8 100%);border-top:10px solid #233f59}.template-event .paper h1{font-size:43px;max-width:720px}.template-event .summary{font-size:18px;color:#405569}.template-event .body h2{color:var(--navy);border-bottom:2px solid #cdd8e0;padding-bottom:8px}.template-brief{border-left:8px solid var(--navy);padding-left:42px}.template-brief .eyebrow{color:var(--navy)}.template-brief .summary{font-size:18px;font-weight:650;color:#405263}.template-brief .body h2{color:var(--navy)}.template-brief .body blockquote{background:#f5f8fa;border-left-color:var(--navy);padding:12px 16px;border-radius:0 10px 10px 0}.error{text-align:center;color:var(--muted);padding:70px 20px}@media(max-width:650px){.wrap{padding:12px 10px 50px}.paper{border-radius:15px;padding:27px 20px}.paper h1,.template-event .paper h1{font-size:29px}.summary,.template-event .summary,.template-brief .summary{font-size:15px}.body{font-size:14.5px}.body h2{font-size:20px}.template-brief{border-left-width:5px;padding-left:18px}}</style></head><body><main class="wrap"><article id="paper" class="paper"><div class="error">불러오는 중…</div></article></main><script>const SB='https://xmlkxfjeagycwttklxjw.supabase.co',KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';const LABEL={article:'ARTICLE · 현장 공유',notice:'NOTICE · 알림',status:'STATUS UPDATE · 업무현황',event:'EVENT · 행사 안내',brief:'POLICY BRIEF · 정책 브리핑'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function md(src){const lines=esc(src).split(/\r?\n/);let out='',list=null;const close=()=>{if(list){out+='</'+list+'>';list=null}};for(let line of lines){let m;if((m=line.match(/^(#{1,3})\s+(.+)$/))){close();const n=m[1].length;out+=`<h${n}>${m[2]}</h${n}>`;continue}if((m=line.match(/^[-*]\s+(.+)$/))){if(list!=='ul'){close();list='ul';out+='<ul>'}out+='<li>'+m[1]+'</li>';continue}if((m=line.match(/^\d+[.)]\s+(.+)$/))){if(list!=='ol'){close();list='ol';out+='<ol>'}out+='<li>'+m[1]+'</li>';continue}close();if(/^&gt;\s?/.test(line)){out+='<blockquote>'+line.replace(/^&gt;\s?/,'')+'</blockquote>';continue}if(!line.trim())continue;line=line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');out+='<p>'+line+'</p>'}close();return out}function render(p,secure=false){document.title=p.title+' · 업무 현황';const template=secure?'article':(p.metadata?.page_design?.template||'article');const paper=document.querySelector('#paper');paper.className='paper template-'+(LABEL[template]?template:'article');paper.innerHTML=`<div class="eyebrow">${secure?'제한 공유 문서':LABEL[template]||LABEL.article}</div><h1>${esc(p.title)}</h1>${p.summary?`<p class="summary">${esc(p.summary)}</p>`:''}<div class="body">${md(p.body||'')}</div><div class="meta">최근 수정 ${new Date(p.updated_at).toLocaleString('ko-KR')}</div>`}async function run(){const hash=new URLSearchParams(location.hash.replace(/^#/,'')),token=hash.get('t');if(token){const r=await fetch(SB+'/rest/v1/rpc/app_open_share',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});const d=await r.json();if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공유 링크가 만료되었거나 사용할 수 없습니다.</div>';return}render(d[0],true);return}const slug=new URLSearchParams(location.search).get('slug');if(!slug){document.querySelector('#paper').innerHTML='<div class="error">페이지 주소가 올바르지 않습니다.</div>';return}const url=SB+'/rest/v1/app_pages?slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&visibility=in.(public,unlisted)&select=title,summary,body,metadata,updated_at&limit=1';const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const d=await r.json();if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공개된 페이지를 찾을 수 없습니다.</div>';return}render(d[0],false)}run().catch(()=>document.querySelector('#paper').innerHTML='<div class="error">페이지를 불러오지 못했습니다.</div>');</script></body></html>
