<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 자료</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><style>:root{--bg:#f4f6f8;--paper:#fff;--ink:#1b2430;--muted:#6b7582;--line:#dfe5ea;--navy:#1d3557}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.7}.wrap{max-width:800px;margin:auto;padding:28px 16px 70px}.paper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#45658b}.paper h1{font-size:32px;line-height:1.3;letter-spacing:-1px;margin:7px 0 10px}.summary{font-size:16px;color:var(--muted);margin:0 0 24px;padding-bottom:22px;border-bottom:1px solid #edf0f2}.body{font-size:15px}.body h1,.body h2,.body h3{line-height:1.35;margin:1.5em 0 .55em}.body h2{font-size:22px}.body h3{font-size:18px}.body p{margin:.8em 0}.body ul,.body ol{padding-left:1.5em}.body blockquote{border-left:3px solid #aebdca;margin:1em 0;padding:.1em 0 .1em 1em;color:#596675}.meta{font-size:11px;color:#8a939d;margin-top:30px;padding-top:14px;border-top:1px solid #edf0f2}.error{text-align:center;color:var(--muted);padding:70px 20px}@media(max-width:650px){.wrap{padding:12px 10px 50px}.paper{border-radius:14px;padding:24px 19px}.paper h1{font-size:27px}}</style></head><body><main class="wrap"><article id="paper" class="paper"><div class="error">불러오는 중…</div></article></main><script>const SB='https://xmlkxfjeagycwttklxjw.supabase.co',KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function md(src){const lines=esc(src).split(/\r?\n/);let out='',list=null;const close=()=>{if(list){out+='</'+list+'>';list=null}};for(let line of lines){let m;if((m=line.match(/^(#{1,3})\s+(.+)$/))){close();const n=m[1].length;out+=`<h${n}>${m[2]}</h${n}>`;continue}if((m=line.match(/^[-*]\s+(.+)$/))){if(list!=='ul'){close();list='ul';out+='<ul>'}out+='<li>'+m[1]+'</li>';continue}if((m=line.match(/^\d+[.)]\s+(.+)$/))){if(list!=='ol'){close();list='ol';out+='<ol>'}out+='<li>'+m[1]+'</li>';continue}close();if(/^&gt;\s?/.test(line)){out+='<blockquote>'+line.replace(/^&gt;\s?/,'')+'</blockquote>';continue}if(!line.trim()){out+='<br>';continue}line=line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');out+='<p>'+line+'</p>'}close();return out}function render(p,secure=false){document.title=p.title+' · 업무 현황';document.querySelector('#paper').innerHTML=`<div class="eyebrow">${secure?'제한 공유 문서':'업무 현황 · 공개 자료'}</div><h1>${esc(p.title)}</h1>${p.summary?`<p class="summary">${esc(p.summary)}</p>`:''}<div class="body">${md(p.body||'')}</div><div class="meta">최근 수정 ${new Date(p.updated_at).toLocaleString('ko-KR')}</div>`}async function run(){const hash=new URLSearchParams(location.hash.replace(/^#/,'')),token=hash.get('t');if(token){const r=await fetch(SB+'/rest/v1/rpc/app_open_share',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});const d=await r.json();if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공유 링크가 만료되었거나 사용할 수 없습니다.</div>';return}render(d[0],true);return}const slug=new URLSearchParams(location.search).get('slug');if(!slug){document.querySelector('#paper').innerHTML='<div class="error">페이지 주소가 올바르지 않습니다.</div>';return}const url=SB+'/rest/v1/app_pages?slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&visibility=in.(public,unlisted)&select=title,summary,body,updated_at&limit=1';const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const d=await r.json();if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공개된 페이지를 찾을 수 없습니다.</div>';return}render(d[0],false)}run().catch(()=>document.querySelector('#paper').innerHTML='<div class="error">페이지를 불러오지 못했습니다.</div>');</script></body></html>
