n-top:10px;padding:9px 12px;border:1px solid #c9d6e1;border-radius:10px;background:#fff;color:var(--navy);text-decoration:none;font-size:12px;font-weight:900}.section-link:hover{background:#f7fafc;border-color:#aebfce}.meta{font-size:11px;color:#8b959f;margin-top:34px;padding-top:15px;border-top:1px solid #edf0f2}.error{text-align:center;color:var(--muted);padding:70px 20px}@media(max-width:650px){.wrap{padding:8px 10px 50px}.print-tools{margin:14px auto 8px;padding:0 10px;align-items:flex-start}.print-actions{flex-wrap:wrap;justify-content:flex-end}.print-btn{padding:8px 10px}.paper{border-radius:15px;padding:27px 20px}.paper .pd-title{font-size:29px}.paper .pd-summary{font-size:15px}.paper .pd-body{font-size:14.5px}.paper .pd-body h2{font-size:20px}.gimpo-hub{grid-template-columns:1fr}}

<div class="print-tools" aria-label="문서 도구">

<main class="wrap"><article id="paper" class="paper"><div class="error">불러오는 중…</div></article></main>
<script src="../../app/page-design-core.js?v=3"></script>
<script src="../../app/public-page-editor.js?v=7"></script>
<script>
const SB='https://xmlkxfjeagycwttklxjw.supabase.co',KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';
const LABEL={article:'ARTICLE · 업무자료',notice:'NOTICE · 알림',status:'STATUS UPDATE · 업무현황',event:'EVENT · 행사 안내',brief:'POLICY BRIEF · 정책 브리핑'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setMeta=(selector,value)=>{const el=document.querySelector(selector);if(el&&value)el.setAttribute('content',String(value))};
let printDetailState=[];
function expandForPrint(){printDetailState=[...document.querySelectorAll('#paper details')].map(el=>({el,open:el.open}));printDetailState.forEach(x=>x.el.open=true)}
function restoreAfterPrint(){printDetailState.forEach(x=>x.el.open=x.open);printDetailState=[]}
function printPage(){expandForPrint();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}
window.addEventListener('beforeprint',expandForPrint);window.addEventListener('afterprint',restoreAfterPrint);document.querySelector('#printPageBtn')?.addEventListener('click',printPage);
function render(p,secure=false){
  document.title=p.title;window.KPTUPublicPageEditor?.setPage(p,secure);
  if(!secure){setMeta('meta[name="description"]',p.summary||p.title);setMeta('meta[property="og:title"]',p.title);setMeta('meta[property="og:description"]',p.summary||p.title)}
  const pd=window.KPTUPageDesign,pageDesign=secure?{}:(p.metadata?.page_design||{}),template=secure?'article':(pageDesign.template||'article');
  const paper=document.querySelector('#paper');paper.className='paper template-'+template+' '+(pd?.classNames(pageDesign,template)||'pd-design');
  const hub=secure?'':`<nav class="gimpo-hub" aria-label="김포 공영화 및 안전인력 확충 투쟁 영역"><a href="#gimpo-bargaining"><b>하반기 임단투</b><span>교섭·조정·쟁의권 확보와 공영화·안전인력 요구 연계</span><em>현황 보기 →</em></a><a href="/work/p/gimpo-publicization-audit/"><b>시의회 대응</b><span>김포시 행정사무감사 자료요구·질의안</span><em>행정사무감사 대응 →</em></a><a href="/work/p/gimpo-publicization-press-1008/"><b>언론 대응</b><span>9.10 보도자료 · 10.8 김포시청 기자회견</span><em>10/8 기자회견 준비페이지 →</em></a></nav>`;
  paper.innerHTML=`<header class="pd-hero"><div class="pd-kicker">${secure?'제한 공유 문서':LABEL[template]||LABEL.article}</div><h1 class="pd-title">${esc(p.title)}</h1>${p.summary?`<p class="pd-summary">${esc(p.summary)}</p>`:''}</header>${hub}<div class="pd-body">${pd?.renderMarkdown(p.body||'')||esc(p.body||'')}</div><div class="meta">최근 수정 ${new Date(p.updated_at).toLocaleString('ko-KR')}</div>`;
  const sections=[...paper.querySelectorAll('.pd-body>.pd-section')];
  if(sections[0])sections[0].id='gimpo-bargaining';
  if(sections[1])sections[1].id='gimpo-council';
  if(sections[2]){
    sections[2].id='gimpo-media';
    const a=document.createElement('a');a.className='section-link';a.href='/work/p/gimpo-publicization-press-1008/';a.textContent='10/8 기자회견 준비페이지 →';sections[2].appendChild(a);
  }
}
window.KPTURenderPublicPage=render;
async function run(){const slug=document.querySelector('meta[name="kptu-page-slug"]')?.content?.trim();const url=SB+'/rest/v1/app_pages?slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&visibility=in.(public,unlisted)&select=id,title,summary,body,metadata,updated_at&limit=1';const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}),d=await r.json();if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공개된 페이지를 찾을 수 없습니다.</div>';return}render(d[0],false)}
run().catch(()=>document.querySelector('#paper').innerHTML='<div class="error">페이지를 불러오지 못했습니다.</div>');
</script>
