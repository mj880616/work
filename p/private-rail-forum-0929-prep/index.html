<div class="print-tools" aria-label="문서 도구"><button id="editPageBtn" class="print-btn hidden" type="button">수정</button><button id="printPageBtn" class="print-btn" type="button">인쇄 / PDF</button></div>
<main class="wrap"><article id="paper" class="paper"><div class="error">불러오는 중…</div></article></main>
<script src="../../app/page-design-core.js?v=3"></script>
<script src="../../app/forum-flow-polish.js?v=2"></script>
<script src="../../app/public-page-editor.js?v=6"></script>
<script>
const SB='https://xmlkxfjeagycwttklxjw.supabase.co',KEY='sb_publishable_X-0lXJztIQUriUidBZ1PLQ_QemTRSpA';
const LABEL={article:'ARTICLE · 현장 공유',notice:'NOTICE · 알림',status:'STATUS UPDATE · 업무현황',event:'EVENT · 행사 안내',brief:'POLICY BRIEF · 정책 브리핑'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setMeta=(selector,value)=>{const el=document.querySelector(selector);if(el&&value)el.setAttribute('content',String(value))};
let printDetailState=[];
function expandForPrint(){printDetailState=[...document.querySelectorAll('#paper details')].map(el=>({el,open:el.open}));printDetailState.forEach(x=>x.el.open=true)}
function restoreAfterPrint(){printDetailState.forEach(x=>x.el.open=x.open);printDetailState=[]}
function printPage(){expandForPrint();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}
window.addEventListener('beforeprint',expandForPrint);
window.addEventListener('afterprint',restoreAfterPrint);
document.querySelector('#printPageBtn')?.addEventListener('click',printPage);
function render(p,secure=false){
  document.title=p.title;
  window.KPTUPublicPageEditor?.setPage(p,secure);
  if(!secure){
    setMeta('meta[name="description"]',p.summary||p.title);
    setMeta('meta[property="og:title"]',p.title);
    setMeta('meta[property="og:description"]',p.summary||p.title);
    setMeta('meta[name="twitter:title"]',p.title);
    setMeta('meta[name="twitter:description"]',p.summary||p.title);
  }
  const pd=window.KPTUPageDesign,pageDesign=secure?{}:(p.metadata?.page_design||{}),template=secure?'article':(pageDesign.template||'article');
  const paper=document.querySelector('#paper');
  paper.className='paper template-'+template+' '+(pd?.classNames(pageDesign,template)||'pd-design');
  paper.innerHTML=`<header class="pd-hero"><div class="pd-kicker">${secure?'제한 공유 문서':LABEL[template]||LABEL.article}</div><h1 class="pd-title">${esc(p.title)}</h1>${p.summary?`<p class="pd-summary">${esc(p.summary)}</p>`:''}</header><div class="pd-body">${pd?.renderMarkdown(p.body||'')||esc(p.body||'')}</div><div class="meta">최근 수정 ${new Date(p.updated_at).toLocaleString('ko-KR')}</div>`;
}
window.KPTURenderPublicPage=render;
async function run(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,'')),token=hash.get('t');
  if(token){
    const r=await fetch(SB+'/rest/v1/rpc/app_open_share',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});
    const d=await r.json();
    if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공유 링크가 만료되었거나 사용할 수 없습니다.</div>';return}
    render(d[0],true);return;
  }
  const fixedSlug=document.querySelector('meta[name="kptu-page-slug"]')?.content?.trim();
  const slug=fixedSlug||new URLSearchParams(location.search).get('slug');
  if(!slug){document.querySelector('#paper').innerHTML='<div class="error">페이지 주소가 올바르지 않습니다.</div>';return}
  const url=SB+'/rest/v1/app_pages?slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&visibility=in.(public,unlisted)&select=id,title,summary,body,metadata,updated_at&limit=1';
  const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}),d=await r.json();
  if(!r.ok||!d.length){document.querySelector('#paper').innerHTML='<div class="error">공개된 페이지를 찾을 수 없습니다.</div>';return}
  render(d[0],false);
}
run().catch(()=>document.querySelector('#paper').innerHTML='<div class="error">페이지를 불러오지 못했습니다.</div>');
</script>
