plugins {
    id 'com.android.application'
}

def envValue = { String name ->
    def value = System.getenv(name) ?: ''
    return value.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'kr.or.kptu.work'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.or.kptu.work'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '0.1.11'

        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + envValue('KPTU_FIREBASE_API_KEY') + '"'
        buildConfigField 'String', 'FIREBASE_APP_ID', '"' + envValue('KPTU_FIREBASE_APP_ID') + '"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + envValue('KPTU_FIREBASE_PROJECT_ID') + '"'
        buildConfigField 'String', 'FIREBASE_SENDER_ID', '"' + envValue('KPTU_FIREBASE_SENDER_ID') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
