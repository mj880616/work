plugins {
    // AGP 9는 Kotlin을 내장한다(org.jetbrains.kotlin.android 플러그인 불필요).
    id 'com.android.application'
}

android {
    namespace 'kr.or.kptu.work'
    compileSdk 36

    defaultConfig {
        // 옛 앱과 같은 앱 ID(설계 D11). 웹 native-auth-bridge.js의 로그인 복귀가 이 ID를 지정한다.
        applicationId 'kr.or.kptu.work'
        minSdk 29
        targetSdk 36
        versionCode 31
        versionName '0.3.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    // 단계 ③ 위젯: 30분 갱신·같은 이름 작업 하나(WorkManager), Origin 머리글을 그대로 보내는 HTTP 도구(OkHttp, 설계 4절).
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
