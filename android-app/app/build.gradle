plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.or.kptu.work'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.or.kptu.work'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
