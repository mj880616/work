plugins {
    // AGP 9는 Kotlin을 내장한다(org.jetbrains.kotlin.android 플러그인 불필요).
    id 'com.android.application'
}

// APP-폰알림: 환경 변수 → BuildConfig 글. 영문·숫자·:._- 200자까지만 받아 Java 글자 깨짐·끼워 넣기를 막는다. 값은 출력하지 않는다.
def fcmField(String name) {
    def value = (System.getenv(name) ?: '').trim()
    return '"' + ((value ==~ /[A-Za-z0-9:._-]{1,200}/) ? value : '') + '"'
}

android {
    namespace 'kr.or.kptu.work'
    compileSdk 36

    defaultConfig {
        // 옛 앱과 같은 앱 ID(설계 D11). 웹 native-auth-bridge.js의 로그인 복귀가 이 ID를 지정한다.
        // 판별 값은 아래 productFlavors가 덮어쓴다(github = 이 값 그대로, play = com.workonplus.app).
        applicationId 'kr.or.kptu.work'
        minSdk 29
        targetSdk 36
        versionCode 88
        versionName '0.5.31'

        // APP-폰알림 N4(설계 docs/design/phone-notifications.md 4.3절): Firebase 앱 설정 4개는 빌드 변수로만 받는다.
        // release workflow(phone-app-release.yml)가 environment phone-app-release의 변수(vars.WEB2_FCM_*)를 넘긴다.
        // google-services.json·구글 서비스 Gradle 플러그인은 쓰지 않는다. 값이 없거나 모양이 다르면 빈 글 → 알림 기능 꺼진 채로 빌드(PR CI debug).
        buildConfigField 'String', 'FCM_PROJECT_ID', fcmField('WEB2_FCM_PROJECT_ID')
        buildConfigField 'String', 'FCM_APP_ID', fcmField('WEB2_FCM_APP_ID')
        buildConfigField 'String', 'FCM_SENDER_ID', fcmField('WEB2_FCM_SENDER_ID')
        buildConfigField 'String', 'FCM_API_KEY', fcmField('WEB2_FCM_API_KEY')
    }

    // S62-34 APP-플레이스토어비공개테스트: 같은 코드(namespace 그대로)로 두 판을 만든다. applicationId만 판마다 다르다.
    //   github = 지금까지의 앱(kr.or.kptu.work). GitHub 공개 릴리스 APK, 앱 안 스스로 업데이트, '모든 파일 접근' 그대로.
    //   play   = 플레이 스토어 판(com.workonplus.app, S69-10 사용자 결정 11/24 — 플레이 콘솔의 옛 초안 앱은 나중 노조+ 앱 몫으로 남긴다). 업데이트는 플레이가 한다. 스스로 업데이트·설치 요청·'모든 파일 접근'을 뺀다
    //            (권한은 src/play/AndroidManifest.xml에서 빼고, 기능은 아래 BuildConfig 값으로 끈다).
    // versionCode·versionName은 defaultConfig 하나를 두 판이 같이 쓴다(올릴 때 둘 다 늘어난다).
    flavorDimensions.add('channel')
    productFlavors {
        github {
            dimension = 'channel'
            applicationId = 'kr.or.kptu.work'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
            buildConfigField 'boolean', 'ALL_FILES', 'true'
            // S70-45 APP-플레이판권한줄이기: 앞쪽 서비스(화면 꺼진 뒤 녹음 잇기·올리는 동안 알림)와 폰 사진 전체 보기. github 판은 그대로 켬.
            buildConfigField 'boolean', 'FG_SERVICES', 'true'
            buildConfigField 'boolean', 'PHONE_GALLERY', 'true'
            // 로그인 복귀 주소의 native 값(app/native-auth-bridge.js가 이 값으로 돌아갈 앱 패키지를 고른다).
            buildConfigField 'String', 'LOGIN_RETURN', '"android"'
            // 웹이 플레이 판인지 아는 사용자 에이전트 표시(github 판은 붙이지 않는다 = 지금과 같다).
            buildConfigField 'String', 'UA_MARK', '""'
        }
        play {
            dimension = 'channel'
            applicationId = 'com.workonplus.app'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
            buildConfigField 'boolean', 'ALL_FILES', 'false'
            // S70-45(사용자 결정 11/25 '플레이 판만 빼고 먼저'): 플레이 검토의 앞쪽 서비스·사진 권한 신고를 피한다.
            //   FG_SERVICES=false → 녹음은 앱이 켜진 동안만(나가면 일시정지), 뒤에서 올리기는 알림 없는 보통 작업.
            //   PHONE_GALLERY=false → 사진 메뉴 '폰 사진'(폰 사진 폴더 전체 보기·폴더 바꾸기·정보 고치기)을 다리가 '없음'으로 알려 웹이 그리지 않는다.
            //   권한·서비스 종류는 src/play/AndroidManifest.xml에서 뺀다.
            buildConfigField 'boolean', 'FG_SERVICES', 'false'
            buildConfigField 'boolean', 'PHONE_GALLERY', 'false'
            buildConfigField 'String', 'LOGIN_RETURN', '"android-play"'
            // S69-10: 노조 약칭이 든 옛 표시 대신 WorkOnPlay. 웹 login/native-google-return.js가 이 표시를 읽는다.
            buildConfigField 'String', 'UA_MARK', '" WorkOnPlay"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    // APP-당겨서새로고침: 웹 화면 맨 위에서 당겨 새로고침(동그란 표시).
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // 단계 ③ 위젯: 30분 갱신·같은 이름 작업 하나(WorkManager), Origin 머리글을 그대로 보내는 HTTP 도구(OkHttp, 설계 4절).
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // APP-폰알림 N4: 폰 알림 받기(FCM). 설정은 빌드 변수로 직접 초기화(PushSetup.kt).
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    // 위 라이브러리가 옛 androidx.fragment(1.3 미만)를 끌어와 registerForActivityResult 검사(lintVital)가 막는다. 새 판으로 맞춘다.
    implementation 'androidx.fragment:fragment:1.8.5'
    // S48-60 PHOTO-정보고치기: 사진 EXIF 시각·위치 읽기·다시 쓰기(JPEG·PNG·WebP).
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
}
