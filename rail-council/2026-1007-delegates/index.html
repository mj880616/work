<style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#18202a;--muted:#687383;--line:#e2e7ec;--navy:#17324d;--blue:#245786;--soft:#edf3f7;--red:#9d2b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.64;word-break:keep-all}button{font:inherit}.wrap{max-width:980px;margin:auto;padding:22px 16px 70px}.back{display:inline-flex;margin:0 2px 12px;color:#566577;text-decoration:none;font-size:13px;font-weight:800}.hero{background:linear-gradient(135deg,#142a42,#245786);color:#fff;border-radius:20px;padding:31px 29px}.eyebrow{font-size:12px;font-weight:900;color:#cbdbea;margin-bottom:8px}.hero h1{font-size:30px;line-height:1.25;margin:0}.hero p{margin:9px 0 0;color:#dce8f2;font-size:14px}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:14px 2px 0}.state,.guide{font-size:11px;color:var(--muted)}.page-actions{display:flex;gap:7px;flex-shrink:0}.action-btn,.table-copy-btn{border:1px solid #c7d3dd;background:#fff;color:var(--navy);border-radius:9px;padding:7px 11px;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 1px 3px rgba(23,50,77,.05)}
.summary{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.summary-card small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.summary-card strong{font-size:15px;color:var(--navy)}
.section,.decision{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 25px}.section h2,.decision h2{font-size:20px;color:var(--navy);margin:0 0 13px}.section p,.section li,.decision li{font-size:14px}.section ul{padding-left:20px}.section li.slogan-final{list-style:none;margin-left:-20px}.lead{font-size:16px!important;font-weight:800;background:#f4f8fb;border-left:4px solid var(--blue);padding:13px 15px}.flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.flow span{background:var(--soft);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:900}.requirements{display:grid;grid-template-columns:1fr 1fr;gap:10px}.req,.point{background:#f8fafb;border-radius:13px;padding:15px}.req h3,.point strong{color:var(--navy)}.note{color:var(--muted);font-size:12px!important}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px}.plan-table{width:100%;border-collapse:collapse;min-width:700px;background:#fff}.plan-table th,.plan-table td{border-bottom:1px solid #e8edf1;border-right:1px solid #edf0f3;padding:10px 11px;text-align:left;vertical-align:top;font-size:13px}.plan-table th:last-child,.plan-table td:last-child{border-right:0}.plan-table th{background:#edf3f7;color:var(--navy)}.plan-table td:first-child{font-weight:800}.table-copy-wrap{display:flex;justify-content:flex-end;margin:8px 0 2px}.footer{text-align:center;color:#8a939f;font-size:11px;margin-top:28px}
.editable-unit{position:relative}.editable-unit:not(tr){padding-right:122px}.unit-tools{position:absolute;right:9px;top:9px;display:flex;gap:4px;z-index:3}.unit-btn,.program-add,.program-row-delete{border:1px solid #d5dde4;background:#fff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap}.unit-btn.edit{color:var(--blue)}.unit-btn.copy{color:#385f7f}.unit-btn.save{background:var(--navy);border-color:var(--navy);color:#fff}.unit-btn.cancel{color:#777}.unit-btn.delete,.program-row-delete{color:var(--red);border-color:#e3b9bd;background:#fff7f7}.unit-active{outline:2px solid #8eabc5;outline-offset:3px}.row-tools{display:inline-flex;gap:4px;margin-left:8px}.program-editing h2,.program-editing th,.program-editing td,.program-editing .note{outline:1px dashed #9fb3c5;outline-offset:-2px;background:#fbfdff}.program-rowbar{display:flex;justify-content:flex-end;margin:10px 0 3px}.program-add{color:var(--navy);background:#f3f7fa}.program-row-delete{margin-left:6px}.loading{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
@media(max-width:900px){.wrap{padding:14px 11px 48px}.hero{padding:25px 21px}.hero h1{font-size:26px}.summary{grid-template-columns:1fr 1fr}.section,.decision{padding:20px 18px}.requirements{grid-template-columns:1fr}.editable-unit:not(tr){padding-right:126px}.unit-tools{right:10px;top:10px}.program-section .table-wrap{overflow-x:visible}.program-section .plan-table{min-width:0;table-layout:fixed;width:100%}.program-section .plan-table th,.program-section .plan-table td{padding:8px 5px;font-size:11px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.program-section .plan-table th:nth-child(1),.program-section .plan-table td:nth-child(1){width:17%}.program-section .plan-table th:nth-child(2),.program-section .plan-table td:nth-child(2){width:14%}.program-section .plan-table th:nth-child(3),.program-section .plan-table td:nth-child(3){width:43%}.program-section .plan-table th:nth-child(4),.program-section .plan-table td:nth-child(4){width:26%}}
@media(max-width:430px){.summary{grid-template-columns:1fr}.toolbar{display:block}.guide{margin-top:5px}.page-actions{margin-top:8px}.action-btn{width:100%}.program-section .plan-table th,.program-section .plan-table td{font-size:10.5px;padding:7px 4px}.editable-unit:not(tr){padding-right:130px}.unit-btn{padding:6px 7px}}
@media print{body{background:#fff;color:#000}.wrap{max-width:none;padding:0}.back,.toolbar,.unit-tools,.row-tools,.program-rowbar,.program-row-delete,.table-copy-wrap,.footer{display:none!important}.hero{background:#fff!important;color:#000;border:0;border-radius:0;padding:0 0 18px}.hero p,.eyebrow{color:#333}.summary{margin-top:8px}.summary-card,.section,.decision{border:1px solid #bbb;box-shadow:none;break-inside:avoid}.editable-unit:not(tr){padding-right:0}.table-wrap{overflow:visible}.plan-table{min-width:0}.program-section .plan-table{table-layout:auto}.unit-active{outline:0}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../">← 궤도협의회</a>
<header class="hero"><div class="eyebrow">2026년 궤도협의회 하반기 공동투쟁</div><h1>10.7 궤도노동자 공동대의원대회 기획안</h1><p>국회 앞 500명 · 하반기 공동투쟁의 공식 출발점</p></header>
<div class="toolbar"><div><div id="state" class="state">불러오는 중…</div><div class="guide">수정·삭제 가능 · ‘단락 복사’는 제목과 내용을 함께 복사함.</div></div><div class="page-actions"><button type="button" class="action-btn" id="printBtn">인쇄</button></div></div>
<div id="editablePlan"><div class="loading">기획안을 불러오는 중입니다.</div></div>
<div class="footer">공공운수노조 궤도협의회 · 10.7 공동대의원대회 기획안</div>
</main>
<script>
const API='https://xmlkxfjeagycwttklxjw.supabase.co/functions/v1/rail-1007-plan';
const plan=document.getElementById('editablePlan'),state=document.getElementById('state');let active=null,before='';
document.getElementById('printBtn').onclick=()=>window.print();
const fmt=v=>{try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return''}};
const heading=(n)=>n?.querySelector?.(':scope > h2')?.textContent.replace(/[\u200B-\u200D\uFEFF]/g,'').trim()||'';
const h2starts=(n,t)=>heading(n).startsWith(t);
const isProgram=n=>n?.tagName==='SECTION'&&h2starts(n,'5. 대회 프로그램');
const deletable=t=>!!t&&(t.matches('.section > ul > li')||t.matches('.requirements > .req')||t.matches('.section > .point')||t.matches('.section > .note')||t.matches('.section > .flow')||t.matches('.decision > ol > li'));
function stripUi(n){n.querySelectorAll('.unit-tools,.row-tools,.program-rowbar,.program-row-delete,.table-copy-wrap').forEach(x=>x.remove());n.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));n.querySelectorAll('.editable-unit,.unit-active,.program-editing,.program-section').forEach(x=>x.classList.remove('editable-unit','unit-active','program-editing','program-section'));return n}
const clean=()=>{const c=plan.cloneNode(true);stripUi(c);return c.innerHTML.trim()};
async function persist(msg='저장 중…'){state.textContent=msg;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',content:clean()})});if(!r.ok)throw 0;const d=await r.json();state.textContent='마지막 수정 '+fmt(d.updated_at||new Date())}
function migrateContent(){let changed=false;
  [...plan.querySelectorAll('.section,.decision')].forEach(s=>{const h=heading(s);if(h.startsWith('9. 조직계획')||h.startsWith('10. 대회 전 사전사업')||h.startsWith('12. 역할분담')||h.startsWith('13. 바로 결정')){s.remove();changed=true}});
  const slogans=[...plan.querySelectorAll('.section')].find(s=>h2starts(s,'7. 핵심 구호'));
  if(slogans){const target=[...slogans.querySelectorAll(':scope > ul > li')].find(li=>li.textContent.replace(/^[\s·ㆍ•]+/,'').trim()==='궤도노동자 공동투쟁으로 산별노조 완성하자!');if(target){const cleanText=target.textContent.replace(/^[\s·ㆍ•]+/,'').trim();if(target.textContent!==cleanText){target.textContent=cleanText;changed=true}if(!target.classList.contains('slogan-final')){target.classList.add('slogan-final');changed=true}}}
  const follow=[...plan.querySelectorAll('.section')].find(s=>/10\.7 이후 투쟁 연결/.test(heading(s)));
  if(follow){const flow=follow.querySelector(':scope > .flow');if(flow){let spans=[...flow.querySelectorAll(':scope > span')];let anchor=spans.find(x=>x.textContent.includes('10.24 공동투쟁'));if(!anchor){anchor=spans.find(x=>x.textContent.includes('10월 총궐기'));if(anchor){anchor.textContent='10.24 공동투쟁';changed=true}}const label='11월 초 공동 쟁의행위 찬반투표 결과발표 기자회견';if(anchor&&!spans.some(x=>x.textContent.trim()===label)){const arrow=document.createElement('b');arrow.textContent='→';const box=document.createElement('span');box.textContent=label;anchor.after(arrow,box);changed=true}}}
  return changed}
function flash(btn){const old=btn.textContent;btn.textContent='복사됨';btn.disabled=true;setTimeout(()=>{btn.textContent=old;btn.disabled=false},1000)}
async function copyRich(html,text,btn){try{if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})])}else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}flash(btn)}catch{alert('복사하지 못했습니다. 클립보드 권한을 확인해 주세요.')}}
function sectionCopy(section,btn){const c=stripUi(section.cloneNode(true));copyRich(`<div style="font-family:'Malgun Gothic','Noto Sans KR',sans-serif;line-height:1.6">${c.innerHTML}</div>`,c.innerText.trim(),btn)}
function tableText(table){return [...table.rows].map(r=>[...r.cells].map(c=>c.innerText.trim()).join('\t')).join('\n')}
function tableHtml(table){const c=stripUi(table.cloneNode(true));c.setAttribute('border','1');c.setAttribute('cellpadding','5');c.setAttribute('cellspacing','0');c.style.borderCollapse='collapse';c.style.width='100%';c.querySelectorAll('th,td').forEach(x=>{x.style.border='1px solid #777';x.style.padding='5px';x.style.verticalAlign='top'});return c.outerHTML}
function addTableCopyButtons(){plan.querySelectorAll('.table-copy-wrap').forEach(x=>x.remove());plan.querySelectorAll('.table-wrap').forEach(w=>{const table=w.querySelector('table');if(!table)return;const box=document.createElement('div');box.className='table-copy-wrap';const b=document.createElement('button');b.type='button';b.className='table-copy-btn';b.textContent='표 전체 복사';b.onclick=e=>{e.stopPropagation();copyRich(tableHtml(table),tableText(table),b)};box.append(b);w.after(box)})}
function addControls(t){if(t.tagName==='TR'){const w=document.createElement('span');w.className='row-tools';const b=document.createElement('button');b.type='button';b.className='unit-btn edit';b.textContent='수정';b.onclick=e=>{e.stopPropagation();startEdit(t)};w.append(b);t.lastElementChild?.append(w);return}const w=document.createElement('span');w.className='unit-tools';const b=document.createElement('button');b.type='button';b.className='unit-btn edit';b.textContent=isProgram(t)?'프로그램 수정':'수정';b.onclick=e=>{e.stopPropagation();startEdit(t)};w.append(b);if(t.matches('.section > h2,.decision > h2')){const c=document.createElement('button');c.type='button';c.className='unit-btn copy';c.textContent='단락 복사';c.onclick=e=>{e.stopPropagation();sectionCopy(t.parentElement,c)};w.append(c)}if(deletable(t)){const d=document.createElement('button');d.type='button';d.className='unit-btn delete';d.textContent='삭제';d.onclick=e=>{e.stopPropagation();deleteItem(t)};w.append(d)}t.append(w)}
function saveControls(t){const p=t.tagName==='TR'?t.lastElementChild:t;p.querySelectorAll('.unit-tools,.row-tools').forEach(x=>x.remove());const w=document.createElement('span');w.className=t.tagName==='TR'?'row-tools':'unit-tools';[['저장','save',()=>saveEdit(t)],['취소','cancel',()=>cancelEdit(t)]].forEach(([txt,cls,fn])=>{const b=document.createElement('button');b.type='button';b.className='unit-btn '+cls;b.textContent=txt;b.onclick=e=>{e.stopPropagation();fn()};w.append(b)});p.append(w)}
async function deleteItem(t){if(active)return alert('수정 중인 항목을 먼저 저장하거나 취소해 주세요.');if(!confirm('이 세부 항목을 삭제할까요?'))return;const p=t.parentElement,n=t.nextSibling;t.remove();try{await persist('삭제 저장 중…');decorate()}catch{n?p.insertBefore(t,n):p.append(t);decorate();alert('삭제 저장 실패')}}
function rowDelete(tr){const last=tr.lastElementChild;if(!last||last.querySelector('.program-row-delete'))return;const b=document.createElement('button');b.type='button';b.className='program-row-delete';b.textContent='행 삭제';b.onclick=e=>{e.stopPropagation();tr.remove()};last.append(b)}
function programTools(s){s.querySelectorAll('.plan-table tbody tr').forEach(rowDelete);const bar=document.createElement('div');bar.className='program-rowbar';const b=document.createElement('button');b.type='button';b.className='program-add';b.textContent='+ 행 추가';b.onclick=e=>{e.stopPropagation();const tr=document.createElement('tr');['새 순서','','내용 입력',''].forEach(v=>{const td=document.createElement('td');td.textContent=v;td.contentEditable='true';tr.append(td)});s.querySelector('tbody')?.append(tr);rowDelete(tr)};bar.append(b);s.querySelector('.table-wrap')?.after(bar)}
function decorate(){plan.querySelectorAll('.unit-tools,.row-tools,.program-rowbar,.program-row-delete,.table-copy-wrap').forEach(x=>x.remove());plan.querySelectorAll('.editable-unit').forEach(x=>x.classList.remove('editable-unit'));const ps=[...plan.querySelectorAll('.section')].find(isProgram);if(ps)ps.classList.add('program-section');const selectors=['.summary-card','.section > h2','.section > .lead','.section > ul > li','.section > .flow','.requirements > .req','.section > .note','.section > .point','.plan-table tbody > tr','.decision > h2','.decision > ol > li'];let targets=[...new Set(selectors.flatMap(s=>[...plan.querySelectorAll(s)]))];if(ps){targets=targets.filter(x=>!ps.contains(x));targets.push(ps)}targets.forEach(t=>{t.classList.add('editable-unit');addControls(t)});addTableCopyButtons()}
function startEdit(t){if(active&&active!==t)return alert('수정 중인 항목을 먼저 저장하거나 취소해 주세요.');active=t;before=stripUi(t.cloneNode(true)).innerHTML;t.classList.add('unit-active');if(isProgram(t)){t.classList.add('program-editing');t.querySelectorAll(':scope > h2,.plan-table th,.plan-table td,:scope > .note').forEach(x=>{x.contentEditable='true';x.spellcheck=false});programTools(t)}else if(t.tagName==='TR'){[...t.children].forEach(x=>{x.contentEditable='true';x.spellcheck=false})}else{t.contentEditable='true';t.spellcheck=false}saveControls(t)}
function finish(t){t.removeAttribute('contenteditable');t.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));active=null;before='';decorate()}
function cancelEdit(t){t.innerHTML=before;finish(t)}
async function saveEdit(t){try{await persist();finish(t)}catch{alert('저장하지 못했습니다. 다시 시도해 주세요.')}}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();plan.innerHTML=(typeof d.content==='string'&&d.content.trim())?d.content:'<section class="section"><h2>저장된 기획안이 없습니다.</h2></section>';state.textContent=d.updated_at?'마지막 수정 '+fmt(d.updated_at):'초안';const changed=migrateContent();decorate();if(changed)try{await persist('내용 정리 저장 중…')}catch{}}catch{plan.innerHTML='<section class="section"><h2>기획안을 불러오지 못했습니다.</h2><p>잠시 후 새로고침해 주세요.</p></section>';state.textContent='불러오기 실패'}}
load();
</script>
</body></html>
